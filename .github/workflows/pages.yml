name: Deploy current catalog to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Use the supported Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run every runtime and catalog test
        run: node --test tests/*.test.*

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Use the supported Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Verify generated catalogs
        run: |
          node scripts/build-bg3-item-economy.mjs --check
          node scripts/audit-bg3-v10-economy.mjs --check
          node scripts/build-bg3-item-mechanics.mjs --check
          node scripts/build-bg3-item-presentation.mjs --check
          node scripts/build-bg3-placement-browser.mjs --check
      - name: Build current-only site artifact
        run: node scripts/build-pages-site.mjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
