<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D&D World — 600 пользовательских тестов сундуков</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#17130d;color:#f4ead0}.head{padding:18px 22px;background:#2b2115;border-bottom:1px solid #8b6a35;position:sticky;top:0;z-index:2}.head h1{margin:0 0 8px;font-size:21px}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}button{border:1px solid #d4ae60;background:#7d261d;color:#fff8e6;padding:8px 16px;font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.status{font-weight:700}.status.running{color:#f1c96b}.status.passed{color:#73d680}.status.failed{color:#ff7b70}.progress{height:7px;background:#3a3024;margin-top:10px}.progress i{display:block;height:100%;width:0;background:#d6ac55;transition:width .12s}.summary{padding:14px 22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}.metric{background:#262017;border:1px solid #5f4d31;padding:10px}.metric b{display:block;font-size:24px;color:#f1c96b}.failures{margin:0 22px 14px;padding:12px;background:#2e1715;border:1px solid #92362d;white-space:pre-wrap;max-height:260px;overflow:auto}.log{margin:0 22px 16px;padding:10px;background:#211c15;border:1px solid #5f4d31;max-height:190px;overflow:auto;font:12px ui-monospace,monospace}.app-wrap{margin:0 22px 22px;border:2px solid #8b6a35;background:#fff;height:760px}.app-wrap iframe{border:0;width:100%;height:100%}
</style>
</head>
<body>
<div class="head">
  <h1>Пользовательская матрица сундуков и добычи</h1>
  <div class="controls"><button id="run" type="button">Запустить 600 UI-тестов</button><span id="status" class="status">Готово к запуску</span></div>
  <div class="progress"><i id="bar"></i></div>
</div>
<div class="summary">
  <div class="metric">Всего<b id="total">0</b></div><div class="metric">Зелёных<b id="passed">0</b></div><div class="metric">Ошибок<b id="failed">0</b></div><div class="metric">Успех<b id="percent">0%</b></div>
</div>
<pre id="failures" class="failures" hidden></pre><div id="log" class="log">Матрица ещё не запускалась.</div><div id="appWrap" class="app-wrap"></div>
<script>
'use strict';
const EXPECTED_TOTAL=600;
const groups={creation:10,parameters:100,trap:100,lootTable:50,generation:100,manualLoot:100,evaluation:50,placement:40,actions:50};
const state={total:0,passed:0,failed:0,failures:[],groupCounts:{},running:false,startedAt:null,finishedAt:null};
const byId=id=>document.getElementById(id),sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
let frame=null,app=null,doc=null,chestId='',actorId='',compatibleItemId='',compatibleContext='';
function update(phase){byId('total').textContent=state.total;byId('passed').textContent=state.passed;byId('failed').textContent=state.failed;byId('percent').textContent=(state.total?((state.passed/state.total)*100).toFixed(2):'0')+'%';byId('bar').style.width=Math.min(100,state.total/EXPECTED_TOTAL*100)+'%';if(phase)byId('status').textContent=phase;}
function log(text){const box=byId('log');box.textContent=new Date().toLocaleTimeString('ru-RU')+' · '+text+'\n'+box.textContent.slice(0,12000);}
function record(group,name,ok,details){state.total++;state.groupCounts[group]=(state.groupCounts[group]||0)+1;if(ok)state.passed++;else{state.failed++;state.failures.push({number:state.total,group,name,details:String(details||'условие не выполнено')});}if(state.total%10===0||!ok)update(`Выполняется: ${state.total}/${EXPECTED_TOTAL} · ${name}`);}
async function waitFor(predicate,label,timeout=15000){const start=Date.now();while(Date.now()-start<timeout){try{const value=predicate();if(value)return value;}catch(_error){}await sleep(15);}throw new Error('Тайм-аут: '+label);}
async function scenario(group,name,action,verify,timeout=10000){try{await action();const value=await waitFor(()=>verify(),name,timeout);record(group,name,!!value,value===true?'':value);}catch(error){record(group,name,false,error&&error.stack||error);}}
function snap(){return app.worldSnapshotPayload();}
function chest(){return snap().chestState.instances.find(row=>row.id===chestId);}
function physical(){const row=chest();return row.kind==='creature'?row.appearance:row.container;}
function click(element){if(!element)throw new Error('Кнопка не найдена');element.click();}
function change(element,value){if(!element)throw new Error('Поле не найдено');if(element.type==='checkbox')element.checked=!!value;else element.value=String(value);element.dispatchEvent(new app.Event('change',{bubbles:true}));}
function labelControl(label){const node=[...doc.querySelectorAll('.chest-detail label')].find(row=>row.textContent.trim().startsWith(label));return node&&node.querySelector('input,select');}
function section(title){return [...doc.querySelectorAll('.chest-section')].find(row=>row.querySelector('h3')?.textContent.trim()===title)||null;}
function sectionLabelControl(title,label){const root=section(title),node=root&&[...root.querySelectorAll('label')].find(row=>row.textContent.trim().startsWith(label));return node&&node.querySelector('input,select');}
function sectionButton(title,text){const root=section(title);return root&&[...root.querySelectorAll('button')].find(row=>row.textContent.includes(text));}
function actionButton(label){return [...doc.querySelectorAll('button.chest-player-action')].find(row=>row.textContent.includes(label))||null;}
async function openFreshApp(){localStorage.clear();byId('appWrap').innerHTML='';frame=document.createElement('iframe');frame.title='D&D World — пользовательский тестовый экземпляр сундуков';frame.src='../index.html?chest-user-matrix='+Date.now();const loaded=new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(new Error('Приложение не загрузилось')),45000);frame.onload=()=>{clearTimeout(timer);resolve();};});byId('appWrap').appendChild(frame);await loaded;app=frame.contentWindow;doc=frame.contentDocument;app.prompt=()=> 'Матрица сундуков';app.confirm=()=>true;await waitFor(()=>typeof app.worldSnapshotPayload==='function'&&app.DndWorldChests&&doc.querySelector('[data-tab="chests"]'),'инициализация D&D World',45000);await waitFor(()=>snap().chars&&snap().chars.length>0&&typeof app.chestCatalog==='function'&&app.chestCatalog().length>0,'персонаж и Item ID',45000);actorId=snap().chars[0].id;}
async function openChestTab(){click(doc.querySelector('[data-tab="chests"]'));await waitFor(()=>doc.querySelector('.chest-toolbar select'),'вкладка сундуков');}
async function createTen(){const templates=app.DndWorldChests.TEMPLATES;for(let index=0;index<10;index++){const template=templates[index%templates.length];await scenario('creation',`UI создание ${index+1}/10: ${template.label}`,async()=>{change(doc.querySelector('.chest-toolbar select'),template.id);click(doc.querySelector('.chest-toolbar button'));},()=>snap().chestState.instances.length===index+1&&doc.querySelector('.chest-editor'));}const rows=snap().chestState.instances,row=rows.find(item=>item.templateId==='wooden-cache');chestId=row.id;const card=[...doc.querySelectorAll('.chest-list-row')][rows.findIndex(item=>item.id===row.id)];click(card);await waitFor(()=>doc.querySelector('.chest-name')?.value===row.name,'выбор основного сундука');const candidates=app.chestCatalog();compatibleItemId=candidates.find(item=>app.DndWorldChests.validateLootDraft(chest(),candidates,{items:[{itemId:item.id,qty:1}],currency:{}}).ok)?.id||'';if(!compatibleItemId)throw new Error('Не найден совместимый существующий Item ID');}
async function runParameters(){
  const cases=[['name','',index=>`UI сундук ${String(index+1).padStart(3,'0')}`,()=>doc.querySelector('.chest-name'),value=>chest().name===value],['size','Размер',index=>`size-${index}`,()=>labelControl('Размер'),value=>physical().size===value],['material','Материал',index=>`material-${index}`,()=>labelControl('Материал'),value=>physical().material===value],['quality','Качество',index=>`quality-${index}`,()=>labelControl('Качество'),value=>physical().quality===value],['environment','Окружение / подземелье',index=>index===19?'dungeon':`dungeon-${index}`,()=>labelControl('Окружение / подземелье'),value=>physical().environment===value]];
  for(const [key,label,valueFor,elementFor,verify] of cases)for(let index=0;index<20;index++){const value=valueFor(index);await scenario('parameters',`UI параметр ${key} ${index+1}/20`,()=>change(elementFor(),value),()=>verify(value));}
  change(labelControl('Уровень группы'),3);change(labelControl('Уровень награды'),1);change(labelControl('Количество предметов'),3);change(labelControl('Тип награды'),'mixed');await waitFor(()=>chest().container.recommendedLevel===3&&chest().container.rewardMode==='mixed','настройка генерации');
}
async function runTrap(){
  for(let index=0;index<20;index++){const value=index%2===0;await scenario('trap',`UI ловушка включена ${index+1}/20`,()=>change(section('Ловушка').querySelector('input[type="checkbox"]'),value),()=>physical().trap.enabled===value);}
  const cases=[['Тип',index=>`needle-${index}`,value=>physical().trap.type===value],['СЛ обнаружения',index=>5+(index%16),value=>physical().trap.detectionDC===value],['СЛ обезвреживания',index=>6+(index%16),value=>physical().trap.disarmDC===value],['СЛ спасброска',index=>7+(index%16),value=>physical().trap.saveDC===value]];
  for(const [label,valueFor,verify] of cases)for(let index=0;index<20;index++){const value=valueFor(index);await scenario('trap',`UI ловушка ${label} ${index+1}/20`,()=>change(sectionLabelControl('Ловушка',label),value),()=>verify(value));}
  change(section('Ловушка').querySelector('input[type="checkbox"]'),true);change(labelControl('СЛ обнаружения'),10);await waitFor(()=>physical().trap.enabled&&physical().trap.detectionDC===10,'финальная ловушка');
}
async function runLootTable(){
  const candidates=app.chestCatalog(),probe=app.DndWorldChests.clone(chest());probe.container.environment='';const compatible=candidates.find(item=>app.DndWorldChests.validateLootDraft(probe,candidates,{items:[{itemId:item.id,qty:1}],currency:{}}).ok);if(!compatible)throw new Error('В реальном каталоге не найден допустимый Item ID');compatibleContext=(compatible.contexts&&compatible.contexts[0])||(compatible.tags&&compatible.tags[0])||'';change(labelControl('Окружение / подземелье'),compatibleContext);await waitFor(()=>physical().environment===compatibleContext,'реальный контекст Item ID');compatibleItemId=compatible.id;if(!app.DndWorldChests.validateLootDraft(chest(),candidates,{items:[{itemId:compatibleItemId,qty:1}],currency:{}}).ok)throw new Error('Item ID не совместим после установки его реального контекста');
  for(let index=0;index<10;index++)await scenario('lootTable',`UI таблица добавить ${index+1}/10`,()=>click(sectionButton('Таблица добычи','+ строка')),()=>chest().container.lootTable.length===index+1);
  for(let index=0;index<10;index++)await scenario('lootTable',`UI таблица Item ID ${index+1}/10`,()=>change(doc.querySelectorAll('.chest-table-row select')[index],compatibleItemId),()=>chest().container.lootTable[index].itemId===compatibleItemId);
  for(let index=0;index<10;index++){const value=1+index;await scenario('lootTable',`UI таблица вес ${index+1}/10`,()=>change(doc.querySelectorAll('.chest-table-row input[title="Вес"]')[index],value),()=>chest().container.lootTable[index].weight===value);}
  for(let index=0;index<10;index++)await scenario('lootTable',`UI таблица мин. уровень ${index+1}/10`,()=>change(doc.querySelectorAll('.chest-table-row input[title="Мин. уровень"]')[index],1),()=>chest().container.lootTable[index].minLevel===1);
  for(let index=0;index<10;index++)await scenario('lootTable',`UI таблица контекст ${index+1}/10`,()=>change(doc.querySelectorAll('.chest-table-row input[title="Контексты через запятую"]')[index],compatibleContext),()=>chest().container.lootTable[index].contexts.join(',')===compatibleContext);
}
async function runGeneration(){for(let index=0;index<50;index++){const seed=`ui-seed-${String(index+1).padStart(3,'0')}`;await scenario('generation',`UI seed ${index+1}/50`,()=>change(labelControl('Seed'),seed),()=>chest().container.loot.seed===seed);await scenario('generation',`UI генерация ${index+1}/50`,()=>click(sectionButton('Предварительный просмотр добычи','Сгенерировать')),()=>chest().container.loot.status==='draft'&&chest().container.loot.seed===seed&&chest().container.loot.validation.ok);}}
async function runManualLoot(){
  for(let index=0;index<50;index++){const value=1+(index%20);await scenario('manualLoot',`UI количество добычи ${index+1}/50`,()=>change(doc.querySelector('.chest-loot-row input[type="number"]'),value),()=>chest().container.loot.draft.items[0].qty===value&&chest().container.loot.validation.ok);}
  for(let index=0;index<30;index++){const value=(index+1)+0.25;await scenario('manualLoot',`UI деньги ${index+1}/30`,()=>change(section('Предварительный просмотр добычи').querySelector('label:last-child input[type="number"]'),value),()=>chest().container.loot.draft.currency.totalCopper===Math.round(value*100));}
  for(let index=0;index<20;index++)await scenario('manualLoot',`UI утверждение ${index+1}/20`,()=>click(sectionButton('Предварительный просмотр добычи','Утвердить')),()=>chest().container.loot.status==='approved'&&chest().container.loot.approved&&chest().container.loot.validation.ok);
}
async function runEvaluation(){const labels=['Осмотреть','Проверить','Открыть','Взломать','Обезвредить','Разрушить'];for(let index=0;index<50;index++){const label=labels[index%labels.length],before=chest().revision;await scenario('evaluation',`UI блок до размещения ${index+1}/50: ${label}`,()=>{const button=actionButton(label);if(!button.disabled)throw new Error('Действие неожиданно доступно');if(!button.title)throw new Error('Нет точной причины блокировки');click(button);},()=>chest().revision===before&&actionButton(label).disabled&&actionButton(label).title.includes('размещ'));}}
async function runPlacement(){for(let index=0;index<40;index++){const before=snap().chestState.revision;await scenario('placement',`UI размещение ${index+1}/40`,()=>click(section('Размещение').querySelector('button')),()=>chest().placement.placed&&chest().placement.sceneId&&snap().chestState.revision===before+1);}}
async function resolveRoll(values,actionLabel){await waitFor(()=>doc.querySelector('#rollBack')?.style.display==='flex','окно броска');const inputs=[...doc.querySelectorAll('#rollRows input')];if(inputs.length!==values.length)throw new Error(`Ожидалось полей ${values.length}, найдено ${inputs.length}`);inputs.forEach((input,index)=>{input.value=String(values[index]);input.dispatchEvent(new app.Event('input',{bubbles:true}));});click([...doc.querySelectorAll('#rollBack button')].find(row=>row.textContent.includes('Рассчитать и применить')));const renderedAfterApply=actionButton(actionLabel),statusText=doc.querySelector('#status')?.textContent||'';if(renderedAfterApply&&!statusText.includes('Действие открыто:'))await waitFor(()=>!renderedAfterApply.isConnected,`завершение ActionEvaluation «${actionLabel}»`,30000);}
async function clickReadyAction(label){await sleep(750);const button=await waitFor(()=>{const current=actionButton(label);return current&&!current.disabled&&current.isConnected?current:null;},`доступная кнопка «${label}»`,30000);click(button);}
async function runActions(){
  for(let index=0;index<20;index++){const before=chest().revision;await scenario('actions',`UI осмотреть ${index+1}/20`,async()=>clickReadyAction('Осмотреть'),()=>chest().revision===before+1&&chest().lastOutcome?.code==='INSPECTED'&&chest().knowledge.inspectedBy.includes(actorId),30000);}
  for(let index=0;index<20;index++){const before=chest().revision,natural=index%2?20:1;await scenario('actions',`UI проверить ${index+1}/20`,async()=>{await clickReadyAction('Проверить');await resolveRoll([natural],'Проверить');},()=>chest().revision===before+1&&['CHECK_SUCCEEDED','CHECK_FAILED'].includes(chest().lastOutcome?.code)&&Number.isFinite(chest().lastOutcome.total),30000);}
  for(let index=0;index<10;index++){const before=chest().revision,durability=physical().durability.current;await scenario('actions',`UI разрушить без урона ${index+1}/10`,async()=>{await clickReadyAction('Разрушить');await resolveRoll([0],'Разрушить');},()=>chest().revision===before+1&&chest().lastOutcome?.code==='CHEST_DAMAGED'&&physical().durability.current===durability,30000);}
}
async function run(){
  if(state.running)return;Object.assign(state,{total:0,passed:0,failed:0,failures:[],groupCounts:{},running:true,startedAt:new Date().toISOString(),finishedAt:null});byId('run').disabled=true;byId('failures').hidden=true;byId('log').textContent='Старт пользовательской матрицы…';byId('status').className='status running';update('Загрузка чистого тестового мира…');
  try{await openFreshApp();await openChestTab();log('Настоящий интерфейс D&D World загружен в чистом iframe.');await createTen();log('10/10 шаблонов созданы через UI.');await runParameters();log('100/100 параметров зелёные.');await runTrap();log('100/100 настроек ловушки зелёные.');await runLootTable();log('50/50 операций таблицы зелёные.');await runGeneration();log('100/100 seed и генераций зелёные.');await runManualLoot();log('100/100 ручных правок и утверждений зелёные.');await runEvaluation();log('50/50 заблокированных действий имеют точные причины.');await runPlacement();log('40/40 размещений зелёные.');await runActions();log('50/50 действий игроков зелёные.');}
  catch(error){record('harness','Критическая ошибка harness',false,error&&error.stack||error);}
  state.finishedAt=new Date().toISOString();state.running=false;const complete=state.total===EXPECTED_TOTAL&&state.failed===0&&Object.entries(groups).every(([key,count])=>state.groupCounts[key]===count);byId('run').disabled=false;byId('status').className='status '+(complete?'passed':'failed');update(complete?`ГОТОВО: ${state.passed}/${EXPECTED_TOTAL} зелёных`:`НЕ ПРОЙДЕНО: ${state.passed}/${state.total} зелёных, ошибок ${state.failed}`);if(state.failures.length){byId('failures').hidden=false;byId('failures').textContent=state.failures.map(row=>`#${row.number} [${row.group}] ${row.name}\n${row.details}`).join('\n\n');}window.__chestUserReport={expected:EXPECTED_TOTAL,total:state.total,passed:state.passed,failed:state.failed,success:complete,groups:Object.assign({},state.groupCounts),failures:state.failures.slice(),startedAt:state.startedAt,finishedAt:state.finishedAt};
}
byId('run').addEventListener('click',run);
</script>
</body>
</html>
