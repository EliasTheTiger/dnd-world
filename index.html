  const t=ab.tags||[];
  if(['attack','action','bonus','reaction','save','extradamage','control','heal','limited'].some(x=>t.indexOf(x)>=0)) return true;
  return AB_ACTIVE_RE.test(normRollTxt(ab.n)+' '+normRollTxt(ab.x));
}
/* пассивность для эффектов и владений считается по-прежнему (без зарядов) */
function isPassiveAbility(ab){
  /* Источник постоянных эффектов и владений. Активная способность (приемы, реакции,
     все, что применяется кнопкой) постоянных эффектов не дает — этого требовала
     ветка codex; при этом записи владений и расовых черт остаются постоянными. */
  if(!ab||ab.uses!=null||ab.rest) return false;
  if(ab.mode==='active') return false;
  if(ab.mode==='passive') return true;
  const tags=ab.tags||[];
  if(tags.indexOf('passive')>=0) return true;
  if(/пассивн[а-я]*/.test(fxTextOf(ab).toLowerCase())) return true;
  return !abilityIsActive(ab);
}

/* ── общие запасы: кости превосходства, ци, вдохновение барда и т.п. ── */
const AB_POOLS=[
  {key:'superiority', use:/кост[ьи]\s+превосходства/, pool:/кост[а-я]*\s+превосходства/, label:'Кость превосходства'},
  {key:'ki',          use:/очк[оа]\s+ци|очков\s+ци/,  pool:/очки\s+ци|ци\b/,             label:'Очко ци'},
  {key:'bardic',      use:/кост[ьи]\s+вдохновения|вдохновени[ея]\s+барда/, pool:/вдохновение\s+барда/, label:'Кость вдохновения'}
];
function abilityPoolOf(caster, ab){
  if(!caster||!ab) return null;
  const x=normRollTxt(ab.x)+' '+normRollTxt(ab.n);
  for(const p of AB_POOLS){
    if(!p.use.test(x)) continue;
    const hit=(caster.abilities||[]).map(e=>({e, db:abilityOf(e.abilityId)}))
      .filter(o=>o.db&&o.db.id!==ab.id&&o.db.uses!=null&&p.pool.test(normRollTxt(o.db.n)+' '+normRollTxt(o.db.x)))[0];
    if(!hit) continue;
    const dm=(normRollTxt(hit.db.n)+' '+normRollTxt(hit.db.x)).match(/d(\d+)/);
    const cur=hit.e.cur==null?hit.db.uses:hit.e.cur;
    /* к чему прибавляется кость запаса */
    let addTo='dmg';
    if(/добавить\s+ее\s+к\s+броску(?!\s+урона)|к\s+броску\s+атаки/.test(x)) addTo='atk';
    if(/к\s+броску\s+урона|к\s+урону/.test(x)) addTo='dmg';
    return {label:p.label, sides:dm?+dm[1]:8, ab:hit.db, entry:hit.e, cur, max:hit.db.uses, addTo};
  }
  return null;
}
/* прием применяется к атаке оружием? */
function abilityUsesWeapon(ab){
  if(!ab) return false;
  const x=normRollTxt(ab.n)+' '+normRollTxt(ab.x);
  return /атак[а-я]*\s+оружием|оружием\s+ближнего|попадаете\s+по\s+(?:существу|цели)|при попадании|броск[а-я]*\s+атаки|скрыт[а-я]*\s+атак|удар[а-я]*\b/.test(x);
}
/* прием срабатывает уже ПОСЛЕ состоявшегося попадания — бросок атаки не нужен */
function abilityAfterHit(ab){
  const x=normRollTxt(ab.x);
  return /если вы попадаете|когда вы попадаете|при попадании|если вы наносите урон/.test(x)
      && !/до или после совершения броска атаки|добавить ее к броску(?!\s+урона)/.test(x);
}
function weaponOptionsOf(c){
  if(!c) return [];
  const out=(typeof weaponRows==='function')?weaponRows(c).map(w=>Object.assign({},w)):[];
  const seen={}; out.forEach(w=>{ seen[String(w.n).replace(/\s*\(без владения\)$/,'')]=1; });
  (c.inventory||[]).forEach(e=>{
    const it=itemOf(e.itemId); if(!it||it.type!=='weapon'||seen[it.n]) return;
    seen[it.n]=1;
    const tags=it.tags||[];
    const useDex=tags.indexOf('ranged')>=0||(tags.indexOf('finesse')>=0&&eMod(c,'dex')>=eMod(c,'str'));
    const m=useDex?eMod(c,'dex'):eMod(c,'str');
    const hasProf=(typeof weaponProfHas==='function')?weaponProfHas(c,it):true;
    out.push({n:it.n+(hasProf?'':' (без владения)')+' · из сумки',
      atk:m+(hasProf?PROF[c.level]:0)+fxSum(c,'atk'), dmg:it.dmg||'', dt:it.dmgType||'',
      m:m+fxSum(c,'dmg'), abn:useDex?'Лов':'Сил', fromBag:true});
  });
  out.forEach((w,i)=>{ w.idx=i; });
  return out;
}

/* ── тип урона из текста ── */
function detectDmgType(ctx){
  const t=String(ctx||'').toLowerCase();
  let m=t.match(/урон[а-я]*\s+([а-я]+)/);
  if(m&&dmgTypeCanon(m[1])!==m[1]) return dmgTypeCanon(m[1]);
  m=t.match(/(дробящ|колющ|рубящ|некротическ|психическ|звуков|огненн|силов)[а-я]*\s+урон/);
  if(m) return dmgTypeCanon(m[1]);
  m=t.match(/урон[а-я]*\s+(огнем|холодом|кислотой|ядом|электричеством|звуком|излучением)/);
  if(m) return dmgTypeCanon(m[1]);
  return '';
}
/* ── бросок d20 с преимуществом: какой результат берется ── */
function pickNat(v, key, mode){
  const a=v[key], b=v[key+'_2'];
  if(a==null) return null;
  if(!mode||b==null) return a;
  return mode===1?Math.max(a,b):Math.min(a,b);
}

/* ═══ Главная функция: какие броски нужны для записи ═══ */
function rollSpecOf(rec, opts){
  opts=opts||{};
  const caster=opts.caster, kind=opts.kind||'spell';
  const isSpell=(kind==='spell');
  const lvl=isSpell?(+rec.l||0):0;
  const slotLvl=(typeof opts.slotLvl==='number')?opts.slotLvl:lvl;
  const extraLv=(isSpell&&slotLvl>lvl)?(slotLvl-lvl):0;
  const ti=opts.target||{kind:'none', known:false, name:''};
  const weapon=opts.weapon||null;
  const pool=opts.pool||null;
  const x=normRollTxt(rec.x), hi=normRollTxt(rec.hi), all=x+' '+hi;
  const rows=[], meta={half:false, dc:0, saveAb:'', saveKey:'', dmgType:'', target:ti,
    weapon:weapon, pool:pool, autoHit:false, afterHit:false, kind:kind, recName:rec.n||''};

  /* 1. бросок атаки — свой d20 */
  const autoHit=/автоматически\s+попада/.test(all);
  meta.autoHit=autoHit;
  const wantsAtk=/атак[а-я]*\s+заклинанием|дальнобойн[а-я]*\s+атак|рукопашн[а-я]*\s+атак|бросок[а-я]*\s+атаки|броску\s+атаки|при попадании|попада[а-я]*\s+по цел|попадаете\s+по/.test(all);
  meta.afterHit=(!isSpell)&&abilityAfterHit(rec);
  if(!autoHit && wantsAtk && !meta.afterHit){
    let mod, hint;
    if(isSpell&&caster){ mod=spellAtk(caster); hint='+ '+mod+' (мастерство + характеристика заклинателя)'; }
    else if(weapon){ mod=weapon.atk; hint='+ '+mod+' ('+weapon.n+')'; }
    else if(caster){ mod=PROF[caster.level]+Math.max(eMod(caster,'str'),eMod(caster,'dex')); hint='+ '+mod+' (мастерство + характеристика)'; }
    else { mod=0; hint=''; }
    const atkFx=caster?rollFxEntries(caster,'attack'):[];
    const aA=atkFx.some(f=>f.mode==='adv'), aD=atkFx.some(f=>f.mode==='dis');
    const atkAdv=(aA===aD)?0:(aA?1:2);
    rows.push({key:'atk', type:'atk', side:'caster', natural:true, mod, adv:atkAdv,
      label:'Бросок атаки: d20', hint:hint+(ti.known&&ti.ac!=null?' · КД цели '+ti.ac:' · КД цели определяет мастер')
        +(atkAdv?(atkAdv===1?' · преимущество от эффекта':' · помеха от эффекта'):'')});
    atkFx.filter(f=>f.mode==='die').forEach((f,i)=>{
      const dm=normDiceInput(String(f.value||'')).match(/^(-)?(\d*)d(\d+)$/); if(!dm) return;
      const cnt=Math.max(1,+dm[2]||1);
      rows.push({key:'atkfx'+i, type:'other', side:'caster', cnt, sides:+dm[3], mod:0, addTo:'atk', sign:dm[1]?-1:1,
        label:f.label+': '+(dm[1]?'-':'')+cnt+'d'+dm[3],
        hint:'кость действующего эффекта — движок учтет ее в итоге атаки'});
    });
  }
  if(meta.afterHit){
    rows.push({key:'atk', type:'atk', side:'caster', natural:true, mod:(weapon?weapon.atk:(caster?PROF[caster.level]+Math.max(eMod(caster,'str'),eMod(caster,'dex')):0)), adv:0, optional:true,
      label:'Бросок атаки оружием: d20 (если проводите атаку прямо сейчас)',
      hint:'прием применяется по уже состоявшемуся попаданию — поле можно оставить пустым'});
  }
  /* 2. кость общего запаса (превосходство, ци, вдохновение) */
  if(pool){
    rows.push({key:'res', type:'res', side:'caster', cnt:1, sides:pool.sides, mod:0, addTo:pool.addTo,
      label:pool.label+': 1d'+pool.sides,
      hint:'прибавляется к '+(pool.addTo==='atk'?'броску атаки':'урону')+' · в запасе '+pool.cur+' из '+pool.max});
  }
  /* 3. урон оружия — для приемов, идущих с атакой оружием */
  if(weapon&&!isSpell){
    const wm=normRollTxt(weapon.dmg).match(/(\d*)d(\d+)/);
    if(wm){
      rows.push({key:'wdmg', type:'dmg', side:'caster', cnt:+wm[1]||1, sides:+wm[2], mod:weapon.m, modLabel:'характеристика',
        dmgType:dmgTypeCanon(weapon.dt),
        label:'Урон оружия ('+weapon.n+'): сумма '+(+wm[1]||1)+'d'+wm[2],
        hint:'от '+(+wm[1]||1)+' до '+((+wm[1]||1)*(+wm[2]))+(weapon.m?' · + '+weapon.m+' (характеристика)':'')+' · оставьте пустым, если урон уже применен'});
      if(!meta.dmgType) meta.dmgType=dmgTypeCanon(weapon.dt);
    }
  }
  /* 4. спасбросок цели */
  const noSave=/спасброск[а-я]*[^.]{0,60}не\s+(?:производятся|требуются|делаются|бросаются)|без\s+спасброск/.test(all);
  const sm=noSave?null:all.match(/спасброс[а-я]*\s+([а-я]+)/);
  if(sm&&SAVE_AB_KEY[sm[1]]&&ti.kind!=='object'){
    meta.saveAb=sm[1]; meta.saveKey=SAVE_AB_KEY[sm[1]];
    const dcm=all.match(/сл\s*(\d+)/);
    meta.dc=(isSpell&&caster)?spellDC(caster)
      :(dcm?+dcm[1]:(caster?8+PROF[caster.level]+Math.max(eMod(caster,'str'),eMod(caster,'dex'),eMod(caster,'wis'),eMod(caster,'cha')):10));
    meta.half=/при успехе[^.]{0,60}половин|половин[а-я]*\s+урона|успешном спасброске[^.]{0,60}половин|или\s+половин|вдвое\s+меньш[а-я]*\s+урон|половинный\s+урон/.test(all);
    const known=ti.known&&typeof ti.saveMod==='function';
    const tmod=known?ti.saveMod(meta.saveKey):0;
    const advPre=(isSpell&&ti.magicRes)?1:0;
    rows.push({key:'save', type:'save', side:'target', natural:known, mod:known?tmod:0, dc:meta.dc, adv:advPre, saveKey:meta.saveKey,
      label:known?('Спасбросок цели ('+sm[1]+'): d20 '+fmtMod(tmod)+' — бросает '+ti.name)
                 :('Спасбросок цели ('+sm[1]+'): итог броска цели'),
      hint:'СЛ '+meta.dc+(known?'':' · у цели нет записи — впишите итог с ее модификатором')
        +(meta.half?' · при успехе урон вдвое меньше (посчитаю сам)':'')
        +(advPre?' · ▲ сопротивление магии':'')});
    if(ti.kind==='ally'&&ti.obj){
      rollFxEntries(ti.obj,'save.'+meta.saveKey).filter(f=>f.mode==='die').forEach((f,i)=>{
        const dm=normDiceInput(String(f.value||'')).match(/^(-)?(\d*)d(\d+)$/); if(!dm) return;
        const cnt=Math.max(1,+dm[2]||1);
        rows.push({key:'savefx'+i,type:'other',side:'target',cnt,sides:+dm[3],mod:0,addTo:'save',sign:dm[1]?-1:1,
          label:f.label+': '+(dm[1]?'-':'')+cnt+'d'+dm[3],hint:'кость действующего эффекта — движок учтет ее в спасброске'});
      });
    }
  }
  else if(!noSave && ti.kind!=='object' && kind!=='spell' &&
      /(?:должн[аоы]|совершает|совершить|проходит|бросает|требует)[^.]{0,40}спасброс|спасброс[а-я]*\s+(?:по\s+наследию|против)/.test(all)){
    /* спасбросок нужен, но характеристика в тексте не названа — спрашиваем итог у цели */
    meta.dc=caster?8+PROF[caster.level]+Math.max(eMod(caster,'str'),eMod(caster,'dex'),eMod(caster,'con'),eMod(caster,'wis'),eMod(caster,'cha')):10;
    meta.half=/или\s+половин|половин[а-я]*\s+урона/.test(all);
    rows.push({key:'save', type:'save', side:'target', natural:false, mod:0, dc:meta.dc, adv:0,
      label:'Спасбросок цели: итог броска', hint:'СЛ '+meta.dc+' · характеристику спасброска определяет мастер по описанию'
        +(meta.half?' · при успехе урон вдвое меньше':'')});
  }
  /* 5. состязание проверок: «вы и ваша цель проводите проверку …» */
  const cm=all.match(/провер[а-я]*\s+(?:навыка\s+)?([а-яa-z]+)/);
  const contest=/вы и ваша цель|состязан|противопоставленн/.test(all);
  if(cm&&(contest||/сравн[а-я]*\s+результат/.test(all))){
    const skName=SKILLS.map(s=>s[0]).find(n=>n.toLowerCase().indexOf(cm[1].slice(0,5))===0);
    let cmod=0;
    if(caster&&skName){ const i=SKILLS.findIndex(s=>s[0]===skName); cmod=skillBonus(caster,i).v; }
    rows.push({key:'chk', type:'check', side:'caster', natural:true, mod:cmod, adv:0,
      label:'Ваша проверка'+(skName?' ('+skName+')':'')+': d20 '+fmtMod(cmod),
      hint:'состязание — сравниваю с проверкой цели'});
    if(ti.kind!=='object'){
      const known=ti.known&&typeof ti.skillMod==='function';
      const tmod=known?(skName?ti.skillMod(skName):0):0;
      rows.push({key:'tchk', type:'tcheck', side:'target', natural:known, mod:known?tmod:0, adv:0,
        label:known?('Проверка цели'+(skName?' ('+skName+')':'')+': d20 '+fmtMod(tmod)+' — бросает '+ti.name)
                   :('Проверка цели'+(skName?' ('+skName+')':'')+': итог броска цели'),
        hint:known?'':'у цели нет записи — впишите итог с ее модификатором'});
      meta.contest=true;
    }
  }
  /* 6. кости из текста записи */
  let groups=scanDiceGroups(x).filter(g=>!/^\s*(?:хитов\s*)?за (?:каждый\s+)?круг|^\s*за каждые|^\s*за круг/.test(g.after));
  const hasTiers=/\d+\s*(?:[–—-]\s*\d+\s*)?уровен[ья]|на\s+\d+\s*уровне/.test(x);
  const buckets={};
  groups.forEach(g=>{ const k=(hasTiers?'lvl':classifyDice(g))+'_'+g.sides; (buckets[k]=buckets[k]||[]).push(g); });
  groups=Object.keys(buckets).map(k=>{
    const arr=buckets[k].sort((a,b)=>a.idx-b.idx);
    if(arr.length===1) return arr[0];
    const lv=(caster&&caster.level)||1;
    const tiers=arr.map(g=>{ const m=g.before.match(/(\d+)\s*(?:[–—-]\s*\d+\s*)?уровен[ья]?[^\d]{0,16}$|на\s+(\d+)\s*уровне[^\d]{0,16}$/);
      return {g, thr:m?(+(m[1]||m[2])):1}; });
    if(tiers.some(t=>t.thr>1)){
      const fit=tiers.filter(t=>t.thr<=lv).sort((a,b)=>b.thr-a.thr)[0];
      const base=Object.assign({}, (fit||tiers.sort((a,b)=>a.thr-b.thr)[0]).g);
      base.cls=classifyDice(arr[0]);
      return base;
    }
    const upTo=arr.filter(g=>/\sдо\s*$/.test(g.before));
    if(upTo.length){ const b=Object.assign({}, upTo[upTo.length-1]); b.cls=classifyDice(arr[0]); return b; }
    const b=Object.assign({}, arr.sort((a,b)=>b.cnt-a.cnt)[0]); b.cls=classifyDice(arr[0]); return b;
  }).sort((a,b)=>a.idx-b.idx);
  const seen={};
  groups.forEach(g=>{
    const cls=g.cls||classifyDice(g);
    const key=cls+'_'+g.sides;
    if(seen[key]) return; seen[key]=1;
    let cnt=g.cnt;
    if(isSpell&&lvl===0&&caster){
      const tier=cantripTierDice(rec.hi, caster.level);
      if(tier&&tier.sides===g.sides) cnt=tier.cnt;
    }
    if(extraLv){ const add=upcastAdd(rec.hi, g.sides, rec.x); if(add) cnt+=extraLv*add; }
    let mod=g.plus, modLabel=g.plus?'из описания':'';
    if(/^\s*\+\s*(?:ваш\s+)?модификатор/.test(g.after)&&caster){ mod=isSpell?eMod(caster,spellAbOf(caster)):Math.max(eMod(caster,'str'),eMod(caster,'dex'),eMod(caster,'con')); modLabel='модификатор характеристики'; }
    else if(/^\s*\+\s*(?:ваш\s+)?уровень/.test(g.after)&&caster){ mod=caster.level; modLabel='ваш уровень'; }
    let dt=detectDmgType(g.ctx);
    const isTemp=/временн[а-я]*\s+хит/.test(g.ctx||'');
    if(isTemp){ dt=''; }
    if(cls==='dmg'&&dt&&!meta.dmgType) meta.dmgType=dt;
    const kind2=isTemp?'temp':cls;
    rows.push({key:kind2+rows.length, type:kind2, side:'caster', cnt, sides:g.sides, mod, modLabel, dmgType:dt,
      label:(kind2==='temp'?'Временные хиты':cls==='heal'?'Лечение':cls==='dmg'?('Урон'+(dt?' ('+dt+')':'')):'Прочий бросок')+': сумма '+cnt+'d'+g.sides,
      hint:(cnt!==g.cnt?'усилено: было '+g.cnt+'d'+g.sides+' · ':'')+'обычно '+cnt+'–'+(cnt*g.sides)+' (крит и несколько целей дают больше)'+(mod?' · + '+mod+(modLabel?' ('+modLabel+')':''):'')});
  });
  /* 7. шкала заговора, если костей в тексте нет */
  if(isSpell&&lvl===0&&caster&&!rows.some(r=>r.type==='dmg'||r.type==='heal')){
    const tier=cantripTierDice(rec.hi, caster.level);
    if(tier) rows.push({key:'dmg0', type:'dmg', side:'caster', cnt:tier.cnt, sides:tier.sides, mod:0, modLabel:'', dmgType:meta.dmgType,
      label:'Урон: сумма '+tier.cnt+'d'+tier.sides, hint:'шкала заговора для '+caster.level+' уровня · от '+tier.cnt+' до '+(tier.cnt*tier.sides)});
  }
  /* 8. свободная строка мастера */
  const needAny=rows.length>0 || /бросок|бросаете|d20|кубик/.test(all);
  if(needAny) rows.push({key:'extra', type:'extra', side:'caster', mod:0, label:'Прочий бросок (по решению мастера)', hint:'необязательно — уйдет в летопись'});
  return {rows, meta};
}

/* ═══ Разбор итога по правилам 5e ═══ */
function resolveOutcome(spec, v, ctx){
  const meta=spec.meta, ti=meta.target||{kind:'none',known:false,name:''};
  const out={verdict:[], notes:[], hit:null, crit:false, fumble:false, saveOk:null, contestWin:null,
    healTotal:null, tempTotal:null, dmgRaw:null, dmgTotal:null, dmgType:meta.dmgType||'', targetName:ti.name||'',
    effectAllowed:null, blocked:false};
  const row=t=>spec.rows.find(r=>r.type===t);
  const resR=row('res'); const resVal=(resR&&v.res!=null)?v.res:0;
  /* атака */
  const ar=row('atk');
  if(ar){
    const nat=pickNat(v,'atk',ar.adv);
    if(nat!=null){
      const fxBonus=spec.rows.filter(r=>r.addTo==='atk'&&v[r.key]!=null)
        .reduce((a,r)=>a+(v[r.key]+(r.mod||0))*(r.sign||1),0);
      const bonus=(resR&&resR.addTo==='atk')?resVal:0;
      const total=nat+ar.mod+bonus+fxBonus;
      const critImmune=ti.known&&ti.obj&&(typeof fxNotesOf==='function')&&ti.kind==='ally'
        ? fxNotesOf(ti.obj).some(t=>/иммунитет к критическ/i.test(t))
        : (ti.obj&&/иммунитет к критическ/i.test(String(ti.obj.traits||'')));
      out.crit=(nat===20)&&!critImmune; out.fumble=(nat===1);
      if(nat===20&&critImmune) out.verdict.push('У цели иммунитет к критическим ударам — двадцатка засчитана как обычное попадание.');
      if(nat===20) out.hit=true;
      else if(nat===1) out.hit=false;
      else if(ti.known&&ti.ac!=null) out.hit=(total>=ti.ac);
      out.verdict.push('Атака: d20 '+nat+(ar.mod?' '+fmtMod(ar.mod):'')+(bonus?' + '+bonus+' (кость запаса)':'')
        +(fxBonus?' '+(fxBonus>0?'+ ':'− ')+Math.abs(fxBonus)+' (действующие эффекты)':'')+' = '+total
        +(ti.known&&ti.ac!=null?(' против КД '+ti.ac+' — '+(out.hit?'ПОПАДАНИЕ':'промах')):' — попадание определяет мастер')
        +(out.crit?' · КРИТИЧЕСКОЕ ПОПАДАНИЕ (кости урона бросаются дважды)':'')
        +(out.fumble?' · критический промах':''));
      out.notes.push('атака '+total+(ti.known&&ti.ac!=null?' против КД '+ti.ac+' — '+(out.hit?'попадание':'промах'):''));
    }
  }
  if(ctx&&ctx.hitOverride==='hit'){ out.hit=true; out.verdict.push('Попадание отмечено мастером.'); }
  if(ctx&&ctx.hitOverride==='miss'){ out.hit=false; out.verdict.push('Промах отмечен мастером.'); }
  if(ctx&&ctx.hitOverride==='crit'){ out.hit=true; out.crit=true; out.verdict.push('Критическое попадание отмечено мастером.'); }
  if(meta.autoHit&&out.hit==null){ out.hit=true; out.verdict.push('Заклинание попадает автоматически.'); }
  /* спасбросок цели */
  const sr=row('save');
  if(sr){
    const raw=sr.natural?pickNat(v,'save',sr.adv):v.save;
    if(raw!=null){
      const fxBonus=spec.rows.filter(r=>r.addTo==='save'&&v[r.key]!=null)
        .reduce((a,r)=>a+(v[r.key]+(r.mod||0))*(r.sign||1),0);
      const total=(sr.natural?(raw+sr.mod):raw)+fxBonus;
      out.saveOk=(total>=sr.dc);
      out.verdict.push('Спасбросок цели'+(meta.saveAb?' ('+meta.saveAb+')':'')+': '
        +(sr.natural?('d20 '+raw+' '+fmtMod(sr.mod)):raw)+(fxBonus?' '+(fxBonus>0?'+ ':'− ')+Math.abs(fxBonus)+' (эффект)':'')
        +' = '+total+' против СЛ '+sr.dc+' — '+(out.saveOk?'УСПЕХ':'провал'));
      out.notes.push('спасбросок цели '+total+' против СЛ '+sr.dc+' — '+(out.saveOk?'успех':'провал'));
    }
  }
  /* состязание проверок */
  const ck=row('check'), tck=row('tcheck');
  if(ck&&tck){
    const a=pickNat(v,'chk',ck.adv), b=tck.natural?pickNat(v,'tchk',tck.adv):v.tchk;
    if(a!=null&&b!=null){
      const at=a+ck.mod, bt=tck.natural?(b+tck.mod):b;
      out.contestWin=(at>bt);
      out.verdict.push('Состязание: ваш итог '+at+' против '+bt+' у цели — '+(out.contestWin?'вы победили':(at===bt?'ничья (по правилам ничья — ничего не происходит)':'победила цель')));
      out.notes.push('состязание '+at+' против '+bt);
    }
  }
  /* Длительное последствие разрешено только после всех требуемых проверок.
     Пустое поле не равно провалу цели: без результата движок не имеет права
     молча наложить состояние. */
  const gates=[];
  if(ar) gates.push(out.hit===true?true:(out.hit===false?false:null));
  if(sr) gates.push(out.saveOk===false?true:(out.saveOk===true?false:null));
  if(ck&&tck) gates.push(out.contestWin===true?true:(out.contestWin===false?false:null));
  out.effectAllowed=gates.some(x=>x===false)?false:(gates.some(x=>x===null)?null:true);
  /* временные хиты */
  let temp=0, tempSeen=false;
  spec.rows.forEach(r=>{ if(r.type==='temp'&&v[r.key]!=null){ temp+=v[r.key]+(r.mod||0); tempSeen=true; } });
  if(tempSeen){
    out.tempTotal=Math.max(0,temp);
    const had=(ti.obj&&+ti.obj.hpTemp)||0;
    out.verdict.push('Временные хиты: '+out.tempTotal+(had?(out.tempTotal>had?' — заменят прежние '+had+' (по правилам берется большее)':' — прежние '+had+' сильнее, останутся они'):''));
  }
  /* лечение */
  let heal=0, healSeen=false;
  spec.rows.forEach(r=>{ if(r.type==='heal'&&v[r.key]!=null){ heal+=v[r.key]+(r.mod||0); healSeen=true; } });
  if(healSeen){ out.healTotal=Math.max(0,heal); out.verdict.push('Лечение: +'+out.healTotal+' хитов.'); }
  /* урон */
  let dmg=0, dmgSeen=false, dtype=meta.dmgType||'';
  spec.rows.forEach(r=>{
    if(r.type!=='dmg'||v[r.key]==null) return;
    dmg+=v[r.key]+(r.mod||0); dmgSeen=true;
    if(r.dmgType&&!dtype) dtype=r.dmgType;
  });
  if(resR&&resR.addTo==='dmg'&&resVal){ dmg+=resVal; dmgSeen=dmgSeen||resVal>0; }
  if(dmgSeen){
    out.dmgRaw=dmg; out.dmgType=dtype;
    let d=dmg;
    if(out.hit===false){ d=0; out.verdict.push('Промах — урон не применяется.'); }
    else if(out.saveOk===true){
      if(meta.half){ d=Math.floor(d/2); out.verdict.push('Успешный спасбросок — урон вдвое меньше: '+d+'.'); }
      else { d=0; out.verdict.push('Успешный спасбросок — урон не применяется.'); }
    }
    if(d>0&&ti.known){
      const tr=dmgAfterTraits(ti.obj, d, dtype);
      if(tr.note){ out.verdict.push('Свойства цели: '+tr.note+' → '+tr.amount+'.'); }
      d=tr.amount;
    }
    out.dmgTotal=d;
    if(d>0) out.verdict.push('Итоговый урон по цели: '+d+(dtype?' ('+dtype+')':'')+'.');
    /* предсказание состояния цели */
    if(d>0&&ti.known&&ti.hp!=null){
      const temp=(ti.obj&&+ti.obj.hpTemp)||0;
      const afterTemp=Math.max(0,d-temp);
      const left=Math.max(0,ti.hp-afterTemp);
      out.verdict.push('У цели останется '+left+' из '+ti.hpMax+' хитов'+(temp?' (временные хиты '+temp+' поглотят часть)':'')+'.');
      if(left<=0) out.verdict.push(ti.kind==='ally'?'Герой падает без сознания — начинаются спасброски от смерти.':'Противник повержен.');
      if(afterTemp-ti.hp>=ti.hpMax) out.verdict.push('⚠ Урон превышает запас хитов на величину максимума — по правилам это мгновенная смерть.');
    }
  }
  if(out.effectAllowed===false) out.blocked=true;
  spec.rows.forEach(r=>{
    if(v[r.key]==null) return;
    if(r.type==='other') out.notes.push(String(r.label).replace(/:.*$/,'')+': '+(v[r.key]+(r.mod||0)));
    else if(r.type==='extra') out.notes.push('прочий бросок: '+v[r.key]);
    else if(r.type==='res') out.notes.push(String(r.label).replace(/:.*$/,'')+' '+v[r.key]);
  });
  return out;
}

/* Единый предохранитель для заклинаний, способностей и предметов. Старые
   программные вызовы без effectAllowed остаются совместимыми, но явный
   успешный спасбросок, промах или проигранное состязание всегда блокируют
   состояние и другой длящийся эффект. */
function outcomeAllowsEffect(rolls){
  if(!rolls) return true;
  if(Object.prototype.hasOwnProperty.call(rolls,'effectAllowed')) return rolls.effectAllowed===true;
  if(rolls.hit===false||rolls.saveOk===true||rolls.contestWin===false||rolls.blocked===true) return false;
  return true;
}

/* ═══ Применение итога к цели: герой, противник бестиария, объект ═══ */
function applyHealTo(targetVal, amount, srcLabel){
  const ti=targetInfoOf(targetVal);
  if(!ti.obj||!(amount>0)) return null;
  if(ti.kind==='ally'){
    const t=ti.obj, mx=eHpMax(t), was=+t.hp||0;
    if(was<=0&&t.deaths&&(+t.deaths.f||0)>=3)
      return {name:t.name,hp:was,hpMax:mx,blocked:true,reason:'герой мертв — обычное лечение не действует'};
    if(fxNotesOf(t).some(x=>/не может восстанавлива[а-я]* (?:хиты|здоровье)/.test(x)))
      return {name:t.name,hp:was,hpMax:mx,blocked:true,reason:'действующий эффект запрещает восстанавливать хиты'};
    t.hp=Math.min(mx, was+amount);
    let extra='';
    if(was<=0&&t.hp>0){
      t.deaths={s:0,f:0};
      t.cond=normalizeConditions(t.cond).filter(x=>x!=='Бессознательный');
      extra=' · герой пришел в себя';
    }
    return {name:t.name, hp:t.hp, hpMax:mx, extra};
  }
  const f=ti.obj;
  f.hp=Math.min(+f.hpMax||0,(+f.hp||0)+amount);
  return {name:f.n, hp:f.hp, hpMax:+f.hpMax||0, extra:''};
}
function applyDamageTo(targetVal, amount, dtype, srcLabel, ctx){
  const ti=targetInfoOf(targetVal);
  if(!ti.obj||!(amount>0)) return null;
  let d=amount, absorbed=0;
  const o=ti.obj;
  if((+o.hpTemp||0)>0){ absorbed=Math.min(+o.hpTemp, d); o.hpTemp-=absorbed; d-=absorbed; }
  const was=+o.hp||0;
  const over=d-was;
  o.hp=Math.max(0, was-d);
  const res={name:ti.name, hp:o.hp, hpMax:ti.hpMax, absorbed, down:o.hp<=0, dead:false, deathFails:0};
  if(ti.kind==='ally'){
    if(o.hp<=0){
      breakConcentration(o,'герой упал до 0 хитов');
      o.cond=normalizeConditions(o.cond);
      if(o.cond.indexOf('Бессознательный')<0) o.cond.push('Бессознательный');
      o.deaths=o.deaths||{s:0,f:0};
      if(over>=ti.hpMax){ res.dead=true; o.deaths={s:0,f:3}; }
      else if(was<=0){
        res.deathFails=(ctx&&ctx.crit)?2:1;
        o.deaths.f=Math.min(3,(+o.deaths.f||0)+res.deathFails);
        if(o.deaths.f>=3) res.dead=true;
      }
    } else if(amount>0) concDamageCheck(o, amount);
  } else {
    if(o.hp<=0){ res.dead=true; o.cond=o.cond||[]; if(o.cond.indexOf('Повержен')<0) o.cond.push('Повержен'); }
  }
  return res;
}
/* единая проводка итогов формулы по цели — для заклинаний и способностей */
function applyRollsToTarget(targetVal, rolls, srcLabel){
  let info='';
  if(!rolls) return info;
  const ti=targetInfoOf(targetVal);
  if(rolls.healTotal!=null&&rolls.healTotal>0){
    const r=applyHealTo(targetVal, rolls.healTotal, srcLabel);
    if(r&&r.blocked){ info+=' · лечение не применено ('+r.reason+')'; }
    else if(r){ info+=' · лечение +'+rolls.healTotal+' хитов ('+r.name+': '+r.hp+'/'+r.hpMax+')'+(r.extra||'');
      diceOutSet(srcLabel+' → '+r.name+': +'+rolls.healTotal+' хитов','var(--ok)'); }
    else info+=' · лечение +'+rolls.healTotal+' хитов (цель вне листов — записано в летопись)';
  }
  if(rolls.tempTotal!=null&&rolls.tempTotal>0){
    const r=applyTempHp(targetVal, rolls.tempTotal);
    if(r) info+=' · временные хиты '+r.temp+(r.replaced?'':' (прежние были выше)');
  }
  if(rolls.dmgTotal!=null&&rolls.dmgTotal>0){
    const r=applyDamageTo(targetVal, rolls.dmgTotal, rolls.dmgType, srcLabel,{crit:!!rolls.crit});
    if(r){ info+=' · урон '+rolls.dmgTotal+(rolls.dmgType?' ('+rolls.dmgType+')':'')+' → '+r.name+': '+r.hp+'/'+r.hpMax
        +(r.absorbed?' (временные хиты поглотили '+r.absorbed+')':'')
        +(r.deathFails?' · провалы спасбросков от смерти +'+r.deathFails:'')
        +(r.dead?' · '+(ti.kind==='ally'?'СМЕРТЬ':'повержен'):(r.down?' · без сознания':''));
      diceOutSet(srcLabel+' → '+r.name+': '+rolls.dmgTotal+' урона','var(--rubric)'); }
    else { info+=' · урон '+rolls.dmgTotal+' по цели'; diceOutSet(srcLabel+': '+rolls.dmgTotal+' урона по цели','var(--rubric)'); }
  } else if(rolls.dmgTotal===0&&rolls.dmgRaw>0){
    info+=' · урон не прошел (промах, успешный спасбросок или иммунитет)';
  }
  if(rolls.notes&&rolls.notes.length) info+=' · '+rolls.notes.join(' · ');
  return info;
}
/* ═══ Шаг «Формула» в окне применения ═══ */
function castRollRec(){
  if(!castCtx) return null;
  if(castCtx.kind==='weapon'){ const w=itemOf(castCtx.itemId); return w?{n:w.n, x:'', hi:'', l:0}:null; }
  if(castCtx.kind==='item'){
    const it=itemOf(castCtx.itemId);
    return it?{n:it.n, x:(it.desc||'')+'\n'+(it.props||''), hi:'', l:0}:null;
  }
  return castCtx.kind==='ability'? abilityOf(castCtx.abilityId) : spellOf(castCtx.spellId);
}
function castAdvSet(key,val){
  if(!castCtx||!castCtx.spec) return;
  const r=castCtx.spec.rows.find(x=>x.key===key); if(r) r.adv=+val;
  const el=document.getElementById('cf_'+key+'_2');
  if(el){ el.style.display=(+val?'inline-block':'none'); if(!+val) el.value=''; }
  castFormulaLive();
}
function castHitSet(val){ if(castCtx){ castCtx.hitOverride=val; castFormulaLive(); } }
const CF_ADV=[[0,'\u2696 обычный'],[1,'\u25b2 преимущество'],[2,'\u25bc помеха']];
function cfRowHTML(r){
  let h='<div class="formula-row"><label>'+esc(r.label)+'</label>'
    +'<input type="number" id="cf_'+r.key+'" oninput="castFormulaLive()" min="'+(r.natural?1:0)+'"'+(r.natural?' max="20"':'')+'>';
  if(r.natural){
    h+='<select id="cfa_'+r.key+'" style="font-size:12.5px;padding:2px 4px" onchange="castAdvSet(\''+r.key+'\',this.value)">'
      +CF_ADV.map(o=>'<option value="'+o[0]+'"'+((r.adv||0)===o[0]?' selected':'')+'>'+o[1]+'</option>').join('')+'</select>'
      +'<input type="number" id="cf_'+r.key+'_2" placeholder="2-й d20" style="display:'+((r.adv||0)?'inline-block':'none')+'" oninput="castFormulaLive()" min="1" max="20">';
  }
  h+='<span class="formula-part">'+esc(r.hint||'')+'</span><b id="cft_'+r.key+'"></b></div>';
  return h;
}
function castFormulaShow(){
  if(!castCtx) return false;
  const rec=castRollRec(), caster=getCh(castCtx.casterId);
  if(!rec||!caster) return false;
  const isSpell=(castCtx.kind!=='ability'&&castCtx.kind!=='item'&&castCtx.kind!=='weapon');
  const lv=(isSpell&&castCtx.slotSel&&!isNaN(parseInt(castCtx.slotSel,10)))?parseInt(castCtx.slotSel,10):(+rec.l||0);
  const ti=targetInfoOf(castCtx.target);
  const pool=(castCtx.kind==='ability')?abilityPoolOf(caster, rec):null;
  const weapon=(!isSpell&&castCtx.weapon)?castCtx.weapon:null;
  const spec=castCtx.kind==='weapon'
    ? weaponSpecOf(caster, itemOf(castCtx.itemId), ti, {two:castCtx.two})
    : rollSpecOf(rec,{caster, kind:castCtx.kind==='item'?'item':(isSpell?'spell':'ability'), slotLvl:lv, target:ti, weapon, pool});
  if(!spec.rows.length) return false;
  castCtx.spec=spec; castCtx.formulaLvl=lv; castCtx.hitOverride='';
  let h='<div class="cast-info" style="border:none;padding:0">Формула'+(isSpell&&lv>(+rec.l||0)?' (усилено ячейкой '+lv+' круга)':'')
    +((castCtx.extraTargets||[]).length?' · цель: '+esc(ti.name):'')
    +' — впишите результаты реальных бросков. Итог разберу по правилам и применю.</div>';
  const mine=spec.rows.filter(r=>r.side!=='target'), theirs=spec.rows.filter(r=>r.side==='target');
  if(mine.length){
    h+='<div class="rubric" style="font-size:17px;margin:6px 0 2px">Бросает '+esc(caster.name)+'</div>';
    h+=mine.map(cfRowHTML).join('');
  }
  if(theirs.length){
    h+='<div class="rubric" style="font-size:17px;margin:10px 0 2px">Бросает цель — '+esc(ti.name)
      +(ti.known?'':' (записи нет — впишите итог со слов игрока за монстра)')+'</div>';
    h+=theirs.map(cfRowHTML).join('');
  }
  if(ti.kind==='object') h+='<div class="note-ital" style="font-size:12.5px">Неодушевленный объект бросков не совершает — от него ничего не требуется.</div>';
  if(spec.rows.some(r=>r.type==='atk')&&!(ti.known&&ti.ac!=null)){
    h+='<div class="formula-row"><label>Итог атаки</label><select id="cfHit" onchange="castHitSet(this.value)" style="width:auto">'
      +'<option value="">по броску и решению мастера</option><option value="hit">попадание</option>'
      +'<option value="crit">критическое попадание</option><option value="miss">промах</option></select>'
      +'<span class="formula-part">у цели нет записи в бестиарии — КД неизвестна</span></div>';
  }
  h+='<div id="castVerdict" class="roll-live" style="white-space:pre-line"></div>';
  h+='<div class="note-ital" style="font-size:12.5px;margin-top:4px">Любое поле можно оставить пустым — эта часть просто не применится.</div>';
  document.getElementById('castFormula').innerHTML=h;
  if(isSpell&&castCtx.primaryTarget&&castCtx.target!==castCtx.primaryTarget&&castCtx.sharedCasterVals){
    Object.keys(castCtx.sharedCasterVals).forEach(k=>{
      const el=document.getElementById('cf_'+k);
      if(el){ el.value=castCtx.sharedCasterVals[k]; el.readOnly=true; el.title='Общий бросок заклинания уже сделан для всех целей'; }
    });
  }
  document.getElementById('castStep1').style.display='none';
  document.getElementById('castStep2').style.display='none';
  document.getElementById('castStep3').style.display='block';
  castFormulaLive();
  return true;
}
function castFormulaVals(){
  const out={}; if(!castCtx||!castCtx.spec) return out;
  castCtx.spec.rows.forEach(r=>{
    const el=document.getElementById('cf_'+r.key);
    out[r.key]=(el&&el.value!=='')?(+el.value):null;
    if(r.natural){
      const e2=document.getElementById('cf_'+r.key+'_2');
      out[r.key+'_2']=(e2&&e2.value!=='')?(+e2.value):null;
    }
  });
  return out;
}
function castFormulaLive(){
  if(!castCtx||!castCtx.spec) return;
  const v=castFormulaVals(), spec=castCtx.spec;
  const res=resolveOutcome(spec, v, {hitOverride:castCtx.hitOverride});
  spec.rows.forEach(r=>{
    const t=document.getElementById('cft_'+r.key); if(!t) return;
    const val=v[r.key];
    if(val==null){ t.textContent=''; return; }
    if(r.natural){
      const nat=pickNat(v,r.key,r.adv);
      t.textContent='= '+(nat+(r.mod||0))+(r.adv&&v[r.key+'_2']!=null?' (взят '+nat+')':'');
    }
    else if(r.type==='heal') t.textContent='= +'+(val+(r.mod||0))+' хитов';
    else if(r.type==='temp') t.textContent='= '+(val+(r.mod||0))+' временных хитов';
    else if(r.type==='dmg') t.textContent='= '+(val+(r.mod||0))+' до разбора';
    else if(r.addTo) t.textContent='= '+((r.sign||1)<0?'−':'+')+(val+(r.mod||0))+' к '+(r.addTo==='atk'?'атаке':'спасброску');
    else t.textContent='= '+(val+(r.mod||0));
  });
  const box=document.getElementById('castVerdict');
  if(box) box.textContent=res.verdict.length?('\u2723 Итог\n'+res.verdict.join('\n')):'Впишите результаты бросков — итог разберу сам.';
}
function spellSpecNeedsPerTarget(spec){
  return !!spec&&spec.rows.some(r=>r.type==='atk'||r.type==='save'||r.type==='tcheck');
}
function sharedSpellRowKeys(spec){
  if(!spec||spec.rows.some(r=>r.type==='atk')) return [];
  return spec.rows.filter(r=>r.type==='dmg'||r.type==='heal'||r.type==='temp').map(r=>r.key);
}
function rollsShareAcrossTargets(rolls){
  if(!rolls) return false;
  /* Один бросок лечения/временных хитов применяется ко всем целям. Урон здесь
     не делим: его сопротивления и спасброски зависят от конкретной цели. */
  return rolls.dmgRaw==null&&(rolls.healTotal!=null||rolls.tempTotal!=null)
    &&rolls.hit==null&&rolls.saveOk==null&&rolls.contestWin==null;
}
function castFormulaConfirm(){
  if(!castCtx||!castCtx.spec) return;
  const v=castFormulaVals(), spec=castCtx.spec;
  const res=resolveOutcome(spec, v, {hitOverride:castCtx.hitOverride});
  const rolls={notes:res.notes.slice(), verdict:res.verdict.slice(), healTotal:res.healTotal, tempTotal:res.tempTotal,
    dmgTotal:res.dmgTotal, dmgRaw:res.dmgRaw, dmgType:res.dmgType, hit:res.hit, crit:res.crit,

  if(castCtx.kind==='weapon'){
    if(weaponAttackApply(castCtx.entryId, castCtx.casterId, castCtx.target, rolls)) closeCastModal();
    return;

  if(castCtx.kind==='item'){
    if(useItemApply(castCtx.entryId, castCtx.casterId, castCtx.target, rolls)) closeCastModal();
    return;

  if(castCtx.kind==='ability'){
    if(useAbilityApply(castCtx.abilityId, castCtx.casterId, castCtx.target, rolls)) closeCastModal();

  const current=castCtx.target;

  }
  if(!Array.isArray(castCtx.rollQueue)){

    if(castFormulaShow()) return;   /* следующий отдельный спасбросок/атака */
  }
  const primary=castCtx.primaryTarget||current;
  const primaryRolls=castCtx.rollsByTarget[primary]||rolls;
  if(castSpellApply(castCtx.spellId, castCtx.casterId, primary, castCtx.inv, castCtx.mat, castCtx.slotSel,
      primaryRolls, castCtx.extraTargets, castCtx.rollsByTarget)) closeCastModal();

function deriveSpellDice(sp, slotLvl, caster){

function slotPlanFor(caster,sp,slotSel){
  if(sp.l===0) return {ok:true,mode:'cantrip',lv:0,info:''};
  if(slotSel===undefined||slotSel===null){
    const lv=Object.keys(caster.slots||{}).map(Number).sort((a,b)=>a-b).find(k=>k>=sp.l&&caster.slots[k].cur>0);
    if(lv===undefined) return {ok:false,reason:'Нет доступной ячейки '+sp.l+' круга или выше.'};
    return {ok:true,mode:'slot',lv,info:' · ячейка '+lv+' круга'+(lv>sp.l?' (усиление)':'')};
  }
  if(slotSel==='ritual'){
    if(!sp.ritual) return {ok:false,reason:'Это заклинание не является ритуалом.'};
    return {ok:true,mode:'ritual',lv:sp.l,info:' · ритуалом (без ячейки, +10 минут)'};
  }
  if(slotSel==='free') return {ok:true,mode:'free',lv:sp.l,info:' · без траты ячейки (решение мастера)'};
  const lv=parseInt(slotSel,10), s=caster.slots&&caster.slots[lv];
  if(!s||lv<sp.l) return {ok:false,reason:'Выбранная ячейка не подходит для этого круга.'};
  if(s.cur<=0) return {ok:false,reason:'Ячейки '+lv+' круга исчерпаны — восстановятся после долгого отдыха'+(caster.cls==='Волшебник'?' или арканного восстановления':'')+'.'};
  return {ok:true,mode:'slot',lv,info:' · ячейка '+lv+' круга'+(lv>sp.l?' (усиление)':'')};
}
function commitSlotPlan(caster,p){
  if(p.mode!=='slot') return;
  caster.slots[p.lv].cur--;
  caster.spentRest=(+caster.spentRest||0)+1;
}
function castTargetCheck(caster,target,invEntryId,sp){
  if(spellSelfOnly(sp)&&target!=='ally:'+caster.id) return {ok:false,reason:'«'+sp.n+'» можно наложить только на себя.'};
  if(target.indexOf('ally:')===0){
    const t=getCh(target.slice(5));
    return t?{ok:true,targetChar:t}:{ok:false,reason:'Выбранная цель больше не существует.'};
  }
  if(target==='invitem'){
    const e=(caster.inventory||[]).find(x=>x.id===invEntryId);
    const it=e?itemOf(e.itemId):null;
    return it?{ok:true,itemEntry:e,item:it}:{ok:false,reason:'Выберите существующий предмет инвентаря.'};
  }
  if(target.indexOf('foe:')===0){
    const f=foeOf(target.slice(4));
    return f?{ok:true,foe:f}:{ok:false,reason:'Выбранный противник больше не значится в бестиарии.'};
  }
  if(target==='enemy'||target==='object') return {ok:true};
  return {ok:false,reason:'Недопустимая цель заклинания.'};
}
function spellSelfOnly(sp){
  return /^(щит|обнаружение магии|зеркальное отражение|туманный шаг|антимагическое поле)$/i.test(normSpellName(sp&&sp.n));
}
function spellTargetLimit(sp,usedLvl){
  const n=normSpellName(sp&&sp.n), lv=+usedLvl||+sp.l||0;
  if(/^(благословение|порча)$/.test(n)) return 3+Math.max(0,lv-1);
  if(n==='героизм') return 1+Math.max(0,lv-1);
  if(n==='очарование личности'||n==='приказ'||n==='скороход') return 1+Math.max(0,lv-1);
  if(n==='подмога') return 3;
  if(n==='невидимость'||n==='улучшение характеристики'||n==='удержание личности') return 1+Math.max(0,lv-2);
  if(n==='полет') return 1+Math.max(0,lv-3);
  if(n==='массовое лечащее слово') return 6;
  if(n==='изгнание') return 1+Math.max(0,lv-4);
  if(n==='удержание чудовища') return 1+Math.max(0,lv-5);
  if(n==='цепная молния') return 4+Math.max(0,lv-6);
  if(n==='молебен лечения'||n==='массовое лечение ран') return 6;
  if(n==='подводное дыхание') return 10;
  return 1;
}
function castSelectedSlotLevel(){

function specialCastPlan(sp,caster,target,usedLvl){
  if(normSpellName(sp.n)!=='контрзаклинание') return {ok:true};
  const raw=window.prompt('⚡ Контрзаклинание: какого круга заклинание прерываем? (1–9)','1');
  if(raw==null) return {ok:false,cancelled:true};

function applyImmediateSpell(sp,caster,target,usedLvl){
  /* Лечение здесь не бросается: кости бросают живые игроки, итог приходит
     шагом «Формула» или отдельным окном askRolls. */
  const n=normSpellName(sp.n);
  if(n==='малое восстановление'){
    const removable=['Ослепленный','Глухой','Парализованный','Отравленный'].filter(x=>(target.cond||[]).indexOf(x)>=0);
    if(removable.length){
      target.cond=target.cond.filter(x=>x!==removable[0]);
      return 'снято состояние «'+removable[0]+'»';
    }
    return 'болезнь/подходящее состояние выбирается мастером';
  }
  if(n==='уход за умирающим'&&target.hp===0){
    target.deaths={s:0,f:0};
    return 'цель стабилизирована с 0 хитов';
  }
  return '';
}
function castSpellApply(spellId, casterId, target, invEntryId, mat, slotSel, rolls, extraTargets, rollsByTarget){
  /* 7-й аргумент принимает и итоги бросков, и список дополнительных целей */
  if(Array.isArray(rolls)){ extraTargets=rolls; rolls=null; }
  const sp=spellOf(spellId), caster=getCh(casterId);
  if(!sp||!caster||!target) return false;

  /* ══ Фаза 1 — только проверки. До ее конца мир не меняется. ══ */
  const chk=canCastCheck(caster, sp);
  if(!chk.ok){ setStatus('✕ '+chk.reason, true); castShowErr&&castShowErr(chk.reason); return false; }
  const targetPlan=castTargetCheck(caster,target,invEntryId,sp);
  if(!targetPlan.ok){ setStatus('✕ '+targetPlan.reason,true); castShowErr&&castShowErr(targetPlan.reason); return false; }
  const slotPlan=slotPlanFor(caster,sp,slotSel);
  if(!slotPlan.ok){ setStatus('✕ '+slotPlan.reason,true); castShowErr&&castShowErr(slotPlan.reason); return false; }
  const extras=[...new Set((extraTargets||[]).filter(x=>x!==target))];
  if(extras.length>Math.max(0,spellTargetLimit(sp,slotPlan.lv)-1)){
    const r='Выбрано больше целей, чем допускает «'+sp.n+'» на этом круге.';
    setStatus('✕ '+r,true); castShowErr&&castShowErr(r); return false;
  }
  const extraPlans=extras.map(x=>castTargetCheck(caster,x,invEntryId,sp));
  const badExtra=extraPlans.find(x=>!x.ok);
  if(badExtra){ setStatus('✕ '+badExtra.reason,true); castShowErr&&castShowErr(badExtra.reason); return false; }
  if(extras.some(x=>x.indexOf('ally:')!==0&&x.indexOf('foe:')!==0)){
    const r='Дополнительной целью может быть только существующая запись героя или противника.';
    setStatus('✕ '+r,true); castShowErr&&castShowErr(r); return false;
  }
  const matPlan=materialPlanFor(caster,sp,chk.comp,mat);
  if(!matPlan.ok){ setStatus('✕ '+matPlan.reason,true); castShowErr&&castShowErr(matPlan.reason); return false; }
  const usedSlotLvl=slotPlan.lv||sp.l;
  const isConc=spellNeedsConcentration(sp,usedSlotLvl);
  const specialPlan=specialCastPlan(sp,caster,target,usedSlotLvl);
  if(!specialPlan.ok) return false;
  if(isConc){
    const cur=concLabelOf(caster);
    if(cur&&!window.confirm(caster.name+' уже концентрируется: «'+cur+'». Одновременно удерживать два заклинания концентрации НЕВОЗМОЖНО.\n\nОК — прервать прежнюю концентрацию и наложить «'+sp.n+'».\nОтмена — не накладывать.')) return false;
  }

  /* ══ Фаза 2 — единый коммит: ресурсы тратятся все сразу. ══ */
  commitSlotPlan(caster,slotPlan);
  const spent=commitMaterialPlan(caster,matPlan);
  if(!spent.ok){ setStatus('✕ '+spent.reason,true); return false; }
  endTriggeredSpellEffects(caster,'spell');
  if(isConc&&concLabelOf(caster)) breakConcentration(caster,'начато новое заклинание концентрации «'+sp.n+'»');
  if(SPECIAL_CAST[sp.n]) return SPECIAL_CAST[sp.n](sp,caster,target,usedSlotLvl,specialPlan,slotPlan.info,matPlan.info);

  const castId=castUid(), power=usedSlotLvl||0;
  const durWhy=(isConc?' · концентрация':'')+(sp.d&&!/мгновенн/i.test(sp.d)?' · '+sp.d:'');
  const lastingFx=spellFxForCast(sp,usedSlotLvl).filter(f=>!(f.stat==='hp'&&f.mode==='add'));
  const dur=durationSpecOf(sp,usedSlotLvl);

  /* ══ Фаза 3 — применение. ══ */
  const targetVals=[target].concat(extras), plans=[targetPlan].concat(extraPlans);
  const creatures=plans.every(p=>p.targetChar||p.foe);
  if(creatures){
    const names=plans.map(p=>p.targetChar?p.targetChar.name:p.foe.n), results=[], snapshots=[], rollBits=[];
    const shared=rollsShareAcrossTargets(rolls);
    plans.forEach((p,i)=>{
      const val=targetVals[i], t=p.targetChar||p.foe, isHero=!!p.targetChar;
      if(isHero) snapshots.push({charId:t.id,hp:t.hp,hpTemp:t.hpTemp,cond:(t.cond||[]).slice(),deaths:Object.assign({},t.deaths||{})});
      const hasOwn=!!(rollsByTarget&&Object.prototype.hasOwnProperty.call(rollsByTarget,val));
      const ownRolls=hasOwn?rollsByTarget[val]:((i===0||shared)?rolls:null);
      if(ownRolls){
        const bit=applyRollsToTarget(val,ownRolls,'«'+sp.n+'»');
        if(bit) rollBits.push((t.name||t.n)+bit);
      }
      /* Если формула требовала отдельного результата каждой цели, отсутствие
         такого результата не считается провалом спасброска и не дает эффекта. */
      const allowed=ownRolls?outcomeAllowsEffect(ownRolls):(!rolls||shared);
      if(isHero&&allowed){
        const immediate=applyImmediateSpell(sp,caster,t,usedSlotLvl);
        if(immediate) results.push(t.name+': '+immediate);
      }
      if(allowed&&(isConc||dur.kind!=='instant'||lastingFx.length)){
        const entry={k:'spell',id:sp.id,label:sp.n,from:caster.name,casterId:caster.id,conc:isConc,castId,
          stackKey:'spell:'+sp.id,power,fx:lastingFx.map(x=>Object.assign({},x)),why:'наложено: '+caster.name+durWhy};
        attachDuration(entry,sp,usedSlotLvl);
        if(isHero) applyFxTo(t.id,entry); else applyFxToFoe(t,entry);
      }
    });
    let rollInfo=rollBits.length?' · '+rollBits.join(' · '):'';
    /* Лечение без шага «Формула»: разбираем описание и просим у мастера кости. */
    if(!rolls){
      const ih=deriveInstantHeal(sp,'spell',caster,usedSlotLvl);
      if(ih&&(ih.cnt||ih.plus)){
        if(ih.cnt&&ih.sides){
          askRolls({title:'⚡ '+sp.n+' — '+caster.name,
            note:'Формула лечения: '+ih.cnt+'d'+ih.sides+(ih.plus?' + '+ih.plus:'')+'.',
            rows:[{key:'s',label:'Сумма '+ih.cnt+'d'+ih.sides,sub:'от '+ih.cnt+' до '+(ih.cnt*ih.sides),min:ih.cnt,max:ih.cnt*ih.sides}],
            compute:v=>'Лечение: +'+(v.s+ih.plus)+' хитов каждой цели',
            apply:v=>{ const tot=v.s+ih.plus;
              targetVals.forEach(vv=>{ const r=applyHealTo(vv,tot,'«'+sp.n+'»'); if(r&&!r.blocked) diceOutSet('«'+sp.n+'» → '+r.name+': +'+tot+' хитов','var(--ok)'); });
              fxInvalidate(); scheduleSave(); renderChars();
              if(typeof renderFoes==='function') renderFoes();
              castLogLine(caster.name+' → '+names.join(', ')+': «'+sp.n+'» · лечение +'+tot+' хитов'+matPlan.info+slotPlan.info); }});
          rollInfo+=' · лечение спрошено отдельным окном';
        } else {
          targetVals.forEach(vv=>applyHealTo(vv, ih.plus, '«'+sp.n+'»'));
          rollInfo+=' · лечение +'+ih.plus+' хитов';
        }
      }
    }
    lastCastEvent={castId,casterId:caster.id,spellId:sp.id,usedSlotLvl,round:fxRound,snapshots};
    fxInvalidate(); scheduleSave(); renderChars(); if(typeof renderFoes==='function') renderFoes();
    setStatus('⚡ «'+sp.n+'» применено к '+names.join(', ')+matPlan.info+slotPlan.info+rollInfo+'.');
    castLogLine(caster.name+' → '+names.join(', ')+': «'+sp.n+'» (СЛ '+spellDC(caster)+')'+durWhy
      +(results.length?' · '+results.join('; '):'')+matPlan.info+slotPlan.info+rollInfo);
    targetVals.forEach((v,i)=>{
      const rr=rollsByTarget&&rollsByTarget[v]||((i===0||shared)?rolls:null);
      if(rr&&rr.verdict&&rr.verdict.length) castLogLine('    '+names[i]+': '+rr.verdict.join(' | '));
    });
    return true;
  }

  const tinfo=targetInfoOf(target);
  let rollInfo='';
  if(rolls) rollInfo=applyRollsToTarget(target, rolls, '«'+sp.n+'»');
  let tl = target==='enemy'?'враг':(target==='object'?'неодушевленный объект':(tinfo.kind==='foe'&&tinfo.obj?tinfo.name:''));
  if(target==='invitem'){
    tl='предмет: '+targetPlan.item.n;
    targetPlan.itemEntry.notes=(targetPlan.itemEntry.notes?targetPlan.itemEntry.notes+' · ':'')+'⚡ '+sp.n+' ('+caster.name+')';
  }
  if(tinfo.kind==='foe'&&tinfo.obj) tinfo.obj.notes=(tinfo.obj.notes?tinfo.obj.notes+'\n':'')+'⚡ '+sp.n+' ('+caster.name+')';
  if(!tl) return false;
  /* при внешней цели концентрация и длительность висят на заклинателе — якорь в его панели */
  if(isConc||dur.kind!=='instant'){
    caster.activeFx=caster.activeFx||[];
    const entry={k:'spell', id:sp.id, uid:fxUid(), label:sp.n, from:caster.name, casterId:caster.id, conc:isConc, castId,
      stackKey:'spell:'+sp.id, power, appliedRound:fxRound,
      why:(isConc?'концентрация':'длится')+' · цель: '+tl,
      fx:[{stat:'note',mode:'text',value:(isConc?'концентрируется на ':'поддерживает ')+'«'+sp.n+'» — цель: '+tl}]};
    attachDuration(entry,sp,usedSlotLvl); caster.activeFx.push(entry);
  }
  lastCastEvent={castId,casterId:caster.id,spellId:sp.id,usedSlotLvl,round:fxRound,snapshots:[]};
  fxInvalidate(); scheduleSave(); renderChars(); if(typeof renderFoes==='function') renderFoes();
  setStatus('⚡ «'+sp.n+'» наложено на: '+tl+' (СЛ спасброска '+spellDC(caster)+')'+matPlan.info+slotPlan.info+rollInfo+'.');
  castLogLine(caster.name+' → '+tl+': «'+sp.n+'» (СЛ '+spellDC(caster)+')'+durWhy+matPlan.info+slotPlan.info+rollInfo);
  if(rolls&&rolls.verdict&&rolls.verdict.length) castLogLine('    разбор: '+rolls.verdict.join(' | '));
  return true;
}
function toggleAbilityFx(abilityId){
  const c=cc(); if(!c) return;
  c.activeFx=c.activeFx||[];
  const ex=c.activeFx.find(a=>a.k==='ability'&&a.id===abilityId);
  if(ex){ removeActiveFx(c.id, ex.uid); return; }
  const ab=abilityOf(abilityId); if(!ab) return;
  /* применение активной способности тратит использование */
  if(ab.uses!=null){
    const e=(c.abilities||[]).find(x=>x.abilityId===ab.id);
    if(e){
      const cur=e.cur==null?ab.uses:e.cur;
      if(cur<=0){ if(!window.confirm('Заряды «'+ab.n+'» исчерпаны. Все равно применить эффект?')) return; }
      else e.cur=cur-1;
    }
  }
  applyFxTo(c.id, {k:'ability', id:ab.id, label:ab.n, from:'', why:'применено'+(ab.rest?' · восст.: '+ab.rest:'')});
}
function abilityFxActive(c,abilityId){ return (c.activeFx||[]).some(a=>a.k==='ability'&&a.id===abilityId); }

/* ── употребление расходуемых предметов ── */
function isConsumableItem(it){
  return !!it && (it.type==='potion'||it.type==='scroll'||(it.tags||[]).includes('consumable'));
}
function deriveHeal(it){
  return deriveInstantHeal(it,'item',null,null);
}
/* ═══════════════ ПРЕДМЕТЫ В ЕДИНОМ ДВИЖКЕ ═══════════════
   Предмет применяется тем же окном, что заклинание и способность:
   цель → формула бросков → разбор по правилам 5e → применение.
   Заряды, настройка, расход и вес влияют на показатели напрямую. */
const ATTUNE_LIMIT=3;
function itemSpec(it){
  const low=fxTextOf(it).toLowerCase();
  const spec={charges:0, recharge:null, when:'', attune:false, attuneNote:'', consumable:isConsumableItem(it)};
  let m=low.match(/(\d+)\s*заряд/);
  if(m) spec.charges=+m[1];
  m=low.match(/восстанавлива[а-я]*\s+(\d*)\s*d\s*(\d+)(?:\s*\+\s*(\d+))?\s*(?:потраченн[а-я]*\s+)?заряд/);
  if(m) spec.recharge={cnt:+(m[1]||1), sides:+m[2], plus:+(m[3]||0)};
  else if(/восстанавлива[а-я]*\s+(?:все|всех)\s+заряд/.test(low)) spec.recharge={cnt:0, sides:0, plus:spec.charges};
  if(spec.charges) spec.when=/на закате/.test(low)?'на закате':(/длинн[а-я]*\s+отдых/.test(low)?'после длинного отдыха':'на рассвете');
  if(/требует настройки/.test(low)){
    spec.attune=true;
    const am=low.match(/требует настройки([^.)]{0,60})/);
    spec.attuneNote=((am&&am[1])||'').trim();
  }
  return spec;
}
function invCharges(e,it){
  const sp=itemSpec(it);
  if(!sp.charges) return null;
  if(!e.ch||e.ch.max!==sp.charges) e.ch={cur:(e.ch&&e.ch.cur!=null)?Math.min(e.ch.cur,sp.charges):sp.charges, max:sp.charges};
  return e.ch;
}
function itemNeedsAttune(it){ return itemSpec(it).attune; }
function attunedEntries(c){
  return (c.inventory||[]).filter(e=>{ const it=itemOf(e.itemId); return it&&itemNeedsAttune(it)&&e.att; });
}
function toggleAttune(entryId){
  const c=cc(); if(!c) return;
  const e=(c.inventory||[]).find(x=>x.id===entryId); if(!e) return;
  const it=itemOf(e.itemId); if(!it) return;
  if(e.att){ e.att=false; setStatus('✵ Настройка на «'+it.n+'» разорвана.'); }
  else{
    if(attunedEntries(c).length>=ATTUNE_LIMIT){
      setStatus('✕ Больше '+ATTUNE_LIMIT+' настроенных предметов держать нельзя — разорвите настройку с другим.', true); return;
    }
    e.att=true; setStatus('✵ «'+it.n+'» настроен — свойства предмета вступили в силу.');
  }
  fxInvalidate(); scheduleSave(); renderChars();
}
/* восстановление зарядов: кости бросает мастер */
function rechargeItems(c, when){
  const list=[];
  (c.inventory||[]).forEach(e=>{
    const it=itemOf(e.itemId); if(!it) return;
    const sp=itemSpec(it), ch=invCharges(e,it);
    if(!ch||!sp.recharge||ch.cur>=ch.max) return;
    if(when==='long'&&sp.when==='на закате') return;
    list.push({e,it,sp,ch});
  });
  if(!list.length) return;
  const dice=list.filter(x=>x.sp.recharge.sides);
  list.filter(x=>!x.sp.recharge.sides).forEach(x=>{
    x.ch.cur=Math.min(x.ch.max, x.ch.cur+(x.sp.recharge.plus||x.ch.max));
  });
  if(!dice.length){ scheduleSave(); return; }
  askRolls({title:'✦ Восстановление зарядов', note:'Предметы восстанавливают заряды — впишите выпавшее.',
    rows:dice.map((x,i)=>({key:'r'+i, label:x.it.n+': '+x.sp.recharge.cnt+'d'+x.sp.recharge.sides+(x.sp.recharge.plus?' + '+x.sp.recharge.plus:''),
      sub:'сейчас '+x.ch.cur+' из '+x.ch.max, min:x.sp.recharge.cnt, max:x.sp.recharge.cnt*x.sp.recharge.sides})),
    compute:v=>dice.map((x,i)=>x.it.n+': +'+((+v['r'+i]||0)+x.sp.recharge.plus)).join(' · '),
    apply:v=>{
      const done=[];
      dice.forEach((x,i)=>{ const add=(+v['r'+i]||0)+x.sp.recharge.plus;
        x.ch.cur=Math.min(x.ch.max, x.ch.cur+add); done.push(x.it.n+' → '+x.ch.cur+'/'+x.ch.max); });
      scheduleSave(); renderChars();
      setStatus('✦ Заряды восстановлены: '+done.join(', ')+'.');
      castLogLine('✦ '+c.name+': восстановление зарядов — '+done.join(', '));
    }});
}
/* ── применение предмета тем же окном, что заклинания и способности ── */
function itemCastFx(entryId, casterId){
  const caster=getCh(casterId||activeCharId); if(!caster) return;
  const e=(caster.inventory||[]).find(x=>x.id===entryId); if(!e) return;
  const it=itemOf(e.itemId); if(!it) return;
  const back=document.getElementById('castBack'); if(!back) return;
  const sp=itemSpec(it), ch=invCharges(e,it);
  castCtx={kind:'item', entryId, itemId:it.id, casterId:caster.id, target:'ally:'+caster.id, weapon:null, extraTargets:[]};
  document.getElementById('castTitle').textContent='⚗ Применить: '+it.n;
  const info=[ITEM_TYPES[it.type]||it.type];
  if(ch) info.push('заряды: '+ch.cur+' из '+ch.max+(sp.when?' · восстановление '+sp.when:''));
  if(sp.attune) info.push(e.att?'настроен':'НЕ настроен — свойства не действуют');
  if(e.qty>1) info.push('в запасе: '+e.qty+' шт.');
  if(sp.consumable) info.push('расходуется при применении');
  document.getElementById('castInfo').innerHTML=esc(info.join(' · '))
    +'<div class="note-ital" style="font-size:13px;margin-top:4px">'+esc(String(it.desc||'').split('\n')[0]).slice(0,300)+'</div>';
  document.getElementById('castTarget').innerHTML=targetOptionsHTML(caster,null);

  const mw=document.getElementById('castMultiWrap'); if(mw) mw.style.display='none';

  document.getElementById('castStep1').style.display='block';
  document.getElementById('castStep2').style.display='none';
  document.getElementById('castStep3').style.display='none';
  const er=document.getElementById('castErr'); er.style.display='none'; er.textContent='';
  back.style.display='flex';
}
function canUseItemCheck(caster, e, it){
  const sp=itemSpec(it), ch=e.ch;
  const cond=effectiveConditions(caster);
  const block=ACTION_BLOCK_CONDS.filter(n=>cond.indexOf(n)>=0)[0];
  if(block) return {ok:false, reason:'Состояние «'+block+'» не позволяет совершать действия — предмет неприменим.'};
  if(sp.attune&&!e.att) return {ok:false, reason:'«'+it.n+'» требует настройки. Настройте предмет (✵), иначе его свойства не действуют.'};
  if(ch&&ch.cur<=0) return {ok:false, reason:'Заряды «'+it.n+'» исчерпаны — восстановление '+(sp.when||'по решению мастера')+'.'};
  if(!ch&&sp.consumable&&(e.qty||0)<=0) return {ok:false, reason:'«'+it.n+'» закончился.'};
  return {ok:true};
}
function useItemApply(entryId, casterId, target, rolls){
  const caster=getCh(casterId); if(!caster) return false;
  const e=(caster.inventory||[]).find(x=>x.id===entryId); if(!e) return false;
  const it=itemOf(e.itemId); if(!it||!target) return false;
  const chk=canUseItemCheck(caster,e,it);
  if(!chk.ok){ setStatus('✕ '+chk.reason,true); castShowErr&&castShowErr(chk.reason); return false; }
  const sp=itemSpec(it), ch=invCharges(e,it);
  let cost='';
  if(ch){ ch.cur--; cost=' · заряд −1 (осталось '+ch.cur+' из '+ch.max+')'; }
  else if(sp.consumable){
    e.qty=(e.qty||1)-1; cost=' · списано 1 шт.';
    if(e.qty<=0){
      Object.keys(caster.equipment||{}).forEach(k=>{ if(caster.equipment[k]===e.id) delete caster.equipment[k]; });
      caster.inventory=caster.inventory.filter(x=>x.id!==e.id);
      cost+=' · запас исчерпан';
    }
  }
  let info='';
  if(rolls) info+=applyRollsToTarget(target, rolls, '⚗ '+it.n);
  else{
    const ih=deriveInstantHeal(it,'item',caster,null);
    if(ih&&ih.plus&&!ih.cnt){ applyHealTo(target, ih.plus, '⚗ '+it.n); info+=' · лечение +'+ih.plus+' хитов'; }
  }
  /* длящиеся свойства расходуемого — записью на цель, с длительностью из описания */
  const tinfo=targetInfoOf(target);
  const effectAllowed=outcomeAllowsEffect(rolls);
  const lasting=recFx(it,'item').filter(f=>!(f.stat==='hp'&&(f.mode==='add'||f.mode==='grant')));
  if(lasting.length&&sp.consumable&&tinfo.kind==='ally'&&effectAllowed){
    const entry={k:'use', id:it.id, label:it.n+' (применено)', fx:lasting, from:caster.name, casterId:caster.id,
      castId:castUid(), stackKey:'use:'+it.id, power:0, why:'применено: '+caster.name};
    attachDuration(entry, {n:it.n, d:'', x:it.desc||''}, 0);
    applyFxTo(tinfo.id, entry);
    info+=' · свойство наложено';
  } else if(lasting.length&&tinfo.kind==='foe'&&tinfo.obj&&effectAllowed){
    const entry={k:'use',id:it.id,label:it.n+' (применено)',fx:lasting.map(x=>Object.assign({},x)),from:caster.name,casterId:caster.id,
      castId:castUid(),stackKey:'use:'+it.id,power:0,why:'применено: '+caster.name};
    attachDuration(entry,{n:it.n,d:'',x:it.desc||''},0);
    applyFxToFoe(tinfo.obj,entry);
    info+=' · свойство наложено на противника';
  }
  const tl=tinfo.name||'—';
  fxInvalidate(); scheduleSave(); renderChars(); if(typeof renderFoes==='function') renderFoes();
  setStatus('⚗ «'+it.n+'» применено (цель: '+tl+')'+cost+info+'.');
  castLogLine('⚗ '+caster.name+' → '+tl+': предмет «'+it.n+'»'+cost+info);
  if(rolls&&rolls.verdict&&rolls.verdict.length) castLogLine('    разбор: '+rolls.verdict.join(' | '));
  return true;
}
/* временные хиты по правилам 5e: не складываются, остается большее */
function applyTempHp(targetVal, amount){
  const ti=targetInfoOf(targetVal);
  if(!ti.obj||!(amount>0)) return null;
  const was=+ti.obj.hpTemp||0;
  ti.obj.hpTemp=Math.max(was, amount);
  return {name:ti.name, temp:ti.obj.hpTemp, replaced:amount>was, was};
}

function itemIsBox(it){
  if(!it) return false;
  if(it.box) return true;
  return (it.tags||[]).indexOf('container')>=0 && itemProfile(it).kind==='container';
}
function entryInside(e){ if(!Array.isArray(e.inside)) e.inside=[]; return e.inside; }
function innerWeightOf(e){
  return entryInside(e).reduce((a,x)=>{ const t=itemOf(x.itemId); const v=t?parseFloat(String(t.weight||'').replace(',','.')):0;
    return a+((v||0)*(x.qty||1)); },0);
}
/* первичное наполнение по описанию предмета */
function fillContainer(e, it){
  if(!it||!Array.isArray(it.contents)||!it.contents.length) return;
  if(e.filled) return;
  e.filled=true;
  const inside=entryInside(e);
  it.contents.forEach(pair=>{
    const [iid,qty]=pair;
    if(!itemOf(iid)) return;
    if(inside.some(x=>x.itemId===iid)) return;
    inside.push({id:'in_'+fxUid(), itemId:iid, qty:qty||1, notes:''});
  });
}
let boxOpen=null;
function containerOpen(entryId){
  const c=cc(); if(!c) return;

  const c=cc(); if(!c||!boxOpen) return;
  const e=invEntryOf(c,boxOpen); if(!e){ boxOpen=null; return; }

    +(innerWeightOf(e)?' · вес содержимого '+Math.round(innerWeightOf(e)*10)/10+' кг':'')+'</div>';
  if(!inside.length) h+='<p class="note-ital">Внутри пусто.</p>';
  else h+='<div class="fx-panel">'+inside.map(x=>{
    const t=itemOf(x.itemId); if(!t) return '';
    return '<div class="fx-row"><b class="fx-src">'+esc(t.n)+'</b>'
      +'<span class="fx-why">'+esc(ITEM_TYPES[t.type]||t.type)+(t.weight?' · '+esc(t.weight):'')+(x.qty>1?' · '+x.qty+' шт.':'')+'</span>'
      +'<span class="fx-items"><span class="fx-note">'+esc(String(t.desc||'').split('\n')[0].slice(0,90))+'</span></span>'
      +'<button class="btn ghost sm" title="Переложить в основной инвентарь" onclick="containerTake(\''+e.id+'\',\''+x.id+'\')">↥ достать</button>'
      +'</div>';
  }).join('')+'</div>';
  const outside=(c.inventory||[]).filter(x=>x.id!==e.id&&!itemIsBox(itemOf(x.itemId)));
  if(outside.length) h+='<div style="margin-top:10px"><label class="lbl">Положить внутрь</label>'
    +'<select id="boxPut" style="width:100%">'+outside.map(x=>{ const t=itemOf(x.itemId);
      return '<option value="'+x.id+'">'+esc(t?t.n:'—')+(x.qty>1?' ('+x.qty+' шт.)':'')+'</option>'; }).join('')+'</select>'
    +'<button class="btn ghost sm" style="margin-top:6px" onclick="containerPut(\''+e.id+'\')">↧ положить</button></div>';

function containerTake(entryId, innerId){
  const c=cc(); if(!c) return;
  const e=invEntryOf(c,entryId); if(!e) return;
  const inside=entryInside(e);
  const i=inside.findIndex(x=>x.id===innerId); if(i<0) return;
  const x=inside[i]; const t=itemOf(x.itemId);
  inside.splice(i,1);
  const same=(c.inventory||[]).find(y=>y.itemId===x.itemId&&!itemIsBox(itemOf(y.itemId)));
  if(same) same.qty=(same.qty||1)+(x.qty||1);
  else c.inventory.push({id:'inv_'+fxUid(), itemId:x.itemId, qty:x.qty||1, notes:''});
  fxInvalidate(); scheduleSave(); renderChars(); containerRender();
  itemLog(c,'↥ '+c.name+' достает из «'+(itemOf(e.itemId)||{}).n+'»: '+(t?t.n:'предмет')+(x.qty>1?' ('+x.qty+' шт.)':''));
}
function containerPut(entryId){
  const c=cc(); if(!c) return;
  const sel=document.getElementById('boxPut'); if(!sel||!sel.value) return;
  const e=invEntryOf(c,entryId), src=invEntryOf(c,sel.value);
  if(!e||!src) return;
  const t=itemOf(src.itemId);
  const inside=entryInside(e);
  const same=inside.find(x=>x.itemId===src.itemId);
  if(same) same.qty=(same.qty||1)+(src.qty||1);
  else inside.push({id:'in_'+fxUid(), itemId:src.itemId, qty:src.qty||1, notes:src.notes||''});
  Object.keys(c.equipment||{}).forEach(k=>{ if(c.equipment[k]===src.id) delete c.equipment[k]; });
  c.inventory=c.inventory.filter(x=>x.id!==src.id);
  fxInvalidate(); scheduleSave(); renderChars(); containerRender();
  itemLog(c,'↧ '+c.name+' кладет в «'+(itemOf(e.itemId)||{}).n+'»: '+(t?t.n:'предмет'));
}

      +(s.removable?'<button class="del-x" title="Снять эффект" onclick="removeActiveFx(\''+c.id+'\',\''+s.uid+'\')">✕</button>':'')
      +'</div>';
  });
  return h+'</div>';
}

/* ═══════════════ ОБЛАЧНАЯ СИНХРОНИЗАЦИЯ: ДВА КОНТУРА ═══════════════
   МИРОВОЙ контур (узел world) — своды всего сайта, вне кампаний и безусловно:
     предметы и снаряжение, заклинания, способности, народы, призвания, справочник мастера.
   КАМПАНЕЙСКИЙ контур (узел campaigns/{ключ}) — персонажи и журнал конкретной кампании.
   Firebase Realtime Database через REST (запись) и Server-Sent Events (живой поток).
   Если в код вписан DEFAULT_DB_URL, облако включается само на любом устройстве. */
const CLOUD_PAUSED=true;   /* по решению мастера: облако временно на паузе, весь материал сайта ведется локально; кнопка «Подключить» работает */
const DEFAULT_DB_URL='https://best-dnd-campaign-ever-default-rtdb.firebaseio.com';
const DEFAULT_ROOM='SpeakFriendAndEnter2026';   /* кампания по умолчанию */

let syncCfg=null, syncOn=false, syncClientId=null;

function lsGet(k){ try{ return window.localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ window.localStorage.setItem(k,v); }catch(e){} }

function syncLoadCfg(){
  try{ syncCfg=JSON.parse(lsGet('dndworld2:synccfg')||'null'); }catch(e){ syncCfg=null; }
  if(!syncCfg && DEFAULT_DB_URL){ syncCfg={url:DEFAULT_DB_URL, room:DEFAULT_ROOM, on:true}; syncSaveCfg(); }
  syncClientId=lsGet('dndworld2:clientid');
  if(!syncClientId){ syncClientId='cl_'+Math.random().toString(36).slice(2,10); lsSet('dndworld2:clientid',syncClientId); }
}
function syncSaveCfg(){ lsSet('dndworld2:synccfg', JSON.stringify(syncCfg||{})); }

function syncBase(){
  if(!syncCfg||!syncCfg.url) return null;
  const u=String(syncCfg.url).trim().replace(/\/+$/,'');
  return /^https:\/\/.+/.test(u)? u : null;
}
function syncRoom(){ return String((syncCfg&&syncCfg.room)||'').trim().replace(/[^a-zA-Z0-9_-]/g,''); }

function syncStatus(t,cls){
  const el=document.getElementById('syncStatus');
  if(el){ el.textContent=t; el.className='sync-status'+(cls?' '+cls:''); }
  const btn=document.getElementById('cloudBtn');
  if(btn){ btn.classList.toggle('cloud-on', !!syncOn); btn.textContent=syncOn?'☁ Облако ✓':'☁ Облако'; }
}

/* ─── описание контура ───
   ch = { name, key, url(), payload(), apply(данные), lastAt, es, pushTimer, retryTimer, pending } */
function makeChan(name, key, urlFn, payloadFn, applyFn){
  return { name, key, url:urlFn, payloadOf:payloadFn, applyData:applyFn,
    lastAt:+(lsGet('dndworld2:synclast:'+key)||0), es:null, pushTimer:null, retryTimer:null, pending:null };
}
const chWorld=makeChan('мир','w',
  ()=>{ const b=syncBase(); return b? b+'/world.json' : null; },
  ()=>({ items:itemsDB, spells:spellsDB, abilities:abilitiesDB, races:racesDB, classes:classesDB, rules:rulesDB, foes:foesDB }),
  (d)=>{
    itemsDB=d.items||[]; spellsDB=d.spells||[]; abilitiesDB=d.abilities||[];
    racesDB=d.races||racesDB; classesDB=d.classes||classesDB; rulesDB=d.rules||rulesDB; foesDB=d.foes||foesDB;
    renderSpellsDB(); renderItemsDB(); renderAbilitiesDB(); renderRaces(); renderClasses(); renderRules(); renderFoes(); renderChars();
  });
const chCamp=makeChan('кампания','c',
  ()=>{ const b=syncBase(), r=syncRoom(); return (b&&r)? b+'/campaigns/'+r+'.json' : null; },
  ()=>({ chars, journal }),
  (d)=>{ chars=(d.chars||[]).map(x=>typeof upgradeChar3==='function'?upgradeChar3(x):x); journal=d.journal||[]; renderChars(); renderJournal(); });
const syncChans=[chWorld, chCamp];

/* ─── применение чужих правок ─── */
async function syncPersistLocal(){
  await store.set('dndworld2:chars',   JSON.stringify(chars));
  await store.set('dndworld2:items',   JSON.stringify(itemsDB));
  await store.set('dndworld2:spells',  JSON.stringify(spellsDB));
  await store.set('dndworld2:abilities',JSON.stringify(abilitiesDB));
  await store.set('dndworld2:races',   JSON.stringify(racesDB));
  await store.set('dndworld2:classes', JSON.stringify(classesDB));
  await store.set('dndworld2:rules',   JSON.stringify(rulesDB));
  await store.set('dndworld2:foes',    JSON.stringify(foesDB));
  await store.set('dndworld2:journal', JSON.stringify(journal));
}
function syncApplyRemote(ch,msg){
  const ae=document.activeElement;   /* не сбивать набор текста */
  const typing=ae && (ae.tagName==='INPUT'||ae.tagName==='TEXTAREA') && ae.closest && ae.closest('.leaf');
  if(typing){
    ch.pending=msg;
    clearTimeout(ch.retryTimer);
    ch.retryTimer=setTimeout(()=>{ const m=ch.pending; ch.pending=null; if(m) syncApplyRemote(ch,m); },2500);
    return;
  }
  try{
    const d=JSON.parse(msg.j);
    ch.applyData(d);
    ch.lastAt=msg.at||Date.now();
    lsSet('dndworld2:synclast:'+ch.key,String(ch.lastAt)); lsSet('dndworld2:dirty:'+ch.key,'');
    syncPersistLocal();
    syncStatus('Облако: получены изменения ('+ch.name+') ✓','ok');
    setStatus('Летопись обновлена из облака ✓');
  }catch(e){ syncStatus('Облако: не удалось разобрать данные ('+ch.name+')','err'); }
}

/* ─── отправка: ядро зовет syncTouch после каждого сохранения ─── */
function syncTouch(){
  if(!syncCfg||!syncCfg.on) return;
  syncChans.forEach(ch=>{
    if(!ch.url()) return;
    if(!syncOn){ lsSet('dndworld2:dirty:'+ch.key,'1'); return; }
    clearTimeout(ch.pushTimer);
    ch.pushTimer=setTimeout(()=>syncPushNow(ch),1200);
  });
}
async function syncPushNow(ch){
  const u=ch.url(); if(!u||!syncOn) return;
  const p={ by:syncClientId, at:Date.now(), j:JSON.stringify(ch.payloadOf()) };
  try{
    syncStatus('Облако: отправляю ('+ch.name+')…');
    const r=await fetch(u,{method:'PUT',body:JSON.stringify(p)});
    if(!r.ok) throw new Error('HTTP '+r.status);
    ch.lastAt=p.at;
    lsSet('dndworld2:synclast:'+ch.key,String(p.at)); lsSet('dndworld2:dirty:'+ch.key,'');
    syncStatus('Облако: сохранено ('+ch.name+') ✓','ok');
  }catch(e){ syncStatus('Облако: ошибка отправки ('+ch.name+') — '+e.message,'err'); }
}

/* ─── живой поток ─── */
function syncCloseStream(ch){ if(ch.es){ try{ ch.es.close(); }catch(e){} ch.es=null; } }
function syncOpenStream(ch){
  syncCloseStream(ch);
  const u=ch.url(); if(!u) return;
  try{
    ch.es=new EventSource(u);
    const onPut=(ev)=>{
      try{
        const p=JSON.parse(ev.data);
        if(!p || p.path!=='/' || !p.data) return;
        const msg=p.data;
        if(msg.by===syncClientId) return;
        if(!(msg.at>ch.lastAt)) return;
        syncApplyRemote(ch,msg);
      }catch(e){}
    };
    ch.es.addEventListener('put',onPut);
    ch.es.addEventListener('patch',onPut);
    ch.es.addEventListener('cancel',()=>syncStatus('Облако: доступ закрыт правилами базы','err'));
    ch.es.addEventListener('auth_revoked',()=>syncStatus('Облако: истек доступ — проверьте правила базы','err'));
    ch.es.onerror=()=>{ if(syncOn) syncStatus('Облако: связь прервана ('+ch.name+'), переподключаюсь…','err'); };
  }catch(e){ syncStatus('Облако: живой поток недоступен — '+e.message,'err'); }
}

/* ─── рукопожатие одного контура ─── */
async function syncHandshake(ch, cloud, interactive){
  const dirty=lsGet('dndworld2:dirty:'+ch.key)==='1';
  if(cloud && cloud.j && cloud.at){
    if(cloud.at>ch.lastAt){
      let take=true;
      if(interactive || dirty){
        take=window.confirm('В облаке уже есть данные («'+ch.name+'», запись от '+new Date(cloud.at).toLocaleString()+').\n\nОК — взять из облака (заменит данные на этом устройстве).\nОтмена — заменить облако данными этого устройства.');
      }
      if(take) syncApplyRemote(ch,cloud); else await syncPushNow(ch);
    } else if(dirty){ await syncPushNow(ch); }
  } else {
    await syncPushNow(ch);       /* узел пуст — кладем свои данные */
  }
  syncOpenStream(ch);
}

/* ─── подключение / отключение ─── */
async function syncConnect(interactive){
  if(!syncBase()){ syncStatus('Укажите ссылку на базу (https://…)','err'); return; }
  syncChans.forEach(syncCloseStream);
  syncStatus('Облако: подключаюсь…');
  /* забираем оба узла */
  let cloudW=null, cloudC=null;
  try{
    const r=await fetch(chWorld.url());
    if(!r.ok) throw new Error('HTTP '+r.status);
    cloudW=await r.json();
  }catch(e){ syncOn=false; syncStatus('Облако: нет доступа — '+e.message,'err'); return; }
  if(chCamp.url()){
    try{ const r=await fetch(chCamp.url()); if(r.ok) cloudC=await r.json(); }catch(e){}
  }
  syncOn=true; syncCfg.on=true; syncSaveCfg();
  /* перенос старого формата: раньше весь мир лежал внутри кампании */
  if((!cloudW || !cloudW.j) && cloudC && cloudC.j){
    try{
      const old=JSON.parse(cloudC.j);
      if(old.items||old.spells||old.abilities){
        itemsDB=old.items||itemsDB; spellsDB=old.spells||spellsDB; abilitiesDB=old.abilities||abilitiesDB;
        await syncPushNow(chWorld);
        cloudW={by:syncClientId, at:chWorld.lastAt, j:JSON.stringify(chWorld.payloadOf())};
        syncStatus('Облако: своды мира вынесены из кампании в общий контур ✓','ok');
      }
    }catch(e){}
  }
  await syncHandshake(chWorld, cloudW, interactive);
  if(chCamp.url()) await syncHandshake(chCamp, cloudC, interactive);
  syncStatus('Облако: подключено ✓ (мир — общий'+(chCamp.url()?', кампания «'+syncRoom()+'»':'; кампания не задана')+')','ok');
}
function syncDisconnect(){
  syncChans.forEach(syncCloseStream); syncOn=false;
  if(syncCfg){ syncCfg.on=false; syncSaveCfg(); }
  syncStatus('Облако: отключено');
}
function syncAutoStart(){
  syncLoadCfg();
  if(CLOUD_PAUSED){ syncStatus('Облако: на паузе — весь материал ведется локально для всего сайта'); return; }
  if(syncCfg && syncCfg.on && syncBase() && typeof EventSource!=='undefined') syncConnect(false);
}

}
function closeSyncModal(){ const m=document.getElementById('syncModal'); if(m) m.classList.add('hidden'); }

}

function saveRaceEd(){

    ab:document.getElementById('edRcAb').value.trim(),

/* ═══════════════ БЕСТИАРИЙ: монстры, NPC и прочие цели ═══════════════
   Каркас под будущую полную базу. Запись противника:
   {id, n, kind:'monster'|'npc', cr, ac, hpMax, hp, hpTemp, speed, abil:{str…cha},
    profB, saveP:{str…cha}, resist:[], vuln:[], immune:[], condImmune:[], cond:[],
    magicRes:bool, senses, langs, traits, actions, notes, tags}
   Все броски цели сайт умеет считать по этим числам; чего нет — спрашивает у мастера. */
const DMG_TYPES=['дробящий','колющий','рубящий','огонь','холод','кислота','яд','электричество','звук',
  'некротическая энергия','излучение','психическая энергия','силовое поле'];
/* как урон назван в текстах записей → канонический вид */
const DMG_ALIASES={'огнем':'огонь','огня':'огонь','огненный':'огонь','холодом':'холод','холода':'холод',
  'кислотой':'кислота','кислоты':'кислота','ядом':'яд','яда':'яд','электричеством':'электричество',
  'звуком':'звук','звуковой':'звук','некротический':'некротическая энергия','некротической':'некротическая энергия',
  'излучением':'излучение','психический':'психическая энергия','психической':'психическая энергия',
  'силовым':'силовое поле','силового':'силовое поле','дробящий':'дробящий','колющий':'колющий','рубящий':'рубящий'};
function dmgTypeCanon(t){
  const k=String(t||'').toLowerCase().trim();
  if(!k) return '';
  if(DMG_ALIASES[k]) return DMG_ALIASES[k];
  const hit=DMG_TYPES.filter(x=>x.indexOf(k)===0||k.indexOf(x)===0)[0];
  return hit||k;
}
function blankFoe(){
  return {id:'foe_'+uid(), n:'', kind:'monster', cr:'', ac:12, hpMax:11, hp:11, hpTemp:0, speed:'9 м',
    abil:{str:10,dex:10,con:10,int:10,wis:10,cha:10}, profB:2, saveP:{},
    resist:[], vuln:[], immune:[], condImmune:[], cond:[], magicRes:false,
    activeFx:[], senses:'', langs:'', traits:'', actions:'', notes:'', tags:[]};
}
function foeOf(id){ return foesDB.find(f=>f.id===id)||null; }
function foeAbMod(f,k){ return mod((f.abil&&f.abil[k])!=null?f.abil[k]:10); }
function foeFxAll(f){
  const out=[], active=(f&&f.activeFx)||[], winners={};
  active.forEach(a=>{
    const key=a.stackKey||(a.k==='spell'?'spell:'+a.id:null); if(!key) return;
    const w=winners[key], power=+a.power||0, applied=+a.appliedRound||0;
    if(!w||power>(+w.power||0)||(power===(+w.power||0)&&applied>=(+w.appliedRound||0))) winners[key]=a;
  });
  active.forEach(a=>{
    const key=a.stackKey||(a.k==='spell'?'spell:'+a.id:null);
    if(key&&winners[key]!==a) return;
    (a.fx||[]).forEach(x=>out.push(x));
  });
  return out;
}
function foeFxSum(f,stat){
  return foeFxAll(f).filter(x=>x.stat===stat&&x.mode==='add').reduce((a,x)=>a+(+x.value||0),0);
}
function effectiveFoeConditions(f){
  const out=normalizeConditions(f&&f.cond);
  foeFxAll(f).filter(x=>x.stat==='condition').forEach(x=>{
    const n=canonicalCondition(x.value); if(n&&out.indexOf(n)<0) out.push(n);
  });
  return out;
}
function foeSaveMod(f,k){ return foeAbMod(f,k)+((f.saveP&&f.saveP[k])?(+f.profB||2):0)+foeFxSum(f,'save.'+k)+foeFxSum(f,'save.all'); }
function foeAlive(f){ return (+f.hp||0)>0; }
function applyFxToFoe(f,entry){
  if(!f) return null;
  f.activeFx=f.activeFx||[];
  let fx=entry.fx;
  if(!fx){
    const rec=entry.k==='spell'?spellOf(entry.id):(entry.k==='ability'?abilityOf(entry.id):null);
    fx=recFx(rec,entry.k);
  }
  const immune=normalizeConditions(f.condImmune);
  entry.fx=(fx||[]).filter(x=>x.stat!=='condition'||immune.indexOf(canonicalCondition(x.value))<0);
  entry.uid=entry.uid||fxUid();
  if(entry.appliedRound==null) entry.appliedRound=fxRound;
  f.activeFx.push(entry);
  fxInvalidate();
  return entry;
}
function removeFoeActiveFx(id,uid){
  const f=foeOf(id); if(!f) return;
  f.activeFx=(f.activeFx||[]).filter(x=>x.uid!==uid);
  fxInvalidate(); scheduleSave(); renderFoes(); renderChars();
}
/* урон по противнику с учетом сопротивлений/уязвимостей/иммунитета */
function dmgAfterTraits(holder, amount, dtype){
  const t=dmgTypeCanon(dtype);
  const list=k=>((holder&&holder[k])||[]).map(dmgTypeCanon);
  let note='';
  if(!t) return {amount, note};
  if(list('immune').indexOf(t)>=0) return {amount:0, note:'иммунитет к «'+t+'»'};
  if(list('resist').indexOf(t)>=0) return {amount:Math.floor(amount/2), note:'сопротивление «'+t+'» — урон вдвое меньше'};
  if(list('vuln').indexOf(t)>=0)   return {amount:amount*2, note:'уязвимость к «'+t+'» — урон вдвое больше'};
  return {amount, note};
}
function csvArr(s){ return String(s||'').split(/[,;]/).map(x=>x.trim()).filter(Boolean); }

function targetInfoOf(val){
  const v=String(val||'');

    const c=getCh(v.slice(5));
    if(!c) return {kind:'none', name:'—', known:false};
    return {kind:'ally', id:c.id, obj:c, name:c.name, known:true, ac:acTotal(c), hp:+c.hp||0, hpMax:eHpMax(c),
      saveMod:k=>eMod(c,k)+((c.saves&&c.saves[k])?PROF[c.level]:0)+fxSaveBonus(c,k),
      abMod:k=>eMod(c,k), skillMod:n=>{ const i=SKILLS.findIndex(x=>x[0]===n); return i<0?0:skillBonus(c,i).v; },
      resist:c.resist||[], vuln:c.vuln||[], immune:c.immune||[]};
  }
  if(v.indexOf('foe:')===0){
    const f=foeOf(v.slice(4));
    if(!f) return {kind:'foe', name:'враг', known:false};
    return {kind:'foe', id:f.id, obj:f, name:f.n, known:true, ac:(+f.ac||10)+foeFxSum(f,'ac'), hp:+f.hp||0, hpMax:+f.hpMax||0,
      saveMod:k=>foeSaveMod(f,k), abMod:k=>foeAbMod(f,k), skillMod:n=>foeAbMod(f,(SKILLS.find(x=>x[0]===n)||[0,'dex'])[1]),
      resist:f.resist||[], vuln:f.vuln||[], immune:f.immune||[], conditions:effectiveFoeConditions(f), magicRes:!!f.magicRes};
  }
  if(v==='object') return {kind:'object', name:'неодушевленный объект', known:false};
  if(v==='self')   return {kind:'none', name:'—', known:false};

}
