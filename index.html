    castLogLine(caster.name+' → '+ti.name+': «'+sp.n+'» — без эффекта ('+ti.hp+' хитов)');
    return true;
  }
  ti.obj.hp=0;
  if(ti.kind==='ally'){
    breakConcentration(ti.obj,'герой убит заклинанием «'+sp.n+'»');
    ti.obj.deaths={s:0,f:3};
    ti.obj.cond=normalizeConditions(ti.obj.cond);
    if(ti.obj.cond.indexOf('Бессознательный')<0) ti.obj.cond.push('Бессознательный');
  } else {
    ti.obj.cond=ti.obj.cond||[]; if(ti.obj.cond.indexOf('Повержен')<0) ti.obj.cond.push('Повержен');
  }
  setStatus('⚡ «'+sp.n+'»: '+ti.name+' погибает ('+ti.hp+' ≤ 100 хитов).');
  castLogLine(caster.name+' → '+ti.name+': «'+sp.n+'» — цель погибает ('+ti.hp+' ≤ 100)');
  fxInvalidate(); scheduleSave(); renderChars(); if(typeof renderFoes==='function') renderFoes();
  return true;
}
const SPECIAL_CAST={ 'Контрзаклинание':castCounterspell, 'Рассеивание магии':castDispel,

const SPECIAL_CAST_BY_KEY={counterspell:castCounterspell,dispel:castDispel,antimagic:castAntimagic,powerWordKill:castPowerWordKill};
function spellSpecialHandler(sp){
  const mechanics=sp&&typeof currentMechanics==='function'?currentMechanics(sp,'spell'):sp&&sp.mechanics;
  if(mechanics&&mechanics.mode!=='legacy'){
    const key=mechanics.special;

function breakConcById(charId){ const c=getCh(charId); if(!c) return;
  if(confirm('Прервать концентрацию '+c.name+'?')) breakConcentration(c, 'решение мастера'); }

/* ── компоненты заклинаний: В (вербальный), С (соматический), М (материальный) ── */
function parseComponents(sp){
  const mechanics=sp&&typeof currentMechanics==='function'?currentMechanics(sp,'spell'):sp&&sp.mechanics;
  const mc=mechanics&&mechanics.schemaVersion===GAME_MECHANICS_SCHEMA_VERSION&&mechanics.mode!=='legacy'?mechanics.components:null;
  if(mc){
    const mat=mc.material;
    return {v:!!mc.verbal,s:!!mc.somatic,m:!!mat,matDesc:mat&&mat.description||'',
      matTokens:mat&&Array.isArray(mat.matchTokens)?mat.matchTokens.slice():[],cost:+(mat&&mat.cost)||0,flex:false};
  }
  const cm=String((sp&&sp.cm)||'').trim().replace(/\u0451/g,'е');
  if(!cm||cm==='—') return {v:false,s:false,m:false,matDesc:'',flex:false};
  /*
     Запятые и косые черты в нотации 5e — разделители обязательных
     компонентов, а косая черта внутри «М (песок/лепестки)» относится
     только к описанию материала. Она никогда не означает «любой из».
  */
  const mat=(cm.match(/(?:М|M)\s*\(([^)]*)\)/i)||[]);
  const matDesc=mat[1]||'';
  const top=cm.replace(/\([^)]*\)/g,' ').toUpperCase();

/* ══════ УНИВЕРСАЛЬНЫЙ РАЗБОР ТРЕБУЕМЫХ БРОСКОВ ══════
   Работает и для заклинаний, и для способностей, и для будущих записей.
   Понимает обе записи костей: «2d8» и «2d8»; масштабирование заговоров по

function normRollTxt(s){
  /* единая нотация: любая запись кости (1d8, 1д8, 1D8, 1 d 8) приводится к «1d8» */
  return String(s||'').replace(/\u0451/g,'е').toLowerCase()

}
function scanDiceGroups(txt){
  const out=[]; const re=/(\d+)\s*d\s*(\d+)(?:\s*\+\s*(\d+))?/g; let m;
  while((m=re.exec(txt))){
    const start=Math.max(0,m.index-90), after=m.index+m[0].length;
    out.push({cnt:+m[1], sides:+m[2], plus:+(m[3]||0), idx:m.index,

        const tr=dmgAfterTraits(ti.obj,p.total,p.type,meta.damageTags||{});
        if(tr.note) out.verdict.push('Свойства цели для '+(p.type||'урона')+': '+tr.note+' → '+tr.amount+'.');
        p.total=tr.amount;
      });
    }
    const d=parts.reduce((n,p)=>n+p.total,0);
    out.damageParts=parts;
    const usedTypes=[...new Set(parts.filter(p=>p.raw>0&&p.type).map(p=>p.type))];
    out.dmgType=usedTypes.length>1?'смешанный: '+usedTypes.join(' + '):(usedTypes[0]||dtype);
    out.dmgTotal=d;
    if(d>0) out.verdict.push('Итоговый урон по цели: '+d+(out.dmgType?' ('+out.dmgType+')':'')+'.');
    /* предсказание состояния цели */
    if(d>0&&ti.known&&ti.hp!=null){
      const temp=(ti.obj&&+ti.obj.hpTemp)||0;
      const afterTemp=Math.max(0,d-temp);
      const left=Math.max(0,ti.hp-afterTemp);
      out.verdict.push('У цели останется '+left+' из '+ti.hpMax+' хитов'+(temp?' (временные хиты '+temp+' поглотят часть)':'')+'.');
      if(left<=0) out.verdict.push(ti.kind==='ally'?'Герой падает без сознания — начинаются спасброски от смерти.':'Противник повержен.');
      if(afterTemp-ti.hp>=ti.hpMax) out.verdict.push('⚠ Урон превышает запас хитов на величину максимума — по правилам это мгновенная смерть.');
    }
  }
  if(out.effectAllowed===false) out.blocked=true;
  spec.rows.forEach(r=>{
    if(v[r.key]==null) return;
    if(r.type==='other') out.notes.push(String(r.label).replace(/:.*$/,'')+': '+(v[r.key]+(r.mod||0)));
    else if(r.type==='res') out.notes.push(String(r.label).replace(/:.*$/,'')+' '+v[r.key]);
  });
  return out;
}

/* Единый предохранитель для заклинаний, способностей и предметов. Старые
   программные вызовы без effectAllowed остаются совместимыми, но явный
   успешный спасбросок, промах или проигранное состязание всегда блокируют
   состояние и другой длящийся эффект. */
function outcomeAllowsEffect(rolls){
  if(!rolls) return true;
  if(Object.prototype.hasOwnProperty.call(rolls,'effectAllowed')) return rolls.effectAllowed===true;
  if(rolls.hit===false||rolls.saveOk===true||rolls.contestWin===false||rolls.blocked===true) return false;
  return true;
}

/* ═══ Применение итога к цели: герой, противник бестиария, объект ═══ */
function applyHealTo(targetVal, amount, srcLabel){
  const ti=targetInfoOf(targetVal);
  if(!ti.obj||!(amount>0)) return null;
  if(ti.kind==='ally'){
    const t=ti.obj, mx=eHpMax(t), was=+t.hp||0;
    if(was<=0&&t.deaths&&(+t.deaths.f||0)>=3)
      return {name:t.name,hp:was,hpMax:mx,blocked:true,reason:'герой мертв — обычное лечение не действует'};
    if(holderFxFlag(t,'healing.block'))
      return {name:t.name,hp:was,hpMax:mx,blocked:true,reason:'действующий эффект запрещает восстанавливать хиты'};
    t.hp=Math.min(mx, was+amount);
    let extra='';
    if(was<=0&&t.hp>0){
      t.deaths={s:0,f:0};
      t.cond=normalizeConditions(t.cond).filter(x=>x!=='Бессознательный');
      extra=' · герой пришел в себя';
    }
    return {name:t.name, hp:t.hp, hpMax:mx, extra};
  }
  const f=ti.obj;
  const max=+foeStatsOf(f).hpMax||0;
  f.hp=Math.min(max,(+f.hp||0)+amount);
  return {name:f.n, hp:f.hp, hpMax:max, extra:''};
}
function applyDamageTo(targetVal, amount, dtype, srcLabel, ctx){
  const ti=targetInfoOf(targetVal);
  if(!ti.obj||!(amount>0)) return null;
  let d=amount, absorbed=0;
  const o=ti.obj;
  let oilExtra=0;
  const fire=ctx&&ctx.fireDamage!=null?(+ctx.fireDamage>0):/огонь|огнен|fire/.test(String(dtype||'').toLowerCase());
  const oil=fire&&(o.activeFx||[]).find(x=>x.itemTrigger==='oil');
  if(oil){
    const tr=dmgAfterTraits(o,5,'огонь',ctx||{}); oilExtra=tr.amount; d+=oilExtra; amount=d;
    o.activeFx=(o.activeFx||[]).filter(x=>x.uid!==oil.uid); fxInvalidate();
  }
  if((+o.hpTemp||0)>0){ absorbed=Math.min(+o.hpTemp, d); o.hpTemp-=absorbed; d-=absorbed; }
  const was=+o.hp||0;
  const over=d-was;
  o.hp=Math.max(0, was-d);
  const res={name:ti.name, hp:o.hp, hpMax:ti.hpMax, absorbed, down:o.hp<=0, dead:false, deathFails:0,
    oilIgnited:!!oil,oilExtra};
  if(ti.kind==='ally'){
    if(o.hp<=0){
      /* Непоколебимая стойкость срабатывает в тот же атомарный переход: если
         урон не убивает мгновенно, герой может остаться на 1 хите. */
      const rel=charAbilityRuleEntries(o).find(x=>x.rules&&x.rules.zeroHpReaction
        &&x.rules.zeroHpReaction.kind==='stayAtOne');
      const relCur=rel&&rel.ab.uses!=null?(rel.e.cur==null?rel.ab.uses:rel.e.cur):0;
      if(was>0&&over<ti.hpMax&&rel&&relCur>0&&window.confirm('✦ '+rel.ab.n+': остаться с 1 хитом вместо падения до 0?')){
        rel.e.cur=relCur-1; o.hp=1; res.hp=1; res.down=false; res.relentless=true;
        concDamageCheck(o,amount);
        return res;
      }
      breakConcentration(o,'герой упал до 0 хитов');
      o.cond=normalizeConditions(o.cond);
      if(o.cond.indexOf('Бессознательный')<0) o.cond.push('Бессознательный');
      o.deaths=o.deaths||{s:0,f:0};
      if(over>=ti.hpMax){ res.dead=true; o.deaths={s:0,f:3}; }
      else if(was<=0){
        res.deathFails=(ctx&&ctx.crit)?2:1;
        o.deaths.f=Math.min(3,(+o.deaths.f||0)+res.deathFails);
        if(o.deaths.f>=3) res.dead=true;
      }
    } else if(amount>0) concDamageCheck(o, amount);
  } else {
    if(o.hp<=0){
      res.dead=true; o.cond=o.cond||[]; if(o.cond.indexOf('Повержен')<0) o.cond.push('Повержен');
      const rule=o.undeadFortitude,damageName=String(dtype||'').toLowerCase();
      const excluded=rule&&((rule.exceptCrit&&ctx&&ctx.crit)||(rule.exceptDamage||[]).some(x=>damageName.indexOf(String(x).toLowerCase())>=0));
      if(was>0&&rule&&!excluded){
        res.undeadFortitude={target:o,dc:(+rule.dcBase||5)+amount,mod:foeSaveMod(o,rule.save||'con'),save:rule.save||'con',resolved:false};
      }
    }
  }
  return res;
}
/* Стойкость нежити не бросает кость за игрока. Урон уже проведен атомарно,
   затем интерфейс запрашивает фактический d20 и при успехе возвращает 1 хит. */
function resolveUndeadFortitude(result,natural){
  const p=result&&result.undeadFortitude;
  if(!p||p.resolved||!Number.isInteger(natural)||natural<1||natural>20) return null;
  p.natural=natural; p.total=natural+(+p.mod||0); p.success=p.total>=p.dc; p.resolved=true;
  if(p.success){
    p.target.hp=1; p.target.cond=normalizeConditions(p.target.cond).filter(x=>x!=='Повержен');
    result.hp=1; result.down=false; result.dead=false;
  }

}
function promptUndeadFortitude(result){

    rows:[{key:'d',label:'d20 Телосложения',min:1,max:20}],

    apply:v=>{

      const line=(p.target.n||'Зомби')+': Стойкость нежити — '+r.total+' против СЛ '+r.dc+' · '+(r.success?'успех, остается 1 хит':'провал, повержен');
      combatLog(line,'change','foe:'+p.target.id); setStatus(line+'.'); fxInvalidate(); scheduleSave(); renderFoes(); renderCombat();
    }});

}
function outcomeReactionPlan(rolls){
  const uses=rolls&&Array.isArray(rolls.reactionUses)?rolls.reactionUses:[];
  if(!uses.length||rolls._reactionsCommitted) return {ok:true,plans:[]};
  const plans=[];
  for(const u of uses){
    const actor=combatActorByKey(u.actorKey),pool=actor&&abilityOf(u.poolId),entry=actor&&pool&&(actor.abilities||[]).find(x=>x.abilityId===pool.id);
    const cur=entry&&pool.uses!=null?(entry.cur==null?pool.uses:entry.cur):0;
    if(!actor||!entry||!(cur>0)||!combatCanSpend('reaction',u.actorKey,true)){
      return {ok:false,plans:[],reason:'Защитная реакция больше недоступна; пересчитайте итог атаки.'};
    }
    plans.push({u,actor,pool,entry,cur});
  }
  return {ok:true,plans};
}
function preflightOutcomeReactions(rolls){
  const plan=outcomeReactionPlan(rolls);
  if(plan.ok) return true;
  setStatus('✕ '+plan.reason,true); castShowErr&&castShowErr(plan.reason); return false;
}
function commitOutcomeReactions(rolls){
  if(!rolls||rolls._reactionsCommitted) return true;
  if(!Array.isArray(rolls.reactionUses)||!rolls.reactionUses.length) return true;
  const plan=outcomeReactionPlan(rolls);
  if(!plan.ok){ setStatus('✕ '+plan.reason,true); castShowErr&&castShowErr(plan.reason); return false; }
  const plans=plan.plans;
  plans.forEach(p=>{
    combatSpend('reaction',p.u.label+' (урон −'+p.u.amount+')',p.u.actorKey);
    p.entry.cur=p.cur-1;
  });
  if(plans.length) rolls._reactionsCommitted=true;
  scheduleSave();
  return true;
}
/* единая проводка итогов формулы по цели — для заклинаний и способностей */
function applyRollsToTarget(targetVal, rolls, srcLabel){
  let info='';
  if(!rolls) return info;
  if(!commitOutcomeReactions(rolls)) return ' · итог не применен: защитная реакция устарела';
  const ti=targetInfoOf(targetVal);
  if(rolls.healTotal!=null&&rolls.healTotal>0){
    const r=applyHealTo(targetVal, rolls.healTotal, srcLabel);
    if(r&&r.blocked){ info+=' · лечение не применено ('+r.reason+')'; }
    else if(r){ info+=' · лечение +'+rolls.healTotal+' хитов ('+r.name+': '+r.hp+'/'+r.hpMax+')'+(r.extra||'');
      diceOutSet(srcLabel+' → '+r.name+': +'+rolls.healTotal+' хитов','var(--ok)'); }
    else info+=' · лечение +'+rolls.healTotal+' хитов (цель вне листов — записано в летопись)';
  }
  if(rolls.tempTotal!=null&&rolls.tempTotal>0){
    const r=applyTempHp(targetVal, rolls.tempTotal);
    if(r) info+=' · временные хиты '+r.temp+(r.replaced?'':' (прежние были выше)');
  }

      damageCtx.fireDamage=rolls.damageParts.filter(p=>dmgTypeCanon(p.type)==='огонь').reduce((n,p)=>n+(+p.total||0),0);
    const r=applyDamageTo(targetVal, rolls.dmgTotal, rolls.dmgType, srcLabel,damageCtx);
    if(r){ if(r.undeadFortitude) promptUndeadFortitude(r);
      info+=' · урон '+rolls.dmgTotal+(rolls.dmgType?' ('+rolls.dmgType+')':'')+' → '+r.name+': '+r.hp+'/'+r.hpMax
        +(r.absorbed?' (временные хиты поглотили '+r.absorbed+')':'')
        +(r.oilIgnited?' · масло вспыхнуло: дополнительно '+r.oilExtra+' огненного урона':'')
        +(r.deathFails?' · провалы спасбросков от смерти +'+r.deathFails:'')
        +(r.relentless?' · Непоколебимая стойкость: остался 1 хит'
          :(r.undeadFortitude&&!r.undeadFortitude.resolved?' · ожидается Стойкость нежити'
            :(r.dead?' · '+(ti.kind==='ally'?'СМЕРТЬ':'повержен'):(r.down?' · без сознания':''))));
      diceOutSet(srcLabel+' → '+r.name+': '+rolls.dmgTotal+' урона','var(--rubric)'); }
    else { info+=' · урон '+rolls.dmgTotal+' по цели'; diceOutSet(srcLabel+': '+rolls.dmgTotal+' урона по цели','var(--rubric)'); }
  } else if(rolls.dmgTotal===0&&rolls.dmgRaw>0){
    info+=' · урон не прошел (промах, успешный спасбросок или иммунитет)';
  }
  if(ti.kind==='foe'&&ti.obj){ const special=foeDamageReaction(ti.obj,rolls); if(special) info+=' · '+special; }
  if(rolls.notes&&rolls.notes.length) info+=' · '+rolls.notes.join(' · ');
  return info;
}

    errors.push('Укажите фактическую дистанцию до цели: до 1,5 м или дальше.');

    if(r.autoFail) return;
    const val=v[r.key], second=v[r.key+'_2'];
    const hitGate=!r.requiredOnHit||(res&&res.hit===true);
    const saveGate=!r.requiredOnFailedSave||(res&&res.saveOk===false);
    if(r.required&&val==null&&hitGate&&saveGate){
      errors.push(r.label+': впишите результат — без него ресурс и эффект приема не подтверждены.');
      return;
    }
    if(r.requiredWhenThresholdEquals&&val==null&&res&&res.hit===true){
      const tr=(spec.rows||[]).find(x=>x.key===r.requiredWhenThresholdEquals),raw=tr&&v[tr.key],ac=spec.meta&&spec.meta.target&&spec.meta.target.ac;
      if(raw!=null&&ac!=null&&raw+(tr.mod||0)===ac){
        errors.push(r.label+': при равенстве проверки и КД нужен спасбросок цели.');
        return;
      }
    }
    if(r.natural){
      if(val!=null&&(val<1||val>20||!Number.isInteger(val))) errors.push(r.label+': результат d20 должен быть целым числом от 1 до 20.');
      if(second!=null&&(second<1||second>20||!Number.isInteger(second))) errors.push(r.label+': второй d20 должен быть целым числом от 1 до 20.');
      if(r.adv&&val!=null&&second==null) errors.push(r.label+': для преимущества или помехи нужны результаты обоих d20.');
      if(second!=null&&val==null) errors.push(r.label+': сначала впишите первый d20.');
      return;
    }
    if(val==null||r.fixed||!(r.cnt>0)||!(r.sides>0)) return;
    const mult=(r.type==='dmg'&&res&&res.crit)?2:1;
    const lo=r.cnt*mult, hi=r.cnt*r.sides*mult;
    if(!Number.isInteger(val)||val<lo||val>hi) errors.push(r.label+': сумма '+(r.cnt*mult)+'d'+r.sides+' должна быть целым числом от '+lo+' до '+hi+'.');
  });

  if(mechanics&&mechanics.schemaVersion===GAME_MECHANICS_SCHEMA_VERSION&&mechanics.mode!=='legacy'){
    const t=mechanics.target||{},lv=+usedLvl||+sp.l||0;
    if(t.allCreatures) return Math.max(1,chars.length+foesDB.length);
    return Math.max(1,Math.floor((+t.base||1)+Math.max(0,lv-(+t.fromSlot||lv))*(+t.perSlot||0)));
  }

  if(n==='героизм') return 1+Math.max(0,lv-1);
  if(n==='очарование личности'||n==='приказ'||n==='скороход') return 1+Math.max(0,lv-1);
  if(n==='подмога') return 3;
  if(n==='невидимость'||n==='улучшение характеристики'||n==='удержание личности') return 1+Math.max(0,lv-2);
  if(n==='полет') return 1+Math.max(0,lv-3);
  if(n==='массовое лечащее слово') return 6;
  if(n==='изгнание') return 1+Math.max(0,lv-4);
  if(n==='удержание чудовища') return 1+Math.max(0,lv-5);
  if(n==='цепная молния') return 4+Math.max(0,lv-6);
  if(n==='молебен лечения'||n==='массовое лечение ран') return 6;
  if(n==='подводное дыхание') return 10;
  if(n==='магический сон'||n==='сон') return Math.max(1,chars.length+foesDB.length);
  if((sp.tags||[]).indexOf('aoe')>=0) return Math.max(1,chars.length+foesDB.length);

}

function specialCastPlan(sp,caster,target,usedLvl){
  const mechanics=currentMechanics(sp,'spell'),special=mechanics&&mechanics.mode!=='legacy'?mechanics.special:'';
  if(special!=='counterspell'&&(!mechanics&&normSpellName(sp.n)!=='контрзаклинание')) return {ok:true};

  /* Одноразовые кости эффектов списываются только после успешного общего
     префлайта каста. Отмена до коммита не меняет ни один лист. */

  endTriggeredSpellEffects(caster,'spell');
  if(isConc&&concLabelOf(caster)) breakConcentration(caster,'начато новое заклинание концентрации «'+sp.n+'»');

  const e=(caster.inventory||[]).find(x=>x.id===entryId); if(!e) return false;
  const it=itemOf(e.itemId); if(!it||!target) return false; upgradeItem(it);
  const use=itemUseOf(it,useId); if(!use) return false;
  if(!combatCastPreflight()) return false;
  const chk=canUseItemCheck(caster,e,it,use,target,opts);
  if(!chk.ok){ setStatus('✕ '+chk.reason,true); castShowErr&&castShowErr(chk.reason); return false; }
  const rc=itemUseRollCheck(use,rolls); if(!rc.ok){ setStatus('✕ '+rc.reason,true); castShowErr&&castShowErr(rc.reason); return false; }
  if(!preflightOutcomeReactions(rolls)) return false;
  if(!combatCommitCastAction('Предмет «'+it.n+'»: '+use.label)) return false;
  const cost=commitItemUseResource(chk.resource);
  if(!commitOutcomeReactions(rolls)) return false;
  consumeOutcomeRollFx(caster,target,rolls);
  if(rolls&&rolls.attackMade) endTriggeredSpellEffects(caster,'attack');
  let info='';
  if(rolls) info+=applyRollsToTarget(target, rolls, '⚗ '+it.n);
  const tinfo=chk.target.ti;

  if((use.effects||[]).length&&itemUseEffectAllowed(use,rolls)&&applyItemUseEntry(caster,it,use,tinfo)) info+=' · эффект наложен';
  const tl=tinfo.name||'—';

  setStatus('⚗ «'+it.n+'» применено (цель: '+tl+')'+cost+info+'.');
  castLogLine('⚗ '+caster.name+' → '+tl+': предмет «'+it.n+'»'+cost+info);
  if(rolls&&rolls.verdict&&rolls.verdict.length) castLogLine('    разбор: '+rolls.verdict.join(' | '));

  const ti=targetInfoOf(targetVal);

  const was=+ti.obj.hpTemp||0;

/* ═══════════════ ВМЕСТИЛИЩА: открыть, достать, положить ═══════════════ */
function itemIsBox(it){
  if(!it) return false;
  if(it.box) return true;
  return itemProfile(it).kind==='container';
}
function entryInside(e){ if(!Array.isArray(e.inside)) e.inside=[]; return e.inside; }
function innerWeightOf(e){
  return entryInside(e).reduce((a,x)=>{ const t=itemOf(x.itemId); const v=t?parseFloat(String(t.weight||'').replace(',','.')):0;
    return a+((v||0)*(x.qty||1)); },0);
}
/* первичное наполнение по описанию предмета */
function fillContainer(e, it){
  if(!it||!Array.isArray(it.contents)||!it.contents.length) return;
  if(e.filled) return;
  e.filled=true;
  const inside=entryInside(e);
  it.contents.forEach(pair=>{
    const [iid,qty]=pair;
    if(!itemOf(iid)) return;
    if(inside.some(x=>x.itemId===iid)) return;
    inside.push({id:'in_'+fxUid(), itemId:iid, qty:qty||1, notes:''});
  });
}
let boxOpen=null;
function containerOpen(entryId){
  const c=cc(); if(!c) return;
  const e=invEntryOf(c,entryId); if(!e) return;
  const it=itemOf(e.itemId); if(!it) return;
  fillContainer(e,it);
  boxOpen=entryId;
  containerRender();
}
function containerRender(){
  const c=cc(); if(!c||!boxOpen) return;
  const e=invEntryOf(c,boxOpen); if(!e){ boxOpen=null; return; }
  const it=itemOf(e.itemId); if(!it) return;
  const inside=entryInside(e);
  const pr=itemProfile(it);
  let h='<div class="note-ital" style="font-size:13.5px;margin-bottom:6px">'
    +esc(it.n)+(it.cap?' · вмещает '+esc(it.cap):'')+' · внутри предметов: '+inside.length
    +(innerWeightOf(e)?' · вес содержимого '+Math.round(innerWeightOf(e)*10)/10+' кг':'')+'</div>';
  if(!inside.length) h+='<p class="note-ital">Внутри пусто.</p>';
  else h+='<div class="fx-panel">'+inside.map(x=>{
    const t=itemOf(x.itemId); if(!t) return '';
    return '<div class="fx-row"><b class="fx-src">'+esc(t.n)+'</b>'
      +'<span class="fx-why">'+esc(ITEM_TYPES[t.type]||t.type)+(t.weight?' · '+esc(t.weight):'')+(x.qty>1?' · '+x.qty+' шт.':'')+'</span>'
      +'<span class="fx-items"><span class="fx-note">'+esc(String(t.desc||'').split('\n')[0].slice(0,90))+'</span></span>'
      +'<button class="btn ghost sm" title="Переложить в основной инвентарь" onclick="containerTake(\''+e.id+'\',\''+x.id+'\')">↥ достать</button>'
      +'</div>';
  }).join('')+'</div>';
  const outside=(c.inventory||[]).filter(x=>x.id!==e.id&&!itemIsBox(itemOf(x.itemId)));
  if(outside.length) h+='<div style="margin-top:10px"><label class="lbl">Положить внутрь</label>'
    +'<select id="boxPut" style="width:100%">'+outside.map(x=>{ const t=itemOf(x.itemId);
      return '<option value="'+x.id+'">'+esc(t?t.n:'—')+(x.qty>1?' ('+x.qty+' шт.)':'')+'</option>'; }).join('')+'</select>'
    +'<button class="btn ghost sm" style="margin-top:6px" onclick="containerPut(\''+e.id+'\')">↧ положить</button></div>';
  askShow({title:'📦 '+it.n, body:'', note:''});
  document.getElementById('showBody').innerHTML=h;
}
function containerTake(entryId, innerId){
  const c=cc(); if(!c) return;
  const e=invEntryOf(c,entryId); if(!e) return;
  const inside=entryInside(e);
  const i=inside.findIndex(x=>x.id===innerId); if(i<0) return;
  const x=inside[i]; const t=itemOf(x.itemId);
  inside.splice(i,1);
  const same=(c.inventory||[]).find(y=>y.itemId===x.itemId&&!itemIsBox(itemOf(y.itemId)));
  if(same) same.qty=(same.qty||1)+(x.qty||1);
  else c.inventory.push({id:'inv_'+fxUid(), itemId:x.itemId, qty:x.qty||1, notes:''});
  fxInvalidate(); scheduleSave(); renderChars(); containerRender();
  itemLog(c,'↥ '+c.name+' достает из «'+(itemOf(e.itemId)||{}).n+'»: '+(t?t.n:'предмет')+(x.qty>1?' ('+x.qty+' шт.)':''));
}
function containerPut(entryId){
  const c=cc(); if(!c) return;
  const sel=document.getElementById('boxPut'); if(!sel||!sel.value) return;
  const e=invEntryOf(c,entryId), src=invEntryOf(c,sel.value);
  if(!e||!src) return;
  const t=itemOf(src.itemId);
  const inside=entryInside(e);
  const same=inside.find(x=>x.itemId===src.itemId);
  if(same) same.qty=(same.qty||1)+(src.qty||1);
  else inside.push({id:'in_'+fxUid(), itemId:src.itemId, qty:src.qty||1, notes:src.notes||''});
  Object.keys(c.equipment||{}).forEach(k=>{ if(c.equipment[k]===src.id) delete c.equipment[k]; });
  c.inventory=c.inventory.filter(x=>x.id!==src.id);
  fxInvalidate(); scheduleSave(); renderChars(); containerRender();
  itemLog(c,'↧ '+c.name+' кладет в «'+(itemOf(e.itemId)||{}).n+'»: '+(t?t.n:'предмет'));
}

/* ═══════════════ ОБЛАЧНАЯ СИНХРОНИЗАЦИЯ: ДВА КОНТУРА ═══════════════
   МИРОВОЙ контур (узел world) — своды всего сайта, вне кампаний и безусловно:
     предметы и снаряжение, заклинания, способности, народы, призвания, справочник мастера.
   КАМПАНЕЙСКИЙ контур (узел campaigns/{ключ}) — персонажи и журнал конкретной кампании.
   Firebase Realtime Database через REST (запись) и Server-Sent Events (живой поток).
   Если в код вписан DEFAULT_DB_URL, облако включается само на любом устройстве. */
const CLOUD_PAUSED=false;
const DEFAULT_DB_URL='https://best-dnd-campaign-ever-default-rtdb.firebaseio.com';
const DEFAULT_ROOM='SpeakFriendAndEnter2026';   /* кампания по умолчанию */
const STRUCTURED_RELEASE='structured-engine-4.1-20260810';

let syncCfg=null, syncOn=false, syncClientId=null, syncReleasePending=false;

function lsGet(k){ try{ return window.localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ window.localStorage.setItem(k,v); }catch(e){} }

function syncLoadCfg(){
  try{ syncCfg=JSON.parse(lsGet('dndworld2:synccfg')||'null'); }catch(e){ syncCfg=null; }
  if(!syncCfg && DEFAULT_DB_URL){ syncCfg={url:DEFAULT_DB_URL, room:DEFAULT_ROOM, on:true}; syncSaveCfg(); }
  /* Однократный выход из прежней общей паузы. Пользовательские адреса и ключи
     кампаний не трогаем; включаем только штатную SpeakFriendAndEnter2026. */
  const defaultCfg=syncCfg&&String(syncCfg.url||'').replace(/\/+$/,'')===DEFAULT_DB_URL
    &&String(syncCfg.room||'')===DEFAULT_ROOM;
  if(defaultCfg&&lsGet('dndworld2:sync-rollout')!==STRUCTURED_RELEASE){
    syncCfg.on=true; syncSaveCfg(); lsSet('dndworld2:sync-rollout',STRUCTURED_RELEASE);
  }
  syncReleasePending=defaultCfg&&lsGet('dndworld2:release-pending')===STRUCTURED_RELEASE;
  syncClientId=lsGet('dndworld2:clientid');
  if(!syncClientId){ syncClientId='cl_'+Math.random().toString(36).slice(2,10); lsSet('dndworld2:clientid',syncClientId); }
}
function syncSaveCfg(){ lsSet('dndworld2:synccfg', JSON.stringify(syncCfg||{})); }

function syncBase(){
  if(!syncCfg||!syncCfg.url) return null;
  const u=String(syncCfg.url).trim().replace(/\/+$/,'');
  return /^https:\/\/.+/.test(u)? u : null;
}
function syncRoom(){ return String((syncCfg&&syncCfg.room)||'').trim().replace(/[^a-zA-Z0-9_-]/g,''); }

function syncStatus(t,cls){
  const el=document.getElementById('syncStatus');
  if(el){ el.textContent=t; el.className='sync-status'+(cls?' '+cls:''); }
  const btn=document.getElementById('cloudBtn');
  if(btn){ btn.classList.toggle('cloud-on', !!syncOn); btn.textContent=syncOn?'☁ Облако ✓':'☁ Облако'; }
}

/* ─── описание контура ───
   ch = { name, key, url(), payload(), apply(данные), lastAt, es, pushTimer, retryTimer, pending } */
function makeChan(name, key, urlFn, payloadFn, applyFn){
  return { name, key, url:urlFn, payloadOf:payloadFn, applyData:applyFn,
    lastAt:+(lsGet('dndworld2:synclast:'+key)||0), es:null, pushTimer:null, retryTimer:null, pending:null };
}
const chWorld=makeChan('мир','w',
  ()=>{ const b=syncBase(); return b? b+'/world.json' : null; },
  ()=>({ items:itemsDB, spells:spellsDB, abilities:abilitiesDB, races:racesDB, classes:classesDB, rules:rulesDB, foes:foesDB }),
  (d)=>{
    itemsDB=d.items||[]; spellsDB=d.spells||[]; abilitiesDB=d.abilities||[];
    racesDB=d.races||racesDB; classesDB=d.classes||classesDB; rulesDB=d.rules||rulesDB; foesDB=d.foes||foesDB;
    itemsDB.forEach(upgradeItem); spellsDB.forEach(upgradeSpell); abilitiesDB.forEach(upgradeAbility);
    racesDB.forEach(upgradeRace); classesDB.forEach(upgradeClass);
    foesDB.forEach(upgradeFoe);
    renderSpellsDB(); renderItemsDB(); renderAbilitiesDB(); renderRaces(); renderClasses(); renderRules(); renderFoes(); renderChars();
  });
const chCamp=makeChan('кампания','c',
  ()=>{ const b=syncBase(), r=syncRoom(); return (b&&r)? b+'/campaigns/'+r+'.json' : null; },
  ()=>({ chars, journal, combat }),
  (d)=>{ chars=(d.chars||[]).map(x=>typeof upgradeChar3==='function'?upgradeChar3(x):x); journal=d.journal||[];
    combat=normalizeCombatState(d.combat); if(typeof combatRepairRuntime==='function') combatRepairRuntime(); renderChars(); renderCombat(); renderJournal(); });
const syncChans=[chWorld, chCamp];

function mergeStableEntries(primary,secondary){
  const out=[],seen={};
  (Array.isArray(primary)?primary:[]).concat(Array.isArray(secondary)?secondary:[]).forEach((x,i)=>{
    if(!x||typeof x!=='object') return;
    const key=x.id?'id:'+x.id:'sig:'+JSON.stringify([x.date||'',x.title||'',x.name||'',x.startedAt||'',x.text||'']);
    if(seen[key]) return; seen[key]=1; out.push(x);
  });
  return out;
}
/* Во время выпуска облачная копия и прежнее локальное устройство могут
   содержать разные страницы журнала или архивы. Облачные версии одноименных
   записей имеют приоритет, уникальные локальные записи не теряются. */
function structuredReleaseCampaignPayload(remote){
  remote=remote&&typeof remote==='object'?remote:{};
  const builtin={char_roku:1,char_torgar:1,char_septih:1,char_legerem:1};
  const remoteCustom=(remote.chars||[]).filter(c=>c&&!builtin[c.id]);
  const localCustom=(chars||[]).filter(c=>c&&!builtin[c.id]);
  const custom=mergeStableEntries(remoteCustom,localCustom).map(resetCustomCharacterForCombat);
  const nextChars=[buildRoku(),buildTorgar(),buildSeptih(),buildLegerem()].concat(custom);
  if(typeof upgradeChar3==='function') nextChars.forEach(upgradeChar3);
  const nextJournal=mergeStableEntries(remote.journal,journal);
  const nextCombat=blankCombat();
  nextCombat.history=mergeStableEntries(remote.combat&&remote.combat.history,combat&&combat.history).slice(0,20);
  return {chars:nextChars,journal:nextJournal,combat:nextCombat};
}
/* Старая версия держала кампанию только в localStorage. Этот одноразовый
   переход сбрасывает незавершенный локальный бой, но сохраняет журнал, архив
   и пользовательских героев до безопасного объединения с облаком. */
async function applyStructuredReleaseMigration(){
  const key='dndworld2:structured-release';
  if((await store.get(key))===STRUCTURED_RELEASE){
    syncReleasePending=lsGet('dndworld2:release-pending')===STRUCTURED_RELEASE;
    return false;
  }
  restorePartyAndCombatState();
  await store.set('dndworld2:chars',JSON.stringify(chars));
  await store.set('dndworld2:foes',JSON.stringify(foesDB));
  await store.set('dndworld2:journal',JSON.stringify(journal));
  await store.set('dndworld2:combat',JSON.stringify(combat));
  await store.set('dndworld2:fxround',JSON.stringify(fxRound));
  await store.set(key,STRUCTURED_RELEASE);
  lsSet('dndworld2:release-pending',STRUCTURED_RELEASE);
  syncReleasePending=true;
  return true;
}

  await store.set('dndworld2:spells',  JSON.stringify(spellsDB));

function syncApplyRemote(ch,msg){
  const ae=document.activeElement;   /* не сбивать набор текста */
  const typing=ae && (ae.tagName==='INPUT'||ae.tagName==='TEXTAREA') && ae.closest && ae.closest('.leaf');
  if(typing){
    ch.pending=msg;
    clearTimeout(ch.retryTimer);
    ch.retryTimer=setTimeout(()=>{ const m=ch.pending; ch.pending=null; if(m) syncApplyRemote(ch,m); },2500);
    return;
  }
  try{
    const d=JSON.parse(msg.j);
    ch.applyData(d);
    ch.lastAt=msg.at||Date.now();
    lsSet('dndworld2:synclast:'+ch.key,String(ch.lastAt)); lsSet('dndworld2:dirty:'+ch.key,'');
    syncPersistLocal();
    syncStatus('Облако: получены изменения ('+ch.name+') ✓','ok');
    setStatus('Летопись обновлена из облака ✓');
  }catch(e){ syncStatus('Облако: не удалось разобрать данные ('+ch.name+')','err'); }
}

/* ─── отправка: ядро зовет syncTouch после каждого сохранения ─── */
function syncTouch(){
  if(!syncCfg||!syncCfg.on) return;
  syncChans.forEach(ch=>{
    if(!ch.url()) return;
    if(!syncOn){ lsSet('dndworld2:dirty:'+ch.key,'1'); return; }
    clearTimeout(ch.pushTimer);
    ch.pushTimer=setTimeout(()=>syncPushNow(ch),1200);
  });
}
async function syncPushNow(ch){
  const u=ch.url(); if(!u||!syncOn) return false;
  const p={ by:syncClientId, at:Date.now(), j:JSON.stringify(ch.payloadOf()) };
  try{
    syncStatus('Облако: отправляю ('+ch.name+')…');
    const r=await fetch(u,{method:'PUT',body:JSON.stringify(p)});
    if(!r.ok) throw new Error('HTTP '+r.status);
    ch.lastAt=p.at;
    lsSet('dndworld2:synclast:'+ch.key,String(p.at)); lsSet('dndworld2:dirty:'+ch.key,'');
    syncStatus('Облако: сохранено ('+ch.name+') ✓','ok');
    return true;
  }catch(e){ syncStatus('Облако: ошибка отправки ('+ch.name+') — '+e.message,'err'); return false; }
}

/* ─── живой поток ─── */
function syncCloseStream(ch){ if(ch.es){ try{ ch.es.close(); }catch(e){} ch.es=null; } }
function syncOpenStream(ch){
  syncCloseStream(ch);
  const u=ch.url(); if(!u) return;
  try{
    ch.es=new EventSource(u);
    const onPut=(ev)=>{
      try{
        const p=JSON.parse(ev.data);
        if(!p || p.path!=='/' || !p.data) return;
        const msg=p.data;
        if(msg.by===syncClientId) return;
        if(!(msg.at>ch.lastAt)) return;
        syncApplyRemote(ch,msg);
      }catch(e){}
    };
    ch.es.addEventListener('put',onPut);
    ch.es.addEventListener('patch',onPut);
    ch.es.addEventListener('cancel',()=>syncStatus('Облако: доступ закрыт правилами базы','err'));
    ch.es.addEventListener('auth_revoked',()=>syncStatus('Облако: истек доступ — проверьте правила базы','err'));
    ch.es.onerror=()=>{ if(syncOn) syncStatus('Облако: связь прервана ('+ch.name+'), переподключаюсь…','err'); };
  }catch(e){ syncStatus('Облако: живой поток недоступен — '+e.message,'err'); }
}

/* ─── рукопожатие одного контура ─── */
async function syncHandshake(ch, cloud, interactive){
  const dirty=lsGet('dndworld2:dirty:'+ch.key)==='1';
  if(cloud && cloud.j && cloud.at){
    if(cloud.at>ch.lastAt){
      let take=true;
      if(interactive){
        take=window.confirm('В облаке уже есть данные («'+ch.name+'», запись от '+new Date(cloud.at).toLocaleString()+').\n\nОК — взять из облака (заменит данные на этом устройстве).\nОтмена — заменить облако данными этого устройства.');
      }
      if(take) syncApplyRemote(ch,cloud); else await syncPushNow(ch);
    } else if(dirty){ await syncPushNow(ch); }
  } else {
    await syncPushNow(ch);       /* узел пуст — кладем свои данные */
  }
  syncOpenStream(ch);
}

async function syncStructuredReleaseCampaign(cloud){
  let remote={};
  try{ if(cloud&&cloud.j) remote=JSON.parse(cloud.j); }catch(e){
    syncStatus('Облако: повреждена кампанийная копия, выпуск остановлен','err'); return false;
  }
  const merged=structuredReleaseCampaignPayload(remote);
  chCamp.applyData(merged);
  await syncPersistLocal();
  const ok=await syncPushNow(chCamp);
  if(!ok) return false;
  lsSet('dndworld2:release-pending','');
  syncReleasePending=false;
  syncOpenStream(chCamp);
  return true;
}

/* ─── подключение / отключение ─── */
async function syncConnect(interactive){
  if(!syncBase()){ syncStatus('Укажите ссылку на базу (https://…)','err'); return; }
  syncChans.forEach(syncCloseStream);
  syncStatus('Облако: подключаюсь…');
  /* забираем оба узла */
  let cloudW=null, cloudC=null;
  try{
    const r=await fetch(chWorld.url());
    if(!r.ok) throw new Error('HTTP '+r.status);
    cloudW=await r.json();
  }catch(e){ syncOn=false; syncStatus('Облако: нет доступа — '+e.message,'err'); return; }
  if(chCamp.url()){
    try{ const r=await fetch(chCamp.url()); if(r.ok) cloudC=await r.json(); }catch(e){}
  }
  syncOn=true; syncCfg.on=true; syncSaveCfg();
  /* перенос старого формата: раньше весь мир лежал внутри кампании */
  if((!cloudW || !cloudW.j) && cloudC && cloudC.j){
    try{
      const old=JSON.parse(cloudC.j);
      if(old.items||old.spells||old.abilities){
        itemsDB=old.items||itemsDB; spellsDB=old.spells||spellsDB; abilitiesDB=old.abilities||abilitiesDB;
        itemsDB.forEach(upgradeItem); spellsDB.forEach(upgradeSpell); abilitiesDB.forEach(upgradeAbility);
        await syncPushNow(chWorld);
        cloudW={by:syncClientId, at:chWorld.lastAt, j:JSON.stringify(chWorld.payloadOf())};
        syncStatus('Облако: своды мира вынесены из кампании в общий контур ✓','ok');
      }
    }catch(e){}
  }
  await syncHandshake(chWorld, cloudW, interactive);
  if(chCamp.url()){
    if(syncReleasePending){
      const ok=await syncStructuredReleaseCampaign(cloudC);
      if(!ok){ syncStatus('Облако: не удалось завершить перенос кампании','err'); return; }
    } else await syncHandshake(chCamp, cloudC, interactive);
  }
  syncStatus('Облако: подключено ✓ (мир — общий'+(chCamp.url()?', кампания «'+syncRoom()+'»':'; кампания не задана')+')','ok');
}
function syncDisconnect(){
  syncChans.forEach(syncCloseStream); syncOn=false;
  if(syncCfg){ syncCfg.on=false; syncSaveCfg(); }
  syncStatus('Облако: отключено');
}
function syncAutoStart(){
  syncLoadCfg();
  if(CLOUD_PAUSED){ syncStatus('Облако: на паузе — весь материал ведется локально для всего сайта'); return; }
  if(syncCfg && syncCfg.on && syncBase() && typeof EventSource!=='undefined') syncConnect(false);
}

function delCls(id){

}

      + '</div></div></div></div></details>';

    + '<p class="note-ital">Бард, волшебник, друид, жрец, чародей. Колдун использует магию договора, паладин и следопыт — половинные заклинатели.</p>'

function foeDamageReaction(f,rolls){
  const rule=f&&f.splitReaction; if(!rule||!rolls||rolls.hit===false||(+f.hp||0)<(+rule.minHp||10)||!FOE_SMALLER_SIZE[f.size]) return '';

  const type=(rolls.damageParts||[]).find(x=>(+x.raw||0)>0&&wanted.indexOf(dmgTypeCanon(x.type))>=0);
  if(!type) return '';

  if(combat.active&&entry&&!combatCanSpend('reaction',key,true)) return 'Разделение недоступно: реакция уже потрачена';
  if(!window.confirm('☠ '+f.n+': применить реакцию «Разделение» после '+dmgTypeCanon(type.type)+' урона?')) return 'Разделение отклонено мастером';

function targetInfoOf(val){
  const v=String(val||'');
  if(v.indexOf('ally:')===0){
    const c=getCh(v.slice(5));
    if(!c) return {kind:'none', name:'—', known:false};
    return {kind:'ally', id:c.id, obj:c, name:c.name, known:true, ac:acTotal(c), hp:+c.hp||0, hpMax:eHpMax(c),
      saveMod:k=>eMod(c,k)+((c.saves&&c.saves[k])?PROF[c.level]:0)+fxSaveBonus(c,k),
      abMod:k=>eMod(c,k), skillMod:n=>{ const i=SKILLS.findIndex(x=>x[0]===n); return i<0?0:skillBonus(c,i).v; },
      resist:c.resist||[], vuln:c.vuln||[], immune:c.immune||[]};
  }
  if(v.indexOf('foe:')===0){
    const f=foeOf(v.slice(4));
    if(!f) return {kind:'foe', name:'враг', known:false};
    const defense=foeDefensesOf(f),stats=foeStatsOf(f);
    return {kind:'foe', id:f.id, obj:f, name:f.n, known:true, ac:(+stats.ac||10)+foeFxSum(f,'ac'), hp:+f.hp||0, hpMax:+stats.hpMax||0,
      saveMod:k=>foeSaveMod(f,k), abMod:k=>foeAbMod(f,k), skillMod:n=>foeSkillMod(f,n),
      resist:defense.resistances||[], vuln:defense.vulnerabilities||[], immune:defense.immunities||[], conditions:effectiveFoeConditions(f), magicRes:!!defense.magicResistance};
  }
  if(v==='object') return {kind:'object', name:'неодушевленный объект', known:false};
  if(v==='self')   return {kind:'none', name:'—', known:false};
  return {kind:'none', name:'цель не выбрана', known:false};
}

  const resolved=selected==='enemy'&&foesDB.length?'foe:'+foesDB[0].id:selected;
  let h=selected==='enemy'&&!foesDB.length?'<option value="" disabled selected>Добавьте цель в бестиарий или выберите героя</option>':'';
  h+=chars.map(x=>'<option value="ally:'+x.id+'"'+((resolved==='ally:'+x.id)||(!resolved&&caster&&x.id===caster.id)?' selected':'')+'>'
    +esc(x.name)+(caster&&x.id===caster.id?' — сам герой':' — герой')+'</option>').join('');
  if(foesDB.length){
    h+='<optgroup label="Бестиарий">'+foesDB.map(f=>'<option value="foe:'+f.id+'"'+(resolved==='foe:'+f.id?' selected':'')+'>'
      +esc(f.n)+' — '+(f.kind==='npc'?'NPC':'монстр')+', КД '+(+f.ac||10)+', хиты '+(+f.hp||0)+'/'+(+f.hpMax||0)+'</option>').join('')+'</optgroup>';
  }
  h+='<option value="object"'+(resolved==='object'?' selected':'')+'>Неодушевленный объект — бросков не требует</option>';
  return h;
}

/* ─── СПРАВОЧНИК МАСТЕРА ─── */
function ruleEditorHTML(){
  const r=rulesDB.find(x=>x.id===refEditing.rule)||{t:'',x:''};
  return '<div class="editor"><h3>'+(refEditing.rule?'Правка записи':'Новая запись мастера')+'</h3>'
   +'<div class="f-grid"><div><label>Заголовок</label><input type="text" id="edRuT" value="'+esc(r.t)+'"></div></div>'
   +'<label>Текст записи</label><textarea id="edRuX" rows="7">'+esc(r.x)+'</textarea>'
   +'<button class="btn rub" onclick="saveRuleEd()">Вписать в свод</button> '
   +'<button class="btn ghost" onclick="refEditing.rule=null;refEditing.ruleNew=false;renderRules()">Отложить перо</button></div>';
}
function saveRuleEd(){
  const t=document.getElementById('edRuT').value.trim();
  if(!t){ alert('У записи должен быть заголовок.'); return; }
  const x=document.getElementById('edRuX').value;
  let r=rulesDB.find(v=>v.id===refEditing.rule);
  if(r){ r.t=t; r.x=x; } else rulesDB.push({id:'rule_'+uid(), t, x});
  refEditing.rule=null; refEditing.ruleNew=false;
  scheduleSave(); renderRules();
}
function delRule(id){
  const r=rulesDB.find(x=>x.id===id); if(!r) return;
  if(!confirm('Вычеркнуть запись «'+r.t+'»?')) return;
  rulesDB=rulesDB.filter(x=>x.id!==id);
  scheduleSave(); renderRules();
}
function renderRules(){
  let h = '<div class="db-head"><h2 class="rubric">Справочник мастера</h2>'
    + '<button class="btn sm rub" onclick="refEditing.ruleNew=true;refEditing.rule=null;renderRules()">+ Запись мастера</button></div>';
  if(refEditing.ruleNew||refEditing.rule) h += ruleEditorHTML();
  if(rulesDB.length){
    h += '<h3 class="sub"><span class="fl">❧</span>Записи мастера</h3><div class="grid c2">';
    rulesDB.forEach(r=>{
      h += '<div class="card"><div class="card-tools">'
        + '<button class="mini" title="Править" onclick="refEditing.rule=\''+r.id+'\';refEditing.ruleNew=false;renderRules();window.scrollTo({top:0,behavior:\'smooth\'})">✎</button>'
        + '<button class="mini" title="Вычеркнуть" onclick="delRule(\''+r.id+'\')">✕</button></div>'
        + '<h4>'+esc(r.t)+'</h4><p style="font-size:14.5px;white-space:pre-wrap">'+esc(r.x)+'</p></div>';
    });
    h += '</div>';
  }
  h += '<h3 class="sub"><span class="fl">❧</span>Опыт и бонус мастерства</h3><div class="table-scroll"><table class="ms"><tr><th>Уровень</th><th>Опыт</th><th>Бонус мастерства</th><th>Уровень</th><th>Опыт</th><th>Бонус мастерства</th></tr>';
  for(let i=1;i<=10;i++){
    h += '<tr><td><b>'+i+'</b></td><td>'+XP_TABLE[i].toLocaleString('ru')+'</td><td>+'+PROF[i]+'</td>'
      + '<td><b>'+(i+10)+'</b></td><td>'+XP_TABLE[i+10].toLocaleString('ru')+'</td><td>+'+PROF[i+10]+'</td></tr>';
  }
  h += '</table></div>';
  h += '<h3 class="sub"><span class="fl">❧</span>Навыки и характеристики</h3><div class="table-scroll"><table class="ms"><tr><th>Навык</th><th>Характеристика</th><th>Навык</th><th>Характеристика</th></tr>';
  for(let i=0;i<SKILLS.length;i+=2){
    const a=SKILLS[i], b=SKILLS[i+1];
    h += '<tr><td><b>'+a[0]+'</b></td><td>'+AB_FULL[a[1]]+'</td><td>'+(b?'<b>'+b[0]+'</b>':'')+'</td><td>'+(b?AB_FULL[b[1]]:'')+'</td></tr>';
  }
  h += '</table></div>';
  h += '<h3 class="sub"><span class="fl">❧</span>Состояния</h3><div class="grid c3">';
  CONDITIONS.forEach(c=>{ h += '<div class="card"><h4>'+esc(c.n)+'</h4><p style="font-size:14.5px">'+esc(c.d)+'</p></div>'; });
  h += '</div>';
  h += '<h3 class="sub"><span class="fl">❧</span>Предыстории</h3><div class="table-scroll"><table class="ms"><tr><th>Предыстория</th><th>Навыки</th><th>Прочие владения</th><th>Умение</th></tr>';
  BACKGROUNDS.forEach(b=>{ h += '<tr><td><b>'+esc(b.n)+'</b></td><td>'+esc(b.sk)+'</td><td>'+esc(b.ex)+'</td><td>'+esc(b.f)+'</td></tr>'; });
  h += '</table></div>';
  document.getElementById('tab-rules').innerHTML = h;
}

function combatEntryKey(e){ return e?e.kind+':'+e.id:''; }

  const p=String(key).split(':'), kind=p.shift(), id=p.join(':');
  return kind==='ally'?getCh(id):(kind==='foe'?foeOf(id):null);
}
function combatEntryByKey(key){ return (combat.order||[]).find(e=>combatEntryKey(e)===key)||null; }
function combatActorName(key){ const o=combatActorByKey(key); return o?(o.name||o.n||'—'):'—'; }

function combatActorHasTurn(key){
  const e=combatEntryByKey(key),o=combatActorByKey(key); if(!e||!o) return false;
  return e.kind==='ally'?((+(o.deaths&&o.deaths.f)||0)<3):foeAlive(o);
}
function combatCurrentEntry(){ return combat.active&&combat.order.length?combat.order[combat.turnIndex]||null:null; }

function combatFocusedKey(){ return combat.focusKey&&combatEntryByKey(combat.focusKey)?combat.focusKey:combatCurrentKey(); }
function combatRepairRuntime(){
  combat=normalizeCombatState(combat);
  combat.order=combat.order.filter(e=>e&&((e.kind==='ally'&&getCh(e.id))||(e.kind==='foe'&&foeOf(e.id))));
  if(!combat.order.length){ combat.active=false; combat.turn=null; combat.turnIndex=0; return combat; }
  combat.turnIndex=Math.max(0,Math.min(+combat.turnIndex||0,combat.order.length-1));
  if(combat.active){
    const key=combatCurrentKey(),prior=combat.turn||{};
    combat.turn=Object.assign({actorKey:key,actionUsed:false,actionMax:1,actionsUsed:0,actionKind:'',attacksUsed:0,attackMax:combatAttackCount(key),attackActionTaken:false,foeAttacks:[],loadingUsed:{},bonusUsed:false,objectUsed:false,movementUsed:0,dash:false,disengage:false,spellCasts:[],bonusSpellUsed:false,abilityUsed:{}},prior);
    combat.turn.spellCasts=Array.isArray(combat.turn.spellCasts)?combat.turn.spellCasts:[];
    combat.turn.abilityUsed=combat.turn.abilityUsed&&typeof combat.turn.abilityUsed==='object'?combat.turn.abilityUsed:{};
    combat.turn.loadingUsed=combat.turn.loadingUsed&&typeof combat.turn.loadingUsed==='object'?combat.turn.loadingUsed:{};
    combat.turn.foeAttacks=Array.isArray(combat.turn.foeAttacks)?combat.turn.foeAttacks:[];
    combat.turn.actionMax=Math.max(1,+combat.turn.actionMax||1);
    if(prior.actionsUsed==null) combat.turn.actionsUsed=prior.actionUsed?1:0;
    combat.turn.actionsUsed=Math.max(0,Math.min(+combat.turn.actionsUsed||0,combat.turn.actionMax));
    combat.turn.actionUsed=combat.turn.actionsUsed>=combat.turn.actionMax;
    combat.turn.attackActionTaken=!!(combat.turn.attackActionTaken||combat.turn.actionKind==='attack'||(+combat.turn.attacksUsed||0)>0);
    combat.turn.actorKey=key; if(!combat.turn.attackMax) combat.turn.attackMax=combatAttackCount(key); if(!combatEntryByKey(combat.focusKey)) combat.focusKey=key;
  }
  return combat;
}
function combatActorMaxHp(key){ const e=combatEntryByKey(key),o=combatActorByKey(key); return !o?1:(e&&e.kind==='ally'?eHpMax(o):Math.max(1,+foeStatsOf(o).hpMax||1)); }
function combatActorAc(key){
  const e=combatEntryByKey(key),o=combatActorByKey(key); if(!e||!o) return 0;
  return e.kind==='ally'?acTotal(o):Math.max(0,(+foeStatsOf(o).ac||10)+foeFxSum(o,'ac'));
}
function combatActorSpeed(key){
  const e=combatEntryByKey(key),o=combatActorByKey(key); if(!o) return '—'; if(e.kind==='ally') return speedTotal(o);
  const movement=foeStatsOf(o).speed||{},modes=Object.keys(movement).filter(k=>k!=='hover'&&Number.isFinite(+movement[k]));
  const fastest=modes.length?Math.max(...modes.map(k=>+movement[k])):0;
  if(conditionForcesZeroSpeed(effectiveFoeConditions(o))) return '0 м';
  return fastest+(modes.length>1?' м ('+modes.map(k=>k+' '+movement[k]).join(', ')+')':' м');

function combatActorConditions(key){ const e=combatEntryByKey(key),o=combatActorByKey(key); return !o?[]:(e.kind==='ally'?effectiveConditions(o):effectiveFoeConditions(o)); }
function combatLog(text,kind,actorKey){
  if(!combat||!String(text||'').trim()) return null;
  const now=new Date(), e={id:'cl_'+uid(),at:now.toISOString(),round:+combat.round||0,

function combatSnapshotOf(entry){
  const key=combatEntryKey(entry),o=combatActorByKey(key); if(!o) return null;
  const snap={hp:+o.hp||0,hpTemp:+o.hpTemp||0,hpMax:combatActorMaxHp(key),ac:combatActorAc(key),speed:combatActorSpeed(key),
    cond:combatActorConditions(key).slice().sort(),fx:(o.activeFx||[]).map(x=>x.label||x.id||x.k).filter(Boolean).sort()};
  if(entry.kind==='ally'){
    snap.deaths=(+(o.deaths&&o.deaths.s)||0)+'/'+(+(o.deaths&&o.deaths.f)||0);
    snap.exhaustion=+o.exhaustion||0; snap.inspiration=!!o.inspiration;
    snap.slots={}; Object.keys(o.slots||{}).sort().forEach(k=>{ const s=o.slots[k]||{}; snap.slots[k]=(+s.cur||0)+'/'+(+s.max||0); });
    snap.abilities={}; (o.abilities||[]).forEach(x=>{ const a=abilityOf(x.abilityId); if(a&&a.uses!=null) snap.abilities[x.abilityId]=(x.cur==null?a.uses:x.cur)+'/'+a.uses; });
    snap.inventory={}; (o.inventory||[]).forEach(x=>{ const it=itemOf(x.itemId); if(!it) return; const ch=invCharges(x,it); snap.inventory[x.id]=(it.n||x.itemId)+' ×'+(+x.qty||0)+(x.ammoCur!=null?' · боеприпасы '+x.ammoCur:'')+(ch?' · заряды '+ch.cur+'/'+ch.max:'')+(x.kit!=null?' · набор '+x.kit:'')+(x.att?' · настроен':''); });

}
function combatMapDelta(before,after,label){
  before=before||{}; after=after||{}; const out=[];
  [...new Set(Object.keys(before).concat(Object.keys(after)))].sort().forEach(k=>{
    if(String(before[k]||'')!==String(after[k]||'')) out.push(label+' '+k+': '+(before[k]==null?'—':before[k])+'→'+(after[k]==null?'—':after[k]));
  });
  return out;
}
function combatSyncChanges(){
  if(!combat||!combat.active) return false;
  combat.snapshots=combat.snapshots||{}; let changed=false;
  (combat.order||[]).forEach(entry=>{
    const key=combatEntryKey(entry),now=combatSnapshotOf(entry),was=combat.snapshots[key]; if(!now) return;
    if(was){
      const bits=[];
      if(was.hp!==now.hp) bits.push('хиты '+was.hp+'→'+now.hp);
      if(was.hpTemp!==now.hpTemp) bits.push('врем. хиты '+was.hpTemp+'→'+now.hpTemp);
      if(was.hpMax!==now.hpMax) bits.push('макс. хиты '+was.hpMax+'→'+now.hpMax);
      if(was.ac!==now.ac) bits.push('КД '+was.ac+'→'+now.ac);
      if(was.speed!==now.speed) bits.push('скорость '+was.speed+'→'+now.speed);
      if(was.exhaustion!==now.exhaustion) bits.push('истощение '+(was.exhaustion||0)+'→'+(now.exhaustion||0));
      if(was.inspiration!==now.inspiration) bits.push('вдохновение '+(was.inspiration?'есть':'нет')+'→'+(now.inspiration?'есть':'нет'));
      if(was.deaths!==now.deaths) bits.push('спасброски смерти (успех/провал) '+(was.deaths||'0/0')+'→'+(now.deaths||'0/0'));
      if(JSON.stringify(was.cond)!==JSON.stringify(now.cond)) bits.push('состояния: '+(was.cond.join(', ')||'нет')+' → '+(now.cond.join(', ')||'нет'));
      if(JSON.stringify(was.fx)!==JSON.stringify(now.fx)) bits.push('эффекты: '+(was.fx.join(', ')||'нет')+' → '+(now.fx.join(', ')||'нет'));
      bits.push(...combatMapDelta(was.slots,now.slots,'ячейка'));
      bits.push(...combatMapDelta(was.abilities,now.abilities,'ресурс'));
      bits.push(...combatMapDelta(was.inventory,now.inventory,'запас'));
      bits.push(...combatMapDelta(was.equipment,now.equipment,'слот'));
      if(bits.length){ combatLog(combatActorName(key)+': '+bits.join(' · '),'change',key); changed=true; }
    }
    combat.snapshots[key]=now;
  });
  if(changed&&typeof renderCombat==='function') renderCombat();
  return changed;
}
function combatEnsureSetup(){
  combat.setup=combat.setup||{};
  chars.forEach(c=>{ const k='ally:'+c.id; if(!combat.setup[k]) combat.setup[k]={selected:(+c.hp||0)>0,nat:''}; });
  /* Бестиарий — каталог, а не готовая встреча. Автовыбор каждого живого
     монстра создавал бой сразу со всем сводом и делал форму почти непригодной. */
  foesDB.forEach(f=>{ const k='foe:'+f.id; if(!combat.setup[k]) combat.setup[k]={selected:false,nat:''}; });
}
function combatSetupToggle(key,on){ combatEnsureSetup(); combat.setup[key].selected=!!on; }
function combatSetupRoll(key,v){
  combatEnsureSetup(); combat.setup[key].nat=v;
  const e=document.getElementById('combatInitTotal_'+combatDomKey(key)),o=combatActorByKey(key),kind=key.indexOf('ally:')===0?'ally':'foe';
  const n=+v,modi=o?(kind==='ally'?initTotal(o):foeAbMod(o,'dex')):0;

function combatStart(entries,name){
  if(combat.active){ setStatus('✕ Текущий бой нужно сначала завершить.',true); return false; }
  combatEnsureSetup();
  const raw=Array.isArray(entries)?entries:Object.keys(combat.setup).filter(k=>combat.setup[k].selected).map(k=>{
    const p=k.split(':'); return {kind:p[0],id:p.slice(1).join(':'),nat:+combat.setup[k].nat};
  });
  const seen={},order=[];
  raw.forEach((x,seq)=>{
    if(!x) return; const kind=x.kind||(String(x.key||'').split(':')[0]),id=x.id||String(x.key||'').split(':').slice(1).join(':');
    const key=kind+':'+id,o=combatActorByKey(key),nat=+x.nat; if(!o||seen[key]) return; seen[key]=1;
    if(!Number.isInteger(nat)||nat<1||nat>20) return;
    const modi=kind==='ally'?initTotal(o):foeAbMod(o,'dex');
    order.push({kind,id,nat,mod:modi,initiative:nat+modi,reactionUsed:false,seq});
  });
  const selectedCount=raw.filter(Boolean).length;
  if(order.length!==selectedCount){ setStatus('✕ Для каждого участника нужен целый результат d20 от 1 до 20.',true); return false; }
  if(order.length<2||!order.some(x=>x.kind==='ally')||!order.some(x=>x.kind==='foe')){
    setStatus('✕ Для боя выберите минимум одного героя и одного противника.',true); return false;
  }
  order.sort((a,b)=>(b.initiative-a.initiative)||(a.seq-b.seq));
  order.filter(e=>e.kind==='foe').forEach(e=>foeResetActionState(foeOf(e.id)));
  const history=(combat.history||[]).slice();
  if((combat.log||[]).length) history.unshift({id:combat.id||'combat_'+uid(),name:combat.name||'Схватка',startedAt:combat.startedAt,endedAt:combat.endedAt,log:combat.log.slice()});
  if(history.length>20) history.length=20;
  combat=blankCombat(); combat.history=history; combat.active=true; combat.id='combat_'+uid();
  combat.name=String(name||(document.getElementById('combatName')||{}).value||'Схватка').trim()||'Схватка';
  combat.round=1; combat.turnIndex=0; combat.order=order; combat.startedAt=new Date().toISOString(); combat.focusKey=combatEntryKey(order[0]);
  combat.snapshots={}; order.forEach(e=>{ combat.snapshots[combatEntryKey(e)]=combatSnapshotOf(e); });
  combatLog('Бой «'+combat.name+'» начат. Инициатива: '+order.map(e=>combatActorName(combatEntryKey(e))+' '+e.nat+(e.mod?fmtMod(e.mod):'')+' = '+e.initiative).join('; '),'round');

  Object.keys(tied).forEach(k=>{ if(tied[k].length>1) combatLog('Ничья инициативы '+k+': '+tied[k].map(e=>combatActorName(combatEntryKey(e))).join(', ')+'. Мастер может переставить их стрелками.','round'); });
  combatBeginTurn(); scheduleSave(); renderCombat(); return true;
}
function combatClearStartEffects(key){
  const o=combatActorByKey(key); if(!o) return;
  const before=(o.activeFx||[]).length; o.activeFx=(o.activeFx||[]).filter(x=>x.combatUntilTurn!==key);
  if(o.activeFx.length!==before) fxInvalidate();

function combatClearEndEffects(key){
  const expired=[];

  holders.forEach(({holderKey,o})=>{
    const keep=[];
    (o.activeFx||[]).forEach(x=>{
      if(x.combatUntilEndTurn!==key){ keep.push(x); return; }
      if(x.combatSkipMatchingEnd){ x.combatSkipMatchingEnd=false; keep.push(x); return; }
      expired.push({holderKey,label:x.label||x.id});

    o.activeFx=keep;

function combatFocus(key){ if(!combatEntryByKey(key)) return; combat.focusKey=key; renderCombat(); }
function combatMoveOrder(index,delta){

function combatAdvanceTurn(){

function renderJournal(){
  const box=document.getElementById('tab-journal');
  if(!box) return;
  let h='<h2 class="rubric">Журнал кампании</h2>'
    + '<div style="text-align:right;margin-bottom:10px"><button class="btn rub" onclick="addJournal()">✠ Новая запись</button></div>';
  if(!journal.length){
    h+='<div class="empty-scroll"><span class="big">❦</span>Хроника молчит.<br>Запишите первую сессию — потомки будут благодарны.</div>';
  } else {
    journal.slice().reverse().forEach(j=>{
      h+='<div class="card journal-entry"><div class="row-line">'
        + '<input type="date" value="'+esc(j.date)+'" onchange="updJournal(\''+j.id+'\',\'date\',this.value)">'
        + '<input class="grow" value="'+esc(j.title)+'" placeholder="Заглавие записи…" style="font-family:var(--disp);color:var(--rubric)" oninput="updJournal(\''+j.id+'\',\'title\',this.value)">'
        + '<button class="del-x" onclick="delJournal(\''+j.id+'\')">✕</button></div>'
        + '<textarea oninput="updJournal(\''+j.id+'\',\'text\',this.value)" placeholder="Что свершилось в этой сессии…">'+esc(j.text)+'</textarea></div>';
    });
  }
  box.innerHTML=h;
}
function addJournal(){
  journal.push({id:uid(), date:new Date().toISOString().slice(0,10), title:'', text:''});
  scheduleJournalSave(); renderJournal();
}
function updJournal(id,k,v){ const j=journal.find(x=>x.id===id); if(!j) return; j[k]=v; scheduleJournalSave(); }
function delJournal(id){ if(!confirm('Вырвать эту страницу из журнала?')) return;
  journal=journal.filter(x=>x.id!==id); scheduleJournalSave(); renderJournal(); }

      const tied=(c.activeFx||[]).some(x=>x.k==='gear'&&x.id===it.id);
      B('🧗', tied?'Смотать':'Закрепить', "ropeUse('"+e.id+"')",'Преимущество на Атлетику при лазании','object');
      break;
    case 'writing':    B('✒','Записать',"writingUse('"+e.id+"')",'Сделать запись или переписать заклинание в книгу','long'); break;

    case 'ritual':     B('🕯','Возжечь',"ritualBurn('"+e.id+"')",'Начать обряд','long'); break;
  }
  const useIcon={action:'⚗',attack:'⚔',bonus:'◇',reaction:'↯',object:'▣',long:'⌛',free:'◌',turnfree:'◌'};
  itemUsesOf(it).forEach(use=>{
    if(a.some(x=>x.label===use.label)) return;

  });

    B('📦','Открыть',"containerOpen('"+e.id+"')",'Посмотреть и переложить содержимое','object');

}
function itemHintHTML(c, e, it){
  const pr=itemProfile(it), bits=[ITEM_KIND_RU[pr.kind]||''];
  if(pr.kind==='weapon'){
    const w=pr.weapon;
    if(w.range) bits.push('дистанция '+w.range);
    if(w.versatile) bits.push('двумя руками '+w.versatile.cnt+'d'+w.versatile.sides);
    if(w.ammo){ const am=ammoEntryFor(c,it); bits.push(am?('боеприпасы: '+(am.qty||0)):'боеприпасов нет'); }
    if(w.loading) bits.push('перезарядка');
    if(w.reach) bits.push('досягаемость 3 м');
  }
  if(pr.kind==='armor'||pr.kind==='shield'){
    if(pr.armor.strReq){
      const lacks=(+c.ab.str||10)<pr.armor.strReq&&!/дварф/i.test(String(c.race||''));
      bits.push('нужна Сила '+pr.armor.strReq+(lacks?' — не хватает, скорость −3 м':''));
    }
    if(pr.armor.stealthDis) bits.push('помеха на Скрытность');
    if(pr.armor.don) bits.push('надевание: '+pr.armor.don);
  }
  if(pr.kind==='tool'&&pr.tool){ bits.push(pr.tool.what); if(pr.tool.kit) bits.push('применений: '+(e.kit==null?pr.tool.kit:e.kit)); }
  if(pr.kind==='light'){ bits.push('яркий '+pr.light.bright+' м · хватает на '+pr.light.hours+' ч'+(pr.light.fuel?' на '+pr.light.fuel:'')); }
  if(pr.kind==='ammo'){ bits.push('боеприпасы: '+ammoRemaining(e,it)); }
  if(pr.kind==='lore'&&e.read) bits.push('прочитано');
  if(pr.kind==='valuable'&&pr.value&&pr.value.gp) bits.push('оценка '+pr.value.gp+' зм');
  if(itemIsBox(it)){
    if(it.cap) bits.push('вмещает '+it.cap);

    const n=(e.inside||[]).length; bits.push(n?('внутри предметов: '+n):'внутри пусто');
  }
  return bits.filter(Boolean).join(' · ');
}

function saveSpellEd(){
  const g=id=>document.getElementById(id);
  const n=g('edSpN').value.trim(); if(!n){ alert('Заклинанию нужно имя.'); return; }
  const data={n, l:Math.max(0,Math.min(9,+g('edSpL').value||0)), s:g('edSpS').value, c:g('edSpC').value.trim(),
    t:g('edSpT').value.trim(), r:g('edSpR').value.trim(), cm:g('edSpCm').value.trim(), d:g('edSpD').value.trim(),
    ritual:g('edSpRit').checked, conc:g('edSpConc').checked, tags:pickedTags('edSpTags'), fx:parseFxLines(g('edSpFx').value),
    x:g('edSpX').value, hi:g('edSpHi').value.trim()};
  let mechanics;
  if(g('edSpCompile')&&g('edSpCompile').checked) mechanics=compileSpellMechanics(data);
  else try{ mechanics=JSON.parse(g('edSpMechanics').value); }
  catch(e){ alert('Исполняемые правила заклинания повреждены: '+e.message); return; }
  mechanics=mechanicsClone(mechanics); mechanics.origin='explicit'; mechanics.schemaVersion=GAME_MECHANICS_SCHEMA_VERSION;
  mechanics.effects=normalizeRuleEffects(data.fx);
  const errs=mechanicsErrors(mechanics,'spell'); if(errs.length){ alert('Mechanics заклинания не прошел аудит:\n'+errs.join('\n')); return; }
  data.mechanics=mechanics;
  if(editing.sp){ Object.assign(spellsDB.find(x=>x.id===editing.sp), data); }
  else spellsDB.push(Object.assign({id:'sp_'+uid(), custom:true}, data));
  editing.sp=null; fxInvalidate(); scheduleSave(); renderSpellsDB(); if(activeCharId) renderChars();
}
function delSpellDB(id){
  const sp=spellsDB.find(x=>x.id===id); if(!sp) return;
  if(!confirm('Вычеркнуть «'+sp.n+'» из гримуара мира? Оно исчезнет и из книг персонажей.')) return;
  spellsDB=spellsDB.filter(x=>x.id!==id);
  chars.forEach(c=>{ c.spellbook=(c.spellbook||[]).filter(e=>e.spellId!==id); });
  fxInvalidate(); scheduleSave(); renderSpellsDB(); if(activeCharId) renderChars();
}

function saveItemEd(){
  const g=id=>document.getElementById(id);
  const n=g('edItN').value.trim(); if(!n){ alert('Предмету нужно имя.'); return; }
  let uses,resource,profile;
  try{ uses=JSON.parse(g('edItUses').value||'[]'); if(!Array.isArray(uses)) throw new Error('нужен JSON-массив'); }
  catch(e){ alert('Структурированные применения повреждены: '+e.message); return; }
  try{ resource=JSON.parse(g('edItResource').value||'null'); if(resource!=null&&(typeof resource!=='object'||Array.isArray(resource))) throw new Error('нужен объект или null'); }
  catch(e){ alert('Ресурс предмета поврежден: '+e.message); return; }
  try{ profile=JSON.parse(g('edItProfile').value||'{}'); if(!profile||typeof profile!=='object'||Array.isArray(profile)) throw new Error('нужен JSON-объект'); }
  catch(e){ alert('Машинный профиль предмета поврежден: '+e.message); return; }
  if(!ITEM_KIND_RU[profile.kind]){ alert('В машинном профиле указан неизвестный kind: '+String(profile.kind)); return; }
  const resourceErrors=itemResourceSchemaErrors(resource);
  if(resourceErrors.length){ alert('Ресурс предмета не прошел аудит:\n'+resourceErrors.join('\n')); return; }
  const useErrors=itemUseSchemaErrors(uses,resource);
  if(useErrors.length){ alert('Структурированные применения не прошли аудит:\n'+useErrors.map(e=>'use['+e.index+']: '+e.message).join('\n')); return; }
  const useMode=g('edItMode').value,manualNote=g('edItManual').value.trim();
  if(useMode==='structured'&&!uses.length){ alert('Структурированный режим требует хотя бы одно применение.'); return; }
  if(useMode==='manual'&&!manualNote){ alert('Для ручного режима объясните, какое решение остается за мастером.'); return; }
  const data={n, type:g('edItT').value, rarity:g('edItRar').value, slot:g('edItSlot').value||null,
    weight:g('edItW').value.trim(), cost:g('edItC').value.trim(), dmg:g('edItDmg').value.trim(),
    dmgType:g('edItDT').value.trim(), ac:g('edItAC').value.trim(), desc:g('edItDesc').value,
    text:(g('edItText')?g('edItText').value:(it.text||'')),
    props:g('edItProps').value, tags:pickedTags('edItTags'), fx:[], passiveFx:parseFxLines(g('edItFx').value),
    schemaVersion:ITEM_SCHEMA_VERSION,useMode,resource,uses,manualNote};
  const mechanics=compileItemMechanics(data); mechanics.origin='explicit';
  if(!(g('edItCompileProfile')&&g('edItCompileProfile').checked)) mechanics.profile=mechanicsClone(profile);
  const finalProfile=mechanics.profile||{},flags=finalProfile.flags||{},armor=finalProfile.armor||{};
  const armorKind=finalProfile.kind==='shield'?'shield':(finalProfile.kind==='armor'?
    (armor.weight==='тяжелый'?'heavy':(armor.weight==='средний'?'medium':'light')):null);
  mechanics.equipment={slot:data.slot||null,armorKind,metal:!!flags.metal,proficiencyExempt:!!flags.proficiencyExempt};
  mechanics.actions=mechanicsClone(uses); mechanics.resource=mechanicsClone(resource); mechanics.effects=normalizeRuleEffects(data.passiveFx);
  const mechanicErrors=mechanicsErrors(mechanics,'item');
  if(mechanicErrors.length){ alert('Mechanics предмета не прошел аудит:\n'+mechanicErrors.join('\n')); return; }
  data.mechanics=mechanics;
  if(editing.it){ const it=itemsDB.find(x=>x.id===editing.it); Object.assign(it, data); upgradeItem(it); }
  else { const it=Object.assign({id:'it_'+uid(), custom:true}, data); upgradeItem(it); itemsDB.push(it); }
  editing.it=null; itemAuditView=null; scheduleSave(); renderItemsDB(); if(activeCharId) renderChars();
}
function delItemDB(id){
  const it=itemsDB.find(x=>x.id===id); if(!it) return;
  if(!confirm('Убрать «'+it.n+'» из арсенала мира? Он исчезнет и из инвентарей персонажей.')) return;
  itemsDB=itemsDB.filter(x=>x.id!==id);
  chars.forEach(c=>{
    c.inventory=(c.inventory||[]).filter(e=>e.itemId!==id);
    Object.keys(c.equipment||{}).forEach(s=>{
      const inv=(c.inventory||[]).find(e=>e.id===c.equipment[s]);
      if(!inv) delete c.equipment[s];
    });
  });
  itemAuditView=null; scheduleSave(); renderItemsDB(); if(activeCharId) renderChars();
}

/* ═══ Авторасчеты листа (передовые практики) ═══ */
function invEntry(c,id){ return (c.inventory||[]).find(e=>e.id===id); }
function acAuto(c){
  const dx=(typeof eMod==='function')?eMod(c,'dex'):mod(c.ab.dex);
  let base=10+dx, shield=0;
  const eq=c.equipment||{};
  const chestE=invEntry(c,eq.CHEST), chest=chestE?itemOf(chestE.itemId):null;
  if(chest){
    const rule=(itemProfile(chest).armor||{}).acRule;
    if(rule&&rule.base){ base=+rule.base; if(rule.dex) base+=(rule.dexCap==null?dx:Math.min(+rule.dexCap,dx)); }
  }
  const offE=invEntry(c,eq.OFF_HAND), off=offE?itemOf(offE.itemId):null;
  if(off){ const rule=(itemProfile(off).armor||{}).acRule; if(rule&&rule.shield) shield=+rule.base||2; }
  return base+shield;
}
function acBase(c){
  if(c.acOverride!=null) return c.acOverride;
  const auto=acAuto(c), magical=fxSet(c,'acbase');
  const eq=c.equipment||{}, chestE=invEntry(c,eq.CHEST), chest=chestE?itemOf(chestE.itemId):null;
  if(magical!=null&&!chest){
    const dx=eMod(c,'dex'), shield=Math.max(0,auto-(10+dx));
    return Math.max(auto,(+magical||10)+dx+shield);
  }
  return auto;
}
function acTotal(c){
  const mn=fxMin(c,'ac');
  if(mn!=null) return Math.max(mn, acBase(c)+fxSum(c,'ac')); return acBase(c)+((typeof fxSum==='function')?fxSum(c,'ac'):0); }
function setAcOverride(v){ const c=cc(); if(!c) return; const s=String(v).trim(); c.acOverride=(s===''?null:Math.max(0,parseInt(s,10)||0)); scheduleSave(); renderChars(); }
function initTotal(c){ return eMod(c,'dex')+(+c.initB||0)+fxSum(c,'init'); }
function setInitB(v){ const c=cc(); if(!c) return; c.initB=parseInt(v,10)||0; scheduleSave(); renderChars(); }
function perceptionIdx(){ return SKILLS.findIndex(s=>s[0]==='Внимательность'); }
function passivePerc(c){ const i=perceptionIdx(); return 10+(i>=0?skillBonus(c,i).v:eMod(c,'wis'))+fxSum(c,'passperc'); }
function weaponRows(c){
  const eq=c.equipment||{}, seen={}, rows=[];
  ['MAIN_HAND','TWO_HAND','OFF_HAND'].forEach(sl=>{
    const eid=eq[sl]; if(!eid||seen[eid]) return; seen[eid]=1;
    const e=invEntry(c,eid), it=e?itemOf(e.itemId):null;
    if(!it||it.type!=='weapon') return;
    const weapon=itemProfile(it).weapon||{},damage=weaponDamageOf(it);
    const useDex=weapon.ranged||(weapon.finesse&&eMod(c,'dex')>=eMod(c,'str'));
    const m=useDex?eMod(c,'dex'):eMod(c,'str');
    const hasProf=(typeof weaponProfHas==='function')?weaponProfHas(c,it):true;
    const wb=weaponBonusOf(it), duel=duelingBonusOf(c,it,{entryId:e.id});
    rows.push({n:it.n+(hasProf?'':' (без владения)'), entryId:e.id, itemId:it.id, atk:m+(hasProf?PROF[c.level]:0)+fxSum(c,'atk')+wb.atk,
      dmg:it.dmg||'', dt:it.dmgType||'',damage,m:m+(+damage.mod||0)+fxSum(c,'dmg')+wb.dmg+duel, abn:useDex?'Лов':'Сил',
      mode:weapon.ranged?'ranged':'melee', within5:(weapon.ranged||weapon.reach)?null:true,damageTags:weaponDamageTraitsOf(it)});
  });
  rows.push({n:'Безоружный удар', unarmed:true, atk:eMod(c,'str')+PROF[c.level]+fxSum(c,'atk'), dmg:'', dt:'дробящий',
    m:eMod(c,'str')+fxSum(c,'dmg'), abn:'Сил', mode:'melee', within5:true, flat:true});
  return rows;
}
function spellAbOf(c){
  if(c.spellAb) return c.spellAb;
  const meta=casterMeta(c); if(meta&&meta.ability) return meta.ability;
  const cl=c.cls||'';
  if(/Жрец|Друид|Следопыт/.test(cl)) return 'wis';
  if(/Бард|Чародей|Колдун|Паладин/.test(cl)) return 'cha';
  return 'int';
}
function setSpellAb(v){ const c=cc(); if(!c) return; c.spellAb=v; scheduleSave(); renderChars(); }
function spellDC(c){ return 8+PROF[c.level]+eMod(c,spellAbOf(c)); }
function spellAtk(c){ return PROF[c.level]+eMod(c,spellAbOf(c)); }
function carryWeight(c){
  let w=0;
  (c.inventory||[]).forEach(e=>{ const it=itemOf(e.itemId); if(!it||!it.weight) return;
    const v=parseFloat(String(it.weight).replace(',','.')); if(v) w+=v*(e.qty||1); });
  (c.inventory||[]).forEach(e=>{ if(Array.isArray(e.inside)) w+=innerWeightOf(e); });
  return Math.round(w*10)/10;
}
function spendHitDie(){
  const c=cc(); if(!c) return;
  const hd=classOf(c).hd||8;
  if(c.hdUsed>=c.level){ setStatus('Кости хитов исчерпаны — нужен долгий отдых.'); return; }
  const con=eMod(c,'con');
  askRolls({title:'⚂ Кость хитов — '+c.name, note:'Игрок бросает d'+hd+'; лечение = бросок '+(con>=0?'+ '+con:'− '+Math.abs(con))+' (Телосложение), минимум 1.',
    rows:[{key:'r',label:'d'+hd,min:1,max:hd}],
    compute:v=>'Лечение: '+v.r+(con?(con>0?' + '+con:' − '+Math.abs(con)):'')+' = +'+Math.max(1,v.r+con)+' хитов',
    apply:v=>{
      const heal=Math.max(1,v.r+con);
      c.hdUsed=(+c.hdUsed||0)+1; c.hp=Math.min((typeof eHpMax==='function')?eHpMax(c):c.hpMax,(+c.hp||0)+heal);
      diceOutSet('Кость хитов: d'+hd+' → '+v.r+(con?(con>0?' + '+con:' − '+Math.abs(con)):'')+' = +'+heal+' хитов','var(--ok)');
      scheduleSave(); renderChars();
    }});
}
function returnHitDie(){ const c=cc(); if(!c) return; c.hdUsed=Math.max(0,(+c.hdUsed||0)-1); scheduleSave(); renderChars(); }
function shortRest(){
  const c=cc(); if(!c) return;
  c.abilities.forEach(a=>{ const db=abilityOf(a.abilityId); if(db&&db.uses!=null&&db.rest==='короткий отдых') a.cur=db.uses; });
  /* Арканное восстановление волшебника: раз в день, суммарный круг ячеек до половины уровня */
  if(c.cls==='Волшебник' && !c.arcUsed && casterMeta(c)){
    let budget=Math.ceil(c.level/2);
    const lvls=Object.keys(c.slots||{}).map(Number).sort((a,b)=>a-b).filter(lv=>lv<=5);
    const miss=lvls.some(lv=>c.slots[lv].cur<c.slots[lv].max);
    if(miss && confirm('⚕ Арканное восстановление (раз в день): вернуть потраченные ячейки суммарным кругом до '+budget+' (ячейки не выше 6 круга)?')){
      const got=[];
      lvls.forEach(lv=>{ while(budget>=lv && c.slots[lv].cur<c.slots[lv].max){ c.slots[lv].cur++; budget-=lv; got.push(lv); } });
      c.arcUsed=true;
      if(got.length) setStatus('⚕ Арканное восстановление: возвращены ячейки кругов '+got.join(', ')+'.');
    }
  }

}
function upgradeChar3(c){
  if(!c) return c;
  c.cond=normalizeConditions(c.cond);
  if(!Array.isArray(c.resist)) c.resist=[];
  if(!Array.isArray(c.vuln)) c.vuln=[];
  if(!Array.isArray(c.immune)) c.immune=[];
  if(!Array.isArray(c.activeFx)) c.activeFx=[];
  c.activeFx.forEach(x=>{ if(x&&x.expiresAtRound==null&&x.untilRound!=null){ x.expiresAtRound=+x.untilRound; delete x.untilRound; } });
  upgradeActiveEffects(c);
  if(c._v3) return c;
  if(c.acOverride===undefined){
    const cur=+c.ac||0, auto=acAuto(c);
    c.acOverride=(cur&&cur!==auto&&cur!==10)?cur:null;
  }
  if(c.initB===undefined) c.initB=0;
  if(c.hdUsed===undefined) c.hdUsed=0;
  if(c.spellAb===undefined) c.spellAb='';
  if(!c.persona) c.persona={tr:'',id:'',bd:'',fl:'',ap:''};
  if(!Array.isArray(c.fxOff)) c.fxOff=[];
  if(c.spentRest===undefined) c.spentRest=0;
  if(c.arcUsed===undefined) c.arcUsed=false;
  if(c.inspiration===undefined) c.inspiration=false;
  c._v3=true; return c;
}

function setHp(v){
  const c=cc(); if(!c) return;
  const before=+c.hp||0, next=Math.max(0,Math.min(eHpMax(c),+v||0));
  c.hp=next;
  if(next<before&&typeof concDamageCheck==='function'){
    const dmg=before-next;
    if(next===0) breakConcentration(c,'герой упал до 0 хитов');
    else concDamageCheck(c,dmg);
  }
  scheduleSave(); renderChars();
}
function hpDelta(d){ const c=cc(); if(!c) return;
  const rawDmg=d<0?-d:0;
  if(d<0 && c.hpTemp>0){ const useTemp=Math.min(c.hpTemp,-d); c.hpTemp-=useTemp; d+=useTemp; }
  c.hp=Math.max(0,Math.min((typeof eHpMax==='function')?eHpMax(c):c.hpMax,(+c.hp||0)+d));
  if(rawDmg>0 && typeof concDamageCheck==='function'){
    if(c.hp<=0){ if(typeof breakConcentration==='function') breakConcentration(c,'герой упал до 0 хитов'); }
    else concDamageCheck(c, rawDmg);
  }
  scheduleSave(); renderChars(); }
function toggleInspiration(){ const c=cc(); if(!c) return; c.inspiration=!c.inspiration; scheduleSave(); renderChars(); }
function levelDown(){
  const c=cc(); if(!c||c.level<=1) return;
  if(!confirm('Откатить '+c.name+' на уровень назад ('+c.level+' → '+(c.level-1)+')? Авто-добавленные заклинания недоступных кругов уйдут из книги, ячейки пересчитаются.')) return;
  const oldLvl=c.level;
  c.level--;
  c.xp=Math.min(c.xp, XP_TABLE[c.level+1]-1);
  if(typeof autoLevelSpells==='function'){
    const r=autoLevelSpells(c, oldLvl);
    if(r.removed.length) setStatus('📖 Откат уровня: из книги ушли '+r.removed.slice(0,5).join(', ')+(r.removed.length>5?' и еще '+(r.removed.length-5):'')+'.');
  }
  if(typeof applyClassSlots==='function' && casterMeta(c)) applyClassSlots(c);

  scheduleSave(); renderChars();
}
function levelUp(){
  const c=cc(); if(!c||c.level>=20) return;
  const oldLvl=c.level;
  c.level++;
  const classRec=classOf(c),progression=classRec.mechanics&&classRec.mechanics.progression&&classRec.mechanics.progression.features;
  (progression||classRec.lv.map(x=>({level:x[0],name:x[1]}))).filter(x=>x.level===c.level).forEach(x=>{
    const fn=x.name;
    let db=abilitiesDB.find(a=>a.type==='class'&&a.source===c.cls&&a.n===fn);
    if(!db){ db={id:'ab_'+uid(), n:fn, type:'class', source:c.cls, custom:true, tags:['classfeature'], uses:null, rest:'',
      x:'Черта класса «'+c.cls+'», получена на '+c.level+' уровне. Опишите ее в своде способностей.'}; upgradeAbility(db); abilitiesDB.push(db); }
    if(!c.abilities.some(a=>a.abilityId===db.id)) c.abilities.push({abilityId:db.id, cur:null, notes:''});
  });
  if(typeof autoLevelSpells==='function'){
    const r=autoLevelSpells(c, oldLvl);
    if(r.added.length) setStatus('📖 Уровень '+c.level+': в книгу вошли заклинания '+Math.min(9,Math.ceil(c.level/2))+' круга — '+r.added.slice(0,5).join(', ')+(r.added.length>5?' и еще '+(r.added.length-5):'')+'.');
  }

  c.hpPend=true; scheduleSave(); renderChars();
}

    if(!c.abilities.some(a=>a.abilityId===db.id)) c.abilities.push({abilityId:db.id, cur:null, notes:''});

function abDelta(k,d){ const c=cc(); if(!c) return; c.ab[k]=Math.max(1,Math.min(30,(+c.ab[k]||10)+d)); scheduleSave(); renderChars(); }
function toggleSaveProf(k){ const c=cc(); if(!c) return; c.saves[k]=!c.saves[k]; scheduleSave(); renderChars(); }
function cycleSkillProf(i){ const c=cc(); if(!c) return; const n=SKILLS[i][0];
  if(!c.skills[n]) c.skills[n]={p:0,m:null};
  c.skills[n].p=(c.skills[n].p+1)%3; scheduleSave(); renderChars(); }
function editSkillBonus(i){
  const c=cc(); if(!c) return; const n=SKILLS[i][0];
  if(!c.skills[n]) c.skills[n]={p:0,m:null};
  const cur=c.skills[n].m;
  const v=prompt('Ручной бонус для «'+n+'» (оставьте пустым для автоматического расчета):', cur==null?'':cur);
  if(v===null) return;
  c.skills[n].m = v.trim()==='' ? null : (parseInt(v,10)||0);
  scheduleSave(); renderChars();
}
function skillBonus(c,i){
  const sk=SKILLS[i]; const rec=c.skills[sk[0]]||{p:0,m:null};
  const fxb=(typeof fxSkillBonus==='function')?fxSkillBonus(c,sk[0]):0;
  if(rec.m!=null) return {v:rec.m+fxb, manual:true, p:rec.p, fxb};
  return {v:eMod(c,sk[1])+rec.p*PROF[c.level]+fxb, manual:false, p:rec.p, fxb};
}
function setExhaustion(v){ const c=cc(); if(!c) return; c.exhaustion=Math.max(0,Math.min(6,+v||0)); scheduleSave(); renderChars(); }
function toggleCond(n){ const c=cc(); if(!c) return;
  const i=c.cond.indexOf(n); if(i>=0) c.cond.splice(i,1); else c.cond.push(n);
  if(i<0 && typeof ACTION_BLOCK_CONDS!=='undefined' && ACTION_BLOCK_CONDS.indexOf(n)>=0 && typeof breakConcentration==='function')
    breakConcentration(c, 'состояние «'+n+'» делает героя недееспособным');
  scheduleSave(); renderChars(); }
function deathVerdict(r){
  if(r===20) return {text:'d20 20 — герой приходит в себя с 1 хитом.', kind:'up'};
  if(r===1)  return {text:'d20 1 — засчитываются сразу ДВА провала.', kind:'f2'};
  return r>=10?{text:'d20 '+r+' — успех (нужно 10 и выше).', kind:'s'}
              :{text:'d20 '+r+' — провал (нужно 10 и выше).', kind:'f'};
}
function deathSaveRoll(){
  const c=cc(); if(!c) return;
  if((+c.hp||0)>0){ setStatus('Спасброски от смерти делаются только при 0 хитов.', true); return; }
  askRolls({title:'⚂ Спасбросок от смерти — '+c.name,
    note:'Чистый d20 без модификаторов. 10 и выше — успех, 9 и ниже — провал. Три успеха — герой стабилизирован, три провала — смерть. 20 — приходит в себя с 1 хитом, 1 — сразу два провала.',
    rows:[{key:'r', label:'d20', min:1, max:20}],
    compute:v=>deathVerdict(v.r).text,
    apply:v=>{
      const d=deathVerdict(v.r);
      c.deaths=c.deaths||{s:0,f:0};
      let out=d.text;
      if(d.kind==='up'){
        c.hp=1; c.deaths={s:0,f:0};
        c.cond=normalizeConditions(c.cond).filter(x=>x!=='Бессознательный');
        out+=' Герой в сознании.';
      } else if(d.kind==='f2') c.deaths.f=Math.min(3,(c.deaths.f||0)+2);
      else if(d.kind==='f')  c.deaths.f=Math.min(3,(c.deaths.f||0)+1);
      else                   c.deaths.s=Math.min(3,(c.deaths.s||0)+1);
      if(c.deaths.f>=3) out+=' Три провала — герой погибает.';
      else if(c.deaths.s>=3) out+=' Три успеха — герой стабилизирован (без сознания, но жив).';
      diceOutSet('Спасбросок от смерти: '+out, d.kind==='up'||d.kind==='s'?'var(--ok)':'var(--rubric)');
      setStatus('⚂ '+c.name+' — спасбросок от смерти: '+out);
      castLogLine('⚂ '+c.name+': спасбросок от смерти — '+out);
      scheduleSave(); renderChars();
    }});
}
function stabilizeChar(){
