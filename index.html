<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D&D World — Развитие персонажей</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --parch:#efe3c2; --parch-2:#e6d4a8; --parch-3:#dcc794; --sheet:#f4ead0;
  --ink:#2b1d10; --ink-soft:#5c452c; --ink-faint:#8a7250;
  --rubric:#7d1f16; --rubric-dk:#5e150e;
  --gold:#96762c; --gold-lt:#c9a84c;
  --frame:#7a5c33; --frame-dk:#513c1e;
  --wax:#8e2318; --wax-dk:#5f130c;
  --ok:#3f6b34;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --disp:'IM Fell English SC','Cormorant Garamond',Georgia,serif;
  --fell:'IM Fell English','Cormorant Garamond',Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scrollbar-color:var(--frame) var(--parch-2)}
body{
  font-family:var(--serif);font-weight:500;font-size:17px;line-height:1.45;color:var(--ink);
  background:
    radial-gradient(ellipse at 20% 10%, rgba(255,250,230,.55), transparent 55%),
    radial-gradient(ellipse at 85% 90%, rgba(120,85,40,.18), transparent 60%),
    radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0), rgba(60,40,15,.22) 140%),
    var(--parch);
  min-height:100vh;padding:14px 10px 40px;
}
::selection{background:var(--gold-lt);color:var(--ink)}
.wrap{max-width:1180px;margin:0 auto}

/* ── Шапка ── */
.masthead{
  position:relative;text-align:center;padding:26px 16px 18px;
  border:3px double var(--frame);outline:1px solid var(--frame-dk);outline-offset:4px;
  background:linear-gradient(180deg,rgba(255,248,225,.5),rgba(190,160,105,.18)),var(--parch-2);
  box-shadow:0 3px 14px rgba(60,40,10,.25), inset 0 0 60px rgba(120,85,40,.18);
  margin-bottom:18px;
}
.masthead .corner{position:absolute;font-size:22px;color:var(--gold);line-height:1}
.corner.tl{top:6px;left:10px}.corner.tr{top:6px;right:10px}
.corner.bl{bottom:6px;left:10px}.corner.br{bottom:6px;right:10px}
h1.title{
  font-family:var(--disp);font-weight:400;font-size:clamp(28px,4.6vw,46px);
  letter-spacing:.06em;color:var(--rubric);text-shadow:0 1px 0 rgba(255,245,215,.7);
}
.subtitle{font-family:var(--fell);font-style:italic;font-size:18px;color:var(--ink-soft);margin-top:2px}
.rule-flourish{display:flex;align-items:center;gap:12px;justify-content:center;margin:10px auto 0;max-width:520px;color:var(--gold)}
.rule-flourish::before,.rule-flourish::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}

/* ── Панель костей и утилит ── */
.toolrow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin-top:14px}
.dicebox{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 10px;border:1px solid var(--frame);background:rgba(255,248,225,.45)}
.dicebox .lbl{font-family:var(--disp);font-size:14px;color:var(--ink-soft);margin-right:2px}
.die{
  font-family:var(--disp);font-size:15px;min-width:44px;padding:4px 8px;cursor:pointer;
  color:var(--sheet);background:linear-gradient(180deg,#8a6a3a,#5f4520);
  border:1px solid var(--frame-dk);box-shadow:inset 0 1px 0 rgba(255,235,190,.4),0 2px 3px rgba(50,30,5,.35);
}
.die:hover{background:linear-gradient(180deg,#9b7a45,#6d5228)}
.die:active{transform:translateY(1px)}
#diceOut{font-family:var(--fell);font-style:italic;min-width:120px;color:var(--rubric);font-size:17px}
.util-btns{display:flex;gap:6px}

/* ── Навигация-закладки ── */
nav.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:0;padding:0 12px}
.tab{
  font-family:var(--disp);font-size:16px;letter-spacing:.04em;cursor:pointer;
  padding:8px 16px 10px;border:1px solid var(--frame);border-bottom:none;
  background:linear-gradient(180deg,var(--parch-2),var(--parch-3));color:var(--ink-soft);
  clip-path:polygon(6px 0,calc(100% - 6px) 0,100% 100%,0 100%);
  position:relative;top:1px;
}
.tab:hover{color:var(--rubric)}
.tab.active{
  background:linear-gradient(180deg,var(--sheet),var(--parch));color:var(--rubric);
  font-weight:400;box-shadow:0 -2px 6px rgba(90,60,20,.2);
}

/* ── Основной лист ── */
main.leaf{
  border:3px double var(--frame);
  background:
    radial-gradient(ellipse at 8% 4%, rgba(150,110,55,.10), transparent 40%),
    radial-gradient(ellipse at 94% 96%, rgba(150,110,55,.12), transparent 40%),
    linear-gradient(180deg,rgba(255,250,232,.5),rgba(205,175,120,.14)),
    var(--sheet);
  box-shadow:0 4px 18px rgba(60,40,10,.28), inset 0 0 80px rgba(130,95,45,.14);
  padding:22px 24px 30px;min-height:60vh;
}
@media(max-width:640px){main.leaf{padding:14px 10px 22px}}

/* ── Рубрики ── */
h2.rubric{
  font-family:var(--disp);font-weight:400;font-size:clamp(22px,3vw,30px);color:var(--rubric);
  display:flex;align-items:center;gap:14px;margin:4px 0 14px;
}
h2.rubric::before,h2.rubric::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
h3.sub{
  font-family:var(--disp);font-weight:400;font-size:19px;color:var(--ink);
  border-bottom:1px solid var(--gold);padding-bottom:3px;margin:18px 0 10px;letter-spacing:.03em;
}
h3.sub .fl{color:var(--gold);margin-right:6px}
.note-ital{font-family:var(--fell);font-style:italic;color:var(--ink-soft)}

/* ── Кнопки ── */
.btn{
  font-family:var(--disp);font-size:15px;letter-spacing:.03em;cursor:pointer;padding:7px 16px;
  color:var(--sheet);background:linear-gradient(180deg,#8a6a3a,#5f4520);
  border:1px solid var(--frame-dk);box-shadow:inset 0 1px 0 rgba(255,235,190,.4),0 2px 3px rgba(50,30,5,.3);
}
.btn:hover{background:linear-gradient(180deg,#9b7a45,#6d5228)}
.btn:active{transform:translateY(1px)}
.btn.rub{background:linear-gradient(180deg,#8e2c20,#63160d);border-color:#4a0f08}
.btn.rub:hover{background:linear-gradient(180deg,#a13527,#742015)}
.btn.ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--frame);box-shadow:none}
.btn.ghost:hover{color:var(--rubric);border-color:var(--rubric)}
.btn.sm{font-size:13px;padding:3px 10px}
.btn.xs{font-size:12px;padding:1px 8px}

/* ── Поля ввода ── */
input,select,textarea{
  font-family:var(--serif);font-weight:500;font-size:16px;color:var(--ink);
  background:rgba(255,251,238,.75);border:1px solid var(--frame);padding:5px 8px;
  box-shadow:inset 0 1px 3px rgba(90,60,20,.18);
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold-lt);outline-offset:1px}
input[type=number]{width:74px;text-align:center}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--rubric);box-shadow:none;cursor:pointer}
textarea{width:100%;min-height:90px;resize:vertical;line-height:1.4}
label.f{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--ink-soft)}
label.f b{font-family:var(--disp);font-weight:400;letter-spacing:.05em;font-size:12.5px;text-transform:uppercase}

/* ── Таблицы ── */
table.ms{width:100%;border-collapse:collapse;margin:8px 0 16px;font-size:15.5px}
table.ms th{
  font-family:var(--disp);font-weight:400;letter-spacing:.05em;font-size:14px;text-align:left;
  color:var(--sheet);background:linear-gradient(180deg,#7a5c33,#513c1e);padding:6px 9px;border:1px solid var(--frame-dk);
}
table.ms td{padding:5px 9px;border:1px solid rgba(122,92,51,.5);vertical-align:top}
table.ms tr:nth-child(even) td{background:rgba(160,125,70,.09)}
table.ms tr:hover td{background:rgba(150,118,44,.14)}
.table-scroll{overflow-x:auto}

/* ── Карточки ── */
.grid{display:grid;gap:12px}
.grid.c2{grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.grid.c3{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{
  border:1px solid var(--frame);background:linear-gradient(180deg,rgba(255,250,235,.6),rgba(205,175,120,.12));
  box-shadow:0 2px 6px rgba(70,45,10,.18);padding:12px 14px;position:relative;
}
.card::before{content:"";position:absolute;inset:3px;border:1px solid rgba(150,118,44,.35);pointer-events:none}
.card h4{font-family:var(--disp);font-weight:400;font-size:18px;color:var(--rubric);margin-bottom:4px}
.card .meta{font-size:13.5px;color:var(--ink-soft);font-style:italic;font-family:var(--fell)}
.card ul{margin:6px 0 0 18px;font-size:15px}
.card li{margin-bottom:2px}
.card.clickable{cursor:pointer}
.card.clickable:hover{border-color:var(--rubric);box-shadow:0 3px 10px rgba(125,31,22,.25)}

/* ── Персонажи: список ── */
.char-card{display:flex;gap:12px;align-items:center}
.sigil{
  flex:0 0 54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:var(--disp);font-size:26px;color:var(--sheet);
  background:radial-gradient(circle at 35% 30%,#b23a2b,var(--wax) 60%,var(--wax-dk));
  border:2px solid var(--wax-dk);box-shadow:0 2px 5px rgba(60,10,5,.5), inset 0 -3px 6px rgba(0,0,0,.35);
}
.char-card .cc-main{flex:1;min-width:0}
.char-card .cc-name{font-family:var(--disp);font-size:19px;color:var(--rubric)}
.char-card .cc-line{font-size:14px;color:var(--ink-soft);font-style:italic;font-family:var(--fell)}
.lvlup-badge{
  display:inline-block;font-family:var(--disp);font-size:12px;color:var(--sheet);
  background:linear-gradient(180deg,#8e2c20,#63160d);padding:1px 8px;margin-left:6px;letter-spacing:.04em;
}

/* ── Лист персонажа ── */
.sheet-head{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:14px}
.sheet-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
.panel{
  border:1px solid var(--frame);padding:12px 14px;
  background:linear-gradient(180deg,rgba(255,250,235,.55),rgba(205,175,120,.10));
  box-shadow:inset 0 0 24px rgba(140,105,50,.10);
}
.panel h3{margin-top:0}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:10px;margin:6px 0 4px}
.seal{
  text-align:center;padding:10px 4px 8px;position:relative;
  background:radial-gradient(circle at 35% 28%, #f7efd8, #e8d7ac 70%, #d8c188);
  border-radius:50% 50% 48% 52%/55% 52% 48% 45%;
  border:2px solid var(--frame);box-shadow:0 2px 5px rgba(70,45,10,.3), inset 0 -4px 8px rgba(120,85,40,.25);
}
.seal .sn{font-family:var(--disp);font-size:13px;letter-spacing:.08em;color:var(--rubric)}
.seal input{width:56px;font-size:20px;font-weight:700;text-align:center;background:transparent;border:none;box-shadow:none;padding:1px}
.seal input:focus{outline:1px dashed var(--gold)}
.seal .md{font-family:var(--fell);font-size:16px;font-style:italic;color:var(--ink-soft);border-top:1px solid var(--gold);margin:2px 10px 0;padding-top:1px}
.combat-row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.hp-btns{display:flex;gap:4px;margin-top:4px}
.prof-list{columns:2;column-gap:18px;font-size:15px}
@media(max-width:520px){.prof-list{columns:1}}
.prof-item{display:flex;align-items:baseline;gap:6px;padding:1px 0;break-inside:avoid;cursor:pointer;user-select:none}
.prof-item .dot{font-size:13px;width:15px;color:var(--ink-faint)}
.prof-item.p1 .dot{color:var(--rubric)}
.prof-item.p2 .dot{color:var(--gold)}
.prof-item .bns{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.prof-item:hover{color:var(--rubric)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  font-size:13.5px;padding:2px 10px;border:1px solid var(--frame);cursor:pointer;user-select:none;
  background:rgba(255,250,235,.5);color:var(--ink-soft);border-radius:2px;
}
.chip.on{background:linear-gradient(180deg,#8e2c20,#63160d);color:var(--sheet);border-color:var(--wax-dk)}
.row-line{display:flex;gap:6px;align-items:center;margin-bottom:5px;flex-wrap:wrap}
.row-line input.grow{flex:1;min-width:110px}
.del-x{
  cursor:pointer;color:var(--rubric);font-family:var(--disp);border:1px solid transparent;
  background:none;font-size:15px;padding:2px 6px;box-shadow:none;
}
.del-x:hover{border-color:var(--rubric)}
.spell-hit{display:flex;justify-content:space-between;gap:8px;padding:3px 6px;border-bottom:1px dashed rgba(122,92,51,.4);cursor:pointer;font-size:15px}
.spell-hit:hover{background:rgba(150,118,44,.14)}
.death-row{display:flex;gap:14px;align-items:center;font-size:14px;flex-wrap:wrap}
.gold-row{display:flex;gap:8px;flex-wrap:wrap}
.gold-row label.f{align-items:center}
.gold-row input{width:64px}
.save-status{font-family:var(--fell);font-style:italic;font-size:14px;color:var(--ok);min-height:18px;text-align:right}

/* ── Фильтры заклинаний ── */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-bottom:10px}
.school-tag{font-size:12.5px;color:var(--sheet);background:var(--gold);padding:0 7px;font-family:var(--disp);letter-spacing:.03em;white-space:nowrap}

/* ── Развороты классов ── */
details.classfold{border:1px solid var(--frame);margin-bottom:10px;background:linear-gradient(180deg,rgba(255,250,235,.55),rgba(205,175,120,.10))}
details.classfold summary{
  font-family:var(--disp);font-size:19px;color:var(--rubric);cursor:pointer;padding:9px 14px;list-style:none;
  display:flex;align-items:center;gap:10px;
}
details.classfold summary::before{content:"❧";color:var(--gold);transition:transform .2s}
details.classfold[open] summary::before{transform:rotate(90deg)}
details.classfold summary .hint{font-family:var(--fell);font-style:italic;font-size:14px;color:var(--ink-soft);font-weight:400;margin-left:auto}
details.classfold .fold-body{padding:4px 16px 14px;border-top:1px dashed rgba(122,92,51,.5)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:700px){.two-col{grid-template-columns:1fr}}
.lv-feats{columns:2;column-gap:20px;font-size:14.5px}
@media(max-width:700px){.lv-feats{columns:1}}
.lv-feats div{break-inside:avoid;padding:1px 0}
.lv-feats b{color:var(--rubric);font-variant-numeric:tabular-nums}

/* ── Журнал ── */
.journal-entry{margin-bottom:14px}
.journal-entry textarea{min-height:70px}

.empty-scroll{
  text-align:center;padding:40px 20px;color:var(--ink-soft);font-family:var(--fell);font-style:italic;font-size:18px;
}
.empty-scroll .big{font-size:40px;color:var(--gold);display:block;margin-bottom:8px;font-style:normal}
footer.colophon{text-align:center;margin-top:18px;font-family:var(--fell);font-style:italic;color:var(--ink-faint);font-size:14px}
.hidden{display:none!important}
@media print{.tabs,.toolrow,.btn,.masthead{display:none}}

/* ═══════════ НОВОЕ: единая книга мастера (интеграция «D&D Нексус») ═══════════ */

/* Цветные ярлыки-печати (теги) */
.tagrow{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.wax-tag{display:inline-block;padding:1px 9px 2px;font-size:12.5px;line-height:1.35;border-radius:3px;
  font-family:var(--serif);font-weight:700;letter-spacing:.02em;color:#fff8ea;
  border:1px solid rgba(40,25,5,.45);box-shadow:inset 0 0 6px rgba(0,0,0,.28),0 1px 2px rgba(60,40,10,.3);
  text-shadow:0 1px 1px rgba(0,0,0,.4)}
.type-tag{display:inline-block;padding:1px 8px;font-size:12px;border:1px solid var(--frame);border-radius:3px;
  background:var(--parch-3);color:var(--ink-soft);font-style:italic}

/* Подвкладки листа персонажа */
.subtabs{display:flex;flex-wrap:wrap;gap:0;border:2px solid var(--frame);background:var(--parch-2);margin:14px 0 12px;
  box-shadow:0 2px 8px rgba(60,40,10,.18)}
.subtab{flex:1 1 auto;min-width:110px;padding:9px 10px;font-family:var(--disp);font-size:16px;letter-spacing:.04em;
  background:transparent;border:none;border-right:1px solid var(--frame);color:var(--ink-soft);cursor:pointer}
.subtab:last-child{border-right:none}
.subtab:hover{background:rgba(150,118,44,.14)}
.subtab.active{background:var(--rubric);color:var(--parch);text-shadow:0 1px 1px rgba(0,0,0,.35)}

/* Карточки характеристик */
.ab-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:8px 0 14px}
@media(max-width:860px){.ab-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:480px){.ab-grid{grid-template-columns:repeat(2,1fr)}}
.ab-card{border:2px solid var(--frame);background:linear-gradient(180deg,rgba(255,248,225,.5),rgba(190,160,105,.14)),var(--sheet);
  text-align:center;padding:8px 6px 7px;box-shadow:inset 0 0 14px rgba(120,85,40,.14)}
.ab-card .abn{font-family:var(--disp);font-size:14px;color:var(--rubric);letter-spacing:.05em}
.ab-card .abv{font-family:var(--disp);font-size:30px;line-height:1.05;color:var(--ink)}
.ab-card .abm{font-family:var(--fell);font-style:italic;font-size:16px;color:var(--gold)}
.ab-card .mini{display:flex;gap:4px;justify-content:center;margin-top:4px}
.mini-btn{width:24px;height:22px;border:1px solid var(--frame);background:var(--parch-2);cursor:pointer;
  font-size:13px;line-height:1;color:var(--ink-soft)}
.mini-btn:hover{background:var(--gold-lt);color:var(--ink)}

/* Спасброски и навыки */
.save-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
@media(max-width:720px){.save-grid{grid-template-columns:repeat(2,1fr)}}
.save-pill{display:flex;align-items:center;gap:8px;border:1px solid var(--frame);background:var(--sheet);
  padding:6px 10px;cursor:pointer}
.save-pill:hover{background:var(--parch-2)}
.skill-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
@media(max-width:760px){.skill-grid{grid-template-columns:1fr}}
.skill-row{display:flex;align-items:center;gap:8px;border:1px solid var(--frame);background:var(--sheet);padding:5px 10px}
.skill-row.trained{background:linear-gradient(180deg,rgba(150,118,44,.16),rgba(150,118,44,.06)),var(--sheet)}
.skill-row .sk-ab{font-size:12px;color:var(--ink-faint);font-style:italic}
.pip{width:15px;height:15px;border:1.5px solid var(--frame-dk);border-radius:50%;flex:none;cursor:pointer;background:var(--parch)}
.pip.p1{background:var(--gold)}
.pip.p2{background:var(--rubric);box-shadow:0 0 0 2px var(--gold-lt) inset}
.bonus-btn{margin-left:auto;font-family:var(--disp);font-size:17px;color:var(--ink);background:none;border:none;
  cursor:pointer;padding:0 2px;min-width:44px;text-align:right}
.bonus-btn:hover{color:var(--rubric)}
.bonus-btn .manual-star{color:var(--rubric);font-size:14px;vertical-align:super}

/* Истощение */
.exh-row{display:flex;align-items:center;gap:10px;border:1px solid var(--frame);background:var(--parch-2);
  padding:8px 12px;margin-top:14px}
.exh-row input[type=range]{flex:1;accent-color:var(--rubric)}

/* Карточки предметов / заклинаний / способностей */
.entry-card{border:2px solid var(--frame);background:linear-gradient(180deg,rgba(255,250,232,.55),rgba(200,170,110,.10)),var(--sheet);
  box-shadow:0 2px 8px rgba(60,40,10,.15), inset 0 0 24px rgba(120,85,40,.08);
  padding:11px 14px;margin-bottom:11px;position:relative}
.entry-card h4{font-family:var(--disp);font-weight:400;font-size:20px;color:var(--rubric);letter-spacing:.03em;display:inline}
.entry-head{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:5px}
.entry-head .spacer{flex:1}
.entry-desc{white-space:pre-wrap;font-size:15.5px;margin:5px 0}
.entry-desc.clamp{max-height:110px;overflow:hidden;position:relative}
.entry-desc.clamp::after{content:"";position:absolute;left:0;right:0;bottom:0;height:36px;
  background:linear-gradient(180deg,transparent,var(--sheet))}
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px 18px;font-size:14.5px;margin:4px 0}
@media(max-width:640px){.meta-grid{grid-template-columns:1fr}}
.meta-grid b{color:var(--ink-soft);font-weight:600}
.stat-line{font-size:14.5px;color:var(--ink-soft)}
.stat-line .dmg{color:var(--rubric);font-weight:700}
.props-block{border-top:1px dashed var(--frame);margin-top:6px;padding-top:5px;font-size:14.5px}
.props-block .pt{font-family:var(--fell);font-style:italic;color:var(--gold);font-size:14px}
.qty-box{display:flex;align-items:center;gap:4px}
.qty-box b{min-width:22px;text-align:center;font-family:var(--disp);font-size:17px}
.toggle-link{background:none;border:none;color:var(--gold);font-family:var(--fell);font-style:italic;
  font-size:14px;cursor:pointer;padding:0}
.toggle-link:hover{color:var(--rubric)}

/* Панель управления базой */
.db-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.db-bar input[type=text],.db-bar select{padding:6px 9px;border:1px solid var(--frame);background:var(--sheet);
  font-family:var(--serif);font-size:15px;color:var(--ink)}
.db-bar input[type=text]{flex:1;min-width:160px}

/* Редактор записи */
.editor{border:2px double var(--rubric);background:linear-gradient(180deg,rgba(255,248,225,.6),rgba(190,160,105,.16)),var(--parch-2);
  padding:14px;margin-bottom:14px;box-shadow:0 3px 12px rgba(60,40,10,.25)}
.editor h3{font-family:var(--disp);color:var(--rubric);font-weight:400;margin-bottom:8px}
.f-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-bottom:8px}
.f-grid label,.editor label{display:block;font-size:13px;color:var(--ink-soft);font-style:italic}
.editor input[type=text],.editor input[type=number],.editor select,.editor textarea{width:100%;padding:6px 8px;
  border:1px solid var(--frame);background:var(--sheet);font-family:var(--serif);font-size:15px;color:var(--ink)}
.editor textarea{min-height:90px;resize:vertical}
.tag-picker{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 10px}
.tag-picker .wax-tag{cursor:pointer;opacity:.42;filter:saturate(.55)}
.tag-picker .wax-tag.on{opacity:1;filter:none;outline:2px solid var(--gold-lt)}

/* Экипировка: манекен */
.mannequin{position:relative;max-width:560px;margin:0 auto;min-height:560px;
  border:2px solid var(--frame);background:
   radial-gradient(ellipse at 50% 42%, rgba(150,118,44,.13), transparent 62%),
   linear-gradient(180deg,rgba(255,248,225,.4),rgba(190,160,105,.12)),var(--parch-2);
  box-shadow:inset 0 0 40px rgba(120,85,40,.18)}
.mannequin::before{content:"⚜";position:absolute;top:46%;left:50%;transform:translate(-50%,-50%);
  font-size:150px;color:rgba(122,92,51,.14);pointer-events:none}
.slot-cell{position:absolute;width:96px;min-height:74px;border:1.5px solid var(--frame);background:var(--sheet);
  box-shadow:0 2px 6px rgba(60,40,10,.2);cursor:pointer;padding:6px 5px;text-align:center;font-size:12px;color:var(--ink-soft)}
.slot-cell:hover{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-lt)}
.slot-cell.filled{border-color:var(--gold);background:linear-gradient(180deg,rgba(201,168,76,.22),rgba(201,168,76,.06)),var(--sheet)}
.slot-cell.sel{outline:2px solid var(--rubric)}
.slot-cell .sic{font-size:19px;line-height:1.1;color:var(--gold)}
.slot-cell .sname{font-family:var(--disp);font-size:12px;letter-spacing:.03em;color:var(--ink-soft)}
.slot-cell .sitem{font-weight:700;font-size:12.5px;color:var(--rubric);margin-top:2px;word-break:break-word}
.slot-pick{max-width:560px;margin:10px auto 0}
@media(max-width:640px){
  .mannequin{transform:scale(.82);transform-origin:top center;margin-bottom:-90px}
}

/* Ячейки заклинаний */
.slots-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.slot-lv{border:1px solid var(--frame);background:var(--parch-2);padding:6px 10px;display:flex;align-items:center;gap:7px}
.slot-lv .lvt{font-family:var(--disp);font-size:14px;color:var(--rubric)}
.slot-gem{cursor:pointer;font-size:17px;color:var(--gold);background:none;border:none;padding:0 1px;line-height:1}
.slot-gem.spent{color:var(--ink-faint)}

/* Использования способностей */
.uses-box{display:flex;align-items:center;gap:5px;font-size:14px;color:var(--ink-soft)}

/* Валюта */
.coin-row{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 14px}
.coin{display:flex;align-items:center;gap:6px;border:1px solid var(--frame);background:var(--sheet);padding:5px 9px}
.coin b{font-family:var(--disp);font-size:14px;color:var(--gold)}
.coin input{width:70px;padding:4px 6px;border:1px solid var(--frame);background:var(--parch);
  font-family:var(--serif);font-size:15px;color:var(--ink);text-align:right}

/* Результат нестандартного броска */
.dice-note{width:88px;padding:5px 7px;border:1px solid var(--frame);background:var(--sheet);
  font-family:var(--serif);font-size:14px;color:var(--ink)}

/* Шапка листа: боевые показатели */
.combat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px;margin:10px 0 4px}
.cbox{border:2px solid var(--frame);background:var(--sheet);text-align:center;padding:7px 6px;
  box-shadow:inset 0 0 12px rgba(120,85,40,.12)}
.cbox .cl{font-family:var(--disp);font-size:12.5px;letter-spacing:.05em;color:var(--rubric)}
.cbox .cv{font-family:var(--disp);font-size:24px;color:var(--ink)}
.cbox input{width:60px;text-align:center;border:1px solid var(--frame);background:var(--parch);
  font-family:var(--disp);font-size:20px;color:var(--ink);padding:2px}
.hp-wide{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.prep-btn{font-size:13px;padding:3px 10px}
.prep-btn.on{background:var(--ok);color:var(--parch);border-color:var(--ok)}

/* ─── облачная синхронизация ─── */
.sync-overlay{position:fixed;inset:0;background:rgba(30,22,12,.55);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.sync-box{background:var(--parch);border:2px solid var(--frame-dk);box-shadow:0 12px 40px rgba(0,0,0,.45), inset 0 0 0 1px var(--gold-lt);max-width:560px;width:100%;padding:22px 26px;max-height:92vh;overflow:auto}
.sync-head{font-family:var(--disp);font-size:1.35rem;color:var(--rubric);letter-spacing:.04em;margin-bottom:4px}
.sync-sub{font-style:italic;color:var(--ink-soft);margin-bottom:14px;font-size:.95rem}
.sync-lbl{display:block;font-family:var(--fell);font-size:.8rem;letter-spacing:.06em;color:var(--ink-soft);margin:10px 0 3px}
.sync-inp{width:100%;box-sizing:border-box;font-family:var(--serif);font-size:.95rem;color:var(--ink);background:var(--sheet);border:1px solid var(--frame);padding:7px 10px}
.sync-inp:focus{outline:none;border-color:var(--rubric)}
.sync-btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.sync-status{margin-top:10px;font-style:italic;font-size:.9rem;color:var(--ink-soft);min-height:1.2em}
.sync-status.ok{color:var(--ok)}
.sync-status.err{color:var(--rubric)}
.sync-help{margin-top:14px;border-top:1px dashed var(--frame);padding-top:10px;font-size:.92rem}
.sync-help summary{cursor:pointer;font-family:var(--fell);letter-spacing:.04em;color:var(--ink-soft)}
.sync-help ol{margin:10px 0 0 18px;padding:0}
.sync-help li{margin-bottom:7px;line-height:1.45}
.sync-help code{background:var(--sheet);border:1px solid var(--frame);padding:1px 5px;font-size:.85em;word-break:break-all}
.sync-note{margin-top:10px;font-style:italic;color:var(--rubric);font-size:.88rem}
#cloudBtn.cloud-on{color:var(--ok);border-color:var(--ok)}
.db-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card-tools{float:right;display:flex;gap:4px}
.fold-tools{float:right;display:flex;gap:4px;margin-left:8px}
.mini{background:transparent;border:1px solid var(--frame);color:var(--ink-soft);cursor:pointer;font-size:.8rem;line-height:1;padding:3px 6px}
.mini:hover{color:var(--rubric);border-color:var(--rubric)}
.chk-row{display:flex;gap:12px;flex-wrap:wrap;margin:4px 0 8px}
.chk{font-size:.9rem;color:var(--ink-soft);white-space:nowrap}
/* ─── профессиональный лист ─── */
.cb-sub{font-size:12px;color:var(--ink-faint);margin-top:3px;display:flex;align-items:center;gap:4px;justify-content:center;flex-wrap:wrap}
.cb-sub .ovr{width:52px;font-size:12px;padding:1px 4px;text-align:center}
.cv.roll,.abm.roll{background:transparent;border:1px dashed var(--frame);cursor:pointer;font-family:var(--disp)}
.cv.roll:hover,.abm.roll:hover{border-color:var(--rubric);color:var(--rubric)}
.roll-sm{background:transparent;border:1px solid var(--frame);color:var(--ink);cursor:pointer;font-size:13px;padding:2px 8px;font-family:var(--serif);white-space:nowrap}
.roll-sm:hover{border-color:var(--rubric);color:var(--rubric)}
.atk-list{display:flex;flex-direction:column;gap:6px;margin:6px 0}
.atk-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--sheet);border:1px solid var(--frame);padding:6px 10px}
.atk-n{font-family:var(--disp);font-size:16px}
.atk-ab{font-size:12px;color:var(--ink-faint);border:1px solid var(--frame);padding:0 6px;border-radius:3px}
.atk-dt{font-size:12.5px;font-style:italic;color:var(--ink-soft);margin-left:auto}
.spell-stats{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--sheet);border:1px dashed var(--frame);padding:7px 10px;margin:8px 0}
.sp-stat b{font-family:var(--disp);font-size:18px;color:var(--rubric)}
.persona-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin:6px 0 12px}
.persona-grid textarea{width:100%;box-sizing:border-box}
.load-row{margin:6px 0 10px;font-size:14.5px;color:var(--ink-soft)}
.load-row.over{color:var(--rubric);font-weight:700}
#advBtn.adv-1{color:var(--ok);border-color:var(--ok)}
#advBtn.adv-2{color:var(--rubric);border-color:var(--rubric)}
/* ─── эффекты ─── */
.fx-line{font-size:12.5px;margin-top:3px;font-style:italic;text-align:center}
.fx-plus{color:var(--ok)}
.fx-minus{color:var(--rubric)}
.fx-note{color:#5e35b1;font-style:italic}
.fx-badge{font-size:12px;font-weight:700;border:1px dashed currentColor;border-radius:3px;padding:0 5px;margin-left:6px;white-space:nowrap}
.fx-panel{display:flex;flex-direction:column;gap:6px;margin:6px 0 4px}
.fx-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;background:var(--sheet);border-left:3px solid #5e35b1;border-top:1px solid var(--frame);border-right:1px solid var(--frame);border-bottom:1px solid var(--frame);padding:6px 10px}
.fx-src{font-family:var(--disp);font-size:15.5px}
.fx-why{font-size:12px;color:var(--ink-faint);font-style:italic}
.fx-items{display:flex;gap:8px;flex-wrap:wrap;font-size:13.5px}
.fx-sep{color:var(--ink-faint)}
.fx-cast{color:#5e35b1;border-color:#5e35b1}
.fx-cast.on{background:#5e35b1;color:#fff8ea}
.fx-cast:hover{color:var(--rubric);border-color:var(--rubric)}
.fx-off{opacity:.5;border-left-color:var(--ink-faint)}
/* ─── окно наложения заклинаний ─── */
.cast-back{position:fixed;inset:0;background:rgba(30,20,8,.55);display:flex;align-items:center;justify-content:center;z-index:60}
.cast-modal{background:var(--sheet,#f5ecd7);border:2px solid var(--frame);box-shadow:0 12px 40px rgba(0,0,0,.35);padding:18px 20px;max-width:460px;width:92%;font-family:var(--serif)}
.cast-modal h3{font-family:var(--disp)}
.cast-info{font-size:13.5px;font-style:italic;color:var(--ink-soft);margin:0 0 10px;border-bottom:1px dashed var(--frame);padding-bottom:8px}
.cast-modal select{font-family:var(--serif);font-size:15px;padding:4px 6px}
.inv-note{font-size:13px;font-style:italic;color:#5e35b1;margin:-6px 0 8px;padding:3px 10px;border-left:3px solid #5e35b1;background:var(--sheet)}
.cast-err{color:var(--rubric);font-weight:700;font-size:14px;margin-top:10px;border:1px dashed var(--rubric);padding:6px 10px;background:var(--sheet)}
/* ─── сводка кругов заклинаний ─── */
.spell-dash{border:1px solid var(--frame);border-left:3px solid var(--rubric);background:var(--sheet);padding:8px 12px;margin:8px 0;font-size:14px}
.sd-slots{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.sd-circle{display:inline-flex;align-items:center;gap:5px;font-family:var(--serif)}
.sd-circle b{font-family:var(--disp)}
.sd-empty{color:var(--rubric)}
.pip-slot{width:11px;height:11px;border:1.5px solid var(--ink-soft);border-radius:50%;display:inline-block}
.pip-slot.on{background:var(--rubric);border-color:var(--rubric)}
.sd-line{margin:3px 0;color:var(--ink-soft)}
.sd-line b{color:var(--ink)}
.sd-over{color:var(--rubric)}
.sd-hot{color:var(--rubric);font-weight:600}
.conc-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--sheet);border:1px solid #5e35b1;border-left:4px solid #5e35b1;padding:7px 10px;margin:6px 0;font-size:14.5px}
.conc-row b{color:#5e35b1}
.fx-clock{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 10px;padding:6px 9px;border:1px dashed var(--frame);background:rgba(255,250,235,.45);font-size:13.5px}
.fx-time{display:inline-block;padding:1px 7px;border:1px solid var(--gold);color:var(--ink-soft);background:var(--sheet);white-space:nowrap}
.fx-expired{color:var(--rubric);font-weight:700}
.fx-stacked{opacity:.62}
/* ─── ввод бросков ─── */
.roll-row{display:flex;align-items:center;gap:10px;margin:7px 0;flex-wrap:wrap}
.roll-row label{font-family:var(--disp);font-size:15px;min-width:150px}
.roll-row input{width:84px;font-size:16px;padding:4px 6px;text-align:center}
.roll-row .sub{font-size:12.5px;color:var(--ink-faint);font-style:italic}
.roll-live{margin-top:10px;padding:7px 10px;border:1px dashed var(--frame);background:var(--sheet);font-size:15px;font-weight:600}
.formula-row{display:flex;align-items:center;gap:8px;margin:8px 0;flex-wrap:wrap;font-size:15px}
.formula-row input{width:84px;font-size:16px;padding:4px 6px;text-align:center}
.formula-part{font-family:var(--disp)}

</style>
</head>
<body>
<div class="wrap">
<header class="masthead">
  <span class="corner tl">✠</span><span class="corner tr">✠</span>
  <span class="corner bl">✠</span><span class="corner br">✠</span>
  <h1 class="title">D&amp;D World</h1>
  <div class="subtitle">Летопись развития персонажей · настольная книга гейм-мастера · единое издание с «D&amp;D Нексус»</div>
  <div class="rule-flourish">❦</div>
  <div class="toolrow">
    <div class="dicebox">
      <span class="lbl">Кости:</span>
      <button class="die" onclick="roll(4)">d4</button>
      <button class="die" onclick="roll(6)">d6</button>
      <button class="die" onclick="roll(8)">d8</button>
      <button class="die" onclick="roll(10)">d10</button>
      <button class="die" onclick="roll(12)">d12</button>
      <button class="die" onclick="roll(20)">d20</button>
      <button class="die" onclick="roll(100)">d100</button>
      <input class="dice-note" id="diceNote" placeholder="2d6+3" onkeydown="if(event.key==='Enter')rollNotation()">
      <button class="die" onclick="rollNotation()">⚁ бросить</button>
      <button class="btn ghost sm adv-0" id="advBtn" title="Преимущество/помеха для бросков d20 с листа" onclick="cycleAdv()">⚖ обычный</button>
      <span id="diceOut">—</span>
    </div>
    <div class="util-btns">
      <button class="btn ghost sm" id="cloudBtn" onclick="openSyncModal()">☁ Облако</button>
      <button class="btn ghost sm" onclick="doExport()">Выгрузить летопись</button>
      <button class="btn ghost sm" onclick="document.getElementById('impFile').click()">Загрузить летопись</button>
      <input type="file" id="impFile" accept=".json" class="hidden" onchange="doImport(this)">
    </div>
  </div>
</header>

<nav class="tabs" id="tabsNav">
  <button class="tab active" data-tab="chars" onclick="switchTab('chars')">Персонажи</button>
  <button class="tab" data-tab="races" onclick="switchTab('races')">Расы</button>
  <button class="tab" data-tab="classes" onclick="switchTab('classes')">Классы</button>
  <button class="tab" data-tab="spellsdb" onclick="switchTab('spellsdb')">Заклинания</button>
  <button class="tab" data-tab="itemsdb" onclick="switchTab('itemsdb')">Предметы</button>
  <button class="tab" data-tab="abilitiesdb" onclick="switchTab('abilitiesdb')">Способности</button>
  <button class="tab" data-tab="foes" onclick="switchTab('foes')">Противники</button>
  <button class="tab" data-tab="rules" onclick="switchTab('rules')">Справочник</button>
  <button class="tab" data-tab="journal" onclick="switchTab('journal')">Журнал</button>
</nav>

<main class="leaf">
  <div class="save-status" id="saveStatus"></div>
  <div id="tab-chars"></div>
  <div id="tab-races" class="hidden"></div>
  <div id="tab-classes" class="hidden"></div>
  <div id="tab-spellsdb" class="hidden"></div>
  <div id="tab-itemsdb" class="hidden"></div>
  <div id="tab-abilitiesdb" class="hidden"></div>
  <div id="tab-foes" class="hidden"></div>
  <div id="tab-rules" class="hidden"></div>
  <div id="tab-journal" class="hidden"></div>
</main>

<footer class="colophon">Писано рукою мастера · все в сей книге правится вручную и хранится меж сессиями ❦</footer>
</div>

<!-- выбор цели наложения заклинания -->
<div id="castBack" class="cast-back" style="display:none" onclick="if(event.target===this)closeCastModal()">
  <div class="cast-modal">
    <h3 id="castTitle" style="margin:0 0 6px">⚡ Наложить заклинание</h3>
    <div id="castInfo" class="cast-info"></div>
    <div id="castStep1">
      <div id="castSlotWrap" style="display:none;margin-bottom:8px">
        <label class="lbl">Какой ячейкой наложить</label>
        <select id="castSlot" style="width:100%" onchange="castSlotChanged()"></select>
        <div id="castSlotHi" class="note-ital" style="font-size:12.5px;display:none;margin-top:3px"></div>
      </div>
      <label class="lbl">На кого или на что наложить</label>
      <select id="castTarget" onchange="castTargetChanged()" style="width:100%"></select>
      <div id="castMultiWrap" style="display:none;margin-top:8px">
        <label class="lbl" id="castMultiLabel">Дополнительные союзные цели</label>
        <div id="castMultiTargets" class="chips"></div>
      </div>
      <div id="castWeaponWrap" style="display:none;margin-top:8px">
        <label class="lbl">Оружие, которым идет прием</label>
        <select id="castWeapon" style="width:100%"></select>
      </div>
      <div id="castItemWrap" style="display:none;margin-top:8px">
        <label class="lbl">Предмет инвентаря заклинателя</label>
        <select id="castItem" style="width:100%"></select>
      </div>
      <div class="row-line" style="margin-top:14px">
        <button class="btn rub" onclick="castConfirm()">⚡ Наложить</button>
        <button class="btn ghost" onclick="closeCastModal()">Отмена</button>
      </div>
    </div>
    <div id="castStep3" style="display:none">
      <div id="castFormula"></div>
      <div class="row-line" style="margin-top:14px">
        <button class="btn rub" onclick="castFormulaConfirm()">Применить итог</button>
        <button class="btn ghost" onclick="castFormulaBack()">← Назад</button>
        <button class="btn ghost" onclick="closeCastModal()">Отмена</button>
      </div>
    </div>
    <div id="castStep2" style="display:none">
      <div id="castMatDesc" class="cast-info" style="border:none;padding:0"></div>
      <label class="lbl">Материальный компонент — предмет из инвентаря</label>
      <select id="castMat" style="width:100%"></select>
      <div class="row-line" style="margin-top:8px;align-items:center">
        <label class="lbl" style="margin:0">Списать, шт.:</label>
        <input id="castMatQty" type="number" min="0" style="width:74px">
        <span class="note-ital" id="castMatAuto" style="font-size:12.5px"></span>
      </div>

   облачные данные могут быть созданы любой версией сайта. */
const CONDITION_ALIASES={'Без сознания':'Бессознательный'};
function canonicalCondition(v){
  const n=String(v||'').trim();
  const aliased=CONDITION_ALIASES[n]||(n.toLowerCase()==='без сознания'?'Бессознательный':n);
  const known=CONDITIONS.find(x=>x.n.toLowerCase()===aliased.toLowerCase());
  return known?known.n:aliased;
}
function normalizeConditions(list){
  const out=[];
  (Array.isArray(list)?list:[]).forEach(v=>{
    const n=canonicalCondition(v);
    if(n&&out.indexOf(n)<0) out.push(n);
  });
  return out;
}

function tagChips(ids, dict){
  if(!ids || !ids.length) return '';
  return '<span class="tagrow">'+ids.map(t=>{
    const d=dict[t]; if(!d) return '';
    return '<span class="wax-tag" style="background:'+d.c+'">'+esc(d.ru)+'</span>';
  }).join('')+'</span>';
}
function tagPicker(dict, selected, boxId){
  return '<div class="tag-picker" id="'+boxId+'">'+Object.keys(dict).map(k=>
    '<span class="wax-tag'+(selected.includes(k)?' on':'')+'" data-tag="'+k+'" style="background:'+dict[k].c+'" onclick="this.classList.toggle(\'on\')">'+esc(dict[k].ru)+'</span>'
  ).join('')+'</div>';
}
function pickedTags(boxId){
  return Array.from(document.querySelectorAll('#'+boxId+' .wax-tag.on')).map(e=>e.dataset.tag);
}

/* какие предметные слоты подходят к ячейке манекена */
function slotAccepts(cellId, itemSlot){
  if(!itemSlot) return false;
  if(cellId==='MAIN_HAND') return itemSlot==='MAIN_HAND'||itemSlot==='TWO_HAND';
  if(cellId==='OFF_HAND')  return itemSlot==='OFF_HAND'||itemSlot==='MAIN_HAND';
  if(cellId==='RING_L'||cellId==='RING_R') return itemSlot==='RING';
  return itemSlot===cellId;
}

/* ═══════════════ ЗАСЕВ БАЗ: справочники старой летописи + перенос ═══════════════ */
function slugify(n){ return n.toLowerCase().replace(/[^a-zа-яе0-9]+/g,'_').replace(/^_+|_+$/g,''); }

function weaponAutoTags(w){
  const t=[];
  if(/дальнобойное/i.test(w.g)) t.push('ranged'); else t.push('melee');
  if(/рубящий/.test(w.dmg)) t.push('slashing');
  if(/колющий/.test(w.dmg)) t.push('piercing');
  if(/дробящий/.test(w.dmg)) t.push('bludgeoning');
  const p=w.p||'';
  if(/[Лл]егкое/.test(p)) t.push('light');
  if(/[Тт]яжелое/.test(p)) t.push('heavy');
  if(/[Фф]ехтовальное/.test(p)) t.push('finesse');
  if(/[Дд]вуручное/.test(p)) t.push('twohanded');
  if(/[Уу]ниверсальное/.test(p)) t.push('versatile');
  if(/[Мм]етательное/.test(p)) t.push('thrown');
  if(/[Бб]оеприпасы/.test(p)) t.push('ammunition');
  return t;
}
function armorAutoTags(a){
  if(a.g==='Щит') return ['shield'];
  if(/Легкий/.test(a.g)) return ['lightarmor'];
  if(/Средний/.test(a.g)) return ['mediumarmor'];
  return ['heavyarmor'];
}
function gearAutoTags(n){
  const t=[];
  if(/зелье|противоядие/i.test(n)) t.push('potion','consumable');
  if(/инструмент/i.test(n)) t.push('tool');
  if(/стрелы|болты|пули/i.test(n)) t.push('ammunition');
  if(/мешоч|сундук|рюкзак|фляга|бурдюк/i.test(n)) t.push('container');
  if(/свиток/i.test(n)) t.push('scroll');
  return t;
}

    out.push({id:'it_'+slugify(g[0]), n:g[0], type:'equipment', rarity:'обычный', custom:false,
      tags:gearAutoTags(g[0]), slot:null, weight:g[2]||'', cost:g[1]||'', dmg:'', dmgType:'',
      desc:'', props:''});
  });
  /* предметы Року поверх справочника (совпадение имен допустимо — у Року свои версии) */
  ROKU_ITEMS.forEach(it=>{
    const clash=out.findIndex(o=>o.n===it.n && o.type===it.type);
    if(clash>=0) out.splice(clash,1);
    out.push(Object.assign({},it));
  });
  out.forEach(o=>{ o.tags=uniqTags((o.tags||[]).concat(itemEnrichTags(o))); });
  return out;
}
/* заклинания старой летописи, вытесненные версиями из «D&D Нексус» */
const SUPERSEDED_SPELLS = ['Волшебная рука','Огненный снаряд','Луч холода','Волшебная стрела','Сон','Паутина'];
function spellAutoTags(sp){
  const t=[];
  if(sp.l===0) t.push('cantrip');
  if(/ритуал/i.test(sp.t)) t.push('ritual');
  if(/Концентрация/i.test(sp.d)) t.push('concentration');
  if(/бонусное действие/i.test(sp.t)) t.push('bonusaction');
  if(/реакция/i.test(sp.t)) t.push('reaction');
  if(/лечит|исцел|восстанавливает.*хит/i.test(sp.x)) t.push('healing');
  if(/урон/i.test(sp.x)) t.push('damage');
  return t;
}
function seedSpellsDB(){
  const out=[];
  SPELLS.forEach(sp=>{
    if(SUPERSEDED_SPELLS.includes(sp.n)) return;
    out.push({id:'sp_'+slugify(sp.n), n:sp.n, l:sp.l, s:sp.s, c:sp.c, t:sp.t, r:sp.r, cm:sp.cm, d:sp.d,
      ritual:/ритуал/i.test(sp.t), conc:/Концентрация/i.test(sp.d), custom:false, tags:spellAutoTags(sp), x:sp.x, hi:''});
  });
  ROKU_SPELLS.forEach(sp=>out.push(Object.assign({},sp)));
  out.forEach(o=>{ o.tags=uniqTags((o.tags||[]).concat(spellEnrichTags(o))); });
  return out;
}
function seedAbilitiesDB(){
  const out=[];
  /* расовые черты из справочника народов */
  RACES_SEED.forEach(r=>{
    r.tr.forEach(tr=>{
      const name=tr.split(':')[0].trim();
      out.push({id:'ab_'+slugify(r.n+'_'+name), n:name+' ('+r.n+')', type:'racial', source:r.n, custom:false,
        tags:['racial','passive'], uses:null, rest:'', x:tr});
    });
  });
  ROKU_ABILITIES.forEach(a=>out.push(Object.assign({},a)));
  out.forEach(o=>{ o.tags=uniqTags((o.tags||[]).concat(abilityEnrichTags(o))); });
  return out;
}

/* Однократное вливание Торгара в своды и летопись (и на уже работающих устройствах) */
async function ensureTorgar(){
  const flag=await store.get('dndworld2:torgar');
  if(flag==='1') return;
  /* предметы: две записи справочника вытесняются версиями Торгара, ссылки героев перевязываются */
  const torgRemap={'Трутница':'it_tinderbox_t','Набор целителя (10 исп.)':'it_healer_kit_t'};
  const torgOldIds={};
  itemsDB.forEach(o=>{ if(torgRemap[o.n] && o.id!==torgRemap[o.n]) torgOldIds[o.id]=torgRemap[o.n]; });
  itemsDB=itemsDB.filter(o=>!torgOldIds[o.id]);
  chars.forEach(c=>(c.inventory||[]).forEach(e=>{ if(torgOldIds[e.itemId]) e.itemId=torgOldIds[e.itemId]; }));
  TORGAR_ITEMS.forEach(it=>{
    if(!itemsDB.some(o=>o.id===it.id)){
      const o=Object.assign({},it);
      o.tags=uniqTags((o.tags||[]).concat(itemEnrichTags(o)));
      itemsDB.push(o);
    }
  });
  /* заклинания: одноименные старые вытесняются версиями Торгара */
  const spNames=TORGAR_SPELLS.map(s=>s.n);
  spellsDB=spellsDB.filter(o=>!(spNames.includes(o.n) && !TORGAR_SPELLS.some(t=>t.id===o.id)));
  TORGAR_SPELLS.forEach(sp=>{
    if(!spellsDB.some(o=>o.id===sp.id)){
      const o=Object.assign({},sp);
      o.tags=uniqTags((o.tags||[]).concat(spellEnrichTags(o)));
      spellsDB.push(o);
    }
  });
  /* способности */
  TORGAR_ABILITIES.forEach(ab=>{
    if(!abilitiesDB.some(o=>o.id===ab.id)){
      const o=Object.assign({},ab);
      o.tags=uniqTags((o.tags||[]).concat(abilityEnrichTags(o)));
      abilitiesDB.push(o);
    }
  });
  /* герой */
  if(!chars.some(c=>c.id==='char_torgar')){
    const t=buildTorgar();
    chars.push(typeof upgradeChar3==='function'?upgradeChar3(t):t);
  }
  await store.set('dndworld2:torgar','1');
  scheduleSave();
}

async function ensureSeptih(){
  const flag=await store.get('dndworld2:septih');
  if(flag==='1') return;
  /* народ чейнджлингов в свод рас */
  if(!racesDB.some(r=>r.n==='Чейнджлинг')) racesDB.push(JSON.parse(JSON.stringify(CHANGELING_RACE)));
  /* предметы: справочные записи вытесняются версиями Септиха, ссылки героев перевязываются */
  const sxRemap={'Крюк-кошка':'it_grappling_hook_s','Короткий меч':'it_shortsword_s'};
  const sxOldIds={};
  itemsDB.forEach(o=>{ if(sxRemap[o.n] && o.id!==sxRemap[o.n]) sxOldIds[o.id]=sxRemap[o.n]; });
  itemsDB=itemsDB.filter(o=>!sxOldIds[o.id]);
  chars.forEach(c=>(c.inventory||[]).forEach(e=>{ if(sxOldIds[e.itemId]) e.itemId=sxOldIds[e.itemId]; }));
  SEPTIH_ITEMS.forEach(it=>{
    if(!itemsDB.some(o=>o.id===it.id)){
      const o=Object.assign({},it);
      o.tags=uniqTags((o.tags||[]).concat(itemEnrichTags(o)));
      itemsDB.push(o);
    }
  });
  /* способности */
  SEPTIH_ABILITIES.forEach(ab=>{
    if(!abilitiesDB.some(o=>o.id===ab.id)){
      const o=Object.assign({},ab);
      o.tags=uniqTags((o.tags||[]).concat(abilityEnrichTags(o)));
      abilitiesDB.push(o);
    }
  });
  /* дополнения полноты из официальных справочников */
  LORE_SPELL_PATCHES.forEach(p=>{
    const sp=spellsDB.find(s=>s.id===p.id); if(!sp) return;
    if(p.ifEmpty && sp[p.field]) return;
    if(p.ifEquals!==undefined && sp[p.field]!==p.ifEquals) return;
    sp[p.field]=p.val;
  });
  /* герой */
  if(!chars.some(c=>c.id==='char_septih')){
    const s=buildSeptih();
    chars.push(typeof upgradeChar3==='function'?upgradeChar3(s):s);
  }
  /* починка возможных осиротевших ссылок после прежних вытеснений */
  chars.forEach(c=>(c.inventory||[]).forEach(e=>{
    if(!itemsDB.some(o=>o.id===e.itemId)){
      const s=String(e.itemId).toLowerCase();
      if(s.includes('трутниц')) e.itemId='it_tinderbox_t';
      else if(s.includes('целител')) e.itemId='it_healer_kit_t';
    }
  }));
  await store.set('dndworld2:septih','1');
  scheduleSave();
}

async function ensureLegerem(){
  const flag=await store.get('dndworld2:legerem');
  if(flag==='1') return;
  LEGEREM_ITEMS.forEach(it=>{
    if(!itemsDB.some(o=>o.id===it.id)){
      const o=Object.assign({},it);
      o.tags=uniqTags((o.tags||[]).concat(itemEnrichTags(o)));
      itemsDB.push(o);
    }
  });
  LEGEREM_ABILITIES.forEach(ab=>{
    if(!abilitiesDB.some(o=>o.id===ab.id)){
      const o=Object.assign({},ab);
      o.tags=uniqTags((o.tags||[]).concat(abilityEnrichTags(o)));
      abilitiesDB.push(o);
    }
  });
  /* правка полноты: наплечник наставника получал несуществующий слот SHOULDERS → ячейка «Плечи» (CLOAK) */
  const pauldron=itemsDB.find(o=>o.id==='it_pauldron_mentor');
  if(pauldron && pauldron.slot!=='CLOAK') pauldron.slot='CLOAK';
  if(!chars.some(c=>c.id==='char_legerem')){
    const l=buildLegerem();
    chars.push(typeof upgradeChar3==='function'?upgradeChar3(l):l);
  }
  await store.set('dndworld2:legerem','1');
  scheduleSave();
}

const CASTER_META = {

 'Бард':{abbr:'Брд', kind:'full'}, 'Чародей':{abbr:'Чрд', kind:'full'}, 'Колдун':{abbr:'Клд', kind:'full'},
 'Паладин':{abbr:'Пал', kind:'half'}, 'Следопыт':{abbr:'Слд', kind:'half'}
};
/* Ячейки полукастеров (паладин, следопыт) по уровню, PHB */
const HALF_SLOTS = {
 1:[], 2:[2], 3:[3], 4:[3], 5:[4,2], 6:[4,2], 7:[4,3], 8:[4,3], 9:[4,3,2], 10:[4,3,2],
 11:[4,3,3], 12:[4,3,3], 13:[4,3,3,1], 14:[4,3,3,1], 15:[4,3,3,2], 16:[4,3,3,2],
 17:[4,3,3,3,1], 18:[4,3,3,3,1], 19:[4,3,3,3,2], 20:[4,3,3,3,2]
};

function casterMeta(c){ return CASTER_META[c.cls]||null; }
function maxCircleFor(c){
  const m=casterMeta(c); if(!m) return 0;
  if(m.kind==='half') return c.level>=2? Math.ceil(c.level/4) : 0;
  return Math.min(9, Math.ceil(c.level/2));
}
function slotsRowFor(c){
  const m=casterMeta(c); if(!m) return [];
  return (m.kind==='half'? HALF_SLOTS[c.level] : FULL_SLOTS[c.level])||[];
}
/* лимит подготовленных: характеристика + уровень (полукастеры — половина уровня), минимум 1 */
function prepMax(c){
  const m=casterMeta(c); if(!m) return 0;
  const lvlPart=m.kind==='half'? Math.max(1,Math.floor(c.level/2)) : c.level;
  return Math.max(1, lvlPart + eMod(c, spellAbOf(c)));
}
function prepCount(c){
  return (c.spellbook||[]).filter(e=>{ const sp=spellOf(e.spellId); return e.prep && sp && sp.l>0; }).length;
}

/* Автокниги: при смене уровня заклинания открывшихся кругов входят в книгу, при откате — авто-добавленные уходят */
function autoLevelSpells(c, oldLevel){
  const m=casterMeta(c); if(!m) return {added:[], removed:[]};
  const oldC=maxCircleFor(Object.assign({},c,{level:oldLevel}));
  const newC=maxCircleFor(c);
  const added=[], removed=[];
  if(newC>oldC){
    for(let k=Math.max(1,oldC+1); k<=newC; k++){
      spellsDB.filter(sp=>sp.l===k && String(sp.c||'').indexOf(m.abbr)>=0).forEach(sp=>{
        if(!c.spellbook.some(e=>e.spellId===sp.id)){
          c.spellbook.push({spellId:sp.id, prep:false, auto:true});
          added.push(sp.n);
        }
      });
    }
  }
  if(newC<oldC){
    c.spellbook=c.spellbook.filter(e=>{
      const sp=spellOf(e.spellId);
      if(e.auto && sp && sp.l>newC){ removed.push(sp.n); return false; }
      return true;
    });
  }
  return {added, removed};
}
/* Слоты по классу с сохранением потраченного */
function applyClassSlots(c){
  const row=slotsRowFor(c);
  const old=c.slots||{};
  const next={};
  row.forEach((mx,i)=>{
    if(mx<=0) return;
    const lv=i+1, prev=old[lv]||{max:0,cur:0};
    const spent=Math.max(0,(prev.max||0)-(prev.cur||0));
    next[lv]={max:mx, cur:Math.max(0, mx-spent)};
  });
  c.slots=next;
}

/* Разовая правка живых листов: то, что нельзя починить одной лишь правкой посева */
async function ensureCharAudit(){
  const flag=await store.get('dndworld2:charaudit');
  if(flag==='1') return;
  let touched=false;
  chars.forEach(c=>{
    if(c.name&&c.name.indexOf('Легерем')===0){
      c.equipment=c.equipment||{};
      const pick=n=>{ const e=(c.inventory||[]).find(x=>{ const it=itemOf(x.itemId); return it&&it.n.indexOf(n)>=0; }); return e?e.id:null; };
      const axe=pick('Фамильный боевой топор'), shirt=pick('Простая кольчужная рубаха'), cloak=pick('Плащ Жентарима');
      if(axe&&!c.equipment.TWO_HAND&&!c.equipment.MAIN_HAND){ c.equipment.TWO_HAND=axe; touched=true; }
      if(shirt&&!c.equipment.CHEST){ c.equipment.CHEST=shirt; touched=true; }
      if(cloak&&!c.equipment.CLOAK){ c.equipment.CLOAK=cloak; touched=true; }
    }
  });
  const unc=abilitiesDB.find(a=>a.n==='Ловкая увертка');
  if(unc&&!unc.mode){ unc.mode='passive'; touched=true; }
  await store.set('dndworld2:charaudit','1');
  if(touched){ fxInvalidate(); scheduleSave(); }
}

it_копье:{desc:'Древко в человеческий рост с граненым наконечником. Древнейшее оружие пехоты: держит врага на расстоянии и одинаково хорошо колет и летит. Взятое двумя руками, бьет заметно сильнее.'},
it_легкий_молот:{desc:'Небольшой молот с короткой рукоятью, пригодный и для боя, и для работы. Не рассечет доспех, но сомнет его вместе с тем, кто внутри. Легок настолько, что уходит в бросок без потери равновесия.'},
it_метательное_копье:{desc:'Легкое копье с узким наконечником, рассчитанное на бросок. Пробивает щит и вязнет в нем, лишая противника защиты. В ближнем бою уступает обычному копью, зато летит вдвое дальше.'},
it_палица:{desc:'Тяжелая дубина с расширенным окованным концом, требующая обеих рук. Не знает изящества, но проламывает щиты, двери и черепа с одинаковым равнодушием. Оружие тех, кто предпочитает простые решения.'},
it_ручной_топор:{desc:'Небольшой топор с короткой рукоятью — и инструмент, и оружие. Хорошо ложится в руку, легко уходит в бросок и всегда пригодится у костра. Легкость позволяет сражаться двумя топорами разом.'},
it_серп:{desc:'Изогнутый жатвенный клинок на короткой рукояти. Оружие крестьянских бунтов и лесных культов: незаметен среди утвари, но в умелой руке вспарывает жилы. Кривизна лезвия цепляет то, что прямой клинок пропустил бы.'},
it_легкий_арбалет:{desc:'Ложе с плечами и воротом, натягиваемое ногой в стремени. Бьет точно и сильно, не требуя ни силы лучника, ни долгих лет выучки — потому и оружие ополчения. Перезарядка съедает время: выстрел приходится делать один за действие.'},
it_дротик:{desc:'Короткое утяжеленное древко с острием, рассчитанное на бросок с руки. Носят связками по нескольку штук на поясе. Летит недалеко, но бросается быстро и полагается на Ловкость.'},
it_короткий_лук:{desc:'Гибкий лук в половину человеческого роста, удобный в лесу и с седла. Уступает длинному в дальности, зато не мешает двигаться и стреляет часто. Требует обеих рук и запаса стрел.'},
it_праща:{desc:'Кожаный ремень с расширением посередине. Самое дешевое дальнобойное оружие: снаряды находятся под ногами, а пастушья выучка стоит недорого. Камень из пращи мнет шлем не хуже дубины.'},
it_алебарда:{desc:'Древковое оружие с широким лезвием, крюком и острием на конце. Рубит, колет и стаскивает всадника с седла, доставая противника за три метра. Тяжела и требует обеих рук и простора.'},
it_боевая_кирка:{desc:'Клюв из закаленного железа на прочной рукояти. Создана пробивать доспех там, где меч бессилен: узкое острие входит в стык пластин. В походе годится и по прямому назначению — бить камень.'},
it_боевой_молот:{desc:'Тяжелое навершие на рукояти в предплечье длиной. Дробящий удар не требует остроты и не боится ржавчины, потому молот любят в подземельях и шахтах. Взятый двумя руками, бьет заметно тяжелее.'},
it_боевой_топор:{desc:'Широкое полукруглое лезвие на прочном топорище. Рубит глубоко и страшно, а крюком лезвия можно отвести щит противника. Двумя руками наносит больший урон.'},
it_глефа:{desc:'Длинный клинок, насаженный на древко в рост человека. Позволяет держать строй и доставать врага, не подпуская его вплотную. Требует обеих рук и открытого пространства.'},
it_двуручный_меч:{desc:'Клинок длиной с человека, с длинной рукоятью и мощной гардой. Оружие тех, кто разрывает строй: один замах сносит древки копий вместе с руками. Не оставляет возможности держать щит.'},
it_длинное_копье_пика:{desc:'Древко в три человеческих роста с узким граненым наконечником. Оружие плотного строя: останавливает конницу и достает противника раньше, чем тот сблизится. В тесноте почти бесполезно.'},
it_длинный_меч:{desc:'Прямой клинок в руку длиной, гарда и навершие уравновешивают его в ладони. Оружие рыцарей и городской стражи: одинаково хорош в рубке и в уколе. Одной рукой оставляет место щиту, двумя — бьет сильнее.'},
it_кавалерийское_копье:{desc:'Длинное всадническое копье с расширением у рукояти. В конном ударе вкладывает в острие весь разгон коня. Пешему неудобно: вблизи древко мешает, и удар идет с помехой.'},
it_кнут:{desc:'Плетеный ремень в три метра длиной с утяжеленным кончиком. Урона наносит мало, зато достает издали, сбивает оружие из рук и обвивает лодыжки. Полагается на Ловкость, а не на Силу.'},
it_молот_кувалда:{desc:'Огромный молот, который берут двумя руками и раскачивают всем корпусом. Проламывает ворота, стены и все, что за ними. Медлителен, но каждый попавший удар решает многое.'},
it_моргенштерн:{desc:'Булава с шипастым навершием, соединившая дробящий удар с пробивным. Шипы находят щели в кольчуге и не соскальзывают с округлого шлема. Проста, тяжела и надежна.'},
it_рапира:{desc:'Узкий колющий клинок с развитой гардой, оружие дуэлянтов и придворных. Бьет точно в стык доспеха, а фехтовальное свойство позволяет положиться на Ловкость. Не годится для рубки — только для укола.'},
it_секира:{desc:'Огромный топор на длинном топорище, берущийся обеими руками. Раскалывает щиты и шлемы; сильнейшая кость урона среди рукопашного оружия. Тяжела и не прощает промаха.'},
it_скимитар:{desc:'Изогнутый однолезвийный клинок, легкий и стремительный. Скользящий рез вспарывает там, где прямой меч завяз бы. Легкость и фехтовальное свойство делают его любимым оружием быстрых бойцов.'},
it_трезубец:{desc:'Три граненых зуба на крепком древке — оружие рыбаков, гладиаторов и морской стражи. Цепляет сети, щиты и доспехи, а брошенный, бьет не хуже копья. Двумя руками наносит больший урон.'},
it_цеп:{desc:'Ударная часть на цепи, соединенная с рукоятью. Гибкое сочленение обходит щит и достает противника из-за укрытия, но и владельцу требует привычки. Дробит доспех вместе с тем, кто в нем.'},
it_ручной_арбалет:{desc:'Маленький арбалет, который держат в одной руке. Прячется под плащом и бьет с расстояния, на котором меч еще бесполезен. Перезарядка ограничивает выстрел одним за действие.'},
it_тяжелый_арбалет:{desc:'Массивное ложе с воротом, натягиваемое обеими руками. Болт пробивает доспех навылет на большом расстоянии — сильнейшее дальнобойное оружие. Тяжел, медлителен и требует запаса болтов.'},
it_длинный_лук:{desc:'Лук в рост стрелка, из тиса или ясеня, с тугой тетивой. Бьет дальше любого другого ручного оружия, но требует силы и многолетней выучки. Держится обеими руками, стрелы расходуются быстро.'},
it_духовая_трубка:{desc:'Полая трубка, из которой выдувают короткую иглу. Урона почти не наносит, зато бьет бесшумно и незаметно — потому ее ценят отравители. Настоящая опасность не в игле, а в том, чем она смазана.'},
it_сеть:{desc:'Плетеная сеть с грузами по краю, которую бросают в противника. Урона не наносит вовсе: попавшее существо становится опутанным и должно вырываться. Дистанция мала, зато один бросок способен решить бой.'},
it_стеганый_arm:{desc:'Простеганная в несколько слоев ткань, набитая паклей или шерстью. Дешевейший доспех, гасящий скользящие удары, но душный и шуршащий. Из-за плотной набивки мешает двигаться тихо.'},
it_кожаный_arm:{desc:'Нагрудник и наплечники из кожи, вываренной в масле до твердости дерева. Легок, не стесняет движений и не выдает шорохом. Против стрелы и укола помогает мало, зато носится сутками.'},
it_проклепанная_кожа_arm:{desc:'Кожаный доспех, усиленный частой россыпью железных заклепок. Заклепки разбивают удар и мешают клинку скользить, почти не прибавляя веса. Любимый доспех тех, кому нужна и защита, и тишина.'},
it_шкурный_arm:{desc:'Грубые шкуры с нашитыми пластинами кости и рога. Доспех дальних племен и варваров: делается на месте из того, что удалось добыть. Защищает сносно, выглядит устрашающе, пахнет соответственно.'},
it_кольчужная_рубаха_arm:{desc:'Короткая рубаха из мелких колец, надеваемая под верхнюю одежду. Прячется под кафтаном, потому ее носят те, кому не положено выглядеть вооруженными. Легче полной кольчуги и не стесняет плечи.'},
it_чешуйчатый_arm:{desc:'Кожаная основа, сплошь покрытая нашитыми металлическими пластинками внахлест. Держит рубящий удар не хуже кольчуги и стоит дешевле. Пластины звенят при каждом шаге — о скрытности можно забыть.'},
it_кираса_arm:{desc:'Цельная нагрудная и наспинная пластина на ремнях, обычно поверх поддоспешника. Прикрывает только корпус, зато прикрывает надежно и не мешает рукам. Ее носят и ради защиты, и ради вида.'},
it_полулаты_arm:{desc:'Кираса, дополненная наручами, наплечниками и набедренниками. Почти полный доспех, оставляющий ногам свободу. Лязг сочленений выдает носителя задолго до его появления.'},
it_колечный_arm:{desc:'Кожаная основа с нашитыми поверх тяжелыми кольцами. Древний и неуклюжий доспех, который держат в арсеналах для тех, кому не досталось кольчуги. Тяжел, шумен, но дешев.'},
it_кольчуга_arm:{desc:'Длинная рубаха из тысяч склепанных колец, с капюшоном и рукавами, надеваемая поверх стеганки. Отменно держит рубящий удар и терпит любую погоду. Тяжела: без должной силы она замедляет шаг.'},
it_наборный_arm:{desc:'Крупные металлические полосы, наклепанные на кожаную основу и кольчужное поле. Дешевле лат и почти так же надежен, поэтому его носит тяжелая пехота. Неповоротлив и оглушительно гремит.'},
it_латы_arm:{desc:'Полный доспех из подогнанных по фигуре пластин, с подкладкой и ремнями. Лучшая защита, какую можно купить за золото; надевать его в одиночку почти невозможно. Требует силы и делает скрытность невозможной.'},
it_щит_arm:{desc:'Деревянный щит, окованный железом по краю, с ремнями под предплечье. Прибавляет к защите два очка и позволяет принимать удары, не подставляя тело. Занимает руку — с двуручным оружием несовместим.'}
};
/* ═══ Описания предметов: снаряжение, припасы, записи, вместилища ═══ */
const ITEM_LORE_B={
it_рюкзак:{desc:'Кожаный заплечный мешок с лямками, клапаном и наружными петлями для скатки. Вмещает около 15 кг поклажи; все, что не влезло, приходится нести в руках. Основное вместилище странника: в него складывают припасы, веревку и добычу.', cap:'15 кг', box:true},
it_спальник:{desc:'Толстая шерстяная скатка с непромокаемым верхом, свернутая ремнями. Без нее ночь на камнях не даст отдыха: мастер вправе не засчитать долгий отдых тому, кто спал на голой земле в холод. Весит немало, но окупается каждым утром.'},
it_постельные_принадлежности:{desc:'Простыни, одеяло и подушка — роскошь для того, кто ночует под крышей. В дороге почти бесполезны, зато на постоялом дворе избавляют от чужих клопов. Часто идут в приданое или в уплату долга.'},
it_веревка_пеньковая_15_м:{desc:'Пятнадцать метров прочной пеньковой веревки, свернутой в бухту. Выдерживает вес человека в доспехе; рвется от долгого трения о камень. Закрепленная веревка облегчает подъем — проверки Атлетики идут с преимуществом.'},
it_веревка_шелковая_15_м:{desc:'Пятнадцать метров шелковой веревки — вдвое легче пеньковой и вчетверо дороже. Не намокает, не гниет и почти не выдает шорохом. Закрепленная, дает то же преимущество при лазании.'},
it_факел:{desc:'Палка в локоть длиной с намотанной смоленой паклей. Горит около часа, давая яркий свет на 6 метров и тусклый еще на 6. В крайнем случае горящий факел бьют в лицо — это импровизированное оружие с уроном огнем.'},
it_фонарь_яблочко:{desc:'Фонарь с зеркальным отражателем, дающий узкий направленный луч. Освещает конус на 18 метров ярко и еще на 18 тускло. Пинты масла хватает на шесть часов; прикрытый заслонкой, он не выдает владельца.'},
it_закрытый_фонарь:{desc:'Фонарь с роговыми или слюдяными стенками и откидной заслонкой. Дает ровный свет на 9 метров и тусклый еще на 9, а заслонка мгновенно превращает его в тусклое пятно. Пинты масла хватает на шесть часов.'},
it_масло_фляга:{desc:'Глиняная фляга с пинтой светильного масла. Ею заправляют фонарь на шесть часов горения либо метают как импровизированное оружие: разбившись, она обливает цель, и поднесенный огонь дает 5 урона огнем. Промах разливает масло по площади полтора метра.'},
it_свеча:{desc:'Восковая или сальная свеча, горит около часа. Дает тусклый свет всего на полтора метра — годится читать, но не идти. Незаменима в обрядах и там, где открытое пламя факела недопустимо.'},
it_рацион_1_день:{desc:'Дневной паек: сухари, вяленое мясо, сушеные фрукты, орехи, немного соли. Не портится в дороге и не требует готовки. Герой, оставшийся без еды и воды, начинает набирать уровни истощения.'},
it_бурдюк:{desc:'Кожаный мех на ремне, вмещает около четырех литров воды. В сутки пешего перехода по жаре человеку нужно вдвое больше обычного. Пустой бурдюк весит мало, полный — заметно тянет плечо.'},
it_фляга:{desc:'Небольшой сосуд из олова или обожженной глины, около литра. Носится на поясе; чаще в ней не вода, а нечто покрепче. Удобна тем, что не мешает бежать.'},
it_ломик:{desc:'Полутораметровый железный рычаг с загнутым расплющенным концом. Вскрывает ящики, отжимает решетки и приподнимает плиты; при работе дает преимущество на проверки Силы. В крайнем случае служит импровизированной дубиной.'},
it_молоток:{desc:'Обычный плотницкий молоток с деревянной рукоятью. Вбивает питоны, сколачивает щиты и чинит все, что развалилось в дороге. Шум от него разносится далеко — в подземелье это стоит обдумать.'},
it_питон_шип:{desc:'Железный костыль с ушком, вбиваемый в скалу или бревно. Держит веревку, закрывает дверь наглухо или мешает ей открыться. Носят связками по десять штук.'},
it_веревочная_лестница_3_м:{desc:'Три метра веревочных ступеней с деревянными перекладинами. По ней поднимаются без проверки — в отличие от голой веревки. Сворачивается компактно, но весит прилично.'},
it_лопата:{desc:'Тяжелая железная лопата с окованным черенком. Роет окопы, могилы и тайники; за час работы человек выкапывает яму в свой рост. Иногда оказывается единственным способом пройти дальше.'},
it_кандалы:{desc:'Железные оковы с замком, рассчитанные на существо среднего размера. Скованный вырывается проверкой Силы СЛ 20 либо вскрывает замок воровскими инструментами СЛ 15. Ключ прилагается — и его стоит хранить отдельно.'},
it_цепь_3_м:{desc:'Три метра толстой железной цепи, выдерживающей вес привязанного существа. Разорвать ее — проверка Силы СЛ 20. Годится и связать пленника, и запереть дверь, и утянуть на дно того, кому это причитается.'},
it_колокольчик:{desc:'Небольшой бронзовый колокольчик с чистым звоном. Служит сигналом, обрядовым инструментом и простейшей ловушкой: привязанный к нити поперек коридора, он выдаст любого. Звук слышен примерно на 18 метров.'},
it_зеркальце_стальное:{desc:'Полированная стальная пластинка с ручкой. Позволяет заглянуть за угол, не подставляя голову, подать сигнал солнечным зайчиком или проверить, отражается ли собеседник. Не бьется, в отличие от стеклянного.'},
it_мыло:{desc:'Кусок серого щелочного мыла, резко пахнущий золой. В городе избавляет от вшей и подозрений, а намыленная веревка или прутья решетки иногда решают дело лучше отмычки. Мелочь, о которой вспоминают слишком поздно.'},
it_мешочек:{desc:'Кожаный кошель на завязке, вмещает около четверти килограмма. Носится на поясе; в нем держат монеты, камни, компоненты и прочую мелочь. Срезать его — обычное дело для карманника.', cap:'0,25 кг', box:true},
it_сундук:{desc:'Окованный деревянный сундук с замком, вмещает до 150 кг. Сам весит столько, что в дорогу его не возьмешь — он для дома, повозки или трюма. Замок вскрывается воровскими инструментами, СЛ по решению мастера.', cap:'150 кг', box:true},
it_палатка_двухместная:{desc:'Промасленная холщовая палатка на двоих, с колышками и растяжками. Ставится за несколько минут и защищает от дождя и ветра — без нее ночлег в непогоду отдыха не даст. Свернутая, крепится поверх рюкзака.'},
it_зелье_лечения_2d4_2:{desc:'Пузырек красной жидкости, отливающей на свету искрами. Выпитый действием, восстанавливает 2d4 + 2 хита; вылить его в рот другому — тоже действие. Самое ходовое зелье в любом городе, где есть хоть один алхимик.'},
it_противоядие:{desc:'Мутноватая настойка на травах и толченом угле в запечатанном флаконе. Выпитая, дает преимущество на спасброски от яда на следующий час. Не снимает уже полученный урон, но останавливает дальнейшее отравление.'},
it_чернила_флакон:{desc:'Флакон густых черных чернил на саже и дубовом орешке. Хватает надолго, если не переписывать целые тома. Вместе с пером и листом позволяют вести записи, а волшебнику — переписывать заклинания в книгу.'},
it_перо_писчее:{desc:'Гусиное перо с очиненным кончиком. Требует чернил и твердой руки; кончик приходится подрезать каждые несколько страниц. Без пера письменные принадлежности бесполезны.'},
it_бумага_лист:{desc:'Лист дешевой тряпичной бумаги. Годится для писем, расписок и записок, но боится воды и рвется на сгибах. Дешевле пергамента и потому расходуется без сожаления.'},
it_пергамент_лист:{desc:'Выделанная телячья кожа, тонкая и прочная. Переживет столетия и выдержит чернила заклинаний, потому свитки пишут именно на ней. Стоит дороже бумаги и ценится соответственно.'},
it_книга:{desc:'Толстый том в кожаном переплете, исписанный от руки. Может содержать что угодно: хронику, трактат, поэмы или счетные записи. На внимательное чтение уходят часы, зато оно дает преимущество на проверки по теме книги.', text:'Страницы исписаны ровным писарским почерком. Мастер сам решает, что здесь написано, — впишите содержание в поле «Содержание» на вкладке «Предметы».'},
it_книга_заклинаний:{desc:'Том в сто листов плотного пергамента, застегнутый на ремень. Волшебник хранит здесь все, что сумел разобрать: каждое заклинание занимает столько листов, каков его круг. Утрата книги для волшебника страшнее утраты кошелька.', text:'На первых листах — знакомые формулы, выведенные твердой рукой. Дальше идут страницы, исписанные торопливее: пометки на полях, зачеркивания, расчеты углов и созвучий. Несколько листов оставлены чистыми — под то, что еще предстоит понять.\n\nЧтобы переписать сюда чужое заклинание, нужны чернила, перо и время: два часа и пятьдесят золотых за каждый круг.'},
it_священный_символ_эмблема:{desc:'Эмблема божества на цепочке или нашитая на щит: солнце, весы, молот, глаз. Служит жрецу и паладину магической фокусировкой, заменяя материальные компоненты. Держать ее нужно в руке или носить на виду.'},
it_мешочек_с_компонентами:{desc:'Плотный кожаный кошель с отделениями, набитый всякой всячиной: щепоти серы и соли, сушеные лепестки, обрывки шерсти, кусочки мела и меди. Заменяет любые материальные компоненты, у которых не указана цена. Расходуемое и дорогое приходится покупать отдельно.', cap:'мелочь для обрядов', box:true},
it_магическая_фокусировка_жезл:{desc:'Короткий жезл из ореха или кости с проводящей сердцевиной. Заменяет чародею и волшебнику мешочек с компонентами, если у заклинания нет платного материала. Занимает руку — это стоит помнить, когда в другой уже щит.'},
it_воровские_инструменты:{desc:'Кожаный футляр с отмычками, крючками, пинцетом и малым напильником. Позволяет вскрывать замки и обезвреживать ловушки; при владении к проверке добавляется бонус мастерства. Обычный замок — СЛ 15, хороший — выше.'},
it_инструменты_ремесленника:{desc:'Набор для одного ремесла: молоточки, резцы, зажимы, мерки. Позволяет чинить снаряжение, изготавливать простые вещи и опознавать чужую работу. При владении к проверкам Интеллекта по ремеслу добавляется бонус мастерства.'},
it_подзорная_труба:{desc:'Латунная труба с шлифованными линзами, складывающаяся втрое. Приближает далекое вдвое, позволяя разглядеть знамена, дозорных и следы задолго до встречи. Дает преимущество на проверки Внимательности вдаль, но требует покоя и света.'},
it_песочные_часы:{desc:'Стеклянная колба в деревянной оправе, отмеряющая один час. Незаменима там, где нет солнца: в подземелье, в трюме, в осажденной башне. По ним отсчитывают горение факела, время обряда и смену караула.'},
it_весы_торговые:{desc:'Малые чашечные весы с набором гирек в футляре. Проверяют вес монеты, порошка или самородка — и тем самым честность продавца. Дают преимущество на проверки Интеллекта при оценке товара.'},
it_стрелы_20:{desc:'Двадцать оперенных стрел с гранеными наконечниками в кожаном колчане. Расходуются по одной на выстрел; после боя примерно половину удается собрать и вернуть в колчан. Ломаются от сырости и небрежного хранения.'},
it_арбалетные_болты_20:{desc:'Двадцать коротких тяжелых болтов в поясном туле. Короче стрелы, но тяжелее — оттого и пробивная сила. После боя половину обычно удается подобрать.'},
it_пули_для_пращи_20:{desc:'Двадцать свинцовых или обкатанных каменных снарядов в мешочке. Дешевле стрел настолько, что их не всегда трудятся собирать. Свинцовые бьют заметно тяжелее каменных.'},
it_zhent_amulet:{desc:'Небольшой серебряный амулет с чеканным знаком: свернувшаяся змея в круге. Такие носят те, кто связан с Жентаримом, — знак, понятный лишь своим. Металл потемнел от времени, но чеканка осталась четкой.\n• Пока абсолютно ничего не известно, надо попробовать надеть…'},
it_gem_pouch:{desc:'Небольшой замшевый мешочек с затянутым шнурком. Внутри перекатываются несколько ограненных камней — на глаз каждый тянет золотых на десять. Мешочек можно открыть и достать камни поштучно.', cap:'десяток камней', box:true,

it_korlinn_scroll:{desc:'Свиток плотного пергамента, перевязанный вылинявшей лентой с обрывком печати. Развернутый, он показывает древо семьи Корлиннов, выведенное несколькими разными руками через поколения. Нижние ветви обрываются, будто писавший не решился их продолжить.',

async function ensureItemAudit(){
  const flag=await store.get('dndworld2:itemaudit');
  if(flag==='1') return;
  ITEM_NEW.forEach(rec=>{ if(!itemsDB.some(x=>x.id===rec.id)) itemsDB.push(rec); });
  const lore=Object.assign({}, ITEM_LORE_A, ITEM_LORE_B, ITEM_LORE_C);
  Object.keys(lore).forEach(id=>{
    const it=itemsDB.find(x=>x.id===id); if(!it) return;
    const L=lore[id];
    /* описание переписываем только там, где его почти не было — правки мастера не трогаем */
    if(L.desc&&(String(it.desc||'').trim().length<130||id==='it_spider_letter')) it.desc=L.desc;
    if(L.text&&!String(it.text||'').trim()) it.text=L.text;
    if(L.props&&!String(it.props||'').trim()) it.props=L.props;
    if(L.cap&&!it.cap) it.cap=L.cap;
    if(L.box) it.box=true;
    if(L.contents&&!it.contents) it.contents=L.contents;
  });
  Object.keys(ITEM_TAG_FIX).forEach(n=>{
    const it=itemsDB.find(x=>x.n===n); if(!it) return;
    const f=ITEM_TAG_FIX[n];
    let tg=(it.tags||[]).slice();
    if(f.drop) tg=tg.filter(t=>f.drop.indexOf(t)<0);
    if(f.add) f.add.forEach(t=>{ if(tg.indexOf(t)<0) tg.push(t); });
    it.tags=tg;
  });
  /* наполняем уже выданные вместилища */
  chars.forEach(c=>(c.inventory||[]).forEach(e=>{
    const it=itemOf(e.itemId);
    if(it&&Array.isArray(it.contents)&&it.contents.length) fillContainer(e,it);
  }));
  await store.set('dndworld2:itemaudit','1');
  fxInvalidate(); scheduleSave();
}
async function ensureSpellAudit(){
  const flag=await store.get('dndworld2:spellaudit');
  if(flag==='3') return;   /* версия 3: исправлены концентрация и длительность перенесенных записей */
  Object.keys(SPELL_HI_PATCHES).forEach(id=>{
    const sp=spellsDB.find(s=>s.id===id);
    if(sp && !sp.hi) sp.hi=SPELL_HI_PATCHES[id];
  });
  Object.keys(SPELL_X_PATCHES).forEach(id=>{
    const sp=spellsDB.find(s=>s.id===id);
    if(sp && (!sp.x || sp.x.length<40)) sp.x=SPELL_X_PATCHES[id];
  });
  if(!spellsDB.some(s=>s.n==='Антимагическое поле')){
    const o=Object.assign({},ANTIMAGIC_SPELL);
    o.tags=uniqTags((o.tags||[]).concat(spellEnrichTags(o)));
    spellsDB.push(o);
  }
  const guidance=spellsDB.find(x=>x.id==='sp_guidance_t');
  if(guidance){ guidance.d='Концентрация, до 1 минуты'; guidance.conc=true; guidance.tags=uniqTags((guidance.tags||[]).concat(['buff','concentration'])); }
  const web=spellsDB.find(x=>x.id==='sp_web');
  if(web){ web.s='Вызов'; web.d='Концентрация, до 1 часа'; web.conc=true; web.tags=uniqTags((web.tags||[]).concat(['concentration','control'])); }
  await store.set('dndworld2:spellaudit','3');
  scheduleSave();
}

/* Хранилище: window.storage (артефакты) → localStorage (свой сайт) → память сеанса */
const store={
  async get(k){
    if(window.storage && window.storage.get){ try{ const r=await window.storage.get(k); return r&&r.value!=null?r.value:null; }catch(e){ return null; } }
    try{ return window.localStorage.getItem(k); }catch(e){ return (k in memStore)?memStore[k]:null; }
  },
  async set(k,v){
    if(window.storage && window.storage.set){ try{ await window.storage.set(k,v); return true; }catch(e){ return false; } }
    try{ window.localStorage.setItem(k,v); return true; }catch(e){ memStore[k]=v; return false; }
  }
};

function askRolls(spec){

  if(Array.isArray(window.__autoRolls)&&window.__autoRolls.length>=spec.rows.length){
    const vals={};

    '<div class="roll-row"><label>'+esc(r.label)+'</label>'
    +'<input type="number" id="rollV'+i+'" min="'+(r.min!=null?r.min:1)+'"'+(r.max!=null?' max="'+r.max+'"':'')+' oninput="rollLiveUpd()">'

function rollCheck(label,m,kind){
  m=+m||0;
  const c=(typeof cc==='function')?cc():null;
  const fxList=(c&&kind)?rollFxEntries(c,kind):[];
  const autoAdv=fxList.some(f=>f.mode==='adv'), autoDis=fxList.some(f=>f.mode==='dis');
  const autoMode=(autoAdv===autoDis)?0:(autoAdv?1:2);
  /* Ручной выбор мастера сильнее автоматического; встречные режимы гасят друг друга. */
  const adv=advMode||autoMode;
  const dice=fxList.filter(f=>f.mode==='die').map(f=>{
    const dm=normDiceInput(String(f.value||'')).match(/^(-)?(\d*)d(\d+)$/);
    if(!dm) return null;
    return {sign:dm[1]?-1:1, cnt:Math.max(1,+dm[2]||1), sides:+dm[3], label:f.label, consume:f.consume, uid:f.sourceUid};
  }).filter(Boolean);
  const rows=adv? [{key:'a',label:'d20 — первый',sub:adv===1?'преимущество: берется больший':'помеха: берется меньший',min:1,max:20},
                   {key:'b',label:'d20 — второй',min:1,max:20}]
                : [{key:'a',label:'d20',min:1,max:20}];
  dice.forEach((d,i)=>rows.push({key:'e'+i, label:d.label+': '+(d.sign<0?'-':'')+d.cnt+'d'+d.sides,
    sub:'от '+d.cnt+' до '+(d.cnt*d.sides), min:d.cnt, max:d.cnt*d.sides}));
  const sumDice=v=>dice.reduce((a,d,i)=>a+d.sign*(+v['e'+i]||0),0);
  const why=(adv===1?' · преимущество':(adv===2?' · помеха':''))
    +((autoMode&&!advMode)?' (от действующего эффекта)':'')
    +(dice.length?' · кости эффектов: '+dice.map(d=>d.label).join(', '):'');
  askRolls({title:'⚂ '+label, note:'Модификатор: '+(m>0?'+':'')+m+why,
    rows,
    compute:v=>{ const r=adv===1?Math.max(v.a,v.b):(adv===2?Math.min(v.a,v.b):v.a); const d=sumDice(v);
      return label+': d20 '+r+(m?(m>0?' + '+m:' − '+Math.abs(m)):'')+(d?(d>0?' + '+d:' − '+Math.abs(d)):'')+' = '+(r+m+d); },
    apply:v=>{
      const r=adv===1?Math.max(v.a,v.b):(adv===2?Math.min(v.a,v.b):v.a);
      const d=sumDice(v);
      const note=adv===1?' ▲['+v.a+'|'+v.b+']':(adv===2?' ▼['+v.a+'|'+v.b+']':'');
      diceOutSet(label+': d20 '+r+(m?(m>0?' + '+m:' − '+Math.abs(m)):'')+(d?(d>0?' + '+d:' − '+Math.abs(d)):'')+' = '+(r+m+d)+note,
        r===20?'var(--ok)':(r===1?'var(--rubric)':'var(--ink)'));
      const spent=dice.filter(x=>x.consume==='roll').map(x=>x.uid).filter(Boolean);
      if(spent.length&&c) consumeRollFx(c,spent);
      if(kind==='attack'&&c) endTriggeredSpellEffects(c,'attack');
    }});
}
