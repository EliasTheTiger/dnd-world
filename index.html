function targetOptionsHTML(caster, selected){
  let h=chars.map(x=>'<option value="ally:'+x.id+'"'+((selected==='ally:'+x.id)||(!selected&&caster&&x.id===caster.id)?' selected':'')+'>'
    +esc(x.name)+(caster&&x.id===caster.id?' — сам герой':' — герой')+'</option>').join('');
  if(foesDB.length){
    h+='<optgroup label="Бестиарий">'+foesDB.map(f=>'<option value="foe:'+f.id+'"'+(selected==='foe:'+f.id?' selected':'')+'>'
      +esc(f.n)+' — '+(f.kind==='npc'?'NPC':'монстр')+', КД '+(+f.ac||10)+', хиты '+(+f.hp||0)+'/'+(+f.hpMax||0)+'</option>').join('')+'</optgroup>';
  }
  h+='<option value="enemy"'+(selected==='enemy'?' selected':'')+'>Враг без записи — броски вводит мастер</option>'
   +'<option value="object"'+(selected==='object'?' selected':'')+'>Неодушевленный объект — бросков не требует</option>';
  return h;
}

/* ─── СПРАВОЧНИК МАСТЕРА ─── */
function ruleEditorHTML(){
  const r=rulesDB.find(x=>x.id===refEditing.rule)||{t:'',x:''};
  return '<div class="editor"><h3>'+(refEditing.rule?'Правка записи':'Новая запись мастера')+'</h3>'
   +'<div class="f-grid"><div><label>Заголовок</label><input type="text" id="edRuT" value="'+esc(r.t)+'"></div></div>'
   +'<label>Текст записи</label><textarea id="edRuX" rows="7">'+esc(r.x)+'</textarea>'
   +'<button class="btn rub" onclick="saveRuleEd()">Вписать в свод</button> '
   +'<button class="btn ghost" onclick="refEditing.rule=null;refEditing.ruleNew=false;renderRules()">Отложить перо</button></div>';
}
function saveRuleEd(){
  const t=document.getElementById('edRuT').value.trim();
  if(!t){ alert('У записи должен быть заголовок.'); return; }
  const x=document.getElementById('edRuX').value;
  let r=rulesDB.find(v=>v.id===refEditing.rule);
  if(r){ r.t=t; r.x=x; } else rulesDB.push({id:'rule_'+uid(), t, x});
  refEditing.rule=null; refEditing.ruleNew=false;
  scheduleSave(); renderRules();
}
function delRule(id){
  const r=rulesDB.find(x=>x.id===id); if(!r) return;
  if(!confirm('Вычеркнуть запись «'+r.t+'»?')) return;
  rulesDB=rulesDB.filter(x=>x.id!==id);
  scheduleSave(); renderRules();
}
function renderRules(){
  let h = '<div class="db-head"><h2 class="rubric">Справочник мастера</h2>'
    + '<button class="btn sm rub" onclick="refEditing.ruleNew=true;refEditing.rule=null;renderRules()">+ Запись мастера</button></div>';
  if(refEditing.ruleNew||refEditing.rule) h += ruleEditorHTML();
  if(rulesDB.length){
    h += '<h3 class="sub"><span class="fl">❧</span>Записи мастера</h3><div class="grid c2">';
    rulesDB.forEach(r=>{
      h += '<div class="card"><div class="card-tools">'
        + '<button class="mini" title="Править" onclick="refEditing.rule=\''+r.id+'\';refEditing.ruleNew=false;renderRules();window.scrollTo({top:0,behavior:\'smooth\'})">✎</button>'
        + '<button class="mini" title="Вычеркнуть" onclick="delRule(\''+r.id+'\')">✕</button></div>'
        + '<h4>'+esc(r.t)+'</h4><p style="font-size:14.5px;white-space:pre-wrap">'+esc(r.x)+'</p></div>';
    });
    h += '</div>';
  }
  h += '<h3 class="sub"><span class="fl">❧</span>Опыт и бонус мастерства</h3><div class="table-scroll"><table class="ms"><tr><th>Уровень</th><th>Опыт</th><th>Бонус мастерства</th><th>Уровень</th><th>Опыт</th><th>Бонус мастерства</th></tr>';
  for(let i=1;i<=10;i++){
    h += '<tr><td><b>'+i+'</b></td><td>'+XP_TABLE[i].toLocaleString('ru')+'</td><td>+'+PROF[i]+'</td>'
      + '<td><b>'+(i+10)+'</b></td><td>'+XP_TABLE[i+10].toLocaleString('ru')+'</td><td>+'+PROF[i+10]+'</td></tr>';
  }
  h += '</table></div>';
  h += '<h3 class="sub"><span class="fl">❧</span>Навыки и характеристики</h3><div class="table-scroll"><table class="ms"><tr><th>Навык</th><th>Характеристика</th><th>Навык</th><th>Характеристика</th></tr>';
  for(let i=0;i<SKILLS.length;i+=2){
    const a=SKILLS[i], b=SKILLS[i+1];
    h += '<tr><td><b>'+a[0]+'</b></td><td>'+AB_FULL[a[1]]+'</td><td>'+(b?'<b>'+b[0]+'</b>':'')+'</td><td>'+(b?AB_FULL[b[1]]:'')+'</td></tr>';
  }
  h += '</table></div>';
  h += '<h3 class="sub"><span class="fl">❧</span>Состояния</h3><div class="grid c3">';
  CONDITIONS.forEach(c=>{ h += '<div class="card"><h4>'+esc(c.n)+'</h4><p style="font-size:14.5px">'+esc(c.d)+'</p></div>'; });
  h += '</div>';
  h += '<h3 class="sub"><span class="fl">❧</span>Предыстории</h3><div class="table-scroll"><table class="ms"><tr><th>Предыстория</th><th>Навыки</th><th>Прочие владения</th><th>Умение</th></tr>';
  BACKGROUNDS.forEach(b=>{ h += '<tr><td><b>'+esc(b.n)+'</b></td><td>'+esc(b.sk)+'</td><td>'+esc(b.ex)+'</td><td>'+esc(b.f)+'</td></tr>'; });
  h += '</table></div>';
  document.getElementById('tab-rules').innerHTML = h;
}

function renderJournal(){
  const box=document.getElementById('tab-journal');
  let h='<h2 class="rubric">Журнал кампании</h2>'
    + '<div style="text-align:right;margin-bottom:10px"><button class="btn rub" onclick="addJournal()">✠ Новая запись</button></div>';
  if(!journal.length){
    h+='<div class="empty-scroll"><span class="big">❦</span>Хроника молчит.<br>Запишите первую сессию — потомки будут благодарны.</div>';
  } else {
    journal.slice().reverse().forEach(j=>{
      h+='<div class="card journal-entry"><div class="row-line">'
        + '<input type="date" value="'+esc(j.date)+'" onchange="updJournal(\''+j.id+'\',\'date\',this.value)">'
        + '<input class="grow" value="'+esc(j.title)+'" placeholder="Заглавие записи…" style="font-family:var(--disp);color:var(--rubric)" oninput="updJournal(\''+j.id+'\',\'title\',this.value)">'
        + '<button class="del-x" onclick="delJournal(\''+j.id+'\')">✕</button></div>'
        + '<textarea oninput="updJournal(\''+j.id+'\',\'text\',this.value)" placeholder="Что свершилось в этой сессии…">'+esc(j.text)+'</textarea></div>';
    });
  }
  box.innerHTML=h;
}
function addJournal(){
  journal.push({id:uid(), date:new Date().toISOString().slice(0,10), title:'', text:''});
  scheduleJournalSave(); renderJournal();
}
function updJournal(id,k,v){ const j=journal.find(x=>x.id===id); if(!j) return; j[k]=v; scheduleJournalSave(); }
function delJournal(id){ if(!confirm('Вырвать эту страницу из журнала?')) return;
  journal=journal.filter(x=>x.id!==id); scheduleJournalSave(); renderJournal(); }

function clampToggle(btn){
  const d=btn.parentElement.querySelector('.entry-desc');
  d.classList.toggle('clamp');
  btn.textContent=d.classList.contains('clamp')?'развернуть ▾':'свернуть ▴';
}
function descBlock(text){
  if(!text) return '';
  const long=text.length>420;
  return '<div><div class="entry-desc'+(long?' clamp':'')+'">'+esc(text)+'</div>'
    +(long?'<button class="toggle-link" onclick="clampToggle(this)">развернуть ▾</button>':'')+'</div>';
}
/* какие кнопки показать у предмета в инвентаре */
function itemActions(c, e, it){
  const pr=itemProfile(it), sp=itemSpec(it), ch=invCharges(e,it), a=[];
  const B=(icon,label,fn,title)=>a.push({icon,label,fn,title:title||label});
  switch(pr.kind){
    case 'weapon':
      B('⚔','Атаковать',"weaponAttackFx('"+e.id+"','"+c.id+"','melee')",'Атака этим оружием: цель, формула, разбор итога');
      if(pr.weapon.thrown) B('🎯','Метнуть',"weaponAttackFx('"+e.id+"','"+c.id+"','throw')",'Метнуть оружие в цель');
      break;
    case 'ammo':
      B('↺','Собрать после боя',"ammoRecover('"+e.id+"')",'Вернуть половину истраченных боеприпасов');
      break;
    case 'light':
      const lit=(c.activeFx||[]).some(x=>x.k==='light'&&x.id===it.id);
      B(lit?'💨':'🔥', lit?'Погасить':'Зажечь', "lightToggle('"+e.id+"')",
        lit?'Погасить источник света':'Зажечь: даст яркий и тусклый свет на время');
      break;
    case 'oil':
      B('🛢','Заправить фонарь',"oilUse('"+e.id+"','fuel')",'Залить масло в фонарь — 6 часов света');
      B('🔥','Метнуть флягу',"oilUse('"+e.id+"','throw')",'Импровизированная дальняя атака');
      break;
    case 'firestarter':{
      const hasCamp=(c.activeFx||[]).some(x=>x.k==='light'&&x.id==='campfire');
      B('🔥', hasCamp?'Потушить костер':'Высечь огонь', "fireStart('"+e.id+"')",
        'Зажечь факел или свечу из сумки, а если их нет — развести костер');
      break;
    }
    case 'trap':  B('⚠','Рассыпать',"trapScatter('"+e.id+"')",'Создать помеху на площади'); break;
    case 'poison':B('☠','Нанести на оружие',"poisonApply('"+e.id+"')",'Отравить оружие до первого попадания'); break;
    case 'tool':
      B('🛠','Проверка',"toolCheck('"+e.id+"')",(pr.tool&&pr.tool.what)||'Проверка с инструментом');
      if(pr.tool&&pr.tool.kit) B('✚','Стабилизировать',"healerKitStabilize('"+e.id+"')",'Стабилизировать умирающего без проверки');
      break;
    case 'instrument': B('🎵','Сыграть',"instrumentPlay('"+e.id+"')",'Проверка Выступления'); break;
    case 'gamble':     B('🎲','Пустить в ход',"gamblePlay('"+e.id+"')",'Скрытно подменить бросок — проверка Обмана'); break;
    case 'lore':       B('📖','Прочитать',"loreRead('"+e.id+"')",'Изучить записи'); break;
    case 'valuable':   B('💰','Продать',"valuableSell('"+e.id+"')",'Обменять на золото'); break;
    case 'food':       B('🍖','Съесть',"foodEat('"+e.id+"')",'Закрыть дневную норму пищи'); break;
    case 'water':      B(e.full===false?'💧':'🥤', e.full===false?'Наполнить':'Испить', "waterDrink('"+e.id+"')",'Вода на день пути'); break;
    case 'camp':       B('⛺','Разбить лагерь',"campSet('"+e.id+"')",'Долгий отдых'); break;
    case 'rope':
      const tied=(c.activeFx||[]).some(x=>x.k==='gear'&&x.id===it.id);
      B('🧗', tied?'Смотать':'Закрепить', "ropeUse('"+e.id+"')",'Преимущество на Атлетику при лазании');
      break;
    case 'writing':    B('✒','Записать',"writingUse('"+e.id+"')",'Сделать запись или переписать заклинание в книгу'); break;
    case 'container':  B('📦','Открыть',"containerOpen('"+e.id+"')",'Посмотреть и переложить содержимое'); break;
    case 'ritual':     B('🕯','Возжечь',"ritualBurn('"+e.id+"')",'Начать обряд'); break;
  }
  /* заряды, снадобья и все, у чего есть настоящий эффект — общее окно применения */
  if(itemIsBox(it)&&!a.some(x=>x.label==='Открыть'))
    B('📦','Открыть',"containerOpen('"+e.id+"')",'Посмотреть и переложить содержимое');
  const hasFx=recFx(it,'item').some(f=>f.mode!=='text');
  if((ch||sp.consumable||pr.kind==='potion'||(pr.kind==='magic'&&hasFx))&&pr.kind!=='writing')
    B('⚗','Применить',"itemCastFx('"+e.id+"','"+c.id+"')",'Применить: цель, формула бросков, разбор итога');
  return a;
}
function itemHintHTML(c, e, it){
  const pr=itemProfile(it), bits=[ITEM_KIND_RU[pr.kind]||''];
  if(pr.kind==='weapon'){
    const w=pr.weapon;
    if(w.range) bits.push('дистанция '+w.range);
    if(w.versatile) bits.push('двумя руками '+w.versatile.cnt+'d'+w.versatile.sides);
    if(w.ammo){ const am=ammoEntryFor(c,it); bits.push(am?('боеприпасы: '+(am.qty||0)):'боеприпасов нет'); }
    if(w.loading) bits.push('перезарядка');
    if(w.reach) bits.push('досягаемость 3 м');
  }
  if(pr.kind==='armor'||pr.kind==='shield'){
    if(pr.armor.strReq) bits.push('нужна Сила '+pr.armor.strReq+(((+c.ab.str||10)<pr.armor.strReq)?' — не хватает, скорость −3 м':''));
    if(pr.armor.stealthDis) bits.push('помеха на Скрытность');
    if(pr.armor.don) bits.push('надевание: '+pr.armor.don);
  }
  if(pr.kind==='tool'&&pr.tool){ bits.push(pr.tool.what); if(pr.tool.kit) bits.push('применений: '+(e.kit==null?pr.tool.kit:e.kit)); }
  if(pr.kind==='light'){ bits.push('яркий '+pr.light.bright+' м · хватает на '+pr.light.hours+' ч'+(pr.light.fuel?' на '+pr.light.fuel:'')); }
  if(pr.kind==='ammo'){ bits.push('в пачке '+pr.ammo.pack); }
  if(pr.kind==='lore'&&e.read) bits.push('прочитано');
  if(pr.kind==='valuable'&&pr.value&&pr.value.gp) bits.push('оценка '+pr.value.gp+' зм');
  if(itemIsBox(it)){
    if(it.cap) bits.push('вмещает '+it.cap);
    else if(pr.container&&pr.container.cap) bits.push('вмещает '+pr.container.cap);
    const n=(e.inside||[]).length; bits.push(n?('внутри предметов: '+n):'внутри пусто');
  }
  return bits.filter(Boolean).join(' · ');
}
function itemCardHTML(it, extra){
  extra=extra||'';
  let h='<div class="entry-card"><div class="entry-head"><h4>'+esc(it.n)+'</h4>'
    +'<span class="type-tag">'+esc(ITEM_TYPES[it.type]||it.type)+'</span>'
    +(it.rarity && it.rarity!=='обычный'?'<span class="type-tag">'+esc(it.rarity)+'</span>':'')
    +tagChips(it.tags,ITEM_TAGS)
    +'<span class="spacer"></span>'+extra+'</div>';
  h+=descBlock(it.desc);
  const meta=[];
  if(it.weight) meta.push('<b>Вес:</b> '+esc(it.weight));
  if(it.cost) meta.push('<b>Цена:</b> '+esc(it.cost));
  if(it.dmg) meta.push('<b>Урон:</b> <span class="dmg">'+esc(it.dmg)+(it.dmgType?' ('+esc(it.dmgType)+')':'')+'</span>');
  if(it.ac) meta.push('<b>КД:</b> '+esc(it.ac));
  if(it.slot) meta.push('<b>Слот:</b> '+esc(ITEM_SLOT_RU[it.slot]||it.slot));
  if(meta.length) h+='<div class="stat-line">'+meta.join(' &nbsp;·&nbsp; ')+'</div>';
  if(it.props) h+='<div class="props-block"><span class="pt">Свойства:</span><div class="entry-desc">'+esc(it.props)+'</div></div>';
  return h+'</div>';
}
function spellCardHTML(sp, extra){

    +'<span class="type-tag">'+(sp.l===0?'заговор':sp.l+' круг')+'</span>'
    +'<span class="type-tag">'+esc(sp.s)+'</span>'
    +(sp.ritual?'<span class="type-tag">ритуал</span>':'')

    +'<div><b>Время:</b> '+esc(sp.t||'—')+'</div><div><b>Дистанция:</b> '+esc(sp.r||'—')+'</div>'
    +'<div><b>Компоненты:</b> '+esc(sp.cm||'—')+'</div><div><b>Длительность:</b> '+esc(sp.d||'—')+'</div>'
    +(sp.c?'<div><b>Классы:</b> '+esc(sp.c)+'</div>':'')+'</div>';

const ABILITY_TYPES={class:'Классовая',racial:'Расовая',feat:'Черта',other:'Прочее'};
function abilityCardHTML(ab, extra){
  extra=extra||'';

/* ═══════════════ БАЗА: ЗАКЛИНАНИЯ ═══════════════ */
const dbFlt={ sp:{q:'',l:'',s:''}, it:{q:'',type:'',tag:''}, ab:{q:'',type:''} };
let editing={sp:null,it:null,ab:null}; /* null=закрыт, ''=новая запись, id=правка */

function renderSpellsDB(){
  const box=document.getElementById('tab-spellsdb'); const f=dbFlt.sp;
  let h='<h2 class="rubric">Гримуар мира — база заклинаний</h2>'
   +'<div class="db-bar">'
   +'<input type="text" placeholder="Поиск заклинаний…" value="'+esc(f.q)+'" oninput="dbFlt.sp.q=this.value;renderSpellsDB()">'
   +'<select onchange="dbFlt.sp.l=this.value;renderSpellsDB()"><option value="">Все круги</option><option value="0"'+(f.l==='0'?' selected':'')+'>Заговоры</option>'
   +[1,2,3,4,5,6,7,8,9].map(l=>'<option value="'+l+'"'+(f.l===String(l)?' selected':'')+'>'+l+' круг</option>').join('')+'</select>'
   +'<select onchange="dbFlt.sp.s=this.value;renderSpellsDB()"><option value="">Все школы</option>'
   +SPELL_SCHOOLS.map(s=>'<option'+(f.s===s?' selected':'')+'>'+s+'</option>').join('')+'</select>'
   +'<button class="btn rub" onclick="openSpellEd(\'\')">✚ Новое заклинание</button></div>';
  if(editing.sp!==null) h+=spellEditorHTML();
  const arr=spellsDB.filter(sp=>
    (!f.q || sp.n.toLowerCase().includes(f.q.toLowerCase()) || (sp.x||'').toLowerCase().includes(f.q.toLowerCase()))
    && (f.l==='' || sp.l===+f.l) && (!f.s || sp.s===f.s)
  ).sort((a,b)=>a.l-b.l || a.n.localeCompare(b.n,'ru'));
  h+='<p class="note-ital" style="font-size:14px">Записей: '+arr.length+' из '+spellsDB.length+'</p>';
  arr.forEach(sp=>{
    h+=spellCardHTML(sp,
      '<button class="btn ghost sm" onclick="openSpellEd(\''+sp.id+'\')">✎</button>'
      +'<button class="del-x" title="Вычеркнуть из гримуара" onclick="delSpellDB(\''+sp.id+'\')">✕</button>');
  });
  box.innerHTML=h;
}
function openSpellEd(id){ editing.sp=id; renderSpellsDB(); window.scrollTo({top:0,behavior:'smooth'}); }
function spellEditorHTML(){
  const sp=spellsDB.find(x=>x.id===editing.sp)||{n:'',l:0,s:'Воплощение',c:'',t:'1 действие',r:'',cm:'В, С',d:'',ritual:false,conc:false,tags:[],x:'',hi:''};
  return '<div class="editor"><h3>'+(editing.sp?'Правка заклинания':'Новое заклинание')+'</h3>'
   +'<div class="f-grid">'
   +'<div><label>Название</label><input type="text" id="edSpN" value="'+esc(sp.n)+'"></div>'
   +'<div><label>Круг (0 = заговор)</label><input type="number" id="edSpL" min="0" max="9" value="'+sp.l+'"></div>'
   +'<div><label>Школа</label><select id="edSpS">'+SPELL_SCHOOLS.map(s=>'<option'+(s===sp.s?' selected':'')+'>'+s+'</option>').join('')+'</select></div>'

/* ═══ Авторасчеты листа (передовые практики) ═══ */
function invEntry(c,id){ return (c.inventory||[]).find(e=>e.id===id); }
function acAuto(c){
  const dx=(typeof eMod==='function')?eMod(c,'dex'):mod(c.ab.dex);
  let base=10+dx, shield=0;
  const eq=c.equipment||{};
  const chestE=invEntry(c,eq.CHEST), chest=chestE?itemOf(chestE.itemId):null;
  if(chest&&chest.ac){
    const m=String(chest.ac).match(/(\d+)/);
    if(m){ base=+m[1]; if(/лов/i.test(chest.ac)) base+=(/макс/i.test(chest.ac)?Math.min(2,dx):dx); }
  }
  const offE=invEntry(c,eq.OFF_HAND), off=offE?itemOf(offE.itemId):null;
  if(off&&off.type==='armor'){ const m=String(off.ac||'').match(/(\d+)/); shield=m?+m[1]:2; }
  return base+shield;
}
function acBase(c){
  if(c.acOverride!=null) return c.acOverride;
  const auto=acAuto(c), magical=fxSet(c,'acbase');
  const eq=c.equipment||{}, chestE=invEntry(c,eq.CHEST), chest=chestE?itemOf(chestE.itemId):null;
  if(magical!=null&&!chest){
    const dx=eMod(c,'dex'), shield=Math.max(0,auto-(10+dx));
    return Math.max(auto,(+magical||10)+dx+shield);
  }
  return auto;
}
function acTotal(c){
  const mn=fxMin(c,'ac');
  if(mn!=null) return Math.max(mn, acBase(c)+fxSum(c,'ac')); return acBase(c)+((typeof fxSum==='function')?fxSum(c,'ac'):0); }
function setAcOverride(v){ const c=cc(); if(!c) return; const s=String(v).trim(); c.acOverride=(s===''?null:Math.max(0,parseInt(s,10)||0)); scheduleSave(); renderChars(); }
function initTotal(c){ return eMod(c,'dex')+(+c.initB||0)+fxSum(c,'init'); }
function setInitB(v){ const c=cc(); if(!c) return; c.initB=parseInt(v,10)||0; scheduleSave(); renderChars(); }
function perceptionIdx(){ return SKILLS.findIndex(s=>s[0]==='Внимательность'); }
function passivePerc(c){ const i=perceptionIdx(); return 10+(i>=0?skillBonus(c,i).v:eMod(c,'wis'))+fxSum(c,'passperc'); }
function weaponRows(c){
  const eq=c.equipment||{}, seen={}, rows=[];
  ['MAIN_HAND','TWO_HAND','OFF_HAND'].forEach(sl=>{
    const eid=eq[sl]; if(!eid||seen[eid]) return; seen[eid]=1;
    const e=invEntry(c,eid), it=e?itemOf(e.itemId):null;
    if(!it||it.type!=='weapon') return;
    const tags=it.tags||[];
    const useDex=tags.includes('ranged')||(tags.includes('finesse')&&eMod(c,'dex')>=eMod(c,'str'));
    const m=useDex?eMod(c,'dex'):eMod(c,'str');
    const hasProf=(typeof weaponProfHas==='function')?weaponProfHas(c,it):true;
    rows.push({n:it.n+(hasProf?'':' (без владения)'), atk:m+(hasProf?PROF[c.level]:0)+fxSum(c,'atk'), dmg:it.dmg||'', dt:it.dmgType||'', m:m+fxSum(c,'dmg'), abn:useDex?'Лов':'Сил'});
  });
  rows.push({n:'Безоружный удар', atk:eMod(c,'str')+PROF[c.level]+fxSum(c,'atk'), dmg:'', dt:'дробящий', m:eMod(c,'str')+fxSum(c,'dmg'), abn:'Сил', flat:true});
  return rows;
}
function spellAbOf(c){
  if(c.spellAb) return c.spellAb;
  const cl=c.cls||'';
  if(/Жрец|Друид|Следопыт/.test(cl)) return 'wis';
  if(/Бард|Чародей|Колдун|Паладин/.test(cl)) return 'cha';
  return 'int';
}
function setSpellAb(v){ const c=cc(); if(!c) return; c.spellAb=v; scheduleSave(); renderChars(); }
function spellDC(c){ return 8+PROF[c.level]+eMod(c,spellAbOf(c)); }
function spellAtk(c){ return PROF[c.level]+eMod(c,spellAbOf(c)); }
function carryWeight(c){
  let w=0;
  (c.inventory||[]).forEach(e=>{ const it=itemOf(e.itemId); if(!it||!it.weight) return;
    const v=parseFloat(String(it.weight).replace(',','.')); if(v) w+=v*(e.qty||1); });
  (c.inventory||[]).forEach(e=>{ if(Array.isArray(e.inside)) w+=innerWeightOf(e); });
  return Math.round(w*10)/10;
}
function spendHitDie(){
  const c=cc(); if(!c) return;
  const hd=classOf(c).hd||8;
  if(c.hdUsed>=c.level){ setStatus('Кости хитов исчерпаны — нужен долгий отдых.'); return; }
  const con=eMod(c,'con');
  askRolls({title:'⚂ Кость хитов — '+c.name, note:'Игрок бросает d'+hd+'; лечение = бросок '+(con>=0?'+ '+con:'− '+Math.abs(con))+' (Телосложение), минимум 1.',
    rows:[{key:'r',label:'d'+hd,min:1,max:hd}],
    compute:v=>'Лечение: '+v.r+(con?(con>0?' + '+con:' − '+Math.abs(con)):'')+' = +'+Math.max(1,v.r+con)+' хитов',
    apply:v=>{
      const heal=Math.max(1,v.r+con);
      c.hdUsed=(+c.hdUsed||0)+1; c.hp=Math.min((typeof eHpMax==='function')?eHpMax(c):c.hpMax,(+c.hp||0)+heal);
      diceOutSet('Кость хитов: d'+hd+' → '+v.r+(con?(con>0?' + '+con:' − '+Math.abs(con)):'')+' = +'+heal+' хитов','var(--ok)');
      scheduleSave(); renderChars();
    }});
}
function returnHitDie(){ const c=cc(); if(!c) return; c.hdUsed=Math.max(0,(+c.hdUsed||0)-1); scheduleSave(); renderChars(); }
function shortRest(){
  const c=cc(); if(!c) return;
  c.abilities.forEach(a=>{ const db=abilityOf(a.abilityId); if(db&&db.uses!=null&&db.rest==='короткий отдых') a.cur=db.uses; });
  /* Арканное восстановление волшебника: раз в день, суммарный круг ячеек до половины уровня */
  if(c.cls==='Волшебник' && !c.arcUsed && casterMeta(c)){
    let budget=Math.ceil(c.level/2);
    const lvls=Object.keys(c.slots||{}).map(Number).sort((a,b)=>a-b).filter(lv=>lv<=5);
    const miss=lvls.some(lv=>c.slots[lv].cur<c.slots[lv].max);
    if(miss && confirm('⚕ Арканное восстановление (раз в день): вернуть потраченные ячейки суммарным кругом до '+budget+' (ячейки не выше 6 круга)?')){
      const got=[];
      lvls.forEach(lv=>{ while(budget>=lv && c.slots[lv].cur<c.slots[lv].max){ c.slots[lv].cur++; budget-=lv; got.push(lv); } });
      c.arcUsed=true;
      if(got.length) setStatus('⚕ Арканное восстановление: возвращены ячейки кругов '+got.join(', ')+'.');
    }
  }
  setStatus('☕ Короткий отдых: способности короткого отдыха восстановлены; кости хитов тратьте кнопкой ⚁ в ячейке «Кости хитов».');
  scheduleSave(); renderChars();
}
function upgradeChar3(c){
  if(!c) return c;
  c.cond=normalizeConditions(c.cond);
  if(!Array.isArray(c.resist)) c.resist=[];
  if(!Array.isArray(c.vuln)) c.vuln=[];
  if(!Array.isArray(c.immune)) c.immune=[];
  if(c._v3) return c;
  if(c.acOverride===undefined){
    const cur=+c.ac||0, auto=acAuto(c);
    c.acOverride=(cur&&cur!==auto&&cur!==10)?cur:null;
  }
  if(c.initB===undefined) c.initB=0;
  if(c.hdUsed===undefined) c.hdUsed=0;
  if(c.spellAb===undefined) c.spellAb='';
  if(!c.persona) c.persona={tr:'',id:'',bd:'',fl:'',ap:''};
  if(!Array.isArray(c.activeFx)) c.activeFx=[];
  if(!Array.isArray(c.fxOff)) c.fxOff=[];
  if(c.spentRest===undefined) c.spentRest=0;
  if(c.arcUsed===undefined) c.arcUsed=false;
  if(c.inspiration===undefined) c.inspiration=false;
  c._v3=true; return c;
}

function setHp(v){
  const c=cc(); if(!c) return;
  const before=+c.hp||0, next=Math.max(0,Math.min(eHpMax(c),+v||0));
  c.hp=next;
  if(next<before&&typeof concDamageCheck==='function'){
    const dmg=before-next;
    if(next===0) breakConcentration(c,'герой упал до 0 хитов');
    else concDamageCheck(c,dmg);
  }
  scheduleSave(); renderChars();
}
function hpDelta(d){ const c=cc(); if(!c) return;
  const rawDmg=d<0?-d:0;
  if(d<0 && c.hpTemp>0){ const useTemp=Math.min(c.hpTemp,-d); c.hpTemp-=useTemp; d+=useTemp; }
  c.hp=Math.max(0,Math.min((typeof eHpMax==='function')?eHpMax(c):c.hpMax,(+c.hp||0)+d));
  if(rawDmg>0 && typeof concDamageCheck==='function'){
    if(c.hp<=0){ if(typeof breakConcentration==='function') breakConcentration(c,'герой упал до 0 хитов'); }
    else concDamageCheck(c, rawDmg);
  }
  scheduleSave(); renderChars(); }
function toggleInspiration(){ const c=cc(); if(!c) return; c.inspiration=!c.inspiration; scheduleSave(); renderChars(); }
function levelDown(){
  const c=cc(); if(!c||c.level<=1) return;
  if(!confirm('Откатить '+c.name+' на уровень назад ('+c.level+' → '+(c.level-1)+')? Авто-добавленные заклинания недоступных кругов уйдут из книги, ячейки пересчитаются.')) return;
  const oldLvl=c.level;
  c.level--;
  c.xp=Math.min(c.xp, XP_TABLE[c.level+1]-1);
  if(typeof autoLevelSpells==='function'){
    const r=autoLevelSpells(c, oldLvl);
    if(r.removed.length) setStatus('📖 Откат уровня: из книги ушли '+r.removed.slice(0,5).join(', ')+(r.removed.length>5?' и еще '+(r.removed.length-5):'')+'.');
  }
  if(typeof applyClassSlots==='function' && casterMeta(c)) applyClassSlots(c);
  c.hpPend=false;
  scheduleSave(); renderChars();
}
function levelUp(){
  const c=cc(); if(!c||c.level>=20) return;
  const oldLvl=c.level;
  c.level++;
  classOf(c).lv.filter(x=>x[0]===c.level).forEach(x=>{
    const fn=x[1];
    let db=abilitiesDB.find(a=>a.type==='class'&&a.source===c.cls&&a.n===fn);
    if(!db){ db={id:'ab_'+uid(), n:fn, type:'class', source:c.cls, custom:true, tags:['classfeature'], uses:null, rest:'',
      x:'Черта класса «'+c.cls+'», получена на '+c.level+' уровне. Опишите ее в своде способностей.'}; abilitiesDB.push(db); }
    if(!c.abilities.some(a=>a.abilityId===db.id)) c.abilities.push({abilityId:db.id, cur:null, notes:''});
  });
  if(typeof autoLevelSpells==='function'){
    const r=autoLevelSpells(c, oldLvl);
    if(r.added.length) setStatus('📖 Уровень '+c.level+': в книгу вошли заклинания '+Math.min(9,Math.ceil(c.level/2))+' круга — '+r.added.slice(0,5).join(', ')+(r.added.length>5?' и еще '+(r.added.length-5):'')+'.');
  }
  if(typeof applyClassSlots==='function' && casterMeta(c)) applyClassSlots(c);
  c.hpPend=true; scheduleSave(); renderChars();
}
function applyHp(){
  const c=cc(); if(!c) return;

  c.hpMax=Math.max(1,(+c.hpMax||0)+v); c.hp=Math.min(c.hpMax,(+c.hp||0)+v);
  c.hpPend=false; scheduleSave(); renderChars();
}

/* ── Подвкладка: Характеристики ── */
function abDelta(k,d){ const c=cc(); if(!c) return; c.ab[k]=Math.max(1,Math.min(30,(+c.ab[k]||10)+d)); scheduleSave(); renderChars(); }
function toggleSaveProf(k){ const c=cc(); if(!c) return; c.saves[k]=!c.saves[k]; scheduleSave(); renderChars(); }
function cycleSkillProf(i){ const c=cc(); if(!c) return; const n=SKILLS[i][0];
  if(!c.skills[n]) c.skills[n]={p:0,m:null};
  c.skills[n].p=(c.skills[n].p+1)%3; scheduleSave(); renderChars(); }
function editSkillBonus(i){
  const c=cc(); if(!c) return; const n=SKILLS[i][0];
  if(!c.skills[n]) c.skills[n]={p:0,m:null};
  const cur=c.skills[n].m;
  const v=prompt('Ручной бонус для «'+n+'» (оставьте пустым для автоматического расчета):', cur==null?'':cur);
  if(v===null) return;
  c.skills[n].m = v.trim()==='' ? null : (parseInt(v,10)||0);
  scheduleSave(); renderChars();
}
function skillBonus(c,i){
  const sk=SKILLS[i]; const rec=c.skills[sk[0]]||{p:0,m:null};
  const fxb=(typeof fxSkillBonus==='function')?fxSkillBonus(c,sk[0]):0;
  if(rec.m!=null) return {v:rec.m+fxb, manual:true, p:rec.p, fxb};
  return {v:eMod(c,sk[1])+rec.p*PROF[c.level]+fxb, manual:false, p:rec.p, fxb};
}
function setExhaustion(v){ const c=cc(); if(!c) return; c.exhaustion=Math.max(0,Math.min(6,+v||0)); scheduleSave(); renderChars(); }
function toggleCond(n){ const c=cc(); if(!c) return;
  const i=c.cond.indexOf(n); if(i>=0) c.cond.splice(i,1); else c.cond.push(n);
  if(i<0 && typeof ACTION_BLOCK_CONDS!=='undefined' && ACTION_BLOCK_CONDS.indexOf(n)>=0 && typeof breakConcentration==='function')
    breakConcentration(c, 'состояние «'+n+'» делает героя недееспособным');
  scheduleSave(); renderChars(); }
function deathVerdict(r){
  if(r===20) return {text:'d20 20 — герой приходит в себя с 1 хитом.', kind:'up'};
  if(r===1)  return {text:'d20 1 — засчитываются сразу ДВА провала.', kind:'f2'};
  return r>=10?{text:'d20 '+r+' — успех (нужно 10 и выше).', kind:'s'}
              :{text:'d20 '+r+' — провал (нужно 10 и выше).', kind:'f'};
}
function deathSaveRoll(){
  const c=cc(); if(!c) return;
  if((+c.hp||0)>0){ setStatus('Спасброски от смерти делаются только при 0 хитов.', true); return; }
  askRolls({title:'⚂ Спасбросок от смерти — '+c.name,
    note:'Чистый d20 без модификаторов. 10 и выше — успех, 9 и ниже — провал. Три успеха — герой стабилизирован, три провала — смерть. 20 — приходит в себя с 1 хитом, 1 — сразу два провала.',
    rows:[{key:'r', label:'d20', min:1, max:20}],
    compute:v=>deathVerdict(v.r).text,
    apply:v=>{
      const d=deathVerdict(v.r);
      c.deaths=c.deaths||{s:0,f:0};
      let out=d.text;
      if(d.kind==='up'){
        c.hp=1; c.deaths={s:0,f:0};
        c.cond=normalizeConditions(c.cond).filter(x=>x!=='Бессознательный');
        out+=' Герой в сознании.';
      } else if(d.kind==='f2') c.deaths.f=Math.min(3,(c.deaths.f||0)+2);
      else if(d.kind==='f')  c.deaths.f=Math.min(3,(c.deaths.f||0)+1);
      else                   c.deaths.s=Math.min(3,(c.deaths.s||0)+1);
      if(c.deaths.f>=3) out+=' Три провала — герой погибает.';
      else if(c.deaths.s>=3) out+=' Три успеха — герой стабилизирован (без сознания, но жив).';
      diceOutSet('Спасбросок от смерти: '+out, d.kind==='up'||d.kind==='s'?'var(--ok)':'var(--rubric)');
      setStatus('⚂ '+c.name+' — спасбросок от смерти: '+out);
      castLogLine('⚂ '+c.name+': спасбросок от смерти — '+out);
      scheduleSave(); renderChars();
    }});
}

function isEquipped(c,entryId){ return Object.values(c.equipment||{}).includes(entryId); }
function invChargeDelta(entryId,d){
  const c=cc(); if(!c) return;
  const e=(c.inventory||[]).find(x=>x.id===entryId); if(!e) return;
  const it=itemOf(e.itemId); if(!it) return;
  const ch=invCharges(e,it); if(!ch) return;
  ch.cur=Math.max(0,Math.min(ch.max,ch.cur+d));
  scheduleSave(); renderChars();
}
function invQty(entryId,d){ const c=cc(); const e=c.inventory.find(x=>x.id===entryId); if(!e) return;
  e.qty=Math.max(1,(e.qty||1)+d); scheduleSave(); renderChars(); }
function invNoteClear(entryId){ const c=cc(); if(!c) return;
  const e=c.inventory.find(x=>x.id===entryId); if(!e) return;
  e.notes=''; scheduleSave(); renderChars(); }
function invDel(entryId){ const c=cc(); const e=c.inventory.find(x=>x.id===entryId); if(!e) return;
  const it=itemOf(e.itemId);
  if(!confirm('Убрать «'+(it?it.n:'предмет')+'» из инвентаря?')) return;
  Object.keys(c.equipment).forEach(s=>{ if(c.equipment[s]===entryId) delete c.equipment[s]; });
  c.inventory=c.inventory.filter(x=>x.id!==entryId); scheduleSave(); renderChars(); }
function invEquipToggle(entryId){
  const c=cc(); const e=c.inventory.find(x=>x.id===entryId); if(!e) return;
  const it=itemOf(e.itemId); if(!it) return;
  if(isEquipped(c,entryId)){
    Object.keys(c.equipment).forEach(s=>{ if(c.equipment[s]===entryId) delete c.equipment[s]; });
  } else {
    if(!it.slot){ alert('У этого предмета нет слота экипировки. Назначьте слот в базе предметов (✎).'); return; }
    /* предупреждение о ношении без владения — последствия по правилам 5e */
    if(typeof itemArmorKind==='function'){
      const kind=itemArmorKind(it), profs=armorProfsOf(c);
      if(kind&&profs!==null&&!profs[kind]&&!profExempt(it)){
        if(!confirm(c.name+' не владеет этим видом защиты ('+ARMOR_KIND_RU[kind]+').\n\nНадеть с последствиями по правилам? Появятся: помеха на проверки/спасброски/атаки Силы и Ловкости, запрет заклинаний (видно в «Действующих эффектах», отключается ⏻ решением мастера).')) return;
      } else if(kind&&armorMaterialBanOf(c)&&itemIsMetal(it)&&!profExempt(it)){
        if(!confirm(c.name+' связан обетом не носить металлические доспехи («'+it.n+'» — металл).\n\nНадеть вопреки обету?')) return;
      }
      if(it.type==='weapon'&&typeof weaponProfHas==='function'&&!weaponProfHas(c,it)){
        if(!confirm(c.name+' не владеет этим оружием («'+it.n+'»).\n\nВзять в руки? Атаки будут совершаться БЕЗ бонуса мастерства (пометка появится в панели атак).')) return;
      }
    }
    const clear=id=>Object.keys(c.equipment).forEach(s=>{ if(c.equipment[s]===id) delete c.equipment[s]; });
    if(it.slot==='TWO_HAND'){ clear(c.equipment.MAIN_HAND); clear(c.equipment.OFF_HAND);
      c.equipment.MAIN_HAND=entryId; c.equipment.OFF_HAND=entryId; }
    else if(it.slot==='RING'){ if(!c.equipment.RING_L) c.equipment.RING_L=entryId;
      else if(!c.equipment.RING_R) c.equipment.RING_R=entryId;
      else { clear(c.equipment.RING_L); c.equipment.RING_L=entryId; } }
    else if(it.slot==='MAIN_HAND'){ const other=c.equipment.MAIN_HAND;
      if(other){ const oit=itemOf((c.inventory.find(x=>x.id===other)||{}).itemId);
        if(oit&&oit.slot==='TWO_HAND') clear(other); }
      c.equipment.MAIN_HAND=entryId; }
    else { c.equipment[it.slot]=entryId; }
  }
  scheduleSave(); renderChars();
}

    c.equipment.MAIN_HAND=entryId; c.equipment.OFF_HAND=entryId; }
  else { const occ=c.equipment[cellId];
    if(occ){ const oit=itemOf((c.inventory.find(x=>x.id===occ)||{}).itemId);
      if(oit&&oit.slot==='TWO_HAND') clear(occ); else delete c.equipment[cellId]; }
    c.equipment[cellId]=entryId; }
  selSlot=null; scheduleSave(); renderChars();
}
function unequipSlot(cellId){
  const c=cc(); const id=c.equipment[cellId]; if(!id) return;
  Object.keys(c.equipment).forEach(s=>{ if(c.equipment[s]===id) delete c.equipment[s]; });
  scheduleSave(); renderChars();
}

/* ── Подвкладка: Заклинания ── */
const bookFlt={q:'',l:'',prep:''};
function addSpellFromDB(spellId){
  const c=cc(); if(!c) return;
  if(!c.spellbook.some(x=>x.spellId===spellId)) c.spellbook.push({spellId, prep:false});
  sheetSearch.sp=''; scheduleSave(); renderChars();
}
function delBookSpell(spellId){ const c=cc(); if(!c) return;
  c.spellbook=c.spellbook.filter(x=>x.spellId!==spellId); scheduleSave(); renderChars(); }
function togglePrep(spellId){ const c=cc(); const e=c.spellbook.find(x=>x.spellId===spellId); if(!e) return;
  if(!e.prep && casterMeta(c) && prepCount(c)>=prepMax(c)){
    if(!confirm('Лимит подготовки достигнут: '+prepCount(c)+' из '+prepMax(c)+' (уровень + модификатор заклинательной характеристики).\n\nОК — нарушить правило решением мастера.\nОтмена — сперва снять подготовку с другого заклинания.')) return;
  }
  e.prep=!e.prep; scheduleSave(); renderChars(); }
function quickAddSpell(){
  const g=id=>document.getElementById(id);
  const n=g('qsN').value.trim(); if(!n){ alert('Заклинанию нужно имя.'); return; }
  const sp={id:'sp_'+uid(), n, l:Math.max(0,Math.min(9,+g('qsL').value||0)), s:g('qsS').value,
    c:'', t:g('qsT').value.trim(), r:g('qsR').value.trim(), cm:g('qsCm').value.trim(), d:g('qsD').value.trim(),
    ritual:false, conc:g('qsConc').checked, custom:true, tags:[], x:g('qsX').value, hi:''};
  spellsDB.push(sp);
  cc().spellbook.push({spellId:sp.id, prep:false});
  quickForm.sp=false; scheduleSave(); renderChars();
}
function slotGem(lv,i){
  const c=cc(); const s=c.slots[lv]; if(!s) return;
  /* клик по камню: потратить до этого камня или восстановить */
  s.cur = (i<=s.cur) ? i-1 : i;
  s.cur=Math.max(0,Math.min(s.max,s.cur));
  scheduleSave(); renderChars();
}
function setSlotMax(lv){
  const c=cc(); const cur=(c.slots[lv]||{max:0}).max;
  const v=prompt('Число ячеек '+lv+' круга (0 — убрать):', cur);
  if(v===null) return;
  const m=Math.max(0,Math.min(9,+v||0));
  if(m===0) delete c.slots[lv];
  else c.slots[lv]={max:m, cur:Math.min(m,(c.slots[lv]||{cur:m}).cur)};
  scheduleSave(); renderChars();
}
function suggestSlots(){
  const c=cc(); if(!c) return;
  if(!casterMeta(c)){ setStatus('«'+c.cls+'» не владеет ячейками заклинаний по таблицам заклинателей.'); return; }
  applyClassSlots(c);
  setStatus('Ячейки выставлены по таблице: '+(casterMeta(c).kind==='half'?'полузаклинатель':'полный заклинатель')+', уровень '+c.level+' (потраченные сохранены).');
  scheduleSave(); renderChars();
}
function longRest(){
  const c=cc(); if(!c) return;
  if(typeof breakConcentration==='function') breakConcentration(c,'начат долгий отдых');
  Object.keys(c.slots).forEach(l=>{ c.slots[l].cur=c.slots[l].max; });
  c.abilities.forEach(a=>{ const db=abilityOf(a.abilityId); if(db&&db.uses!=null) a.cur=db.uses; });
  c.hpTemp=0; c.exhaustion=Math.max(0,c.exhaustion-1); c.deaths={s:0,f:0};
  c.hdUsed=Math.max(0,(+c.hdUsed||0)-Math.max(1,Math.ceil(c.level/2)));   /* возвращается половина костей хитов */
  /* Заклинания дольше 8 часов не исчезают от отдыха; краткие эффекты и
     активированные способности завершаются, обратимые хиты корректно снимаются. */
  const keep=[];
  (c.activeFx||[]).forEach(a=>{
    const rem=fxRemaining(a), end=(a.k==='ability'||a.k==='use'||(rem!=null&&rem<=4800));
    if(end) detachActiveFx(c,a); else keep.push(a);
  });
  c.activeFx=keep;
  c.spentRest=0; c.arcUsed=false;      /* счетчик трат ячеек и арканное восстановление обнуляются */
  if(typeof rechargeItems==='function') rechargeItems(c,'long');
  if(typeof fxInvalidate==='function') fxInvalidate();
  syncStackedGrants(c);
  c.hp=(typeof eHpMax==='function')?eHpMax(c):c.hpMax;
  scheduleSave(); renderChars();
}

/* ── умная сводка кругов: что есть, что тратится, что вернется ── */
function spellDashHTML(c){
  const meta=casterMeta(c);
  const lvls=Object.keys(c.slots||{}).map(Number).sort((a,b)=>a-b);
  let h='<div class="spell-dash">';
  /* пипсы ячеек по кругам */
  if(lvls.length){
    h+='<div class="sd-slots">';
    lvls.forEach(lv=>{
      const s=c.slots[lv];
      let pips=''; for(let i=0;i<s.max;i++) pips+='<span class="pip-slot'+(i<s.cur?' on':'')+'"></span>';
      h+='<span class="sd-circle'+(s.cur===0?' sd-empty':'')+'"><b>Круг '+lv+'</b> '+pips+' '+s.cur+' / '+s.max+(s.cur===0?' — исчерпан':'')+'</span>';
    });
    h+='</div>';
  }
  /* подготовка и доступность */
  if(meta){
    const pc=prepCount(c), pm=prepMax(c);
    const cantrips=(c.spellbook||[]).filter(e=>{ const sp=spellOf(e.spellId); return sp&&sp.l===0; }).length;
    const prepped=(c.spellbook||[]).filter(e=>{ const sp=spellOf(e.spellId); return e.prep&&sp&&sp.l>0; });
    const castable=prepped.filter(e=>{ const sp=spellOf(e.spellId);
      return lvls.some(lv=>lv>=sp.l && c.slots[lv].cur>0); }).length;
    const ritual=(c.spellbook||[]).filter(e=>{ const sp=spellOf(e.spellId); return sp&&sp.ritual; }).length;
    const spent=+c.spentRest||0;
    h+='<div class="sd-line'+(pc>pm?' sd-over':'')+'">Подготовлено: <b>'+pc+' из '+pm+'</b> (уровень + модификатор характеристики)'+(pc>pm?' — превышение решением мастера':'')+'; смена списка — на долгом отдыхе.</div>';
    h+='<div class="sd-line">Сейчас можно наложить: <b>'+castable+'</b> из '+prepped.length+' подготовленных (по свободным ячейкам подходящих кругов) · заговоров без ячеек: '+cantrips+(ritual?' · ритуалов без ячеек: '+ritual:'')+'.</div>';
    h+='<div class="sd-line'+(spent>=3?' sd-hot':'')+'">Потрачено ячеек с последнего долгого отдыха: <b>'+spent+'</b>'+(spent>=3?' — бой заметно истощает запас!':'')+'.</div>';
    const total=lvls.reduce((a,lv)=>a+c.slots[lv].cur,0);
    const totalMax=lvls.reduce((a,lv)=>a+c.slots[lv].max,0);
    h+='<div class="sd-line">После долгого отдыха: восстановятся все ячейки ('+(totalMax-total)+' шт.) и способности, список подготовки можно сменить'
      +(c.cls==='Волшебник'?(c.arcUsed?'; арканное восстановление уже использовано сегодня':'; на коротком отдыхе доступно ⚕ арканное восстановление (суммарно кругов: до '+Math.ceil(c.level/2)+')'):'')+'.</div>';
  }
  return h+'</div>';
}

/* ── Подвкладка: Способности ── */
const abFlt={cat:'all',q:''};
function addAbilityFromDB(abilityId){
  const c=cc(); if(!c) return;
  if(!c.abilities.some(x=>x.abilityId===abilityId)){
    const db=abilityOf(abilityId);
    c.abilities.push({abilityId, cur:db&&db.uses!=null?db.uses:null, notes:''});
  }
  sheetSearch.ab=''; scheduleSave(); renderChars();
}
function delCharAbility(abilityId){ const c=cc(); if(!c) return;
  c.abilities=c.abilities.filter(x=>x.abilityId!==abilityId); scheduleSave(); renderChars(); }
function abilityUse(abilityId,d){
  const c=cc(); const e=c.abilities.find(x=>x.abilityId===abilityId); const db=abilityOf(abilityId);
  if(!e||!db||db.uses==null) return;
  if(e.cur==null) e.cur=db.uses;
  e.cur=Math.max(0,Math.min(db.uses,e.cur+d)); scheduleSave(); renderChars();
}
function quickAddAbility(){
  const g=id=>document.getElementById(id);
  const n=g('qaN').value.trim(); if(!n){ alert('Способности нужно имя.'); return; }
  const uv=g('qaUses').value;
  const ab={id:'ab_'+uid(), n, type:g('qaT').value, source:g('qaSrc').value.trim(), custom:true, tags:[],
    uses:uv===''?null:Math.max(0,+uv||0), rest:g('qaRest').value, x:g('qaX').value};
  abilitiesDB.push(ab);
  cc().abilities.push({abilityId:ab.id, cur:ab.uses, notes:''});
  quickForm.ab=false; scheduleSave(); renderChars();
}
function abilityDashHTML(c){
  const list=(c.abilities||[]).map(e=>({e, db:abilityOf(e.abilityId)})).filter(x=>x.db);
  const act=list.filter(x=>x.db.uses!=null);
  if(!act.length) return '';
  let ready=0, backShort=0, backLong=0, backBattle=0;
  act.forEach(x=>{
    const cur=x.e.cur==null?x.db.uses:x.e.cur;
    if(cur>0) ready++;
    const miss=x.db.uses-cur;
    if(miss>0){
      if(x.db.rest==='короткий отдых') backShort+=miss;
      else if(x.db.rest==='длинный отдых'||x.db.rest==='раз в день') backLong+=miss;
      else backBattle+=miss;
    }
  });
  return '<div class="spell-dash"><div class="sd-line">Способностей с зарядами: <b>'+act.length+'</b> · готовы к применению: <b>'+ready+'</b>'
    +(backBattle?' · вернется после боя: <b>'+backBattle+'</b>':'')
    +(backShort?' · после короткого отдыха: <b>'+backShort+'</b>':'')
    +(backLong?' · после длинного отдыха: <b>'+backLong+'</b>':'')+'.</div>'
    +'<div class="sd-line">Пассивные действуют постоянно и видны в «Действующих эффектах»; активные применяются кнопкой «✦ Применить» — с целью, тратой заряда и записью в летопись.</div></div>';
}
function stAbilities(c){
  let h='<div class="panel">';
  const cats=[['all','Все способности'],['class','Классовые'],['racial','Расовые'],['feat','Черты'],['other','Прочие']];
  h+='<div class="subtabs" style="margin-top:0">'+cats.map(x=>'<button class="subtab'+(abFlt.cat===x[0]?' active':'')+'" onclick="abFlt.cat=\''+x[0]+'\';renderChars()">'+x[1]+'</button>').join('')+'</div>';
  h+='<div class="row-line" style="margin:4px 0"><span class="grow"></span><button class="btn ghost sm" title="Восстановить способности с ограничением «раз за бой» у всех героев" onclick="encounterEnd()">⚔ Бой окончен</button></div>'+abilityDashHTML(c);
  h+='<div class="db-bar"><input type="text" placeholder="Найти способность в своде мира и вписать герою…" value="'+esc(sheetSearch.ab)+'" oninput="sheetSearch.ab=this.value;renderChars();const f=document.querySelector(\'#tab-chars .db-bar input\');if(f){f.focus();f.setSelectionRange(f.value.length,f.value.length)}">'
   +'<button class="btn ghost sm" onclick="quickForm.ab=!quickForm.ab;renderChars()">✚ Свое</button>'
   +'<button class="btn ghost sm" onclick="addRaceTraitsToChar()">Вписать черты народа</button></div>';
  if(sheetSearch.ab.trim().length>1){
    const q=sheetSearch.ab.toLowerCase();
    const has=new Set(c.abilities.map(x=>x.abilityId));
    const hits=abilitiesDB.filter(ab=>ab.n.toLowerCase().includes(q)&&!has.has(ab.id)).slice(0,10);
    h+=hits.length?hits.map(ab=>'<div class="spell-hit" onclick="addAbilityFromDB(\''+ab.id+'\')"><span><b>'+esc(ab.n)+'</b> <span style="font-size:13px;color:var(--ink-faint)">'+esc(ABILITY_TYPES[ab.type]||'')+(ab.source?', '+esc(ab.source):'')+'</span></span><span style="color:var(--gold)">+ вписать</span></div>').join('')
      :'<p class="note-ital" style="font-size:14px">В своде мира такого нет — создайте свое.</p>';
  }
  if(quickForm.ab){
    h+='<div class="editor"><h3>Быстрое создание способности</h3><div class="f-grid">'
     +'<div><label>Название</label><input type="text" id="qaN"></div>'
     +'<div><label>Вид</label><select id="qaT">'+Object.keys(ABILITY_TYPES).map(t=>'<option value="'+t+'">'+ABILITY_TYPES[t]+'</option>').join('')+'</select></div>'
     +'<div><label>Источник</label><input type="text" id="qaSrc"></div>'
     +'<div><label>Использований (пусто — без счета)</label><input type="number" id="qaUses" min="0"></div>'
     +'<div><label>Восстановление</label><select id="qaRest"><option value="">—</option><option>короткий отдых</option><option>длинный отдых</option><option>раз в день</option><option>особое</option></select></div></div>'
     +'<label>Описание</label><textarea id="qaX"></textarea>'
     +'<button class="btn rub" onclick="quickAddAbility()">Создать и вписать</button> '
     +'<button class="btn ghost" onclick="quickForm.ab=false;renderChars()">Отменить</button></div>';
  }
  const groups=[['racial','Расовые черты'],['class','Классовые способности'],['feat','Черты'],['other','Особые']];
  let shown=0;
  groups.forEach(gr=>{
    if(abFlt.cat!=='all'&&abFlt.cat!==gr[0]) return;
    const list=c.abilities.map(e=>({e, ab:abilityOf(e.abilityId)})).filter(x=>x.ab&&x.ab.type===gr[0])
      .sort((a,b)=>a.ab.n.localeCompare(b.ab.n,'ru'));
    if(!list.length) return;
    h+='<h3 class="rubric" style="font-size:22px;margin-top:12px">'+gr[1]+'</h3>';
    list.forEach(x=>{
      let uses='';
      if(x.ab.uses!=null){
        const cur=x.e.cur==null?x.ab.uses:x.e.cur;
        uses='<span class="uses-box"><button class="mini-btn" onclick="abilityUse(\''+x.ab.id+'\',-1)">−</button>'
          +cur+' / '+x.ab.uses+'<button class="mini-btn" onclick="abilityUse(\''+x.ab.id+'\',1)">+</button>'
          +(x.ab.rest?'<span style="font-style:italic">'+esc(x.ab.rest)+'</span>':'')+'</span>';
      }
      const isActive=abilityIsActive(x.ab);
      const pool=abilityPoolOf(c,x.ab);
      const poolBox=pool?'<span class="uses-box" title="Общий запас: '+esc(pool.ab.n)+'">'+esc(pool.label)+' '+pool.cur+' / '+pool.max+'</span>':'';
      const fxBtn=isActive
        ?(abilityFxActive(c,x.ab.id)
          ?'<button class="btn ghost sm fx-cast on" title="Эффект действует — нажмите, чтобы снять" onclick="toggleAbilityFx(\''+x.ab.id+'\')">✦ Действует</button>'
          :'<button class="btn ghost sm fx-cast" title="Применить: цель, заряд, лечение и эффекты — единым окном" onclick="abilityCastFx(\''+x.ab.id+'\',\''+c.id+'\')">✦ Применить</button>')
        :'';
      const extra=fxBtn+poolBox+uses
       +'<button class="btn ghost sm" title="Править в своде мира" onclick="switchTab(\'abilitiesdb\');openAbilityEd(\''+x.ab.id+'\')">✎</button>'
       +'<button class="del-x" onclick="delCharAbility(\''+x.ab.id+'\')">✕</button>';
      h+=abilityCardHTML(x.ab, extra);
      shown++;
    });
  });
  if(!shown) h+='<div class="empty-scroll"><span class="big">❦</span>Здесь пока пусто.</div>';
  return h+'</div>';
}

/* ── Подвкладка: Записи ── */
function stNotes(c){
  return '<div class="panel"><div class="f-grid">'
   +'<div><label class="lbl">Игрок</label><input type="text" value="'+esc(c.player)+'" oninput="updC(\'player\',this.value)"></div>'
   +'<div><label class="lbl">Языки</label><input type="text" value="'+esc(c.langs)+'" oninput="updC(\'langs\',this.value)"></div></div>'
   +'<h3 class="rubric" style="font-size:20px;margin-top:12px">Характер героя</h3><div class="persona-grid">'
   +[['tr','Черты характера','Вежлив, но недоверчив к незнакомцам…'],['id','Идеалы','Знание — путь к силе…'],['bd','Привязанности','Библиотека Огмы — мой дом…'],['fl','Слабости','Не могу устоять перед древним фолиантом…'],['ap','Внешность','Высокий эльф с серебристыми волосами…']].map(p=>
     '<div><label class="lbl">'+p[1]+'</label><textarea rows="2" placeholder="'+p[2]+'" oninput="updPersona(\''+p[0]+'\',this.value)">'+esc((c.persona||{})[p[0]]||'')+'</textarea></div>').join('')
   +'</div>'
   +'<label class="lbl">Заметки мастера и история героя</label>'
   +'<textarea style="width:100%;min-height:220px" oninput="updC(\'notes\',this.value)" placeholder="Все, что должно остаться в летописи…">'+esc(c.notes)+'</textarea></div>';
}
