it_палица:{desc:'Тяжелая дубина с расширенным окованным концом, требующая обеих рук. Не знает изящества, но проламывает щиты, двери и черепа с одинаковым равнодушием. Оружие тех, кто предпочитает простые решения.'},
it_ручной_топор:{desc:'Небольшой топор с короткой рукоятью — и инструмент, и оружие. Хорошо ложится в руку, легко уходит в бросок и всегда пригодится у костра. Легкость позволяет сражаться двумя топорами разом.'},
it_серп:{desc:'Изогнутый жатвенный клинок на короткой рукояти. Оружие крестьянских бунтов и лесных культов: незаметен среди утвари, но в умелой руке вспарывает жилы. Кривизна лезвия цепляет то, что прямой клинок пропустил бы.'},
it_легкий_арбалет:{desc:'Ложе с плечами и воротом, натягиваемое ногой в стремени. Бьет точно и сильно, не требуя ни силы лучника, ни долгих лет выучки — потому и оружие ополчения. Перезарядка съедает время: выстрел приходится делать один за действие.'},
it_дротик:{desc:'Короткое утяжеленное древко с острием, рассчитанное на бросок с руки. Носят связками по нескольку штук на поясе. Летит недалеко, но бросается быстро и полагается на Ловкость.'},
it_короткий_лук:{desc:'Гибкий лук в половину человеческого роста, удобный в лесу и с седла. Уступает длинному в дальности, зато не мешает двигаться и стреляет часто. Требует обеих рук и запаса стрел.'},
it_праща:{desc:'Кожаный ремень с расширением посередине. Самое дешевое дальнобойное оружие: снаряды находятся под ногами, а пастушья выучка стоит недорого. Камень из пращи мнет шлем не хуже дубины.'},
it_алебарда:{desc:'Древковое оружие с широким лезвием, крюком и острием на конце. Рубит, колет и стаскивает всадника с седла, доставая противника за три метра. Тяжела и требует обеих рук и простора.'},
it_боевая_кирка:{desc:'Клюв из закаленного железа на прочной рукояти. Создана пробивать доспех там, где меч бессилен: узкое острие входит в стык пластин. В походе годится и по прямому назначению — бить камень.'},
it_боевой_молот:{desc:'Тяжелое навершие на рукояти в предплечье длиной. Дробящий удар не требует остроты и не боится ржавчины, потому молот любят в подземельях и шахтах. Взятый двумя руками, бьет заметно тяжелее.'},
it_боевой_топор:{desc:'Широкое полукруглое лезвие на прочном топорище. Рубит глубоко и страшно, а крюком лезвия можно отвести щит противника. Двумя руками наносит больший урон.'},
it_глефа:{desc:'Длинный клинок, насаженный на древко в рост человека. Позволяет держать строй и доставать врага, не подпуская его вплотную. Требует обеих рук и открытого пространства.'},
it_двуручный_меч:{desc:'Клинок длиной с человека, с длинной рукоятью и мощной гардой. Оружие тех, кто разрывает строй: один замах сносит древки копий вместе с руками. Не оставляет возможности держать щит.'},
it_длинное_копье_пика:{desc:'Древко в три человеческих роста с узким граненым наконечником. Оружие плотного строя: останавливает конницу и достает противника раньше, чем тот сблизится. В тесноте почти бесполезно.'},
it_длинный_меч:{desc:'Прямой клинок в руку длиной, гарда и навершие уравновешивают его в ладони. Оружие рыцарей и городской стражи: одинаково хорош в рубке и в уколе. Одной рукой оставляет место щиту, двумя — бьет сильнее.'},
it_кавалерийское_копье:{desc:'Длинное всадническое копье с расширением у рукояти. В конном ударе вкладывает в острие весь разгон коня. Пешему неудобно: вблизи древко мешает, и удар идет с помехой.'},
it_кнут:{desc:'Плетеный ремень в три метра длиной с утяжеленным кончиком. Урона наносит мало, зато достает издали, сбивает оружие из рук и обвивает лодыжки. Полагается на Ловкость, а не на Силу.'},
it_молот_кувалда:{desc:'Огромный молот, который берут двумя руками и раскачивают всем корпусом. Проламывает ворота, стены и все, что за ними. Медлителен, но каждый попавший удар решает многое.'},
it_моргенштерн:{desc:'Булава с шипастым навершием, соединившая дробящий удар с пробивным. Шипы находят щели в кольчуге и не соскальзывают с округлого шлема. Проста, тяжела и надежна.'},
it_рапира:{desc:'Узкий колющий клинок с развитой гардой, оружие дуэлянтов и придворных. Бьет точно в стык доспеха, а фехтовальное свойство позволяет положиться на Ловкость. Не годится для рубки — только для укола.'},
it_секира:{desc:'Огромный топор на длинном топорище, берущийся обеими руками. Раскалывает щиты и шлемы; сильнейшая кость урона среди рукопашного оружия. Тяжела и не прощает промаха.'},
it_скимитар:{desc:'Изогнутый однолезвийный клинок, легкий и стремительный. Скользящий рез вспарывает там, где прямой меч завяз бы. Легкость и фехтовальное свойство делают его любимым оружием быстрых бойцов.'},
it_трезубец:{desc:'Три граненых зуба на крепком древке — оружие рыбаков, гладиаторов и морской стражи. Цепляет сети, щиты и доспехи, а брошенный, бьет не хуже копья. Двумя руками наносит больший урон.'},
it_цеп:{desc:'Ударная часть на цепи, соединенная с рукоятью. Гибкое сочленение обходит щит и достает противника из-за укрытия, но и владельцу требует привычки. Дробит доспех вместе с тем, кто в нем.'},
it_ручной_арбалет:{desc:'Маленький арбалет, который держат в одной руке. Прячется под плащом и бьет с расстояния, на котором меч еще бесполезен. Перезарядка ограничивает выстрел одним за действие.'},
it_тяжелый_арбалет:{desc:'Массивное ложе с воротом, натягиваемое обеими руками. Болт пробивает доспех навылет на большом расстоянии — сильнейшее дальнобойное оружие. Тяжел, медлителен и требует запаса болтов.'},
it_длинный_лук:{desc:'Лук в рост стрелка, из тиса или ясеня, с тугой тетивой. Бьет дальше любого другого ручного оружия, но требует силы и многолетней выучки. Держится обеими руками, стрелы расходуются быстро.'},
it_духовая_трубка:{desc:'Полая трубка, из которой выдувают короткую иглу. Урона почти не наносит, зато бьет бесшумно и незаметно — потому ее ценят отравители. Настоящая опасность не в игле, а в том, чем она смазана.'},
it_сеть:{desc:'Плетеная сеть с грузами по краю, которую бросают в противника. Урона не наносит вовсе: попавшее существо становится опутанным и должно вырываться. Дистанция мала, зато один бросок способен решить бой.'},
it_стеганый_arm:{desc:'Простеганная в несколько слоев ткань, набитая паклей или шерстью. Дешевейший доспех, гасящий скользящие удары, но душный и шуршащий. Из-за плотной набивки мешает двигаться тихо.'},
it_кожаный_arm:{desc:'Нагрудник и наплечники из кожи, вываренной в масле до твердости дерева. Легок, не стесняет движений и не выдает шорохом. Против стрелы и укола помогает мало, зато носится сутками.'},
it_проклепанная_кожа_arm:{desc:'Кожаный доспех, усиленный частой россыпью железных заклепок. Заклепки разбивают удар и мешают клинку скользить, почти не прибавляя веса. Любимый доспех тех, кому нужна и защита, и тишина.'},
it_шкурный_arm:{desc:'Грубые шкуры с нашитыми пластинами кости и рога. Доспех дальних племен и варваров: делается на месте из того, что удалось добыть. Защищает сносно, выглядит устрашающе, пахнет соответственно.'},
it_кольчужная_рубаха_arm:{desc:'Короткая рубаха из мелких колец, надеваемая под верхнюю одежду. Прячется под кафтаном, потому ее носят те, кому не положено выглядеть вооруженными. Легче полной кольчуги и не стесняет плечи.'},
it_чешуйчатый_arm:{desc:'Кожаная основа, сплошь покрытая нашитыми металлическими пластинками внахлест. Держит рубящий удар не хуже кольчуги и стоит дешевле. Пластины звенят при каждом шаге — о скрытности можно забыть.'},
it_кираса_arm:{desc:'Цельная нагрудная и наспинная пластина на ремнях, обычно поверх поддоспешника. Прикрывает только корпус, зато прикрывает надежно и не мешает рукам. Ее носят и ради защиты, и ради вида.'},
it_полулаты_arm:{desc:'Кираса, дополненная наручами, наплечниками и набедренниками. Почти полный доспех, оставляющий ногам свободу. Лязг сочленений выдает носителя задолго до его появления.'},
it_колечный_arm:{desc:'Кожаная основа с нашитыми поверх тяжелыми кольцами. Древний и неуклюжий доспех, который держат в арсеналах для тех, кому не досталось кольчуги. Тяжел, шумен, но дешев.'},
it_кольчуга_arm:{desc:'Длинная рубаха из тысяч склепанных колец, с капюшоном и рукавами, надеваемая поверх стеганки. Отменно держит рубящий удар и терпит любую погоду. Тяжела: без должной силы она замедляет шаг.'},
it_наборный_arm:{desc:'Крупные металлические полосы, наклепанные на кожаную основу и кольчужное поле. Дешевле лат и почти так же надежен, поэтому его носит тяжелая пехота. Неповоротлив и оглушительно гремит.'},
it_латы_arm:{desc:'Полный доспех из подогнанных по фигуре пластин, с подкладкой и ремнями. Лучшая защита, какую можно купить за золото; надевать его в одиночку почти невозможно. Требует силы и делает скрытность невозможной.'},
it_щит_arm:{desc:'Деревянный щит, окованный железом по краю, с ремнями под предплечье. Прибавляет к защите два очка и позволяет принимать удары, не подставляя тело. Занимает руку — с двуручным оружием несовместим.'}
};
/* ═══ Описания предметов: снаряжение, припасы, записи, вместилища ═══ */
const ITEM_LORE_B={
it_рюкзак:{desc:'Кожаный заплечный мешок с лямками, клапаном и наружными петлями для скатки. Вмещает около 15 кг поклажи; все, что не влезло, приходится нести в руках. Основное вместилище странника: в него складывают припасы, веревку и добычу.', cap:'15 кг', box:true},
it_спальник:{desc:'Толстая шерстяная скатка с непромокаемым верхом, свернутая ремнями. Без нее ночь на камнях не даст отдыха: мастер вправе не засчитать долгий отдых тому, кто спал на голой земле в холод. Весит немало, но окупается каждым утром.'},
it_постельные_принадлежности:{desc:'Простыни, одеяло и подушка — роскошь для того, кто ночует под крышей. В дороге почти бесполезны, зато на постоялом дворе избавляют от чужих клопов. Часто идут в приданое или в уплату долга.'},
it_веревка_пеньковая_15_м:{desc:'Пятнадцать метров прочной пеньковой веревки, свернутой в бухту. Выдерживает вес человека в доспехе; рвется от долгого трения о камень. Закрепленная веревка облегчает подъем — проверки Атлетики идут с преимуществом.'},
it_веревка_шелковая_15_м:{desc:'Пятнадцать метров шелковой веревки — вдвое легче пеньковой и вчетверо дороже. Не намокает, не гниет и почти не выдает шорохом. Закрепленная, дает то же преимущество при лазании.'},
it_факел:{desc:'Палка в локоть длиной с намотанной смоленой паклей. Горит около часа, давая яркий свет на 6 метров и тусклый еще на 6. В крайнем случае горящий факел бьют в лицо — это импровизированное оружие с уроном огнем.'},
it_фонарь_яблочко:{desc:'Фонарь с зеркальным отражателем, дающий узкий направленный луч. Освещает конус на 18 метров ярко и еще на 18 тускло. Пинты масла хватает на шесть часов; прикрытый заслонкой, он не выдает владельца.'},
it_закрытый_фонарь:{desc:'Фонарь с роговыми или слюдяными стенками и откидной заслонкой. Дает ровный свет на 9 метров и тусклый еще на 9, а заслонка мгновенно превращает его в тусклое пятно. Пинты масла хватает на шесть часов.'},
it_масло_фляга:{desc:'Глиняная фляга с пинтой светильного масла. Ею заправляют фонарь на шесть часов горения либо метают как импровизированное оружие: разбившись, она обливает цель, и поднесенный огонь дает 5 урона огнем. Промах разливает масло по площади полтора метра.'},
it_свеча:{desc:'Восковая или сальная свеча, горит около часа. Дает тусклый свет всего на полтора метра — годится читать, но не идти. Незаменима в обрядах и там, где открытое пламя факела недопустимо.'},
it_рацион_1_день:{desc:'Дневной паек: сухари, вяленое мясо, сушеные фрукты, орехи, немного соли. Не портится в дороге и не требует готовки. Герой, оставшийся без еды и воды, начинает набирать уровни истощения.'},
it_бурдюк:{desc:'Кожаный мех на ремне, вмещает около четырех литров воды. В сутки пешего перехода по жаре человеку нужно вдвое больше обычного. Пустой бурдюк весит мало, полный — заметно тянет плечо.'},
it_фляга:{desc:'Небольшой сосуд из олова или обожженной глины, около литра. Носится на поясе; чаще в ней не вода, а нечто покрепче. Удобна тем, что не мешает бежать.'},
it_ломик:{desc:'Полутораметровый железный рычаг с загнутым расплющенным концом. Вскрывает ящики, отжимает решетки и приподнимает плиты; при работе дает преимущество на проверки Силы. В крайнем случае служит импровизированной дубиной.'},
it_молоток:{desc:'Обычный плотницкий молоток с деревянной рукоятью. Вбивает питоны, сколачивает щиты и чинит все, что развалилось в дороге. Шум от него разносится далеко — в подземелье это стоит обдумать.'},
it_питон_шип:{desc:'Железный костыль с ушком, вбиваемый в скалу или бревно. Держит веревку, закрывает дверь наглухо или мешает ей открыться. Носят связками по десять штук.'},
it_веревочная_лестница_3_м:{desc:'Три метра веревочных ступеней с деревянными перекладинами. По ней поднимаются без проверки — в отличие от голой веревки. Сворачивается компактно, но весит прилично.'},
it_лопата:{desc:'Тяжелая железная лопата с окованным черенком. Роет окопы, могилы и тайники; за час работы человек выкапывает яму в свой рост. Иногда оказывается единственным способом пройти дальше.'},
it_кандалы:{desc:'Железные оковы с замком, рассчитанные на существо среднего размера. Скованный вырывается проверкой Силы СЛ 20 либо вскрывает замок воровскими инструментами СЛ 15. Ключ прилагается — и его стоит хранить отдельно.'},
it_цепь_3_м:{desc:'Три метра толстой железной цепи, выдерживающей вес привязанного существа. Разорвать ее — проверка Силы СЛ 20. Годится и связать пленника, и запереть дверь, и утянуть на дно того, кому это причитается.'},
it_колокольчик:{desc:'Небольшой бронзовый колокольчик с чистым звоном. Служит сигналом, обрядовым инструментом и простейшей ловушкой: привязанный к нити поперек коридора, он выдаст любого. Звук слышен примерно на 18 метров.'},
it_зеркальце_стальное:{desc:'Полированная стальная пластинка с ручкой. Позволяет заглянуть за угол, не подставляя голову, подать сигнал солнечным зайчиком или проверить, отражается ли собеседник. Не бьется, в отличие от стеклянного.'},
it_мыло:{desc:'Кусок серого щелочного мыла, резко пахнущий золой. В городе избавляет от вшей и подозрений, а намыленная веревка или прутья решетки иногда решают дело лучше отмычки. Мелочь, о которой вспоминают слишком поздно.'},
it_мешочек:{desc:'Кожаный кошель на завязке, вмещает около четверти килограмма. Носится на поясе; в нем держат монеты, камни, компоненты и прочую мелочь. Срезать его — обычное дело для карманника.', cap:'0,25 кг', box:true},
it_сундук:{desc:'Окованный деревянный сундук с замком, вмещает до 150 кг. Сам весит столько, что в дорогу его не возьмешь — он для дома, повозки или трюма. Замок вскрывается воровскими инструментами, СЛ по решению мастера.', cap:'150 кг', box:true},
it_палатка_двухместная:{desc:'Промасленная холщовая палатка на двоих, с колышками и растяжками. Ставится за несколько минут и защищает от дождя и ветра — без нее ночлег в непогоду отдыха не даст. Свернутая, крепится поверх рюкзака.'},
it_зелье_лечения_2d4_2:{desc:'Пузырек красной жидкости, отливающей на свету искрами. Выпитый действием, восстанавливает 2d4 + 2 хита; вылить его в рот другому — тоже действие. Самое ходовое зелье в любом городе, где есть хоть один алхимик.'},
it_противоядие:{desc:'Мутноватая настойка на травах и толченом угле в запечатанном флаконе. Выпитая, дает преимущество на спасброски от яда на следующий час. Не снимает уже полученный урон, но останавливает дальнейшее отравление.'},
it_чернила_флакон:{desc:'Флакон густых черных чернил на саже и дубовом орешке. Хватает надолго, если не переписывать целые тома. Вместе с пером и листом позволяют вести записи, а волшебнику — переписывать заклинания в книгу.'},
it_перо_писчее:{desc:'Гусиное перо с очиненным кончиком. Требует чернил и твердой руки; кончик приходится подрезать каждые несколько страниц. Без пера письменные принадлежности бесполезны.'},
it_бумага_лист:{desc:'Лист дешевой тряпичной бумаги. Годится для писем, расписок и записок, но боится воды и рвется на сгибах. Дешевле пергамента и потому расходуется без сожаления.'},
it_пергамент_лист:{desc:'Выделанная телячья кожа, тонкая и прочная. Переживет столетия и выдержит чернила заклинаний, потому свитки пишут именно на ней. Стоит дороже бумаги и ценится соответственно.'},
it_книга:{desc:'Толстый том в кожаном переплете, исписанный от руки. Может содержать что угодно: хронику, трактат, поэмы или счетные записи. На внимательное чтение уходят часы, зато оно дает преимущество на проверки по теме книги.', text:'Страницы исписаны ровным писарским почерком. Мастер сам решает, что здесь написано, — впишите содержание в поле «Содержание» на вкладке «Предметы».'},
it_книга_заклинаний:{desc:'Том в сто листов плотного пергамента, застегнутый на ремень. Волшебник хранит здесь все, что сумел разобрать: каждое заклинание занимает столько листов, каков его круг. Утрата книги для волшебника страшнее утраты кошелька.', text:'На первых листах — знакомые формулы, выведенные твердой рукой. Дальше идут страницы, исписанные торопливее: пометки на полях, зачеркивания, расчеты углов и созвучий. Несколько листов оставлены чистыми — под то, что еще предстоит понять.\n\nЧтобы переписать сюда чужое заклинание, нужны чернила, перо и время: два часа и пятьдесят золотых за каждый круг.'},
it_священный_символ_эмблема:{desc:'Эмблема божества на цепочке или нашитая на щит: солнце, весы, молот, глаз. Служит жрецу и паладину магической фокусировкой, заменяя материальные компоненты. Держать ее нужно в руке или носить на виду.'},
it_мешочек_с_компонентами:{desc:'Плотный кожаный кошель с отделениями, набитый всякой всячиной: щепоти серы и соли, сушеные лепестки, обрывки шерсти, кусочки мела и меди. Заменяет любые материальные компоненты, у которых не указана цена. Расходуемое и дорогое приходится покупать отдельно.', cap:'мелочь для обрядов', box:true},
it_магическая_фокусировка_жезл:{desc:'Короткий жезл из ореха или кости с проводящей сердцевиной. Заменяет чародею и волшебнику мешочек с компонентами, если у заклинания нет платного материала. Занимает руку — это стоит помнить, когда в другой уже щит.'},
it_воровские_инструменты:{desc:'Кожаный футляр с отмычками, крючками, пинцетом и малым напильником. Позволяет вскрывать замки и обезвреживать ловушки; при владении к проверке добавляется бонус мастерства. Обычный замок — СЛ 15, хороший — выше.'},
it_инструменты_ремесленника:{desc:'Набор для одного ремесла: молоточки, резцы, зажимы, мерки. Позволяет чинить снаряжение, изготавливать простые вещи и опознавать чужую работу. При владении к проверкам Интеллекта по ремеслу добавляется бонус мастерства.'},
it_подзорная_труба:{desc:'Латунная труба с шлифованными линзами, складывающаяся втрое. Приближает далекое вдвое, позволяя разглядеть знамена, дозорных и следы задолго до встречи. Дает преимущество на проверки Внимательности вдаль, но требует покоя и света.'},
it_песочные_часы:{desc:'Стеклянная колба в деревянной оправе, отмеряющая один час. Незаменима там, где нет солнца: в подземелье, в трюме, в осажденной башне. По ним отсчитывают горение факела, время обряда и смену караула.'},
it_весы_торговые:{desc:'Малые чашечные весы с набором гирек в футляре. Проверяют вес монеты, порошка или самородка — и тем самым честность продавца. Дают преимущество на проверки Интеллекта при оценке товара.'},
it_стрелы_20:{desc:'Двадцать оперенных стрел с гранеными наконечниками в кожаном колчане. Расходуются по одной на выстрел; после боя примерно половину удается собрать и вернуть в колчан. Ломаются от сырости и небрежного хранения.'},
it_арбалетные_болты_20:{desc:'Двадцать коротких тяжелых болтов в поясном туле. Короче стрелы, но тяжелее — оттого и пробивная сила. После боя половину обычно удается подобрать.'},
it_пули_для_пращи_20:{desc:'Двадцать свинцовых или обкатанных каменных снарядов в мешочке. Дешевле стрел настолько, что их не всегда трудятся собирать. Свинцовые бьют заметно тяжелее каменных.'},
it_zhent_amulet:{desc:'Небольшой серебряный амулет с чеканным знаком: свернувшаяся змея в круге. Такие носят те, кто связан с Жентаримом, — знак, понятный лишь своим. Металл потемнел от времени, но чеканка осталась четкой.\n• Пока абсолютно ничего не известно, надо попробовать надеть…'},
it_gem_pouch:{desc:'Небольшой замшевый мешочек с затянутым шнурком. Внутри перекатываются несколько ограненных камней — на глаз каждый тянет золотых на десять. Мешочек можно открыть и достать камни поштучно.', cap:'десяток камней', box:true,

async function ensureItemAudit(){
  const flag=await store.get('dndworld2:itemaudit');
  if(flag==='3') return;
  ITEM_NEW.forEach(rec=>{ if(!itemsDB.some(x=>x.id===rec.id)) itemsDB.push(rec); });
  const lore=Object.assign({}, ITEM_LORE_A, ITEM_LORE_B, ITEM_LORE_C);
  Object.keys(lore).forEach(id=>{
    const it=itemsDB.find(x=>x.id===id); if(!it) return;
    const L=lore[id];
    /* описание переписываем только там, где его почти не было — правки мастера не трогаем */
    if(L.desc&&(String(it.desc||'').trim().length<130||id==='it_spider_letter')) it.desc=L.desc;
    if(L.text&&!String(it.text||'').trim()) it.text=L.text;
    if(L.props&&!String(it.props||'').trim()) it.props=L.props;
    if(L.cap&&!it.cap) it.cap=L.cap;
    if(L.box) it.box=true;
    if(L.contents&&!it.contents) it.contents=L.contents;
  });
  Object.keys(ITEM_TAG_FIX).forEach(n=>{
    const it=itemsDB.find(x=>x.n===n); if(!it) return;
    const f=ITEM_TAG_FIX[n];
    let tg=(it.tags||[]).slice();
    if(f.drop) tg=tg.filter(t=>f.drop.indexOf(t)<0);
    if(f.add) f.add.forEach(t=>{ if(tg.indexOf(t)<0) tg.push(t); });
    it.tags=tg;
  });
  /* наполняем уже выданные вместилища */
  chars.forEach(c=>(c.inventory||[]).forEach(e=>{
    const it=itemOf(e.itemId);
    if(it&&Array.isArray(it.contents)&&it.contents.length) fillContainer(e,it);
  }));
  itemsDB.forEach(upgradeItem);
  await store.set('dndworld2:itemaudit','3');
  fxInvalidate(); scheduleSave();
}
async function ensureSpellAudit(){
  const flag=await store.get('dndworld2:spellaudit');
  if(flag==='5') return;   /* версия 5: Огонь фей содержит спасбросок и машинные последствия */
  Object.keys(SPELL_HI_PATCHES).forEach(id=>{
    const sp=spellsDB.find(s=>s.id===id);
    if(sp && !sp.hi) sp.hi=SPELL_HI_PATCHES[id];
  });
  Object.keys(SPELL_X_PATCHES).forEach(id=>{
    const sp=spellsDB.find(s=>s.id===id);
    if(sp && (!sp.x || sp.x.length<40)) sp.x=SPELL_X_PATCHES[id];
  });
  if(!spellsDB.some(s=>s.n==='Антимагическое поле')){
    const o=Object.assign({},ANTIMAGIC_SPELL);
    o.tags=uniqTags((o.tags||[]).concat(spellEnrichTags(o)));
    spellsDB.push(o);
  }
  const guidance=spellsDB.find(x=>x.id==='sp_guidance_t');
  if(guidance){ guidance.d='Концентрация, до 1 минуты'; guidance.conc=true; guidance.tags=uniqTags((guidance.tags||[]).concat(['buff','concentration'])); }
  const web=spellsDB.find(x=>x.id==='sp_web');
  if(web){ web.s='Вызов'; web.d='Концентрация, до 1 часа'; web.conc=true; web.tags=uniqTags((web.tags||[]).concat(['concentration','control'])); }
  const faerie=spellsDB.find(x=>x.n==='Огонь фей');
  if(faerie){
    faerie.x='Все существа в кубе с гранью 6 м должны пройти спасбросок Ловкости. При провале цель на время действия очерчена светом: атаки по ней совершаются с преимуществом, а сама цель не получает преимуществ от невидимости.';
    faerie.tags=uniqTags((faerie.tags||[]).concat(spellEnrichTags(faerie)));
  }
  await store.set('dndworld2:spellaudit','5');
  scheduleSave();
}

  if(clericArmor && clericArmor.x && clericArmor.x.indexOf('легкими и средними')<0)
    clericArmor.x+=' Вы также владеете легкими и средними доспехами и щитами.';
  abilitiesDB.forEach(ab=>{
    if(ABILITY_X_PATCHES_BY_NAME[ab.n] && (!ab.x||ab.x.length<30)) ab.x=ABILITY_X_PATCHES_BY_NAME[ab.n];

    {stat:'note',mode:'text',value:'Защитник: +1 к КД только пока надет доспех'}];
  /* героям с этими способностями — счетчики зарядов */
  chars.forEach(c=>(c.abilities||[]).forEach(e=>{
    const db=abilitiesDB.find(a=>a.id===e.abilityId);
    if(db&&db.uses!=null&&e.cur==null) e.cur=db.uses;

function referenceSourceHash(rec,kind){
  const keys=kind==='race'?['n','ab','sz','sp','tr','subs']:['n','hd','prime','saves','armor','weap','skills','subT','subs','lv'];
  return kind+'|'+keys.map(k=>JSON.stringify(rec&&rec[k]===undefined?null:rec[k])).join('|');

function parseRaceAbilityAdjustments(raw){
  const t=String(raw||'').toLowerCase().replace(/ё/g,'е'),fixed={},choices=[];
  if(/\+\s*1[^.]{0,20}всем\s+характеристик/.test(t)) Object.keys(AB_FULL).forEach(k=>fixed[k]=1);
  let m,re=/\+\s*(\d+)\s*(?:к\s+)?(сила|силу|ловкость|телосложение|интеллект|мудрость|харизма)/g;
  while((m=re.exec(t))) fixed[REF_AB_KEYS[m[2]]]=+m[1];
  const choice=t.match(/\+\s*(\d+)\s+к\s+(\d+)\s+(?:другим|характеристикам)/);
  if(choice) choices.push({count:+choice[2],amount:+choice[1],exclude:Object.keys(fixed)});
  return {fixed,choices};
}
function parseReferenceSpeed(raw){
  const s=String(raw||''),m=s.replace(',','.').match(/(\d+(?:\.\d+)?)\s*(м|фут)/i);
  return m?{value:+m[1],unit:/фут/i.test(m[2])?'ft':'m',armorDoesNotReduce:/не снижается доспех/i.test(s)}:{value:null,unit:'manual',label:s};
}
function compileRaceMechanics(r){

    abilityAdjustments:parseRaceAbilityAdjustments(r.ab),size:r.sz||'Средний',speed:parseReferenceSpeed(r.sp),
    features:(r.tr||[]).map((text,i)=>{const name=String(text).split(':')[0].trim();return {id:'racial_'+slugify(r.n+'_'+name),abilityId:'ab_'+slugify(r.n+'_'+name),name,textIndex:i};}),
    subraces:(r.subs||[]).map((s,i)=>({id:'subrace_'+slugify(r.n+'_'+s.n),name:s.n,textIndex:i,
      abilityAdjustments:parseRaceAbilityAdjustments(s.d),mode:'manual',manualNote:'Остальные черты подрасы описаны мастером явно.'}))};
}
function upgradeRace(r,force){
  if(!r||typeof r!=='object') return r; const m=r.mechanics,hash=referenceSourceHash(r,'race');
  if(force||!m||m.schemaVersion!==GAME_MECHANICS_SCHEMA_VERSION||(m.origin!=='explicit'&&m.sourceHash!==hash)) r.mechanics=compileRaceMechanics(r);
  return r;
}
function parseClassProficiencies(c){
  const armor=String(c.armor||'').toLowerCase(),weap=String(c.weap||'').toLowerCase(),skills=String(c.skills||'');
  const armorRules={light:/все доспех|легк/.test(armor),medium:/все доспех|средн/.test(armor),heavy:/все доспех|тяжел/.test(armor),shield:/щит/.test(armor)};
  const weapons={simple:/прост/.test(weap),martial:/воинск/.test(weap),names:[]};
  if(!weapons.simple||!weapons.martial) weapons.names=weap.split(/,|\s+и\s+/).map(x=>x.trim()).filter(x=>x&& !/прост|воинск/.test(x));
  const count=(skills.match(/(?:любые\s+)?(\d+)\s+(?:из|навык)/i)||[])[1];
  const list=(skills.split(':')[1]||'').split(',').map(x=>x.trim()).filter(Boolean);
  return {armor:armorRules,weapons,skills:{choose:+count||0,from:list,any:/любые/i.test(skills)},savingThrows:(c.saves||[]).slice()};
}
function classSpellcastingRule(c){
  const map={'Волшебник':['full','int','Влш'],'Жрец':['full','wis','Жрц'],'Друид':['full','wis','Дрд'],'Бард':['full','cha','Брд'],

function compileClassMechanics(c){
  const progression=(c.lv||[]).map((x,i)=>({level:+x[0]||1,id:'class_'+slugify(c.n+'_'+x[1]+'_'+i),name:x[1]}));
  return {schemaVersion:GAME_MECHANICS_SCHEMA_VERSION,mode:'structured',origin:'migration',sourceHash:referenceSourceHash(c,'class'),
    hitDie:+c.hd||8,primaryAbilities:Object.keys(AB_FULL).filter(k=>String(c.prime||'').toLowerCase().indexOf(AB_FULL[k].toLowerCase())>=0),
    proficiencies:parseClassProficiencies(c),spellcasting:classSpellcastingRule(c),progression:{features:progression,
      attacks:progression.filter(x=>/дополнительная атака/i.test(x.name)).map(x=>{const m=x.name.match(/\((\d+)\)/);return {level:x.level,count:m?+m[1]+1:2};})},
    subclasses:(c.subs||[]).map((s,i)=>({id:'subclass_'+slugify(c.n+'_'+s[0]),name:s[0],textIndex:i}))};

function referenceMechanicsErrors(m,kind){
  const out=[];
  if(!m||typeof m!=='object'||Array.isArray(m)) return ['mechanics отсутствует или не является объектом'];
  if(+m.schemaVersion!==GAME_MECHANICS_SCHEMA_VERSION||m.mode!=='structured') out.push('нужны актуальная версия и mode=structured');
  if(kind==='race'){
    if(!m.abilityAdjustments||typeof m.abilityAdjustments!=='object') out.push('abilityAdjustments не структурированы');
    if(!m.speed||typeof m.speed!=='object') out.push('speed не структурирована');
    if(!Array.isArray(m.features)||m.features.some(x=>!x.id||!x.abilityId||!x.name)) out.push('features должны содержать id, abilityId и name');
    if(!Array.isArray(m.subraces)) out.push('subraces должен быть массивом');
  } else {
    if(!Number.isInteger(+m.hitDie)||+m.hitDie<4) out.push('hitDie должен быть допустимой костью хитов');
    if(!m.proficiencies||!m.proficiencies.armor||!m.proficiencies.weapons) out.push('proficiencies не структурированы');
    if(!m.spellcasting||!['none','full','half','pact'].includes(m.spellcasting.kind)) out.push('spellcasting не структурирован');
    if(!m.progression||!Array.isArray(m.progression.features)||!Array.isArray(m.progression.attacks)) out.push('progression не структурирован');
    if(!Array.isArray(m.subclasses)) out.push('subclasses должен быть массивом');
  }
  return out;
}

/* Хранилище: window.storage (артефакты) → localStorage (свой сайт) → память сеанса */
const store={
  async get(k){
    if(window.storage && window.storage.get){ try{ const r=await window.storage.get(k); return r&&r.value!=null?r.value:null; }catch(e){ return null; } }
    try{ return window.localStorage.getItem(k); }catch(e){ return (k in memStore)?memStore[k]:null; }
  },
  async set(k,v){
    if(window.storage && window.storage.set){ try{ await window.storage.set(k,v); return true; }catch(e){ return false; } }
    try{ window.localStorage.setItem(k,v); return true; }catch(e){ memStore[k]=v; return false; }
  }
};

let advMode=0; /* 0 обычный · 1 преимущество · 2 помеха */

/* ═══ Реальные кости бросают игроки: сайт спрашивает результаты и считает ═══ */
let rollSpec=null;
function askShow(o){
  const b=document.getElementById('showBack'); if(!b){ alert(o.body||''); return; }
  document.getElementById('showTitle').textContent=o.title||'Записи';
  document.getElementById('showBody').textContent=o.body||'';
  document.getElementById('showNote').textContent=o.note||'';
  b.style.display='flex';
}
function askRolls(spec){
  /* скриптовый канал: window.__autoRolls=[...] подставляет значения без окна */
  if(Array.isArray(window.__autoRolls)&&window.__autoRolls.length>=spec.rows.length){
    const vals={};
    spec.rows.forEach(r=>{ vals[r.key]=+window.__autoRolls.shift(); });
    spec.apply(vals);
    return;
  }
  rollSpec=spec;
  const back=document.getElementById('rollBack'); if(!back){ rollSpec=null; return; }
  document.getElementById('rollTitle').textContent=spec.title||'⚂ Результаты бросков';
  document.getElementById('rollNote').textContent=spec.note||'';
  document.getElementById('rollRows').innerHTML=spec.rows.map((r,i)=>
    '<div class="roll-row"><label>'+esc(r.label)+'</label>'
    +'<input type="number" id="rollV'+i+'" min="'+(r.min!=null?r.min:1)+'"'+(r.max!=null?' max="'+r.max+'"':'')+' oninput="rollLiveUpd()">'
    +(r.sub?'<span class="sub">'+esc(r.sub)+'</span>':'')+'</div>').join('');
  document.getElementById('rollLive').textContent='…';
  back.style.display='flex';
  const f=document.getElementById('rollV0'); if(f) setTimeout(()=>f.focus(),50);
  rollLiveUpd();
}
function rollVals(){
  const vals={}; let full=true;
  (rollSpec.rows||[]).forEach((r,i)=>{
    const el=document.getElementById('rollV'+i);
    const v=el&&el.value!==''?+el.value:null;
    if(v==null||isNaN(v)) full=false; else vals[r.key]=v;
  });
  return {vals, full};
}
function rollLiveUpd(){
  if(!rollSpec) return;
  const r=rollVals();
  const el=document.getElementById('rollLive');
  el.textContent=r.full&&rollSpec.compute? rollSpec.compute(r.vals) : 'Впишите результаты костей — итог посчитается сам.';
}
function rollDone(){
  if(!rollSpec) return;
  const r=rollVals();
  if(!r.full){ document.getElementById('rollLive').textContent='Заполните все поля бросков.'; return; }
  const spec=rollSpec; rollSpec=null;
  document.getElementById('rollBack').style.display='none';
  const applied=spec.apply(r.vals);
  /* Часть старых предметных действий не знает о боевом контуре и списывает
     действие здесь. Новые атомарные обработчики уже сделали это сами — в
     таком случае повторно тратить ресурс и показывать ложную ошибку нельзя. */
  if(spec.combatAction&&applied!==false&&combatCanSpend(spec.combatAction.cost,spec.combatAction.actorKey,true))
    combatSpend(spec.combatAction.cost,spec.combatAction.label,spec.combatAction.actorKey);
}
function rollCancel(){
  rollSpec=null;
  const b=document.getElementById('rollBack'); if(b) b.style.display='none';
}
function diceOutSet(text,color){
  const out=document.getElementById('diceOut'); if(!out) return;
  out.textContent=text; out.style.color=color||'var(--ink)';
}
function rollFxEntries(c,kind,tags){
  if(!c||!kind) return [];
  const keys=[kind];
  if(kind.indexOf('attack.')===0) keys.push('attack');
  if(kind.indexOf('check.')===0) keys.push('check');
  if(kind.indexOf('save.')===0) keys.push('save');
  if(kind.indexOf('skill.')===0) keys.push('check');
  (tags||[]).forEach(t=>{ const k=kind.indexOf('save.')===0?'save.'+t:(kind+'.'+t); if(keys.indexOf(k)<0) keys.push(k); });
  return charFxAll(c).filter(f=>keys.indexOf(f.stat)>=0);
}
function rollCheck(label,m,kind){
  m=+m||0;
  const c=(typeof cc==='function')?cc():null;
  const fxList=(c&&kind)?rollFxEntries(c,kind):[];
  const autoAdv=fxList.some(f=>f.mode==='adv'), autoDis=fxList.some(f=>f.mode==='dis');
  const autoMode=(autoAdv===autoDis)?0:(autoAdv?1:2);
  /* Ручной выбор мастера сильнее автоматического; встречные режимы гасят друг друга. */
  const adv=advMode||autoMode;
  const dice=fxList.filter(f=>f.mode==='die').map(f=>{
    const dm=normDiceInput(String(f.value||'')).match(/^(-)?(\d*)d(\d+)$/);
    if(!dm) return null;
    return {sign:dm[1]?-1:1, cnt:Math.max(1,+dm[2]||1), sides:+dm[3], label:f.label, consume:f.consume, uid:f.sourceUid};
  }).filter(Boolean);
  const rows=adv? [{key:'a',label:'d20 — первый',sub:adv===1?'преимущество: берется больший':'помеха: берется меньший',min:1,max:20},
                   {key:'b',label:'d20 — второй',min:1,max:20}]
                : [{key:'a',label:'d20',min:1,max:20}];
  dice.forEach((d,i)=>rows.push({key:'e'+i, label:d.label+': '+(d.sign<0?'-':'')+d.cnt+'d'+d.sides,
    sub:'от '+d.cnt+' до '+(d.cnt*d.sides), min:d.cnt, max:d.cnt*d.sides}));
  const sumDice=v=>dice.reduce((a,d,i)=>a+d.sign*(+v['e'+i]||0),0);
  const why=(adv===1?' · преимущество':(adv===2?' · помеха':''))
    +((autoMode&&!advMode)?' (от действующего эффекта)':'')
    +(dice.length?' · кости эффектов: '+dice.map(d=>d.label).join(', '):'');
  askRolls({title:'⚂ '+label, note:'Модификатор: '+(m>0?'+':'')+m+why,
    rows,
    compute:v=>{ const r=adv===1?Math.max(v.a,v.b):(adv===2?Math.min(v.a,v.b):v.a); const d=sumDice(v);
      return label+': d20 '+r+(m?(m>0?' + '+m:' − '+Math.abs(m)):'')+(d?(d>0?' + '+d:' − '+Math.abs(d)):'')+' = '+(r+m+d); },
    apply:v=>{
      const r=adv===1?Math.max(v.a,v.b):(adv===2?Math.min(v.a,v.b):v.a);
      const d=sumDice(v);
      const note=adv===1?' ▲['+v.a+'|'+v.b+']':(adv===2?' ▼['+v.a+'|'+v.b+']':'');
      diceOutSet(label+': d20 '+r+(m?(m>0?' + '+m:' − '+Math.abs(m)):'')+(d?(d>0?' + '+d:' − '+Math.abs(d)):'')+' = '+(r+m+d)+note,
        r===20?'var(--ok)':(r===1?'var(--rubric)':'var(--ink)'));
      const spent=dice.filter(x=>x.consume==='roll').map(x=>x.uid).filter(Boolean);
      if(spent.length&&c) consumeRollFx(c,spent);
      if(kind==='attack'&&c) endTriggeredSpellEffects(c,'attack');
    }});
}
function rollDmgStr(label,dmgStr,extra){
  extra=+extra||0;
  const m=normDiceInput(dmgStr).match(/(\d*)d(\d+)\s*([+-]\s*\d+)?/);
  if(!m){ diceOutSet(label+': урон '+Math.max(1,1+extra)); return; }
  const cnt=Math.min(40,+m[1]||1), sides=+m[2]; extra+=parseInt(String(m[3]||'0').replace(/\s/g,''),10)||0;
  askRolls({title:'⚂ '+label+' — урон', note:'Кости: '+cnt+'d'+sides+(extra?(extra>0?' + '+extra:' − '+Math.abs(extra)):''),
    rows:[{key:'s',label:'Сумма '+cnt+'d'+sides,sub:'от '+cnt+' до '+(cnt*sides),min:cnt,max:cnt*sides}],
    compute:v=>label+': урон '+Math.max(1,v.s+extra),
    apply:v=>diceOutSet(label+': урон '+Math.max(1,v.s+extra)+' ('+cnt+'d'+sides+' = '+v.s+(extra?(extra>0?' +'+extra:' −'+Math.abs(extra)):'')+')')});
}

function roll(n){

    rows:[{key:'v',label:'d'+n,min:1,max:n}],

/* ═══════════════ ДВИЖОК ЭФФЕКТОВ ═══════════════
   Эффект: {stat, mode:'add'|'text', value, note}
   stat: ac, hpmax, hp, init, speed, atk, dmg, passperc,
         ab.str…ab.cha, save.str…save.cha, save.all, skill.<Название>, note
   Источники (в порядке применения):
   1) надетые предметы (есть slot) · 2) предметы инвентаря без слота ·
   3) пассивные способности героя · 4) наложенные эффекты (c.activeFx).
   Исполняемые эффекты берутся из mechanics.effects. deriveFx используется
   только миграцией старых записей и больше не участвует в обычном расчете. */

let fxCacheT=0;
function fxInvalidate(){ fxCacheT++; }
const FX_STAT_RU={ac:'КД', hpmax:'макс. хиты', hp:'текущие хиты', init:'инициатива', speed:'скорость',
 atk:'броски атаки', dmg:'урон', passperc:'пасс. Внимательность',
 'ab.str':'Сила','ab.dex':'Ловкость','ab.con':'Телосложение','ab.int':'Интеллект','ab.wis':'Мудрость','ab.cha':'Харизма',
 'save.str':'спас. Силы','save.dex':'спас. Ловкости','save.con':'спас. Телосложения','save.int':'спас. Интеллекта','save.wis':'спас. Мудрости','save.cha':'спас. Харизмы','save.all':'все спасброски'};
const FX_AB_WORDS={'сила':'str','силы':'str','ловкость':'dex','ловкости':'dex','телосложение':'con','телосложения':'con',
 'интеллект':'int','интеллекта':'int','мудрость':'wis','мудрости':'wis','харизма':'cha','харизмы':'cha'};

/* ── авторазбор эффектов из описания записи ── */
function fxTextOf(rec){
  return [rec&&rec.x,rec&&rec.desc,rec&&rec.props].filter(Boolean).join('\n')
    .replace(/\u0451/g,'е').replace(/\u0401/g,'Е').replace(/\u00ad/g,'').replace(/[−–—]/g,'-');
}
function fxPush(out, fx){
  const sig=[fx.stat,fx.mode,String(fx.value),fx.unit||'',fx.note||''].join('|');
  if(!out.some(x=>[x.stat,x.mode,String(x.value),x.unit||'',x.note||''].join('|')===sig)) out.push(fx);
}
function fxSigned(v){ return +(String(v||'').replace(/\s/g,'').replace(/[−–—]/g,'-'))||0; }
const FX_CONDITIONS=[
 ['Захваченный',/захвачен(?:ный|ная|ное|ные|а|о|ы)?(?=[^а-я]|$)/],
 ['Бессознательный',/бессознательн(?:ый|ая|ое|ые|ым|ой|а|о|ы)?(?=[^а-я]|$)/],
 ['Парализованный',/парализован(?:ный|ная|ное|ные|а|о|ы)?(?=[^а-я]|$)/],
 ['Окаменевший',/окаменевш(?:ий|ая|ее|ие|им|ей)(?=[^а-я]|$)/],
 ['Ошеломленный',/ошеломлен(?:ный|ная|ное|ные|а|о|ы)?(?=[^а-я]|$)/],
 ['Недееспособный',/недееспособ(?:ный|ная|ное|ные|ен|на|но|ны)(?=[^а-я]|$)/],
 ['Опутанный',/опутан(?:ный|ная|ное|ные|а|о|ы)?(?=[^а-я]|$)/],
 ['Ослепленный',/ослеплен(?:ный|ная|ное|ные|а|о|ы)?(?=[^а-я]|$)/],
 ['Отравленный',/отравлен(?:ный|ная|ное|ные|а|о|ы)?(?=[^а-я]|$)/],
 ['Очарованный',/очарован(?:ный|ная|ное|ные|а|о|ы)?(?=[^а-я]|$)/],
 ['Испуганный',/испуган(?:ный|ная|ное|ные|а|о|ы)?(?=[^а-я]|$)/],
 ['Сбитый с ног',/сбит[аоы]?\s+с\s+ног|падает\s+ничком/],
 ['Невидимый',/невидим(?:ый|ая|ое|ые|ым|ой|а|о|ы)?(?=[^а-я]|$)/]
];
function deriveFx(rec, kind){
  const t=[]; const x=fxTextOf(rec);
  const low=x.toLowerCase();
  let m;
  /* +N к КД (у брони базовый КД считает acAuto — ловим только явные бонусы) */
  const armorBase=(kind==='item'&&rec.type==='armor'&&rec.ac);   /* базу и бонусы такой брони считает acAuto */
  if(!armorBase){
    const acRe=/([+-]\s*\d+)\s*(?:к\s*)?(?:класс[ау]?\s+доспеха\s*(?:\(кд\))?|кд)/gi;
    while((m=acRe.exec(low))) fxPush(t,{stat:'ac',mode:'add',value:fxSigned(m[1])});
  }
  if((m=low.match(/кд\s+не\s+может\s+быть\s+ниже\s+(\d+)/)))
    fxPush(t,{stat:'ac',mode:'min',value:+m[1]});
  if(/(?:базов|класс)\w*\s+кд[^.]{0,50}(?:становится|равен)\s+13\s*\+\s*модификатор\s+ловкост/.test(low))
    fxPush(t,{stat:'note',mode:'text',value:'базовый КД 13 + модификатор Ловкости (если цель без доспехов)'});
  /* +N к броскам атаки и/или урону */
  const bothRe=/([+-]\s*\d+)\s*к\s*(?:броскам?\s*)?атак[а-я]*\s+и\s+(?:броскам?\s*)?урон/gi;
  while((m=bothRe.exec(low))){
    fxPush(t,{stat:'atk',mode:'add',value:fxSigned(m[1])});
    fxPush(t,{stat:'dmg',mode:'add',value:fxSigned(m[1])});
  }
  const atkRe=/([+-]\s*\d+)\s*к\s*(?:броскам?\s*)?атак[а-я]*/gi;
  while((m=atkRe.exec(low))) fxPush(t,{stat:'atk',mode:'add',value:fxSigned(m[1])});
  const dmgRe=/([+-]\s*\d+)\s*к\s*(?:броскам?\s*)?урон/gi;
  while((m=dmgRe.exec(low))) fxPush(t,{stat:'dmg',mode:'add',value:fxSigned(m[1])});
  /* максимум хитов и текущие хиты увеличиваются на N */
  if((m=low.match(/([+-]\s*\d+)\s*к\s+максимуму\s+и\s+текущим\s+хитам/))){
    const v=fxSigned(m[1]); fxPush(t,{stat:'hpmax',mode:'add',value:v}); fxPush(t,{stat:'hp',mode:'add',value:v});
  } else if((m=low.match(/(?:максимум[ау]? хитов и текущи[ем] хиты|к максимуму и текущим хитам)[^.]{0,70}?(?:увеличиваются на|получают|[+:])?\s*([+-]?\s*\d+)/))){
    const v=Math.abs(fxSigned(m[1])); fxPush(t,{stat:'hpmax',mode:'add',value:v}); fxPush(t,{stat:'hp',mode:'add',value:v});
  } else if((m=low.match(/максимум хитов[^.]*увеличивается на (\d+)/))){
    if(/каждый раз[^.]*уровен/.test(low)) fxPush(t,{stat:'hpmax',mode:'add',value:'lvl',note:'за уровень'});
    else fxPush(t,{stat:'hpmax',mode:'add',value:+m[1]});
  }
  /* инициатива и скорость */
  if((m=low.match(/инициатив[а-я]*\s*([+-]\s*\d+)/)||low.match(/([+-]\s*\d+)\s*к\s*инициатив/)))
    fxPush(t,{stat:'init',mode:'add',value:fxSigned(m[1])});
  const speedRe=/скорост[ьи][^.]{0,45}?(увеличива|повыша|снижа|уменьша)[а-я]*\s+на\s+(\d+(?:[.,]\d+)?)\s*(м(?:етр[а-я]*)?|фут[а-я]*)/gi;
  while((m=speedRe.exec(low))) fxPush(t,{stat:'speed',mode:'add',
    value:(/снижа|уменьша/.test(m[1])?-1:1)*parseFloat(m[2].replace(',','.')),unit:/^фут/.test(m[3])?'фут':'м'});
  if(/скорость[^.]{0,25}(?:уменьшена|снижается)\s+вдвое/.test(low))
    fxPush(t,{stat:'note',mode:'text',value:'скорость уменьшена вдвое'});
  if(/скорость[^.]{0,20}(?:равна|становится)\s+0/.test(low))
    fxPush(t,{stat:'note',mode:'text',value:'скорость равна 0'});
  if(/(?:удвоенн[а-я]*\s+скорость|скорость[^.]{0,20}удваива)/.test(low))
    fxPush(t,{stat:'speed',mode:'mul',value:2});
  /* +N к проверкам Характеристики (Навык) — возможно перечисление через «и» */
  const skRe=/([+-]\s*\d+)\s*к\s*проверк[а-я]*\s*([а-я]+)\s*\(([^)]+)\)(?:\s*и\s*([а-я]+)\s*\(([^)]+)\))?/gi;
  while((m=skRe.exec(x))){
    fxPush(t,{stat:'skill.'+m[3].trim(),mode:'add',value:fxSigned(m[1])});
    if(m[5]) fxPush(t,{stat:'skill.'+m[5].trim(),mode:'add',value:fxSigned(m[1])});
  }
  const skillNames=typeof SKILLS!=='undefined'?SKILLS.map(s=>s[0]):[];
  skillNames.forEach(name=>{
    const re=new RegExp('([+\\\\-]\\\\s*\\\\d+)\\\\s*к\\\\s*проверк[а-я]*\\\\s+'+name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i');
    const mm=x.match(re); if(mm) fxPush(t,{stat:'skill.'+name,mode:'add',value:fxSigned(mm[1])});

    const base=+rec.l||0, used=usedSlotLvl||base, delta=Math.max(0,used-base);
    const hi=(String(rec.hi||'')+' '+text).toLowerCase();
    const dieUp=hi.match(/(?:увеличива[а-я]*|добавля[а-я]*)\s+на\s+(\d*)\s*[кd]\s*(\d+)\s+за\s+кажд[а-я]*\s+круг/);
    if(delta&&dieUp&&(!sides||+dieUp[2]===sides)) cnt+=delta*+(dieUp[1]||1);
    const flatUp=hi.match(/(?:увеличива[а-я]*|добавля[а-я]*)\s+на\s+(\d+)\s+хит[а-я]*\s+за\s+кажд[а-я]*\s+круг/);
    if(delta&&flatUp) plus+=delta*(+flatUp[1]);
    plus+=healingPassiveBonus(caster,rec,used,text);
  }
  if(!cnt&&!plus) return null;
  return {cnt,sides,plus};
}

/* ── мини-язык поля «Влияние на показатели» в редакторах ──
   по строке: кд +2 · кд-мин 16 · хиты-макс +5 · хиты +5 · иниц +1 · атака +1 · урон +2 ·
   хар.мудр +1 · спас.все +1 · спас.тел +2 · навык.Убеждение +1 ·
   скорость +3 м · скорость ×2 · состояние: Опутанный · текст: сопротивление урону ядом */
const FX_KEYS={'кд':'ac','хиты-макс':'hpmax','хиты':'hp','иниц':'init','инициатива':'init','атака':'atk','урон':'dmg',
 'пассв':'passperc','хар.сил':'ab.str','хар.лов':'ab.dex','хар.тел':'ab.con','хар.инт':'ab.int','хар.мудр':'ab.wis','хар.хар':'ab.cha',
 'спас.все':'save.all','спас.сил':'save.str','спас.лов':'save.dex','спас.тел':'save.con','спас.инт':'save.int','спас.мудр':'save.wis','спас.хар':'save.cha'};
function parseFxLines(txt){
  const out=[];
  String(txt||'').split('\n').map(s=>s.trim()).filter(Boolean).forEach(line=>{
    let m;
    if((m=line.match(/^json:\s*(\{.*\})$/i))){
      try{ const fx=JSON.parse(m[1]); if(fx&&typeof fx==='object'&&!Array.isArray(fx)) out.push(fx); }
      catch(e){ out.push({stat:'note',mode:'text',value:'Некорректное правило JSON: '+m[1]}); }
      return;
    }
    if((m=line.match(/^текст:\s*(.+)$/i))){ out.push({stat:'note',mode:'text',value:m[1]}); return; }
    if((m=line.match(/^состояние:\s*(.+)$/i))){ out.push({stat:'condition',mode:'text',value:m[1].trim()}); return; }
    if((m=line.match(/^кд-мин\s+(\d+)$/i))){ out.push({stat:'ac',mode:'min',value:+m[1]}); return; }
    if((m=line.match(/^навык\.(.+?)\s+([+-]?\d+)$/i))){ out.push({stat:'skill.'+m[1].trim(),mode:'add',value:+m[2]}); return; }
    if((m=line.match(/^скорость\s+([+-]?\d+(?:[.,]\d+)?)\s*(м|фут(?:ов|а)?)$/i))){
      out.push({stat:'speed',mode:'add',value:parseFloat(m[1].replace(',','.')),unit:/^фут/i.test(m[2])?'фут':'м'}); return;
    }
    if((m=line.match(/^скорость\s+[x×*]\s*(\d+(?:[.,]\d+)?)$/i))){
      out.push({stat:'speed',mode:'mul',value:parseFloat(m[1].replace(',','.'))}); return;
    }
    if((m=line.match(/^скорость\s+(.+)$/i))){ out.push({stat:'speed',mode:'text',value:m[1]}); return; }
    if((m=line.match(/^([а-я.\-]+)\s+([+-]?\d+|lvl)$/i))){
      const k=FX_KEYS[m[1].toLowerCase()];
      if(k){ out.push({stat:k,mode:'add',value:(m[2].toLowerCase()==='lvl'?'lvl':+m[2])}); return; }
    }
    out.push({stat:'note',mode:'text',value:line});
  });
  return out;
}
function fxToLines(fx){
  const back={}; Object.keys(FX_KEYS).forEach(k=>back[FX_KEYS[k]]=k);
  return (fx||[]).map(f=>{
    if(f.stat==='note') return 'текст: '+f.value;
    if(f.stat==='condition') return 'состояние: '+f.value;
    if(f.stat==='ac'&&f.mode==='min') return 'кд-мин '+f.value;
    if(f.stat.startsWith('skill.')&&f.mode==='add') return 'навык.'+f.stat.slice(6)+' '+(f.value>0?'+':'')+f.value;
    if(f.stat==='speed'&&(f.mode==='add'||f.mode==='mul')) return f.mode==='mul'?'скорость ×'+f.value:'скорость '+(f.value>0?'+':'')+f.value+(f.unit?' '+f.unit:'');
    const k=back[f.stat];
    if(k&&f.mode==='add'&&(typeof f.value==='number'||f.value==='lvl'))
      return k+' '+(f.value==='lvl'?'lvl':(f.value>0?'+':'')+f.value);
    return 'json: '+JSON.stringify(f);
  }).join('\n');
}

/* ── активные источники эффектов героя ── */
const EXHAUST_FX=['помеха на проверки характеристик','скорость уменьшена вдвое','помеха на броски атаки и спасброски','максимум хитов уменьшен вдвое','скорость равна 0','смерть'];
function fxSrcKey(s){ return s.k+':'+s.id; }
function toggleFxSource(charId,key){
  const t=getCh(charId); if(!t) return;

}
function charFxSources(c){

        if(profile.armor.strReq&&(+c.ab.str||10)<profile.armor.strReq&&!/дварф/i.test(String(c.race||'')))

      }

      if(fx.length){

        const s={k:'item', id:it.id, label:it.n, why:(wearable?'надето':'в инвентаре')+(needAtt?(e.att?' · настроен':' · НЕ настроен'):''), fx, canOff:true};
        s.off=off.includes(fxSrcKey(s));
        if(needAtt&&!e.att) s.suppressed=true;
        if((c.activeFx||[]).some(a=>a.antimagic) && !!((itemProfile(it).flags||{}).magical)) s.suppressed=true;
        out.push(s);
      }
    }
  });
  (c.abilities||[]).forEach(e=>{
    const ab=abilityOf(e.abilityId); if(!ab) return;
    if(isPassiveAbility(ab)){
      let fx=recFx(ab,'ability');
      if(ab.id==='ab_lg_styles'){
        const chest=invEntry(c,(c.equipment||{}).CHEST), armor=chest&&itemOf(chest.itemId);
        if(armor&&itemProfile(armor).kind==='armor') fx=fx.concat({stat:'ac',mode:'add',value:1,note:'надет доспех'});
      }
      if(fx.length){
        const s={k:'ability', id:ab.id, label:ab.n, why:'пассивная', fx, canOff:true};
        s.off=off.includes(fxSrcKey(s)); out.push(s);
      }
    }
  });
  const hasAM=(c.activeFx||[]).some(a=>a.antimagic);
  (c.activeFx||[]).forEach(a=>{
    let rec=null, label=a.label||'';
    if(a.k==='spell'){ rec=spellOf(a.id); label=rec?rec.n:label; }
    if(a.k==='ability'){ rec=abilityOf(a.id); label=rec?rec.n:label; }
    const fx=a.fx&&a.fx.length? a.fx : recFx(rec, a.k);
    if(fx.length||a.k==='spell'||a.k==='use'){
      const s={k:a.k, id:a.id, uid:a.uid, label, why:a.why||(a.from?'наложено: '+a.from:'применено'), fx, removable:true,
        stackKey:a.stackKey||(a.k==='spell'?'spell:'+a.id:null), power:+a.power||0, appliedRound:+a.appliedRound||0, entry:a};
      if(hasAM && !a.antimagic && (a.k==='spell'||a.k==='use')) s.suppressed=true;
      out.push(s);

  /* ношение без владения — канонические последствия 5e */
  armorViolations(c).forEach(v=>{
    const penalized=[
      {stat:'attack.str',mode:'dis',value:1},{stat:'attack.dex',mode:'dis',value:1},
      {stat:'check.str',mode:'dis',value:1},{stat:'check.dex',mode:'dis',value:1},
      {stat:'save.str',mode:'dis',value:1},{stat:'save.dex',mode:'dis',value:1}
    ];
    SKILLS.filter(sk=>sk[1]==='str'||sk[1]==='dex').forEach(sk=>penalized.push({stat:'skill.'+sk[0],mode:'dis',value:1}));
    const s={k:'prof', id:v.it.id, label:'⛔ '+v.it.n, why:v.why, canOff:true,
      fx:penalized.concat([
        {stat:'note',mode:'text',value:'помеха на проверки характеристик, спасброски и броски атаки, использующие Силу или Ловкость'},
        {stat:'note',mode:'text',value:'наложение заклинаний невозможно'}])};
    s.off=off.includes(fxSrcKey(s)); out.push(s);
  });
  /* Одинаковые заклинания не складываются: действует самое сильное, при равной
     силе — самое свежее. Прочие продолжают отсчитывать длительность и вступят
     в силу, когда победивший эффект закончится. */
  const winners={};

    if(!x.stackKey) return;

      fx:EXHAUST_FX.slice(0,Math.min(6,ex)).map(v=>({stat:'note',mode:'text',value:v}))});
  }

  if((c.cond||[]).length){
    out.push({k:'cond', id:'cond', label:'Состояния', why:'отмечены на листе',
      fx:c.cond.map(n=>({stat:'note',mode:'text',value:n}))});

}
function charFxAll(c){
  if(c.__fxC && c.__fxC.t===fxCacheT) return c.__fxC.v;
  const list=[];
  charFxSources(c).forEach(s=>{ if(s.off||s.suppressed||s.stacked) return; s.fx.forEach(f=>{
    let v=f.value;
    if(v==='lvl') v=c.level;
    list.push({stat:f.stat, mode:f.mode, value:v, unit:f.unit||'', note:f.note||'', label:s.label, k:s.k,
      consume:f.consume||'', sourceUid:s.uid||null});
  });});
  c.__fxC={t:fxCacheT, v:list};
  return list;
}
function fxSum(c,stat){
  return charFxAll(c).filter(f=>f.stat===stat&&f.mode==='add').reduce((a,f)=>a+(+f.value||0),0);
}
function fxParts(c,stat){
  return charFxAll(c).filter(f=>f.stat===stat&&f.mode==='add').map(f=>({v:+f.value||0,label:f.label,note:f.note}));
}
function fxMul(c,stat){
  return charFxAll(c).filter(f=>f.stat===stat&&f.mode==='mul').reduce((a,f)=>a*(+f.value||1),1);
}
function fxSet(c,stat){

  return a.length?a[a.length-1].value:null;
}
function fxDice(c,stat){

}
function fxRollMode(c,stat){
  const a=charFxAll(c).filter(f=>f.stat===stat&&(f.mode==='adv'||f.mode==='dis'));
  const adv=a.some(f=>f.mode==='adv'), dis=a.some(f=>f.mode==='dis');
  return adv===dis?0:(adv?1:2);
}
function speedTotal(c){
  const raw=String(c.speed||'');
  if(conditionForcesZeroSpeed(effectiveConditions(c))) return '0 '+(/фут/i.test(raw)?'футов':'м');
  const over=(typeof carryWeight==='function')?(carryWeight(c)>Math.round((+c.ab.str||10)*7.5)):false;
  const m=raw.replace(',','.').match(/-?\d+(?:\.\d+)?/);
  if(!m) return raw;
  let v=+m[0], add=0, mul=1, setVal=null, unit=/фут/i.test(raw)?' футов':' м';
  charFxAll(c).filter(f=>f.stat==='speed').forEach(f=>{
    if(f.mode==='mul') mul*=+f.value||1;
    else if(f.mode==='set'){
      const sm=String(f.value).replace(',','.').match(/-?\d+(?:\.\d+)?/);
      if(sm){ setVal=+sm[0]; unit=/фут/i.test(String(f.value))?' футов':' м'; }
    } else if(f.mode==='add'){
      const sm=String(f.value).replace(',','.').match(/-?\d+(?:\.\d+)?/);
      if(sm){
        let d=+sm[0], su=f.unit==='фут'||/фут/i.test(String(f.value))?'фут':'м';
        if((unit.indexOf('фут')>=0)!==(su==='фут')) d=unit.indexOf('фут')>=0?d*(10/3):d*0.3;
        add+=d;
      }
    }
  });
  v=setVal==null?(v+add)*mul:setVal;
  if(over) v-=3;   /* перегруз: −10 футов по варианту правил 5e */
  v=Math.max(0,Math.round(v*10)/10);
  return String(v).replace('.',',')+unit;
}
function fxMin(c,stat){
  const vals=charFxAll(c).filter(f=>f.stat===stat&&f.mode==='min').map(f=>+f.value||0);
  return vals.length?Math.max(...vals):null;
}
function effectiveConditions(c){
  const out=normalizeConditions(c.cond);
  charFxAll(c).filter(f=>f.stat==='condition').forEach(f=>{
    const n=canonicalCondition(f.value);
    if(n&&out.indexOf(n)<0) out.push(n);
  });
  return out;
}
function effectiveSpeed(c){
  const raw=String(c.speed||''), m=raw.match(/(\d+(?:[.,]\d+)?)\s*(м|фут)/i);
  if(!m) return raw;
  const unit=/^фут/i.test(m[2])?'фут':'м', base=parseFloat(m[1].replace(',','.'));
  if(conditionForcesZeroSpeed(effectiveConditions(c))) return raw.replace(m[1],'0');
  const all=charFxAll(c).filter(f=>f.stat==='speed');
  const parts=all.filter(f=>f.mode==='add');
  const delta=parts.reduce((a,f)=>{
    const from=f.unit||unit, v=+f.value||0;
    if(from===unit) return a+v;
    return a+(unit==='м'?v*.3:v/.3); /* 5 футов = 1,5 м в сетке 5e */
  },0);
  const mult=all.filter(f=>f.mode==='mul').reduce((a,f)=>a*(+f.value||1),1);
  const value=Math.max(0,Math.round((base+delta)*mult*10)/10);

}
function speedFxClass(c){
  const base=(String(c.speed||'').match(/\d+(?:[.,]\d+)?/)||[])[0];
  const effective=(effectiveSpeed(c).match(/\d+(?:[.,]\d+)?/)||[])[0];
  return base&&effective&&parseFloat(effective.replace(',','.'))<parseFloat(base.replace(',','.'))?'fx-minus':'fx-plus';

function fxLine(c,stat){
  const parts=fxParts(c,stat);
  if(!parts.length) return '';
  const sum=parts.reduce((a,p)=>a+p.v,0);
  const cls=sum>=0?'fx-plus':'fx-minus';
  return '<div class="fx-line '+cls+'">✦ '+(sum>0?'+':'')+sum+' · '+parts.map(p=>esc(p.label)+(p.note?' ('+esc(p.note)+')':'')).join(', ')+'</div>';

/* ── эффективные характеристики (каскад в модификаторы) ── */
function eAb(c,k){ return (c.ab&&c.ab[k]!=null?c.ab[k]:10)+fxSum(c,'ab.'+k); }
function eMod(c,k){ return Math.floor((eAb(c,k)-10)/2); }
/* Некоторые эффекты 5e (например, Вытягивание жизни) действительно могут
   уменьшить максимум хитов до 0 — это не техническая «единица для деления»,
   а смерть существа. Защиту от деления на ноль держим в самой полосе хитов. */
function eHpMax(c){ return Math.max(0,Math.floor(((+c.hpMax||0)+fxSum(c,'hpmax'))*fxMul(c,'hpmax'))); }
function fxSaveBonus(c,k){ return fxSum(c,'save.'+k)+fxSum(c,'save.all'); }
function fxSkillBonus(c,name){ return fxSum(c,'skill.'+name); }

/* ── наложение и снятие ── */
let fxUidSeq=0;
function fxUid(){ fxUidSeq++; return 'fx_'+Date.now().toString(36)+'_'+fxUidSeq.toString(36); }
function castUid(){ fxUidSeq++; return 'cast_'+Date.now().toString(36)+'_'+fxUidSeq.toString(36); }
function applyFxTo(targetId, entry){
  const t=getCh(targetId); if(!t) return;
  t.activeFx=t.activeFx||[];
  let fx=entry.fx;
  if(!fx){
    const rec=entry.k==='spell'?spellOf(entry.id):(entry.k==='ability'?abilityOf(entry.id):null);
    fx=recFx(rec, entry.k);
  }
  /* текущие хиты — мгновенный эффект при наложении, а не постоянный модификатор */
  const inst=fx.filter(f=>f.stat==='hp'&&f.mode==='add'&&typeof f.value==='number');
  const grants=fx.filter(f=>f.stat==='hp'&&f.mode==='grant');
  entry.fx=normalizeRuleEffects(fx.filter(f=>!inst.includes(f)&&!grants.includes(f)));
  entry.mechanicsVersion=entry.mechanicsVersion||GAME_MECHANICS_SCHEMA_VERSION;
  entry.effectSchemaVersion=GAME_MECHANICS_SCHEMA_VERSION;
  if(grants.length) entry.hpGrant=grants.reduce((a,f)=>a+(+f.value||0),0);
  entry.uid=fxUid();
  if(entry.appliedRound==null) entry.appliedRound=fxRound;
  t.activeFx.push(entry);
  fxInvalidate();
  syncStackedGrants(t);
  const appliedConditions=(entry.fx||[]).filter(f=>f.stat==='condition').map(f=>String(f.value));
  const incapacitating=appliedConditions.find(n=>typeof ACTION_BLOCK_CONDS!=='undefined'&&ACTION_BLOCK_CONDS.indexOf(n)>=0);
  if(incapacitating&&typeof breakConcentration==='function')
    breakConcentration(t,'наложено состояние «'+incapacitating+'»');
  let healed=0; inst.forEach(f=>healed+=f.value);
  if(healed){ t.hp=Math.min(eHpMax(t),(+t.hp||0)+healed); }
  scheduleSave(); renderChars();
  setStatus('✦ «'+entry.label+'» — эффект наложен на '+t.name+(healed?' (+'+healed+' к текущим хитам)':'')+'.');
}
function activeStackWinners(t){
  const winners={}, hasAM=(t.activeFx||[]).some(a=>a.antimagic);
  (t.activeFx||[]).forEach(a=>{
    if(hasAM&&!a.antimagic&&(a.k==='spell'||a.k==='use')) return;
    const key=a.stackKey||(a.k==='spell'?'spell:'+a.id:null); if(!key) return;
    const w=winners[key], power=+a.power||0, applied=+a.appliedRound||0;
    if(!w||power>(+w.power||0)||(power===(+w.power||0)&&applied>=(+w.appliedRound||0))) winners[key]=a;
  });

}
function syncStackedGrants(t){
  if(!t) return;
  const winners=activeStackWinners(t);
  (t.activeFx||[]).forEach(a=>{
    if(!a.hpGrant) return;
    const key=a.stackKey||(a.k==='spell'?'spell:'+a.id:null);
    const should=!key||winners[key]===a;
    if(should&&!a.hpGrantActive){ t.hp=(+t.hp||0)+(+a.hpGrant||0); a.hpGrantActive=true; }
    if(!should&&a.hpGrantActive){ t.hp=Math.max(0,(+t.hp||0)-(+a.hpGrant||0)); a.hpGrantActive=false; }
  });
  t.hp=Math.min(+t.hp||0,eHpMax(t));
}
function detachActiveFx(t,a){
  if(!t||!a) return;
  if(a.hpGrant&&a.hpGrantActive) t.hp=Math.max(0,(+t.hp||0)-(+a.hpGrant||0));
  a.hpGrantActive=false;
}
function removeCastGroup(castId, reason){
  if(!castId) return 0;
  let count=0;
  chars.forEach(t=>{
    const gone=(t.activeFx||[]).filter(a=>a.castId===castId);
    gone.forEach(a=>{ detachActiveFx(t,a); count++; });
    if(gone.length) t.activeFx=t.activeFx.filter(a=>a.castId!==castId);
  });
  foesDB.forEach(f=>{
    const gone=(f.activeFx||[]).filter(a=>a.castId===castId);
    count+=gone.length;
    if(gone.length) f.activeFx=f.activeFx.filter(a=>a.castId!==castId);

function advanceFxRound(steps){

  const expired=[];
  chars.forEach(t=>{
    const keep=[];
    (t.activeFx||[]).forEach(a=>{
      if(a.expiresAtRound!=null && +a.expiresAtRound<=fxRound){
        detachActiveFx(t,a); expired.push((a.label||'Эффект')+' → '+t.name);
      } else keep.push(a);
    });
    t.activeFx=keep;
  });
  foesDB.forEach(f=>{
    const keep=[];
    (f.activeFx||[]).forEach(a=>{
      if(a.expiresAtRound!=null&&+a.expiresAtRound<=fxRound) expired.push((a.label||'Эффект')+' → '+f.n);
      else keep.push(a);
    });
    f.activeFx=keep;
  });
  fxInvalidate();
  chars.forEach(t=>{ syncStackedGrants(t); t.hp=Math.min(+t.hp||0,eHpMax(t)); });
  scheduleSave(); renderChars(); if(typeof renderFoes==='function') renderFoes();
  const msg='⏱ Раунд '+fxRound+(expired.length?' · завершены: '+expired.join('; '):' · длительности обновлены');

function endTriggeredSpellEffects(c,trigger){

}
function consumeRollFx(c,uids){

    const a=(c.activeFx||[]).find(x=>x.uid===id);
    if(a){ detachActiveFx(c,a); c.activeFx=c.activeFx.filter(x=>x.uid!==id); }

}
function consumeOutcomeRollFx(caster,targetVal,rolls){

  const ti=targetInfoOf(targetVal);
  if(ti.kind==='ally'&&ti.obj) consumeRollFx(ti.obj,rolls.consumeTargetFx||[]);
  else if(ti.kind==='foe'&&ti.obj&&(rolls.consumeTargetFx||[]).length){
    const gone=new Set(rolls.consumeTargetFx);

  }
}
function removeActiveFx(charId, uid){
  const t=getCh(charId); if(!t||!t.activeFx) return;
  const a=t.activeFx.find(x=>x.uid===uid);
  if(!a) return;
  detachActiveFx(t,a);
  t.activeFx=t.activeFx.filter(x=>x.uid!==uid);
  fxInvalidate();
  syncStackedGrants(t);
  t.hp=Math.min(+t.hp||0, eHpMax(t));   /* максимум мог снизиться — подрезаем текущие */

}





/* ── владения из пассивных способностей: преимущества И ограничения (5e) ── */
function profTextsOf(c){
  return (c.abilities||[]).map(e=>abilityOf(e.abilityId)).filter(ab=>ab&&isPassiveAbility(ab))
    .map(ab=>String((ab.n||'')+' '+(ab.x||'')).toLowerCase().replace(/\u0451/g,'е'));
}
function structuredProficienciesOf(c){
  const out={armor:{},weapons:{simple:false,martial:false,names:[]},materialBan:'',found:false};
  (c.abilities||[]).map(e=>abilityOf(e.abilityId)).filter(ab=>ab&&isPassiveAbility(ab)).forEach(ab=>{
    const m=currentMechanics(ab,'ability');
    if(!m||m.schemaVersion!==GAME_MECHANICS_SCHEMA_VERSION||m.mode==='legacy') return;
    out.found=true;
    const p=m.proficiencies;
    if(!p||!Object.keys(p).length) return;
    Object.assign(out.armor,p.armor||{});
    if(p.weapons){out.weapons.simple=out.weapons.simple||!!p.weapons.simple;out.weapons.martial=out.weapons.martial||!!p.weapons.martial;
      (p.weapons.names||[]).forEach(n=>{if(out.weapons.names.indexOf(n)<0)out.weapons.names.push(n);});}
    if(p.materialBan) out.materialBan=p.materialBan;
  });
  return out;
}
function armorProfsOf(c){
  const structured=structuredProficienciesOf(c);
  if(structured.found) return Object.keys(structured.armor).length?structured.armor:null;
  const txts=profTextsOf(c).filter(t=>/(доспех|брон|защит)/.test(t)&&/(владе|обучены)/.test(t));
  if(!txts.length) return null;
  const p={};
  txts.forEach(t=>{
    if(/(любые|любыми|всеми видами)[^.]{0,30}(средства защиты|доспех)/.test(t)){ p.light=p.medium=p.heavy=p.shield=true; }
    if(/легк[а-я]*\s+(доспех|брон)/.test(t)) p.light=true;
    if(/средн[а-я]*\s+(доспех|брон)/.test(t)) p.medium=true;
    if(/тяжел[а-я]*\s+(доспех|брон|защит)/.test(t)) p.heavy=true;
    if(/щит/.test(t)) p.shield=true;
  });
  return Object.keys(p).length? p : null;
}
function armorMaterialBanOf(c){
  const structured=structuredProficienciesOf(c);
  if(structured.found) return structured.materialBan==='metalArmor';
  return profTextsOf(c).some(t=>/не (носит|носят|надева[а-я]*|может носить)[^.]{0,40}метал/.test(t));
}
function weaponProfsOf(c){
  const structured=structuredProficienciesOf(c);
  if(structured.found) return structured.weapons.simple||structured.weapons.martial||structured.weapons.names.length?structured.weapons:null;
  const txts=profTextsOf(c).filter(t=>/оружи/.test(t)&&/(владе|обучены)/.test(t));
  if(!txts.length) return null;
  const r={simple:false, martial:false, names:[]};
  txts.forEach(t=>{
    if(/(любым инвентарем|любым оружием|с любым видом оружия|простым и воинским)/.test(t)){ r.simple=true; r.martial=true; }
    if(/простым оружием/.test(t)) r.simple=true;
    if(/воинским оружием/.test(t)) r.martial=true;
    const list=(t.match(/(?:а также|включая)\s+([^.]+)/)||[,''])[1];
    list.split(/,|\sи\s/).map(s=>s.trim()).filter(s=>s.length>3).forEach(s=>{
      r.names.push(s.split(/\s+/).map(w=>w.length>=6?w.slice(0,w.length-3):w).join(' '));
    });
  });
  if(!r.simple&&!r.martial&&!r.names.length) return null;
  return r;
}
const MARTIAL_WEAPON_RE=/длинный меч|короткий меч|двуручный меч|полуторн|боевой топор|секир|боевой молот|молот|рапир|скимитар|сабл|кнут|глеф|алебард|пик[аи ]|цеп|моргенштерн|трезубец|длинный лук|тяжелый арбалет|ручной арбалет/;
const ARMOR_KIND_RU={light:'легкий доспех', medium:'средний доспех', heavy:'тяжелый доспех', shield:'щит'};
function itemArmorKind(it){
  const eq=it&&it.mechanics&&it.mechanics.schemaVersion===GAME_MECHANICS_SCHEMA_VERSION&&it.mechanics.mode!=='legacy'&&it.mechanics.equipment;
  if(eq) return eq.armorKind||null;
  const tags=it.tags||[], hay=String((it.n||'')+' '+(it.props||'')).toLowerCase();
  if(tags.indexOf('shield')>=0||/\bщит/.test(String(it.n||'').toLowerCase())) return 'shield';
  if(it.type!=='armor') return null;
  if(tags.indexOf('heavyarmor')>=0||/тяжел/.test(hay)) return 'heavy';
  if(tags.indexOf('mediumarmor')>=0||/средн/.test(hay)) return 'medium';

function itemIsMetal(it){
  const eq=it&&it.mechanics&&it.mechanics.schemaVersion===GAME_MECHANICS_SCHEMA_VERSION&&it.mechanics.mode!=='legacy'&&it.mechanics.equipment;
  return eq?!!eq.metal:/кольчуг|лат[ыа]|сталь|железн|метал|панцир|чешуйчат/.test(String((it.n||'')+' '+(it.desc||'')).toLowerCase());
}
function profExempt(it){
  const eq=it&&it.mechanics&&it.mechanics.schemaVersion===GAME_MECHANICS_SCHEMA_VERSION&&it.mechanics.mode!=='legacy'&&it.mechanics.equipment;
  return eq?!!eq.proficiencyExempt:/не требует владени/.test(String(it.desc||'').toLowerCase());
}
function weaponProfHas(c, it){
  const wp=weaponProfsOf(c);
  if(wp===null||profExempt(it)) return true;
  const n=String(it.n||'').toLowerCase();
  if(wp.names.some(nm=>nm.split(' ').every(root=>root&&n.indexOf(root)>=0))) return true;
  const profile=itemProfile(it),martial=profile.weapon?profile.weapon.category==='martial':MARTIAL_WEAPON_RE.test(n);
  if(martial) return !!wp.martial;

}
function armorViolations(c){
  const out=[], profs=armorProfsOf(c), ban=armorMaterialBanOf(c);
  if(profs===null&&!ban) return out;
  const seen={};
  Object.keys(c.equipment||{}).forEach(sl=>{
    const id=c.equipment[sl]; if(!id||seen[id]) return; seen[id]=1;
    const e=invEntry(c,id), it=e&&itemOf(e.itemId); if(!it) return;
    const kind=itemArmorKind(it); if(!kind) return;
    if(profExempt(it)) return;
    if(profs!==null&&!profs[kind]) out.push({it, key:'prof:'+it.id, why:'нет владения: '+ARMOR_KIND_RU[kind]});
    else if(ban&&itemIsMetal(it)) out.push({it, key:'prof:'+it.id, why:'обет запрещает металлические доспехи'});
  });
  return out;
}
function activeArmorViolations(c){
  const off=c.fxOff||[];
  return armorViolations(c).filter(v=>off.indexOf(v.key)<0);
}

/* ── единый движок применения способностей (общий канвас с заклинаниями) ── */

    if(blockAct) return {ok:false, reason:'Состояние «'+blockAct+'» не позволяет совершать действия — способность неприменима.'};
  }

function useAbilityApply(abilityId, casterId, target, rolls){
  const ab=abilityOf(abilityId), caster=getCh(casterId);

  }
  if(resourceTriggered&&requiredPool&&(!rolls||rolls.poolSpend!==requiredPool.ab.id)){
    const msg='Для «'+ab.n+'» нужен подтвержденный бросок ресурсной кости.';
    setStatus('✕ '+msg,true); castShowErr&&castShowErr(msg); return false;
  }
  /* 1. Строгий префлайт всех ресурсов. Исчерпанный или отсутствующий запас
     останавливает действие без какого-либо изменения мира. */
  let chargeInfo='';

  }

    const back=ab.rest?(' Восстановление: '+ab.rest+'.'):' Восстановление: после завершения боя.';
    const msg='Заряды «'+ab.n+'» исчерпаны.'+back;
    setStatus('✕ '+msg,true); castShowErr&&castShowErr(msg); return false;
  }
  let poolDb=null, poolEntry=null, poolCur=null;
  if(resourceTriggered&&requiredPool){
    poolDb=requiredPool.ab;
    poolEntry=requiredPool.entry;
    if(poolDb&&poolEntry){
      poolCur=poolEntry.cur==null?poolDb.uses:poolEntry.cur;
      if(poolCur<=0){
        const msg='«'+poolDb.n+'» — запас исчерпан.';
        setStatus('✕ '+msg,true); castShowErr&&castShowErr(msg); return false;

  if(lasting.length&&tIsAlly&&effectAllowed){
    applyFxTo(target.slice(5), {k:'ability', id:ab.id, label:ab.n, from:caster.name,

  }
  if(combatRule.disarm&&tinfo.obj&&effectAllowed){
    const entry={k:'ability',id:ab.id,label:ab.n,from:caster.name,casterId:caster.id,castId:castUid(),

  if(ab.uses!=null) info.push('заряды: '+((e&&e.cur!=null)?e.cur:ab.uses)+' из '+ab.uses);
  if(ab.rest) info.push('восстановление: '+ab.rest);
  const chk=canUseAbilityCheck(caster, ab);
  if(!chk.ok) info.push('⚠ '+chk.reason);
  document.getElementById('castInfo').textContent=info.join(' · ');
  document.getElementById('castTarget').innerHTML=abilityTargetOptionsHTML(caster,ab);
  /* оружие, если прием идет вместе с атакой оружием */
  const ww=document.getElementById('castWeaponWrap'), wsel=document.getElementById('castWeapon');
  if(ww&&wsel){
    if(abilityUsesWeapon(ab)){
      const combatRule=abilityCombatRules(ab),wl=weaponOptionsOf(caster).filter(w=>!combatRule.requiresWeapon||(!w.fromBag&&!w.unarmed));
      wsel.innerHTML=wl.map(w=>'<option value="'+w.idx+'">'+esc(w.n)+' — атака '+fmtMod(w.atk)+(w.dmg?', урон '+esc(w.dmg):'')+'</option>').join('')
        +(combatRule.requiresWeapon?'':'<option value="">Без оружия (только сам прием)</option>');
      ww.style.display='block';

  }
  const pool=abilityPoolOf(caster, ab);

  const sw=document.getElementById('castSlotWrap'); if(sw) sw.style.display='none';

  document.getElementById('castStep1').style.display='block';
  document.getElementById('castStep2').style.display='none';

}
function abilityTargetOptionsHTML(caster,ab){

  if(ab&&rule.target==='enemy'){

/* «Бой окончен»: способности с зарядами без типа отдыха возвращаются (раз за бой) */
function encounterEnd(){
  let n=0;
  chars.forEach(c=>(c.abilities||[]).forEach(e=>{
    const db=abilityOf(e.abilityId);
    if(db&&db.uses!=null&&!db.rest&&(e.cur==null||e.cur<db.uses)){ e.cur=db.uses; n++; }
  }));
  fxInvalidate(); scheduleSave(); renderChars();
  setStatus('⚔ Бой окончен: восстановлены способности «раз за бой» ('+n+' шт.) у всех героев.');
  if(typeof castLogLine==='function') castLogLine('— бой окончен: способности «раз за бой» восстановлены ('+n+') —');
}

/* Полный и воспроизводимый возврат кампании к точке перед боем.
   Встроенные герои собираются заново из канонических листов, поэтому здесь
   восстанавливаются не только хиты, но и ячейки, заряды, расходники,
   экипировка и все остальные исходные значения. Пользовательские герои не
   удаляются: для них выполняется максимально полный отдых без догадок об
   исходном составе инвентаря. Журнал и архив завершенных боев сохраняются. */
function resetCustomCharacterForCombat(c){
  if(!c) return c;
  c.activeFx=[]; c.fxOff=[]; c.cond=[]; c.hpTemp=0; c.deaths={s:0,f:0};
  c.exhaustion=0; c.hdUsed=0; c.spentRest=0; c.hpPend=false;
  Object.keys(c.slots||{}).forEach(k=>{ const s=c.slots[k]||{}; s.cur=Math.max(0,+s.max||0); });
  (c.abilities||[]).forEach(e=>{ const ab=abilityOf(e.abilityId); if(ab&&ab.uses!=null) e.cur=ab.uses; });
  (c.inventory||[]).forEach(e=>{ e.ammoSpent=0; });
  c.hp=Math.max(1,eHpMax(c));
  return c;
}
function restorePartyAndCombatState(){
  const canonical={char_roku:buildRoku,char_torgar:buildTorgar,char_septih:buildSeptih,char_legerem:buildLegerem};
  const custom=(chars||[]).filter(c=>!canonical[c.id]).map(resetCustomCharacterForCombat);
  chars=[buildRoku(),buildTorgar(),buildSeptih(),buildLegerem()].concat(custom);
  if(typeof upgradeChar3==='function') chars.forEach(upgradeChar3);
  foesDB.forEach(f=>{
    const stats=foeStatsOf(f); f.hp=Math.max(0,+stats.hpMax||0); f.hpTemp=0; f.cond=[]; f.activeFx=[];
    foeResetActionState(f);
  });
  const history=(combat&&combat.history||[]).slice();
  combat=blankCombat(); combat.history=history;
  activeCharId=chars.length?chars[0].id:null; fxRound=1; lastCastEvent=null;
  fxInvalidate();
  return true;
}
function resetCombatAndParty(force){
  if(!force&&!window.confirm('Сбросить текущий бой и восстановить группу?\n\nВстроенные герои вернутся к исходным листам; пользовательские герои получат полный отдых; противники восстановят хиты. Журнал и архив завершенных боев сохранятся.')) return false;

/* ── концентрация: единый учет, разрыв, проверка при уроне ── */
function concEntriesOf(casterId){
  const out=[];
  chars.forEach(ch=>(ch.activeFx||[]).forEach(a=>{ if(a.conc&&a.casterId===casterId) out.push({ch,a}); }));
  foesDB.forEach(ch=>(ch.activeFx||[]).forEach(a=>{ if(a.conc&&a.casterId===casterId) out.push({ch,a,foe:true}); }));
  return out;
}
function concLabelOf(c){
  const e=concEntriesOf(c.id);
  return e.length? e.map(o=>o.a.label).filter((v,i,arr)=>arr.indexOf(v)===i).join('», «') : null;
}
function breakConcentration(caster, reason){
  const olds=concEntriesOf(caster.id);
  if(!olds.length) return false;
  const casterName=caster.name||caster.n||'Существо';
  const names=olds.map(o=>o.a.label).filter((v,i,a)=>a.indexOf(v)===i);
  olds.forEach(o=>{ if(!o.foe) detachActiveFx(o.ch,o.a); o.ch.activeFx=o.ch.activeFx.filter(x=>x.uid!==o.a.uid); });
  fxInvalidate();
  olds.filter(o=>!o.foe).forEach(o=>{ syncStackedGrants(o.ch); o.ch.hp=Math.min(+o.ch.hp||0, eHpMax(o.ch)); });
  scheduleSave(); renderChars(); if(typeof renderFoes==='function') renderFoes();
  setStatus('🧠✕ Концентрация '+casterName+' на «'+names.join('», «')+'» прервана: '+reason+'.');
  if(typeof castLogLine==='function') castLogLine(casterName+': концентрация на «'+names.join('», «')+'» прервана ('+reason+')');
  return true;
}
function concAdvantage(c){
  if(holderFxRules(c,'save.concentration').some(f=>f.mode==='adv')) return true;
  return charAbilityRuleEntries(c).some(x=>x.rules&&x.rules.concentrationAdvantage);
}
function concDamageCheck(c, dmg){
  if(!concEntriesOf(c.id).length) return;
  const dc=Math.max(10, Math.floor(dmg/2));
  const conMod=eMod(c,'con')+(c.saves&&c.saves.con?PROF[c.level]:0)+fxSaveBonus(c,'con');
  const adv=concAdvantage(c);
  const rows=adv? [{key:'a',label:'d20 — первый',sub:'преимущество на концентрацию: берется больший',min:1,max:20},{key:'b',label:'d20 — второй',min:1,max:20}]
                : [{key:'a',label:'d20',min:1,max:20}];
  askRolls({title:'⚂ Концентрация — '+c.name,
    note:'Урон '+dmg+' → спасбросок Телосложения, СЛ '+dc+'. Модификатор: '+(conMod>0?'+':'')+conMod+'.',
    rows,
    compute:v=>{ const r=adv?Math.max(v.a,v.b):v.a; const t=r+conMod; return 'd20 '+r+(conMod?(conMod>0?' + '+conMod:' − '+Math.abs(conMod)):'')+' = '+t+' против СЛ '+dc+' — '+(t>=dc?'удержана ✓':'ПРОВАЛ ✕'); },
    apply:v=>{
      const r=adv?Math.max(v.a,v.b):v.a;
      const tot=r+conMod, ok=tot>=dc;
      diceOutSet('Концентрация ('+c.name+'): урон '+dmg+' → спасбросок Тел СЛ '+dc+': d20 '+r+(adv?' ▲['+v.a+'|'+v.b+']':'')+(conMod?(conMod>0?' + '+conMod:' − '+Math.abs(conMod)):'')+' = '+tot+' — '+(ok?'удержана ✓':'ПРОВАЛ ✕'), ok?'var(--ok)':'var(--rubric)');
      if(!ok) breakConcentration(c, 'провален спасбросок Телосложения от урона (СЛ '+dc+')');
      else setStatus('🧠 '+c.name+' удерживает концентрацию (СЛ '+dc+' пройдена).');
    }});
}

function combatSnapshot(t,isFoe){
  return {id:t.id,foe:!!isFoe,hp:+t.hp||0,hpTemp:+t.hpTemp||0,cond:(t.cond||[]).slice(),
    deaths:isFoe?null:Object.assign({},t.deaths||{s:0,f:0}),

function rollbackLastCast(casterId){
  const ev=lastCastEvent;

/* ── спец-заклинания контрмагии: работают по имени записи — готово и для будущих ── */
function castCounterspell(sp, caster, target, usedLvl, plan){
  /* Круг цели уже выбран в префлайте до списания ячейки. Повторный prompt
     здесь раньше позволял отменить окно после коммита ресурсов. */
  let tLvl=plan&&plan.targetLevel;
  if(!tLvl){
    const raw=window.prompt('⚡ Контрзаклинание: какого круга заклинание прерываем? (1-9)','1');
    if(raw==null) return false;
    tLvl=Math.max(1,Math.min(9,parseInt(raw,10)||1));
  }
  const myLvl=usedLvl||3;
  let ok, note;
  if(myLvl>=tLvl){ ok=true; note='автоматически (ячейка '+myLvl+' круга ≥ круга цели)'; }
  else {
    const m=eMod(caster,spellAbOf(caster)), dc=10+tLvl;
    askRolls({title:'⚂ Контрзаклинание — проверка', note:'Круг цели '+tLvl+' выше ячейки '+myLvl+': проверка характеристики, СЛ '+dc+'. Модификатор: '+(m>0?'+':'')+m+'.',
      rows:[{key:'a',label:'d20',min:1,max:20}],
      compute:v=>'d20 '+v.a+(m?(m>0?' + '+m:' − '+Math.abs(m)):'')+' = '+(v.a+m)+' против СЛ '+dc+' — '+((v.a+m>=dc)?'успех':'провал'),
      apply:v=>{
        const okk=v.a+m>=dc;
        const nt='проверка d20 '+v.a+(m?(m>0?' + '+m:' − '+Math.abs(m)):'')+' = '+(v.a+m)+' против СЛ '+dc+(okk?' — успех':' — провал');
        diceOutSet('Контрзаклинание: '+nt, okk?'var(--ok)':'var(--rubric)');
        counterspellResolve(caster, target, tLvl, okk, nt);
      }});
    return true;
  }
  counterspellResolve(caster, target, tLvl, ok, note);
  return true;
}
function counterspellResolve(caster, target, tLvl, ok, note){
  let rollback='';
  if(target.indexOf('ally:')===0 && ok){
    const t=getCh(target.slice(5));
    if(t){
      const rb=rollbackLastCast(t.id);
      rollback=rb.ok?' · последствия последнего каста полностью отменены':' · '+rb.reason;
    }
  }
  const tl=target.indexOf('ally:')===0?(getCh(target.slice(5))||{}).name:(target==='enemy'?'враг':'цель');
  setStatus('⚡ Контрзаклинание от '+caster.name+' против '+tl+': '+(ok?'заклинание ('+tLvl+' круг) ПРЕРВАНО':'не удалось')+' — '+note+rollback+'.');
  castLogLine(caster.name+' → '+tl+': «Контрзаклинание» против заклинания '+tLvl+' круга — '+(ok?'прервано':'провал')+' ('+note+')'+rollback);
  fxInvalidate(); scheduleSave(); renderChars();
}
function castDispel(sp, caster, target, usedLvl){
  const myLvl=usedLvl||3;
  const ti=targetInfoOf(target);
  if(!ti.known||(ti.kind!=='ally'&&ti.kind!=='foe')){
    const tl=target==='enemy'?'враг':'неодушевленный объект';
    setStatus('⚡ Рассеивание магии: заклинания круга ≤ '+myLvl+' на цели («'+tl+'») оканчиваются; более высокие — проверка d20 + '+eMod(caster,spellAbOf(caster))+' против СЛ 10 + круг.');
    castLogLine(caster.name+' → '+tl+': «Рассеивание магии» (ячейка '+myLvl+' круга)');
    return true;
  }
  const t=ti.obj;
  const dispelled=[], held=[];
  const above=[];
  (t.activeFx||[]).slice().forEach(a=>{
    if(a.k!=='spell') return;
    const rec=spellOf(a.id); const lv=Math.max(rec?(+rec.l||0):0,+a.power||0);
    if(lv<=myLvl){
      if(ti.kind==='ally') removeActiveFx(t.id,a.uid); else t.activeFx=t.activeFx.filter(x=>x.uid!==a.uid);
      dispelled.push(a.label+(lv?' ('+lv+' кр.)':''));
    }
    else above.push({a, lv});
  });
  if(above.length){
    const m=eMod(caster,spellAbOf(caster));
    askRolls({title:'⚂ Рассеивание магии — проверки', note:'Эффекты выше '+myLvl+' круга: на каждый — d20 '+(m>0?'+ '+m:(m<0?'− '+Math.abs(m):''))+' против СЛ 10 + круг.',
      rows:above.map((x,i)=>({key:'r'+i, label:'d20 против «'+x.a.label+'»', sub:'СЛ '+(10+x.lv), min:1, max:20})),
      compute:v=>above.map((x,i)=>x.a.label+': '+(v['r'+i]+m)+(v['r'+i]+m>=10+x.lv?' ✓':' ✕')).join(' · '),
      apply:v=>{
        above.forEach((x,i)=>{
          const tot=v['r'+i]+m;
          if(tot>=10+x.lv){
            if(ti.kind==='ally') removeActiveFx(t.id,x.a.uid); else t.activeFx=t.activeFx.filter(a=>a.uid!==x.a.uid);
            dispelled.push(x.a.label+' ('+x.lv+' кр., проверка '+tot+'≥'+(10+x.lv)+')');
          }
          else held.push(x.a.label+' ('+x.lv+' кр., проверка '+tot+'<'+(10+x.lv)+')');
        });
        dispelFinish(caster,t,myLvl,dispelled,held);
      }});
    return true;
  }
  dispelFinish(caster, t, myLvl, dispelled, held);
  return true;
}
function dispelFinish(caster, t, myLvl, dispelled, held){
  const tn=t.name||t.n||'цель';
  const msg='⚡ Рассеивание магии на '+tn+': '+(dispelled.length?'рассеяно — '+dispelled.join('; '):'рассеивать нечего')+(held.length?' · устояло — '+held.join('; '):'');
  setStatus(msg+'.');
  castLogLine(caster.name+' → '+tn+': «Рассеивание магии» (ячейка '+myLvl+' круга) — '+(dispelled.length?'рассеяно: '+dispelled.join(', '):'ничего')+(held.length?'; устояло: '+held.join(', '):''));
  fxInvalidate(); scheduleSave(); renderChars(); if(typeof renderFoes==='function') renderFoes();
}
function castAntimagic(sp, caster, target, usedLvl){

      why:'концентрация · цель: '+(target==='enemy'?'враг':'неодушевленный объект'),

function castPowerWordKill(sp,caster,target){
  const ti=targetInfoOf(target);
  if(!ti.known||!ti.obj){
    setStatus('⚡ «'+sp.n+'»: цель без записи — мастер проверяет, было ли у нее 100 хитов или меньше.');
    castLogLine(caster.name+' → '+ti.name+': «'+sp.n+'» — порог 100 текущих хитов проверяет мастер');

  }
  if(ti.hp>100){
