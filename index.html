const FX_CONDITIONS=[
 ['Бессознательный',/бессознательн(?:ый|ая|ое|ые|ым|ой|а|о|ы)?(?=[^а-я]|$)/],
 ['Парализованный',/парализован(?:ный|ная|ное|ные|а|о|ы)?(?=[^а-я]|$)/],
 ['Окаменевший',/окаменевш(?:ий|ая|ее|ие|им|ей)(?=[^а-я]|$)/],
 ['Ошеломленный',/ошеломлен(?:ный|ная|ное|ные|а|о|ы)?(?=[^а-я]|$)/],
 ['Недееспособный',/недееспособ(?:ный|ная|ное|ные|ен|на|но|ны)(?=[^а-я]|$)/],
 ['Опутанный',/опутан(?:ный|ная|ное|ные|а|о|ы)?(?=[^а-я]|$)/],
 ['Ослепленный',/ослеплен(?:ный|ная|ное|ные|а|о|ы)?(?=[^а-я]|$)/],
 ['Отравленный',/отравлен(?:ный|ная|ное|ные|а|о|ы)?(?=[^а-я]|$)/],
 ['Очарованный',/очарован(?:ный|ная|ное|ные|а|о|ы)?(?=[^а-я]|$)/],
 ['Испуганный',/испуган(?:ный|ная|ное|ные|а|о|ы)?(?=[^а-я]|$)/],
 ['Сбитый с ног',/сбит[аоы]?\s+с\s+ног|падает\s+ничком/],
 ['Невидимый',/невидим(?:ый|ая|ое|ые|ым|ой|а|о|ы)?(?=[^а-я]|$)/]
];
function deriveFx(rec, kind){
  const t=[]; const x=fxTextOf(rec);
  const low=x.toLowerCase();
  let m;
  /* +N к КД (у брони базовый КД считает acAuto — ловим только явные бонусы) */
  const armorBase=(kind==='item'&&rec.type==='armor'&&rec.ac);   /* базу и бонусы такой брони считает acAuto */
  if(!armorBase){
    const acRe=/([+-]\s*\d+)\s*(?:к\s*)?(?:класс[ау]?\s+доспеха\s*(?:\(кд\))?|кд)/gi;
    while((m=acRe.exec(low))) fxPush(t,{stat:'ac',mode:'add',value:fxSigned(m[1])});
  }
  if((m=low.match(/кд\s+не\s+может\s+быть\s+ниже\s+(\d+)/)))
    fxPush(t,{stat:'ac',mode:'min',value:+m[1]});
  if(/(?:базов|класс)\w*\s+кд[^.]{0,50}(?:становится|равен)\s+13\s*\+\s*модификатор\s+ловкост/.test(low))
    fxPush(t,{stat:'note',mode:'text',value:'базовый КД 13 + модификатор Ловкости (если цель без доспехов)'});
  /* +N к броскам атаки и/или урону */
  const bothRe=/([+-]\s*\d+)\s*к\s*(?:броскам?\s*)?атак[а-я]*\s+и\s+(?:броскам?\s*)?урон/gi;
  while((m=bothRe.exec(low))){
    fxPush(t,{stat:'atk',mode:'add',value:fxSigned(m[1])});
    fxPush(t,{stat:'dmg',mode:'add',value:fxSigned(m[1])});
  }
  const atkRe=/([+-]\s*\d+)\s*к\s*(?:броскам?\s*)?атак[а-я]*/gi;
  while((m=atkRe.exec(low))) fxPush(t,{stat:'atk',mode:'add',value:fxSigned(m[1])});
  const dmgRe=/([+-]\s*\d+)\s*к\s*(?:броскам?\s*)?урон/gi;
  while((m=dmgRe.exec(low))) fxPush(t,{stat:'dmg',mode:'add',value:fxSigned(m[1])});
  /* максимум хитов и текущие хиты увеличиваются на N */
  if((m=low.match(/([+-]\s*\d+)\s*к\s+максимуму\s+и\s+текущим\s+хитам/))){
    const v=fxSigned(m[1]); fxPush(t,{stat:'hpmax',mode:'add',value:v}); fxPush(t,{stat:'hp',mode:'add',value:v});
  } else if((m=low.match(/(?:максимум[ау]? хитов и текущи[ем] хиты|к максимуму и текущим хитам)[^.]{0,70}?(?:увеличиваются на|получают|[+:])?\s*([+-]?\s*\d+)/))){
    const v=Math.abs(fxSigned(m[1])); fxPush(t,{stat:'hpmax',mode:'add',value:v}); fxPush(t,{stat:'hp',mode:'add',value:v});
  } else if((m=low.match(/максимум хитов[^.]*увеличивается на (\d+)/))){
    if(/каждый раз[^.]*уровен/.test(low)) fxPush(t,{stat:'hpmax',mode:'add',value:'lvl',note:'за уровень'});
    else fxPush(t,{stat:'hpmax',mode:'add',value:+m[1]});
  }
  /* инициатива и скорость */
  if((m=low.match(/инициатив[а-я]*\s*([+-]\s*\d+)/)||low.match(/([+-]\s*\d+)\s*к\s*инициатив/)))
    fxPush(t,{stat:'init',mode:'add',value:fxSigned(m[1])});
  const speedRe=/скорост[ьи][^.]{0,45}?(увеличива|повыша|снижа|уменьша)[а-я]*\s+на\s+(\d+(?:[.,]\d+)?)\s*(м(?:етр[а-я]*)?|фут[а-я]*)/gi;
  while((m=speedRe.exec(low))) fxPush(t,{stat:'speed',mode:'add',
    value:(/снижа|уменьша/.test(m[1])?-1:1)*parseFloat(m[2].replace(',','.')),unit:/^фут/.test(m[3])?'фут':'м'});
  if(/скорость[^.]{0,25}(?:уменьшена|снижается)\s+вдвое/.test(low))
    fxPush(t,{stat:'note',mode:'text',value:'скорость уменьшена вдвое'});
  if(/скорость[^.]{0,20}(?:равна|становится)\s+0/.test(low))
    fxPush(t,{stat:'note',mode:'text',value:'скорость равна 0'});
  if(/(?:удвоенн[а-я]*\s+скорость|скорость[^.]{0,20}удваива)/.test(low))
    fxPush(t,{stat:'speed',mode:'mul',value:2});
  /* +N к проверкам Характеристики (Навык) — возможно перечисление через «и» */
  const skRe=/([+-]\s*\d+)\s*к\s*проверк[а-я]*\s*([а-я]+)\s*\(([^)]+)\)(?:\s*и\s*([а-я]+)\s*\(([^)]+)\))?/gi;
  while((m=skRe.exec(x))){
    fxPush(t,{stat:'skill.'+m[3].trim(),mode:'add',value:fxSigned(m[1])});
    if(m[5]) fxPush(t,{stat:'skill.'+m[5].trim(),mode:'add',value:fxSigned(m[1])});
  }
  const skillNames=typeof SKILLS!=='undefined'?SKILLS.map(s=>s[0]):[];
  skillNames.forEach(name=>{
    const re=new RegExp('([+\\\\-]\\\\s*\\\\d+)\\\\s*к\\\\s*проверк[а-я]*\\\\s+'+name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i');
    const mm=x.match(re); if(mm) fxPush(t,{stat:'skill.'+name,mode:'add',value:fxSigned(mm[1])});
  });
  /* +N к спасброскам: ко всем или к одной/нескольким характеристикам */
  const saveRe=/([+-]\s*\d+)\s*к\s*(?:броскам\s*)?спасброск[а-я]*(?:\s+([а-я]+)(?:\s+и\s+([а-я]+))?)?/gi;
  while((m=saveRe.exec(low))){
    const a=FX_AB_WORDS[m[2]], b=FX_AB_WORDS[m[3]], v=fxSigned(m[1]);
    if(a){ fxPush(t,{stat:'save.'+a,mode:'add',value:v}); if(b) fxPush(t,{stat:'save.'+b,mode:'add',value:v}); }
    else fxPush(t,{stat:'save.all',mode:'add',value:v});
  }
  /* +N к характеристике: «значение вашей Мудрости … увеличивается на 1» */
  if((m=low.match(/значение ваше[йго]+\s+([а-я]+)(?:\s+или\s+([а-я]+))?[^.]*увеличивается на (\d+)/))){
    const k=FX_AB_WORDS[m[1]], choice=!!m[2]||/на выбор/.test(m[0]), conditional=/если[^.]{0,120}значение/.test(low);
    if(k&&!choice&&!conditional) fxPush(t,{stat:'ab.'+k,mode:'add',value:+m[3]});
    else if(k) fxPush(t,{stat:'note',mode:'text',value:'характеристика: +'+m[3]+' к '+m[1]+(m[2]?' или '+m[2]:'')+(choice?' (на выбор)':'')+(conditional?' при выполнении условия':'')});
  }
  /* качественные: преимущество/помеха/сопротивление/иммунитет */
  const qual=[
   [/преимуществ[а-я]*\s+(?:при|на|к)\s+(спасброск[а-я]*(?:\s+от|\s+против)?\s+[а-я ,и]+?)(?=,\s*(?:иммунитет|сопротив)|\s+и\s+сопротив|[.;)]|$)/g, (mm)=>'преимущество: '+mm[1].trim()],
   [/помех[а-я]*\s+(?:при|на)\s+(спасброск[а-я]*|броск[а-я]* атак[а-я]*|проверк[а-я]*)[^.;)]*/g, (mm)=>'помеха: '+mm[1].trim()],
   [/сопротив(?:ление|ляемост[а-я]*)\s+(?:к\s+)?урону\s+([а-я]+)/g, (mm)=>'сопротивление урону: '+mm[1]],
   [/иммунитет[а-я]*\s+к\s+([а-я ]+?)(?=[,.;)]|$)/g, (mm)=>'иммунитет: '+mm[1].trim()],
   [/не можете получить критическ[а-я]+ удар/g, ()=>'иммунитет к критическим ударам (в обычных условиях)'],
   [/не может быть испуган[а-я]*/g, ()=>'иммунитет к состоянию «Испуганный»'],
   [/не может восстанавлива[а-я]* (?:здоровье|хиты)/g, ()=>'не может восстанавливать хиты'],
   [/атак[а-я]* по (?:нему|ней|цели|существу)[^.]{0,35}с преимуществом/g, ()=>'атаки по цели совершаются с преимуществом'],
   [/помех[а-я]*\s+на\s+скрытност/g, ()=>'помеха на проверки Скрытности'],
   [/скрытност[а-я]*:\s*помеха/g, ()=>'помеха на проверки Скрытности']
  ];
  qual.forEach(([re,fn])=>{ let mm; while((mm=re.exec(low))) fxPush(t,{stat:'note',mode:'text',value:fn(mm)}); });
  /* Состояния: только формулировки, которые действительно накладывают состояние. */
  low.split(/[.!?;\n]+/).map(s=>s.trim()).filter(Boolean).forEach(sentence=>{
    if(/(?:снимает|излечивает|иммунитет|не может быть|невидимость не)/.test(sentence)) return;
    const candidates=FX_CONDITIONS.map(([name,re])=>({name,hit:sentence.match(re)})).filter(x=>x.hit);
    const direct=candidates.filter(({hit})=>{
      const before=sentence.slice(0,hit.index).trim();
      return /(?:становится|оказывается|при провале|эффект сна)[^,:;]{0,100}$/.test(before)
        ||/(?:^|\s)(?:цель|гуманоид|существо|оно|любое существо|усыпленное существо)(?:\s+[а-я0-9-]+){0,4}\s*[:,]?\s*$/.test(before)
        ||/существо\s+со\s+\d+\s+хитами\s+или\s+меньше\s*$/.test(before);
    });
    if(direct.length) candidates.forEach(({name})=>fxPush(t,{stat:'condition',mode:'text',value:name}));
  });
  /* Наставление, Благословение и подобные кубиковые добавки/вычеты. */
  const dieRe=/(добавля[а-я]*|вычита[а-я]*)\s+((?:\d+)?[кdд]\d+)\s+(?:к|из)\s+([^.;]+)/gi;
  while((m=dieRe.exec(low))){
    const sign=/вычита/.test(m[1])?'-':'+';
    fxPush(t,{stat:'note',mode:'text',value:sign+m[2].replace(/^[кдd]/,'1d').replace(/^(\d+)[кд]/,'$1d')+' '+(/вычита/.test(m[1])?'из ':'к ')+m[3].trim()});
  }
  return t;
}
const fxAutoCache=new WeakMap();
function recFx(rec, kind){
  if(rec && Array.isArray(rec.fx) && rec.fx.length) return rec.fx;
  if(!rec) return [];
  const sig=String(kind||'')+'\0'+fxTextOf(rec);
  const hit=fxAutoCache.get(rec);
  if(hit&&hit.sig===sig) return hit.fx;
  let fx=deriveFx(rec,kind);
  if(kind==='spell'){
    /* Структурные правила (то, что регулярками не вывести) идут первыми,
       автоматический разбор описания дополняет их без повторов. */
    const preset=spellPresetFx(rec);
    if(preset.length){
      const merged=preset.slice();
      const NUM=['hp','hpmax','ac','acbase','speed','atk','dmg','init'];
      const taken={}; preset.forEach(f=>{ taken[f.stat]=1; });
      /* если показатель уже задан структурным правилом, тот же показатель из
         авторазбора отбрасываем — иначе «Подмога» прибавила бы хиты дважды */
      fx.forEach(f=>{ if(taken[f.stat]&&NUM.indexOf(f.stat)>=0) return; fxPush(merged,f); });
      fx=merged;
    }
  }
  fxAutoCache.set(rec,{sig,fx});
  return fx;
}

function normSpellName(v){
  return String(v||'').toLowerCase().replace(/\u0451/g,'е').replace(/[«»"]/g,'').replace(/\s+/g,' ').trim();
}
function spellPresetFx(sp){
  const n=normSpellName(sp&&sp.n);
  if(n==='щит') return [
    {stat:'ac',mode:'add',value:5},
    {stat:'note',mode:'text',value:'невосприимчивость к «Волшебной стреле»'}
  ];
  if(n==='доспехи мага') return [
    {stat:'acbase',mode:'set',value:13,note:'только без доспеха'}
  ];
  if(n==='щит веры') return [{stat:'ac',mode:'add',value:2}];
  if(n==='благословение') return [
    {stat:'attack',mode:'die',value:'1d4'},
    {stat:'save',mode:'die',value:'1d4'}
  ];
  if(n==='порча') return [
    {stat:'attack',mode:'die',value:'-1d4'},
    {stat:'save',mode:'die',value:'-1d4'}
  ];
  if(n==='указание'||n==='наставление') return [
    {stat:'check',mode:'die',value:'1d4',consume:'roll'}
  ];
  if(n==='сопротивление') return [
    {stat:'save',mode:'die',value:'1d4',consume:'roll'}
  ];
  if(n==='скороход') return [{stat:'speed',mode:'add',value:'3 м'}];
  if(n==='луч холода'||n==='ледяной луч') return [{stat:'speed',mode:'add',value:'-10 футов'}];
  if(n==='ускорение') return [
    {stat:'ac',mode:'add',value:2},
    {stat:'save.dex',mode:'adv',value:1},
    {stat:'speed',mode:'mul',value:2},
    {stat:'note',mode:'text',value:'одно дополнительное ограниченное действие в каждый ход; после окончания — летаргия на ход'}
  ];
  if(n==='подмога') return [
    {stat:'hpmax',mode:'add',value:5},
    {stat:'hp',mode:'grant',value:5}
  ];
  if(n==='полет') return [
    {stat:'speed.fly',mode:'set',value:'18 м'},
    {stat:'note',mode:'text',value:'при окончании цель падает, если ее ничто не удерживает'}
  ];
  if(n==='невидимость'||n==='высшая невидимость') return [
    {stat:'note',mode:'text',value:n==='невидимость'?'невидимость до атаки или наложения заклинания':'невидимость не прекращается от атак и заклинаний'}
  ];
  if(n==='каменная кожа') return [
    {stat:'note',mode:'text',value:'сопротивление немагическому дробящему, колющему и рубящему урону'}
  ];
  if(n==='защита от энергии') return [
    {stat:'note',mode:'text',value:'сопротивление выбранному виду стихийного урона'}
  ];
  if(n==='удержание личности'||n==='удержание чудовища') return [
    {stat:'condition',mode:'text',value:'Парализованный'},
    {stat:'note',mode:'text',value:'повторный спасбросок Мудрости в конце каждого хода цели'}
  ];
  if(n==='убийственный смех таши') return [
    {stat:'condition',mode:'text',value:'Сбитый с ног'},
    {stat:'condition',mode:'text',value:'Недееспособный'},
    {stat:'note',mode:'text',value:'повторный спасбросок Мудрости в конце каждого хода цели'}
  ];
  if(n==='опутывание'||n==='паутина') return [
    {stat:'note',mode:'text',value:'при провале спасброска цель Опутана; повторная проверка для освобождения'}
  ];
  if(n==='страх') return [{stat:'note',mode:'text',value:'при провале спасброска цель Испугана'}];
  if(n==='изгнание'||n==='лабиринт') return [{stat:'note',mode:'text',value:'цель временно удалена с текущего плана'}];
  if(n==='леденящее прикосновение') return [
    {stat:'note',mode:'text',value:'цель не может восстанавливать хиты до начала следующего хода заклинателя'}
  ];
  if(n==='направляющий снаряд') return [
    {stat:'note',mode:'text',value:'следующая атака по цели совершается с преимуществом'}
  ];
  return [];
}
function spellFxForCast(sp,usedLvl){
  const fx=recFx(sp,'spell').map(f=>Object.assign({},f));
  const n=normSpellName(sp&&sp.n), lv=+usedLvl||+sp.l||0;
  if(n==='подмога'){
    const v=5+Math.max(0,lv-2)*5;
    fx.forEach(f=>{ if(f.stat==='hpmax'||f.stat==='hp') f.value=v; });
  }
  if(n==='волшебное оружие'){
    const v=lv>=6?3:(lv>=4?2:1);
    return [{stat:'atk',mode:'add',value:v},{stat:'dmg',mode:'add',value:v}];
  }
  return fx;
}
function spellNeedsConcentration(sp, usedLvl){
  const n=normSpellName(sp&&sp.n);
  if(n==='наставление'||n==='указание') return true;
  if(n==='возложение проклятия' && (+usedLvl||0)>=5) return false;
  return !!(sp&&sp.conc)||/концентрация/i.test(String((sp&&sp.d)||''));
}
function durationSpecOf(sp, usedLvl){
  const n=normSpellName(sp&&sp.n);
  if(n==='наставление'||n==='указание') return {kind:'rounds',rounds:10,label:'1 мин.'};
  if(n==='возложение проклятия'){
    const lv=+usedLvl||+sp.l||3;
    if(lv>=9) return {kind:'manual',label:'до рассеивания'};
    if(lv>=7) return {kind:'rounds',rounds:14400,label:'24 часа'};
    if(lv>=5) return {kind:'rounds',rounds:4800,label:'8 часов'};
    if(lv>=4) return {kind:'rounds',rounds:100,label:'10 минут'};
  }
  const raw=(String((sp&&sp.d)||'')+' '+String((sp&&sp.x)||'')).toLowerCase().replace(/\u0451/g,'е');
  if(/луч холода|ледяной луч|леденящее прикосновение|направляющий снаряд/.test(n))
    return {kind:'rounds',rounds:1,label:'до начала следующего хода'};
  if(/мгновенн/.test(String((sp&&sp.d)||'').toLowerCase())) return {kind:'instant',rounds:0,label:'мгновенно'};
  let m=raw.match(/(\d+)\s*(?:раунд|раундов|раунда)/);
  if(m) return {kind:'rounds',rounds:+m[1],label:m[1]+' раунд.'};
  m=raw.match(/(\d+)\s*(?:минут|минуты|минута|мин\.)/);
  if(m) return {kind:'rounds',rounds:+m[1]*10,label:m[1]+' мин.'};
  m=raw.match(/(\d+)\s*(?:часов|часа|час)/);
  if(m) return {kind:'rounds',rounds:+m[1]*600,label:m[1]+' ч.'};
  m=raw.match(/(\d+)\s*(?:дней|дня|день|суток|сутки)/);
  if(m) return {kind:'rounds',rounds:+m[1]*14400,label:m[1]+' сут.'};
  if(/до (?:начала|конца) (?:вашего |своего |следующего )?хода/.test(raw))
    return {kind:'rounds',rounds:1,label:'до следующего хода'};
  if(/до рассеивания|постоянн|до конца боя|особое/.test(raw))
    return {kind:'manual',label:String((sp&&sp.d)||'до снятия вручную')};
  return {kind:'manual',label:String((sp&&sp.d)||'до снятия вручную')};
}
function attachDuration(entry, sp, usedLvl){
  const d=durationSpecOf(sp,usedLvl);
  entry.durationLabel=d.label;
  entry.appliedRound=fxRound;
  if(d.kind==='rounds') entry.expiresAtRound=fxRound+d.rounds;
  else delete entry.expiresAtRound;
  entry.durationKind=d.kind;
  return d;
}
function fxRemaining(a){ return a&&a.expiresAtRound!=null?Math.max(0,(+a.expiresAtRound||0)-fxRound):null; }
function fxDurationLabel(a){
  const rem=fxRemaining(a);
  if(rem==null) return a.durationLabel||'до снятия';
  if(rem<=0) return 'истек';
  if(rem<10) return rem+' раунд.';
  if(rem%14400===0) return (rem/14400)+' сут.';
  if(rem%600===0) return (rem/600)+' ч.';
  if(rem%10===0) return (rem/10)+' мин.';
  return rem+' раунд.';
}

/* ── мгновенное лечение из свободного текста заклинаний, способностей и предметов ── */
function healingPassiveBonus(caster, spell, usedSlotLvl, text){
  if(!caster||!spell||(+spell.l||0)<=0) return 0;
  const level=usedSlotLvl||(+spell.l||1);
  /* В старых персональных записях бонус Ученика Жизни уже мог быть вписан числом. */
  const expected=2+level;
  if(new RegExp('модификатор[^.!?]{0,60}\\+\\s*'+expected+'(?:\\D|$)','i').test(text)) return 0;
  const hasLife=(caster.abilities||[]).some(e=>{
    const ab=typeof abilityOf==='function'?abilityOf(e.abilityId):null;
    const s=fxTextOf(ab||{}).toLowerCase();
    return !!ab&&(/ученик\s+жизни/.test(String(ab.n||'').toLowerCase())||/дополнительн[а-я]*\s+хит[^.]{0,80}2\s*\+\s*круг\s+заклинания/.test(s));

function deriveInstantHeal(rec, kind, caster, usedSlotLvl){
  const text=fxTextOf(rec), low=text.toLowerCase();
  if(kind==='spell'&&typeof normSpellName==='function'&&normSpellName(rec.n)==='исцеление')
    return {cnt:0, sides:0, plus:70+Math.max(0,(+usedSlotLvl||+rec.l||6)-6)*10};
  if(!/(?:восстанавлива[а-я]*[^.!?\n]{0,140}(?:хит|здоров)|(?:хит|здоров)[^.!?\n]{0,100}восстанавлива[а-я]*|(?:исцеля|исцелен|лечени)[а-я]*[^.!?\n]{0,100}(?:хит|здоров)|увеличить[^.]{0,80}(?:здоров|текущ)[^.]{0,60}хит)/.test(low)) return null;
  let cnt=0, sides=0, plus=0, m;
  const dice=low.match(/(?:восстанавлива[а-я]*|(?:исцеля|исцелен|лечени)[а-я]*|количество\s+хитов[^.]{0,25}равн[оые]*|хитов[^.]{0,25}равн[оые]*)[^.!?\n]{0,100}?(\d*)\s*[кd]\s*(\d+)([^.!?\n]*)/);

    const nums=[...tail.matchAll(/\+\s*(\d+)(?!\s*[кd])\b/g)].map(x=>+x[1]);
    plus+=nums.reduce((a,b)=>a+b,0);
    let key=null;
    const km=tail.match(/модификатор\s+(сил[ыа]|ловкост[ьи]|телосложени[яе]|интеллект[а]?|мудрост[ьи]|харизм[ыа])/);
    if(km) key=FX_AB_WORDS[km[1]];
    else if(/модификатор[^.!?\n]{0,45}(?:базов|характеристик|заклинател)/.test(tail))
      key=typeof spellAbOf==='function'&&caster?spellAbOf(caster):null;
    if(key&&caster) plus+=eMod(caster,key);
    if(/ваш\s+уровень(?:\s+[а-я]+)?/.test(tail)&&caster) plus+=(+caster.level||0);
  } else if((m=low.match(/восстанавлива[а-я]*\s+(\d+)\s+хит/))){

    const base=+rec.l||0, used=usedSlotLvl||base, delta=Math.max(0,used-base);
    const hi=(String(rec.hi||'')+' '+text).toLowerCase();
    const dieUp=hi.match(/(?:увеличива[а-я]*|добавля[а-я]*)\s+на\s+(\d*)\s*[кd]\s*(\d+)\s+за\s+кажд[а-я]*\s+круг/);
    if(delta&&dieUp&&(!sides||+dieUp[2]===sides)) cnt+=delta*+(dieUp[1]||1);
    const flatUp=hi.match(/(?:увеличива[а-я]*|добавля[а-я]*)\s+на\s+(\d+)\s+хит[а-я]*\s+за\s+кажд[а-я]*\s+круг/);
    if(delta&&flatUp) plus+=delta*(+flatUp[1]);
    plus+=healingPassiveBonus(caster,rec,used,text);

  if(!cnt&&!plus) return null;
  return {cnt,sides,plus};
}

/* ── мини-язык поля «Влияние на показатели» в редакторах ──
   по строке: кд +2 · кд-мин 16 · хиты-макс +5 · хиты +5 · иниц +1 · атака +1 · урон +2 ·
   хар.мудр +1 · спас.все +1 · спас.тел +2 · навык.Убеждение +1 ·
   скорость +3 м · скорость ×2 · состояние: Опутанный · текст: сопротивление урону ядом */
const FX_KEYS={'кд':'ac','хиты-макс':'hpmax','хиты':'hp','иниц':'init','инициатива':'init','атака':'atk','урон':'dmg',
 'пассв':'passperc','хар.сил':'ab.str','хар.лов':'ab.dex','хар.тел':'ab.con','хар.инт':'ab.int','хар.мудр':'ab.wis','хар.хар':'ab.cha',
 'спас.все':'save.all','спас.сил':'save.str','спас.лов':'save.dex','спас.тел':'save.con','спас.инт':'save.int','спас.мудр':'save.wis','спас.хар':'save.cha'};
function parseFxLines(txt){
  const out=[];
  String(txt||'').split('\n').map(s=>s.trim()).filter(Boolean).forEach(line=>{
    let m;
    if((m=line.match(/^текст:\s*(.+)$/i))){ out.push({stat:'note',mode:'text',value:m[1]}); return; }
    if((m=line.match(/^состояние:\s*(.+)$/i))){ out.push({stat:'condition',mode:'text',value:m[1].trim()}); return; }
    if((m=line.match(/^кд-мин\s+(\d+)$/i))){ out.push({stat:'ac',mode:'min',value:+m[1]}); return; }
    if((m=line.match(/^навык\.(.+?)\s+([+-]?\d+)$/i))){ out.push({stat:'skill.'+m[1].trim(),mode:'add',value:+m[2]}); return; }
    if((m=line.match(/^скорость\s+([+-]?\d+(?:[.,]\d+)?)\s*(м|фут(?:ов|а)?)$/i))){
      out.push({stat:'speed',mode:'add',value:parseFloat(m[1].replace(',','.')),unit:/^фут/i.test(m[2])?'фут':'м'}); return;
    }
    if((m=line.match(/^скорость\s+[x×*]\s*(\d+(?:[.,]\d+)?)$/i))){
      out.push({stat:'speed',mode:'mul',value:parseFloat(m[1].replace(',','.'))}); return;
    }
    if((m=line.match(/^скорость\s+(.+)$/i))){ out.push({stat:'speed',mode:'text',value:m[1]}); return; }
    if((m=line.match(/^([а-я.\-]+)\s+([+-]?\d+|lvl)$/i))){
      const k=FX_KEYS[m[1].toLowerCase()];
      if(k){ out.push({stat:k,mode:'add',value:(m[2].toLowerCase()==='lvl'?'lvl':+m[2])}); return; }
    }
    out.push({stat:'note',mode:'text',value:line});
  });
  return out;
}
function fxToLines(fx){
  const back={}; Object.keys(FX_KEYS).forEach(k=>back[FX_KEYS[k]]=k);
  return (fx||[]).map(f=>{
    if(f.stat==='note') return 'текст: '+f.value;
    if(f.stat==='condition') return 'состояние: '+f.value;
    if(f.stat==='ac'&&f.mode==='min') return 'кд-мин '+f.value;
    if(f.stat.startsWith('skill.')) return 'навык.'+f.stat.slice(6)+' '+(f.value>0?'+':'')+f.value;
    if(f.stat==='speed') return f.mode==='mul'?'скорость ×'+f.value:'скорость '+(f.mode==='add'&&f.value>0?'+':'')+f.value+(f.unit?' '+f.unit:'');
    const k=back[f.stat]||f.stat;
    return k+' '+(f.value==='lvl'?'lvl':(f.value>0?'+':'')+f.value);
  }).join('\n');
}

/* ── активные источники эффектов героя ── */
const EXHAUST_FX=['помеха на проверки характеристик','скорость уменьшена вдвое','помеха на броски атаки и спасброски','максимум хитов уменьшен вдвое','скорость равна 0','смерть'];

function charFxSources(c){
  const out=[];

  (c.inventory||[]).forEach(e=>{
    const it=itemOf(e.itemId); if(!it) return;
    const worn=wornEntry.has(e.id);

    if((wearable&&worn)||(!wearable)){
      const fx=recFx(it,'item');
      if(fx.length){
        const needAtt=itemNeedsAttune(it);
        const s={k:'item', id:it.id, label:it.n, why:(wearable?'надето':'в инвентаре')+(needAtt?(e.att?' · настроен':' · НЕ настроен'):''), fx, canOff:true};

    let rec=null, label=a.label||'';

     силе — самое свежее. Прочие продолжают отсчитывать длительность и вступят
     в силу, когда победивший эффект закончится. */
  const winners={};
  out.forEach(x=>{
    if(!x.stackKey) return;

  out.forEach(x=>{ if(x.stackKey&&winners[x.stackKey]!==x) x.stacked=true; });

  const ex=+c.exhaustion||0;

    out.push({k:'exhaustion', id:'ex', label:'Истощение (уровень '+ex+')', why:'состояние',

  }
  return out;
}
function charFxAll(c){
  if(c.__fxC && c.__fxC.t===fxCacheT) return c.__fxC.v;
  const list=[];
  charFxSources(c).forEach(s=>{ if(s.off||s.suppressed||s.stacked) return; s.fx.forEach(f=>{
    let v=f.value;
    if(v==='lvl') v=c.level;
    list.push({stat:f.stat, mode:f.mode, value:v, unit:f.unit||'', note:f.note||'', label:s.label, k:s.k,
      consume:f.consume||'', sourceUid:s.uid||null});

}
function fxSum(c,stat){

}
function fxParts(c,stat){
  return charFxAll(c).filter(f=>f.stat===stat&&f.mode==='add').map(f=>({v:+f.value||0,label:f.label,note:f.note}));
}
function fxMul(c,stat){

function speedTotal(c){
  const raw=String(c.speed||'');
  const over=(typeof carryWeight==='function')?(carryWeight(c)>Math.round((+c.ab.str||10)*7.5)):false;
  const m=raw.replace(',','.').match(/-?\d+(?:\.\d+)?/);
  if(!m) return raw;
  let v=+m[0], add=0, mul=1, setVal=null, unit=/фут/i.test(raw)?' футов':' м';
  charFxAll(c).filter(f=>f.stat==='speed').forEach(f=>{
    if(f.mode==='mul') mul*=+f.value||1;
    else if(f.mode==='set'){
      const sm=String(f.value).replace(',','.').match(/-?\d+(?:\.\d+)?/);
      if(sm){ setVal=+sm[0]; unit=/фут/i.test(String(f.value))?' футов':' м'; }
    } else if(f.mode==='add'){
      const sm=String(f.value).replace(',','.').match(/-?\d+(?:\.\d+)?/);

function fxMin(c,stat){

/* ── эффективные характеристики (каскад в модификаторы) ── */
function eAb(c,k){ return (c.ab&&c.ab[k]!=null?c.ab[k]:10)+fxSum(c,'ab.'+k); }
function eMod(c,k){ return Math.floor((eAb(c,k)-10)/2); }

/* ── наложение и снятие ── */
let fxUidSeq=0;
function fxUid(){ fxUidSeq++; return 'fx_'+Date.now().toString(36)+'_'+fxUidSeq.toString(36); }
function castUid(){ fxUidSeq++; return 'cast_'+Date.now().toString(36)+'_'+fxUidSeq.toString(36); }
function applyFxTo(targetId, entry){
  const t=getCh(targetId); if(!t) return;
  t.activeFx=t.activeFx||[];
  let fx=entry.fx;
  if(!fx){
    const rec=entry.k==='spell'?spellOf(entry.id):(entry.k==='ability'?abilityOf(entry.id):null);
    fx=recFx(rec, entry.k);
  }
  /* текущие хиты — мгновенный эффект при наложении, а не постоянный модификатор */
  const inst=fx.filter(f=>f.stat==='hp'&&f.mode==='add'&&typeof f.value==='number');
  const grants=fx.filter(f=>f.stat==='hp'&&f.mode==='grant');
  entry.fx=fx.filter(f=>!inst.includes(f)&&!grants.includes(f));
  if(grants.length) entry.hpGrant=grants.reduce((a,f)=>a+(+f.value||0),0);
  entry.uid=fxUid();
  if(entry.appliedRound==null) entry.appliedRound=fxRound;
  t.activeFx.push(entry);
  fxInvalidate();
  syncStackedGrants(t);
  const appliedConditions=(entry.fx||[]).filter(f=>f.stat==='condition').map(f=>String(f.value));
  const incapacitating=appliedConditions.find(n=>typeof ACTION_BLOCK_CONDS!=='undefined'&&ACTION_BLOCK_CONDS.indexOf(n)>=0);
  if(incapacitating&&typeof breakConcentration==='function')
    breakConcentration(t,'наложено состояние «'+incapacitating+'»');
  let healed=0; inst.forEach(f=>healed+=f.value);
  if(healed){ t.hp=Math.min(eHpMax(t),(+t.hp||0)+healed); }
  scheduleSave(); renderChars();
  setStatus('✦ «'+entry.label+'» — эффект наложен на '+t.name+(healed?' (+'+healed+' к текущим хитам)':'')+'.');
}
function activeStackWinners(t){
  const winners={}, hasAM=(t.activeFx||[]).some(a=>a.antimagic);
  (t.activeFx||[]).forEach(a=>{
    if(hasAM&&!a.antimagic&&(a.k==='spell'||a.k==='use')) return;
    const key=a.stackKey||(a.k==='spell'?'spell:'+a.id:null); if(!key) return;
    const w=winners[key], power=+a.power||0, applied=+a.appliedRound||0;
    if(!w||power>(+w.power||0)||(power===(+w.power||0)&&applied>=(+w.appliedRound||0))) winners[key]=a;

function syncStackedGrants(t){
  if(!t) return;
  const winners=activeStackWinners(t);
  (t.activeFx||[]).forEach(a=>{
    if(!a.hpGrant) return;
    const key=a.stackKey||(a.k==='spell'?'spell:'+a.id:null);
    const should=!key||winners[key]===a;
    if(should&&!a.hpGrantActive){ t.hp=(+t.hp||0)+(+a.hpGrant||0); a.hpGrantActive=true; }
    if(!should&&a.hpGrantActive){ t.hp=Math.max(0,(+t.hp||0)-(+a.hpGrant||0)); a.hpGrantActive=false; }
  });

  a.hpGrantActive=false;
}
function removeCastGroup(castId, reason){

    gone.forEach(a=>{ detachActiveFx(t,a); count++; });
    if(gone.length) t.activeFx=t.activeFx.filter(a=>a.castId!==castId);
  });
  foesDB.forEach(f=>{
    const gone=(f.activeFx||[]).filter(a=>a.castId===castId);
    count+=gone.length;
    if(gone.length) f.activeFx=f.activeFx.filter(a=>a.castId!==castId);
  });
  if(count){
    fxInvalidate();
    chars.forEach(t=>{ syncStackedGrants(t); t.hp=Math.min(+t.hp||0,eHpMax(t)); });
    scheduleSave(); renderChars(); if(typeof renderFoes==='function') renderFoes();
    if(reason) setStatus(reason);
  }
  return count;
}
function advanceFxRound(steps){
  steps=Math.max(1,Math.min(600,+steps||1));
  fxRound+=steps;
  if(lastCastEvent&&lastCastEvent.round<fxRound) lastCastEvent=null;
  const expired=[];
  chars.forEach(t=>{
    const keep=[];
    (t.activeFx||[]).forEach(a=>{
      if(a.expiresAtRound!=null && +a.expiresAtRound<=fxRound){
        detachActiveFx(t,a); expired.push((a.label||'Эффект')+' → '+t.name);
      } else keep.push(a);
    });
    t.activeFx=keep;
  });
  foesDB.forEach(f=>{
    const keep=[];
    (f.activeFx||[]).forEach(a=>{
      if(a.expiresAtRound!=null&&+a.expiresAtRound<=fxRound) expired.push((a.label||'Эффект')+' → '+f.n);
      else keep.push(a);
    });
    f.activeFx=keep;
  });
  fxInvalidate();
  chars.forEach(t=>{ syncStackedGrants(t); t.hp=Math.min(+t.hp||0,eHpMax(t)); });
  scheduleSave(); renderChars(); if(typeof renderFoes==='function') renderFoes();
  const msg='⏱ Раунд '+fxRound+(expired.length?' · завершены: '+expired.join('; '):' · длительности обновлены');
  setStatus(msg+'.');
  if(expired.length) castLogLine(msg);
}
function endTriggeredSpellEffects(c,trigger){
  if(!c) return;
  const gone=(c.activeFx||[]).filter(a=>a.k==='spell'&&normSpellName(a.label)==='невидимость'&&(trigger==='attack'||trigger==='spell'));
  if(!gone.length) return;
  gone.forEach(a=>detachActiveFx(c,a));
  c.activeFx=c.activeFx.filter(a=>gone.indexOf(a)<0);
  fxInvalidate(); syncStackedGrants(c); scheduleSave(); renderChars();
  setStatus('✦ «Невидимость» окончена: '+(trigger==='attack'?'совершена атака':'наложено заклинание')+'.');
}
function consumeRollFx(c,uids){
  const ids=[...new Set((uids||[]).filter(Boolean))];
  if(!c||!ids.length) return;
  ids.forEach(id=>{
    const a=(c.activeFx||[]).find(x=>x.uid===id);
    if(a){ detachActiveFx(c,a); c.activeFx=c.activeFx.filter(x=>x.uid!==id); }
  });
  fxInvalidate(); syncStackedGrants(c); scheduleSave(); renderChars();
}
function removeActiveFx(charId, uid){
  const t=getCh(charId); if(!t||!t.activeFx) return;
  const a=t.activeFx.find(x=>x.uid===uid);
  if(!a) return;
  detachActiveFx(t,a);
  t.activeFx=t.activeFx.filter(x=>x.uid!==uid);
  fxInvalidate();
  syncStackedGrants(t);
  t.hp=Math.min(+t.hp||0, eHpMax(t));   /* максимум мог снизиться — подрезаем текущие */
  scheduleSave(); renderChars();
}





/* ── владения из пассивных способностей: преимущества И ограничения (5e) ── */
function profTextsOf(c){
  return (c.abilities||[]).map(e=>abilityOf(e.abilityId)).filter(ab=>ab&&isPassiveAbility(ab))
    .map(ab=>String((ab.n||'')+' '+(ab.x||'')).toLowerCase().replace(/\u0451/g,'е'));
}
function armorProfsOf(c){
  const txts=profTextsOf(c).filter(t=>/(доспех|брон|защит)/.test(t)&&/(владе|обучены)/.test(t));
  if(!txts.length) return null;
  const p={};
  txts.forEach(t=>{
    if(/(любые|любыми|всеми видами)[^.]{0,30}(средства защиты|доспех)/.test(t)){ p.light=p.medium=p.heavy=p.shield=true; }
    if(/легк[а-я]*\s+(доспех|брон)/.test(t)) p.light=true;
    if(/средн[а-я]*\s+(доспех|брон)/.test(t)) p.medium=true;
    if(/тяжел[а-я]*\s+(доспех|брон|защит)/.test(t)) p.heavy=true;
    if(/щит/.test(t)) p.shield=true;
  });
  return Object.keys(p).length? p : null;
}
function armorMaterialBanOf(c){
  return profTextsOf(c).some(t=>/не (носит|носят|надева[а-я]*|может носить)[^.]{0,40}метал/.test(t));
}
function weaponProfsOf(c){
  const txts=profTextsOf(c).filter(t=>/оружи/.test(t)&&/(владе|обучены)/.test(t));
  if(!txts.length) return null;
  const r={simple:false, martial:false, names:[]};
  txts.forEach(t=>{
    if(/(любым инвентарем|любым оружием|с любым видом оружия|простым и воинским)/.test(t)){ r.simple=true; r.martial=true; }
    if(/простым оружием/.test(t)) r.simple=true;
    if(/воинским оружием/.test(t)) r.martial=true;
    const list=(t.match(/(?:а также|включая)\s+([^.]+)/)||[,''])[1];
    list.split(/,|\sи\s/).map(s=>s.trim()).filter(s=>s.length>3).forEach(s=>{
      r.names.push(s.split(/\s+/).map(w=>w.length>=6?w.slice(0,w.length-3):w).join(' '));
    });
  });
  if(!r.simple&&!r.martial&&!r.names.length) return null;
  return r;
}
const MARTIAL_WEAPON_RE=/длинный меч|короткий меч|двуручный меч|полуторн|боевой топор|секир|боевой молот|молот|рапир|скимитар|сабл|кнут|глеф|алебард|пик[аи ]|цеп|моргенштерн|трезубец|длинный лук|тяжелый арбалет|ручной арбалет/;
const ARMOR_KIND_RU={light:'легкий доспех', medium:'средний доспех', heavy:'тяжелый доспех', shield:'щит'};
function itemArmorKind(it){
  const tags=it.tags||[], hay=String((it.n||'')+' '+(it.props||'')).toLowerCase();
  if(tags.indexOf('shield')>=0||/\bщит/.test(String(it.n||'').toLowerCase())) return 'shield';
  if(it.type!=='armor') return null;
  if(tags.indexOf('heavyarmor')>=0||/тяжел/.test(hay)) return 'heavy';
  if(tags.indexOf('mediumarmor')>=0||/средн/.test(hay)) return 'medium';
  return 'light';
}
function itemIsMetal(it){ return /кольчуг|лат[ыа]|сталь|железн|метал|панцир|чешуйчат/.test(String((it.n||'')+' '+(it.desc||'')).toLowerCase()); }
function profExempt(it){ return /не требует владени/.test(String(it.desc||'').toLowerCase()); }
function weaponProfHas(c, it){
  const wp=weaponProfsOf(c);
  if(wp===null||profExempt(it)) return true;
  const n=String(it.n||'').toLowerCase();
  if(wp.names.some(nm=>nm.split(' ').every(root=>root&&n.indexOf(root)>=0))) return true;
  const martial=MARTIAL_WEAPON_RE.test(n);
  if(martial) return !!wp.martial;
  return !!wp.simple;
}
function armorViolations(c){
  const out=[], profs=armorProfsOf(c), ban=armorMaterialBanOf(c);
  if(profs===null&&!ban) return out;
  const seen={};
  Object.keys(c.equipment||{}).forEach(sl=>{
    const id=c.equipment[sl]; if(!id||seen[id]) return; seen[id]=1;
    const e=invEntry(c,id), it=e&&itemOf(e.itemId); if(!it) return;
    const kind=itemArmorKind(it); if(!kind) return;
    if(profExempt(it)) return;
    if(profs!==null&&!profs[kind]) out.push({it, key:'prof:'+it.id, why:'нет владения: '+ARMOR_KIND_RU[kind]});
    else if(ban&&itemIsMetal(it)) out.push({it, key:'prof:'+it.id, why:'обет запрещает металлические доспехи'});
  });
  return out;
}
function activeArmorViolations(c){
  const off=c.fxOff||[];
  return armorViolations(c).filter(v=>off.indexOf(v.key)<0);
}

/* ── единый движок применения способностей (общий канвас с заклинаниями) ── */
function canUseAbilityCheck(caster, ab){
  const active=abilityIsActive(ab);
  if(active){
    const cond=effectiveConditions(caster);
    const blockAct=ACTION_BLOCK_CONDS.filter(n=>cond.indexOf(n)>=0)[0];
    if(blockAct) return {ok:false, reason:'Состояние «'+blockAct+'» не позволяет совершать действия — способность неприменима.'};
  }
  return {ok:true};
}
function deriveAbilityHeal(ab, caster){
  return deriveInstantHeal(ab,'ability',caster,null);
}
function useAbilityApply(abilityId, casterId, target, rolls){
  const ab=abilityOf(abilityId), caster=getCh(casterId);
  if(!ab||!caster||!target) return false;
  const chk=canUseAbilityCheck(caster, ab);
  if(!chk.ok){ setStatus('✕ '+chk.reason, true); castShowErr&&castShowErr(chk.reason); return false; }
  rolls=rolls||(arguments.length>3?arguments[3]:null);
  /* 1. Префлайт всех ресурсов. Ни один счетчик не меняется, пока мастер не
     подтвердил каждое превышение запаса. */
  let chargeInfo='';
  const ownEntry=ab.uses!=null?(caster.abilities||[]).find(x=>x.abilityId===ab.id):null;
  const ownCur=ownEntry?(ownEntry.cur==null?ab.uses:ownEntry.cur):null;
  if(ownEntry&&ownCur<=0){
    const back=ab.rest?('восстановится: '+ab.rest):'восстановится после боя или решением мастера';
    if(!window.confirm('Заряды «'+ab.n+'» исчерпаны ('+back+').\n\nОК — применить все равно решением мастера.')) return false;
  }
  let poolDb=null, poolEntry=null, poolCur=null;
  if(rolls&&rolls.poolSpend){
    poolDb=abilityOf(rolls.poolSpend);
    poolEntry=(caster.abilities||[]).find(x=>x.abilityId===rolls.poolSpend);
    if(poolDb&&poolEntry){
      poolCur=poolEntry.cur==null?poolDb.uses:poolEntry.cur;
      if(poolCur<=0&&!window.confirm('«'+poolDb.n+'» — запас исчерпан.\n\nОК — применить все равно решением мастера.')) return false;
    }
  }
  /* 2. Атомарный коммит ресурсов после успешного префлайта. */
  if(ownEntry){
    if(ownCur>0){ ownEntry.cur=ownCur-1; chargeInfo=' · заряд −1 (осталось '+ownEntry.cur+' из '+ab.uses+')'; }
    else chargeInfo=' · сверх зарядов (решение мастера)';
  }
  if(poolDb&&poolEntry){
    if(poolCur>0){ poolEntry.cur=poolCur-1; chargeInfo+=' · '+poolDb.n+' −1 (осталось '+poolEntry.cur+' из '+poolDb.uses+')'; }
    else chargeInfo+=' · '+poolDb.n+' сверх запаса';
  }
  const tIsAlly=target.indexOf('ally:')===0;
  const tinfo=targetInfoOf(target);
  let info='';
  /* 3. итоги формулы */
  if(rolls){
    info+=applyRollsToTarget(target, rolls, '✦ '+ab.n);
  } else {
    /* старый путь: лечение прямо из описания (для программных вызовов) */
    const heal=deriveAbilityHeal(ab, caster);
    if(heal&&tIsAlly){
      if(ab.uses!=null){ const e=(caster.abilities||[]).find(x=>x.abilityId===ab.id); if(e&&chargeInfo.indexOf('−1')>=0) e.cur=(e.cur||0)+1; }
      askRolls({title:'✦ '+ab.n+' — '+caster.name,
        note:'Формула лечения: '+heal.cnt+'d'+heal.sides+(heal.plus?' + '+heal.plus:'')+'.',
        rows:[{key:'s',label:'Сумма '+heal.cnt+'d'+heal.sides,sub:'от '+heal.cnt+' до '+(heal.cnt*heal.sides),min:heal.cnt,max:heal.cnt*heal.sides}],
        compute:v=>'Лечение: '+v.s+(heal.plus?' + '+heal.plus:'')+' = +'+(v.s+heal.plus)+' хитов',
        apply:v=>useAbilityApply(abilityId, casterId, target, {healTotal:v.s+heal.plus, notes:[], verdict:[]})});
      return true;
    }
  }
  /* 4. длящиеся эффекты на цель — только если прием не промахнулся */
  const effectAllowed=outcomeAllowsEffect(rolls);
  const lasting=recFx(ab,'ability').filter(f=>!(f.stat==='hp'&&f.mode==='add'));
  if(lasting.length&&tIsAlly&&effectAllowed){
    applyFxTo(target.slice(5), {k:'ability', id:ab.id, label:ab.n, from:caster.name,
      why:'применено: '+caster.name+(ab.rest?' · восст.: '+ab.rest:''), fx:lasting});
    info+=' · эффект наложен';
  } else if(lasting.length&&tinfo.kind==='foe'&&tinfo.obj&&effectAllowed){
    const entry={k:'ability',id:ab.id,label:ab.n,from:caster.name,casterId:caster.id,
      castId:castUid(),stackKey:'ability:'+ab.id,power:0,why:'применено: '+caster.name,fx:lasting.map(x=>Object.assign({},x))};
    attachDuration(entry,{n:ab.n,d:'',x:ab.x||''},0);
    applyFxToFoe(tinfo.obj,entry);
    info+=' · эффект наложен на противника';
  }
  const tl=tinfo.name||(target==='enemy'?'враг':'—');
  fxInvalidate(); scheduleSave(); renderChars(); if(typeof renderFoes==='function') renderFoes();
  setStatus('✦ «'+ab.n+'» — применено (цель: '+tl+')'+chargeInfo+info+'.');
  castLogLine('✦ '+caster.name+' → '+tl+': способность «'+ab.n+'»'+chargeInfo+info);
  if(rolls&&rolls.verdict&&rolls.verdict.length) castLogLine('    разбор: '+rolls.verdict.join(' | '));
  return true;
}
function abilityCastFx(abilityId, casterId){

/* «Бой окончен»: способности с зарядами без типа отдыха возвращаются (раз за бой) */
function encounterEnd(){

/* ── концентрация: единый учет, разрыв, проверка при уроне ── */
function concEntriesOf(casterId){
  const out=[];
  chars.forEach(ch=>(ch.activeFx||[]).forEach(a=>{ if(a.conc&&a.casterId===casterId) out.push({ch,a}); }));
  foesDB.forEach(ch=>(ch.activeFx||[]).forEach(a=>{ if(a.conc&&a.casterId===casterId) out.push({ch,a,foe:true}); }));
  return out;
}
function concLabelOf(c){
  const e=concEntriesOf(c.id);
  return e.length? e.map(o=>o.a.label).filter((v,i,arr)=>arr.indexOf(v)===i).join('», «') : null;
}
function breakConcentration(caster, reason){
  const olds=concEntriesOf(caster.id);
  if(!olds.length) return false;
  const names=olds.map(o=>o.a.label).filter((v,i,a)=>a.indexOf(v)===i);
  olds.forEach(o=>{ if(!o.foe) detachActiveFx(o.ch,o.a); o.ch.activeFx=o.ch.activeFx.filter(x=>x.uid!==o.a.uid); });
  fxInvalidate();
  olds.filter(o=>!o.foe).forEach(o=>{ syncStackedGrants(o.ch); o.ch.hp=Math.min(+o.ch.hp||0, eHpMax(o.ch)); });
  scheduleSave(); renderChars(); if(typeof renderFoes==='function') renderFoes();
  setStatus('🧠✕ Концентрация '+caster.name+' на «'+names.join('», «')+'» прервана: '+reason+'.');
  if(typeof castLogLine==='function') castLogLine(caster.name+': концентрация на «'+names.join('», «')+'» прервана ('+reason+')');
  return true;
}
function concAdvantage(c){
  return fxNotesOf(c).some(t=>/преимуществ[а-я]*[^.]*концентрац/.test(t));
}
function concDamageCheck(c, dmg){
  if(!concEntriesOf(c.id).length) return;
  const dc=Math.max(10, Math.floor(dmg/2));
  const conMod=eMod(c,'con')+(c.saves&&c.saves.con?PROF[c.level]:0)+fxSaveBonus(c,'con');
  const adv=concAdvantage(c);
  const rows=adv? [{key:'a',label:'d20 — первый',sub:'преимущество на концентрацию: берется больший',min:1,max:20},{key:'b',label:'d20 — второй',min:1,max:20}]
                : [{key:'a',label:'d20',min:1,max:20}];
  askRolls({title:'⚂ Концентрация — '+c.name,
    note:'Урон '+dmg+' → спасбросок Телосложения, СЛ '+dc+'. Модификатор: '+(conMod>0?'+':'')+conMod+'.',
    rows,
    compute:v=>{ const r=adv?Math.max(v.a,v.b):v.a; const t=r+conMod; return 'd20 '+r+(conMod?(conMod>0?' + '+conMod:' − '+Math.abs(conMod)):'')+' = '+t+' против СЛ '+dc+' — '+(t>=dc?'удержана ✓':'ПРОВАЛ ✕'); },
    apply:v=>{
      const r=adv?Math.max(v.a,v.b):v.a;
      const tot=r+conMod, ok=tot>=dc;
      diceOutSet('Концентрация ('+c.name+'): урон '+dmg+' → спасбросок Тел СЛ '+dc+': d20 '+r+(adv?' ▲['+v.a+'|'+v.b+']':'')+(conMod?(conMod>0?' + '+conMod:' − '+Math.abs(conMod)):'')+' = '+tot+' — '+(ok?'удержана ✓':'ПРОВАЛ ✕'), ok?'var(--ok)':'var(--rubric)');
      if(!ok) breakConcentration(c, 'провален спасбросок Телосложения от урона (СЛ '+dc+')');
      else setStatus('🧠 '+c.name+' удерживает концентрацию (СЛ '+dc+' пройдена).');
    }});
}

/* ── спец-заклинания контрмагии: работают по имени записи — готово и для будущих ── */
function castCounterspell(sp, caster, target, usedLvl, plan){
  /* Круг цели уже выбран в префлайте до списания ячейки. Повторный prompt
     здесь раньше позволял отменить окно после коммита ресурсов. */
  let tLvl=plan&&plan.targetLevel;
  if(!tLvl){
    const raw=window.prompt('⚡ Контрзаклинание: какого круга заклинание прерываем? (1-9)','1');
    if(raw==null) return false;
    tLvl=Math.max(1,Math.min(9,parseInt(raw,10)||1));
  }
  const myLvl=usedLvl||3;
  let ok, note;
  if(myLvl>=tLvl){ ok=true; note='автоматически (ячейка '+myLvl+' круга ≥ круга цели)'; }
  else {
    const m=eMod(caster,spellAbOf(caster)), dc=10+tLvl;
    askRolls({title:'⚂ Контрзаклинание — проверка', note:'Круг цели '+tLvl+' выше ячейки '+myLvl+': проверка характеристики, СЛ '+dc+'. Модификатор: '+(m>0?'+':'')+m+'.',
      rows:[{key:'a',label:'d20',min:1,max:20}],
      compute:v=>'d20 '+v.a+(m?(m>0?' + '+m:' − '+Math.abs(m)):'')+' = '+(v.a+m)+' против СЛ '+dc+' — '+((v.a+m>=dc)?'успех':'провал'),
      apply:v=>{
        const okk=v.a+m>=dc;
        const nt='проверка d20 '+v.a+(m?(m>0?' + '+m:' − '+Math.abs(m)):'')+' = '+(v.a+m)+' против СЛ '+dc+(okk?' — успех':' — провал');
        diceOutSet('Контрзаклинание: '+nt, okk?'var(--ok)':'var(--rubric)');
        counterspellResolve(caster, target, tLvl, okk, nt);
      }});
    return true;
  }
  counterspellResolve(caster, target, tLvl, ok, note);
  return true;
}
function counterspellResolve(caster, target, tLvl, ok, note){

/* ── компоненты заклинаний: В (вербальный), С (соматический), М (материальный) ── */
function parseComponents(sp){
  const cm=String((sp&&sp.cm)||'').trim().replace(/\u0451/g,'е');
  if(!cm||cm==='—') return {v:false,s:false,m:false,matDesc:'',flex:false};
  /*
     Запятые и косые черты в нотации 5e — разделители обязательных
     компонентов, а косая черта внутри «М (песок/лепестки)» относится
     только к описанию материала. Она никогда не означает «любой из».
  */
  const mat=(cm.match(/(?:М|M)\s*\(([^)]*)\)/i)||[]);
  const matDesc=mat[1]||'';
  const top=cm.replace(/\([^)]*\)/g,' ').toUpperCase();
  const tokens=top.split(/[\s,;/+]+/).filter(Boolean);
  const has=(...variants)=>tokens.some(x=>variants.indexOf(x)>=0);
  return {v:has('В','V'), s:has('С','C','S'), m:has('М','M'), matDesc, flex:false};
}

  const text=(String(sp.cm||'')+' '+String(sp.x||'')).toLowerCase().replace(/\u0451/g,'е');
  if(/не\s+(?:требуется\s+и\s+не\s+)?расходу/.test(text)) return 0;
  return /(?:расходуется|расходуем[а-я]*|при этом расходу)/.test(text)?1:0;
}
const ACTION_BLOCK_CONDS=['Бессознательный','Парализованный','Окаменевший','Ошеломленный','Недееспособный'];

/* ── формула заклинания: кости лечения/урона с учетом круга ячейки ── */
/* ══════ УНИВЕРСАЛЬНЫЙ РАЗБОР ТРЕБУЕМЫХ БРОСКОВ ══════
   Работает и для заклинаний, и для способностей, и для будущих записей.
   Понимает обе записи костей: «2d8» и «2d8»; масштабирование заговоров по
   уровню из поля усиления; апкаст ячейкой; броски атаки; спасброски цели. */
function normRollTxt(s){
  /* единая нотация: любая запись кости (1d8, 1д8, 1D8, 1 d 8) приводится к «1d8» */
  return String(s||'').replace(/\u0451/g,'е').toLowerCase()
    .replace(/(\d+)\s*[кkд]\s*(\d+)/g,'$1d$2')
    .replace(/(\d+)\s*d\s*(\d+)/g,'$1d$2');
}
function normDiceInput(s){
  return String(s||'').toLowerCase().replace(/[кkд]/g,'d');
}
function scanDiceGroups(txt){
  const out=[]; const re=/(\d+)\s*d\s*(\d+)(?:\s*\+\s*(\d+))?/g; let m;
  while((m=re.exec(txt))){
    const start=Math.max(0,m.index-90), after=m.index+m[0].length;
    out.push({cnt:+m[1], sides:+m[2], plus:+(m[3]||0), idx:m.index,
      ctx:txt.slice(start, after+110), ctxPos:m.index-start,
      after:txt.slice(after, after+60), before:txt.slice(Math.max(0,m.index-34), m.index)});
  }
  return out;
}
/* классификация по БЛИЖАЙШЕМУ ключевому слову, отрицания («не может восстанавливать») не считаются */
const HEAL_KW_SRC='лечен|восстанавлива|исцел|вылечи|количество хитов|уровень здоровья|временных хитов';
const DMG_KW_SRC='урон|поврежд';
function kwDist(ctx, pos, srcRe, skipNegated){
  const re=new RegExp(srcRe,'g'); let m, best=Infinity;
  while((m=re.exec(ctx))){
    if(skipNegated){
      const pre=ctx.slice(Math.max(0,m.index-16), m.index);
      if(/\bне\s+\S*\s*$|\bне\s*$|\bбез\s+\S*\s*$/.test(pre)) continue;
    }
    best=Math.min(best, Math.abs(m.index-pos));
  }
  return best;
}
function classifyDice(g){
  const h=kwDist(g.ctx, g.ctxPos, HEAL_KW_SRC, true);
  const d=kwDist(g.ctx, g.ctxPos, DMG_KW_SRC, false);
  if(h===Infinity&&d===Infinity) return 'other';
  return (h<=d)?'heal':'dmg';
}
function cantripTierDice(hiTxt, level){
  const t=normRollTxt(hiTxt); if(!t) return null;
  const re=/(\d+)\s*(?:[–—-]\s*\d+\s*)?уровн[а-я]*\s*[:—–-]?\s*(\d+)\s*d\s*(\d+)/g;
  let m, best=null;
  while((m=re.exec(t))){
    const thr=+m[1];
    if(thr<=level && (!best||thr>=best.thr)) best={thr, cnt:+m[2], sides:+m[3]};
  }
  return best;
}
function upcastAdd(hiTxt, sides, extraTxt){
  const t=normRollTxt(hiTxt)+' '+normRollTxt(extraTxt||''); if(!t.trim()) return 0;
  const re=/(?:увеличивается на|прибавляйте|\+)\s*(\d+)\s*d\s*(\d+)/g;
  let m;
  while((m=re.exec(t))){ if(+m[2]===sides && /за каждый круг|за круг/.test(t.slice(m.index, m.index+80))) return +m[1]; }
  return 0;
}
const SAVE_AB_KEY={'силы':'str','ловкости':'dex','телосложения':'con','интеллекта':'int','мудрости':'wis','харизмы':'cha'};
/* ═══════════════ ДВИЖОК БРОСКОВ v3: заклинания, способности, цели ═══════════════
   Броски делают живые игроки; сайт выдает формулу, принимает результаты,
   разбирает итог по правилам 5e и применяет его к листам и бестиарию.  */

/* ── активные и пассивные способности ── */
const AB_ACTIVE_RE=/вы можете потратить|вы тратите|потратить\s+(?:одну|один|одно)?\s*(?:кость|очко|заряд)|в качестве действия|действием|бонусным действием|своей реакцией|реакцией|бросок атаки|броска атаки|броску атаки|спасбросок|спасброска|проверк[уаи]|вы наносите|дополнительный урон|наносит[еь]\s+урон|восстанавлива[а-я]+\s+\d|можете попытаться|при попадании|если вы попадаете|когда вы попадаете|один раз в ход|раз в ход|раз за бой|вы можете заставить|вы можете добавить/;
function abilityIsActive(ab){
  if(!ab) return false;
